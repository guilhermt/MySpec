name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run still going on it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Only the tools the job runs: govulncheck, go-test-coverage and lefthook stay on the machine.
      - uses: jdx/mise-action@v4
        with:
          install_args: go node pnpm task golangci-lint gotestsum shellcheck npm:@biomejs/biome
          cache: true
      - name: Resolve pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: task tidy:check
      - run: task lint:web
      - run: task lint:sh
      - run: task typecheck
      - run: task lint:go:ci
      - run: task test:go:ci

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The temporary folder of the runner, which has no short 8.3 names, so the
      # paths git prints match the ones the tests build.
      - name: Use the runner temporary folder
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v4
        with:
          install_args: go
          cache: true
      - name: Resolve the Go caches
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      # main.go embeds frontend/dist, which only a frontend build fills.
      - name: Stub the embedded frontend
        run: mkdir -p frontend/dist && touch frontend/dist/.gitkeep
      - name: Build
        run: go build -tags production -trimpath -ldflags=-H=windowsgui -o bin/myspec.exe .
      - name: Test
        run: go test ./...
