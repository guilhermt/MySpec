name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run still going on it.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Only the tools the job runs: govulncheck, go-test-coverage and lefthook stay on the machine.
      - uses: jdx/mise-action@v4
        with:
          install_args: go node pnpm task golangci-lint gotestsum npm:@biomejs/biome
          cache: true
      - name: Resolve pnpm store
        id: pnpm-store
        working-directory: frontend
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: task tidy:check
      - run: task lint:web
      - run: task typecheck
      - run: task lint:go:ci
      - run: task test:go:ci
