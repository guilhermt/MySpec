name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: task lint:web
      - run: pnpm typecheck
      - run: pnpm test:coverage --reporter=default --reporter=json --outputFile.json=./coverage/test-results.json
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Chromium of Playwright
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:painted
      - uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          working-directory: ./frontend
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          vite-config-path: ./vitest.config.ts
      # The action takes no extra text, so the run summary is added to the
      # comment it just wrote, found by the marker the action leaves behind.
      - name: Add the test summary to the coverage comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ../.github/scripts/coverage_comment.py \
            --report ./coverage/test-results.json \
            --repo ${{ github.repository }} \
            --pr ${{ github.event.pull_request.number }} \
            --marker '<!-- vitest-coverage-report-marker-./frontend -->'

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Install GTK and WebKitGTK headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: task tidy:check
      - run: task lint:go
      - run: task vuln
      - run: task test:go
        env:
          GOTESTSUM_JUNITFILE: coverage/junit.xml
      - uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage/go.out
      - uses: fgrosse/go-coverage-report@v1.3.1
        id: coverage
        if: github.event_name == 'pull_request'
        with:
          coverage-artifact-name: code-coverage
          coverage-file-name: go.out
          root-package: github.com/guilhermt/myspec
          # The report is posted below instead, with the run summary on it.
          skip-comment: true
      - name: Comment the coverage report with the test summary
        if: github.event_name == 'pull_request' && steps.coverage.outputs.coverage_report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.coverage.outputs.coverage_report }}
        run: |
          printf '%s' "$REPORT" > coverage/report.md
          python3 .github/scripts/coverage_comment.py \
            --report coverage/junit.xml \
            --repo ${{ github.repository }} \
            --pr ${{ github.event.pull_request.number }} \
            --marker '<!-- go-coverage-report -->' \
            --body-file coverage/report.md

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, go]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Install GTK and WebKitGTK headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Install wails3
        run: |
          go install tool
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: task bindings:check
      - run: task build
      - uses: actions/upload-artifact@v7
        with:
          name: myspec-linux-amd64
          path: bin/myspec
          retention-days: 7
