name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release at a time, and a release never cancels another.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  release:
    name: Release
    # Pinned, not latest: the binary links against the libraries of this Ubuntu, the oldest of the
    # systems the team runs, so it runs on Pop!_OS 24.04 and on Arch.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; only commits of main are released"
            exit 1
          fi
          version="$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
      # A release builds from scratch: no cache, so nothing from another run reaches the binary.
      - uses: jdx/mise-action@v4
        with:
          install_args: go node pnpm task
          cache: false
      # wails3 compiles against the GTK and WebKitGTK headers, so they are installed before it.
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install wails3
        run: |
          go install tool
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      # task package builds both packages. The Windows one is cross-compiled from here, without cgo, so it
      # needs neither GTK nor a Windows runner.
      - run: task package
      - name: Check the build left the tree as committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::the build changed tracked files; the tag does not build as committed"
            exit 1
          fi
      - name: Check the binaries hold no path of the runner
        run: |
          for binary in bin/package/linux/myspec bin/package/windows/myspec.exe; do
            if strings "$binary" | grep -F "$HOME"; then
              echo "::error::$binary holds paths of the build machine"
              exit 1
            fi
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" bin/myspec-linux-amd64.tar.gz bin/myspec-windows-amd64.zip
          --title "$GITHUB_REF_NAME" --generate-notes --latest --verify-tag
