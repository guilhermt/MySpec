name: Full check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  full:
    name: Full check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Install GTK and WebKitGTK headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-
      - name: Install wails3
        run: |
          go install tool
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Install the Chromium of Playwright
        run: pnpm exec playwright install --with-deps --only-shell chromium
        working-directory: frontend
      - run: task check:full
      - run: task build
