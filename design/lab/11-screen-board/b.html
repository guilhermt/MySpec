/* BEGIN design/system/tokens.css */
/* =====================================================================
   MySpec design tokens · theme Grafite quente
   Phase 3, approved 2026-09-24. The single source of the tokens.

   How to read it
   - Every value the interface paints or measures lives here. Components use
     these names and nothing else: no color, size or duration outside this file.
   - Three layers of blocks:
       1. :root                            values that do not depend on the mode;
       2. :root, [data-theme="light"]      the light colors (the default);
          @media dark, :root without light the dark colors, following the system;
          [data-theme="dark"]              the dark colors, fixed by the user or
                                           forced on a subtree (the specimen);
       3. :root, [data-theme]              derived tokens (washes and veils),
                                           declared on every scope so they
                                           resolve against that scope's colors.
   - Sizes are rem at a 16px root and land on whole pixels: WebKitGTK blurs
     half pixels (brief.md §9).
   - Colors are OKLCH. The neutral carries a trace of warmth: surfaces and lines
     at hue 65 (chroma 0.004), inks at hue 60 (chroma 0.01), the sidebar at 68 in
     light and 62 in dark. The identity is an electric blue eased toward cobalt,
     hue 260.
   - A token that means the same as another is written as var(), never as a copy
     of its value: the aliases live in the last block.
   - The dark colors are written twice: for the system setting, and for a fixed
     choice or a subtree forced dark. In the app the theme is always set by script
     on data-theme, so the implementation keeps only the [data-theme="dark"] block.
   ===================================================================== */

:root {
  /* Type families: one sans for chrome and reading, one mono for code, paths and keys. */
  --font-ui: "Fira Sans", system-ui, sans-serif;
  --font-read: "Fira Sans", system-ui, sans-serif;
  --font-mono: "Fira Code", ui-monospace, monospace;

  /* Type sizes and leading, paired: the chrome register (caps to ui) and the reading register (body, read, code). */
  --text-caps: 0.6875rem;    --leading-caps: 1rem;
  --text-micro: 0.75rem;     --leading-micro: 1rem;
  --text-meta: 0.8125rem;    --leading-meta: 1.125rem;
  --text-ui: 0.875rem;       --leading-ui: 1.25rem;
  --text-body: 0.9375rem;    --leading-body: 1.375rem;
  --text-read: 1rem;         --leading-read: 1.625rem;
  --text-title: 1.125rem;    --leading-title: 1.5rem;
  --text-display: 1.375rem;  --leading-display: 1.75rem;
  --text-code: 0.8125rem;    --leading-code: 1.25rem;
  --text-code-read: 0.875rem;  /* inline code inside the reading register; it takes the line's leading */

  /* Weights: hierarchy comes from weight before color. A name that waits for you is 600, any other name 400. */
  --weight-regular: 400; --weight-medium: 500; --weight-strong: 600; --weight-bold: 700;
  --weight-name: 400; --weight-name-waiting: 600;
  --tracking-caps: 0.07em;

  /* Measure: the conversation column and the reading line inside it. */
  --measure: 50rem;
  --measure-read: 42rem;

  /* Space: a 4px grid with two half steps for tight chrome. */
  --space-0-5: 0.125rem; --space-1: 0.25rem; --space-1-5: 0.375rem; --space-2: 0.5rem; --space-2-5: 0.625rem;
  --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;

  /* Radius: grows with the size and the elevation of the object. */
  --radius-xs: 0.1875rem; --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-pill: 999px;

  /* Strokes: borders, the error rail, focus. Focus sits outside with a gap; selection sits inside. */
  --border: 1px; --border-2: 2px; --error-rail: 3px; --radius-glyph: 1px;
  --focus-width: 2px; --focus-offset: 2px; --halo: 3px;

  /* Control and chrome sizes. */
  --size-control: 2rem; --size-control-sm: 1.75rem; --size-control-xs: 1.375rem;
  --size-chip: 1.75rem; --size-time-chip: 1.125rem; --size-kbd: 1.125rem; --size-kbd-sm: 1rem;
  --size-head: 3rem; --size-progress: 2.5rem; --size-node: 1.75rem; --size-tab: 1.75rem; --size-ask: 2.75rem;
  --size-composer-min: 3.5rem; --size-mark: 1.5rem; --size-avatar: 1.5rem; --size-more-below: 1.75rem;
  --size-menu-min: 14rem; --size-dialog: 30rem; --size-toast: 22rem; --size-tooltip-max: 20rem;

  /* Icons and status glyphs. Glyphs are even so they center on a whole pixel. */
  --icon: 1rem; --icon-sm: 0.875rem; --icon-xs: 0.75rem; --icon-stroke: 1.5;
  --glyph: 0.625rem; --glyph-sm: 0.5rem; --glyph-diamond: 0.5rem; --glyph-bar: 0.1875rem;

  /* Meters: the context meter and the step segments of the current stage. */
  --meter-w: 2.5rem; --meter-h: 0.25rem; --meter-label: 2rem;
  --seg-w: 0.75rem; --seg-w-current: 1.25rem; --seg-h: 0.25rem; --seg-gap: 0.1875rem;

  /* The tree: row rhythm, the epic indent and its guide under the epic's chevron. */
  --tree-pad: 0.5rem; --row-pad-y: 0.375rem; --row-gap: 0.25rem; --line-gap: 0.125rem; --section-gap: 1.5rem;
  --epic-indent: 1rem; --guide-x: 0.9375rem;

  /* Layout: continuous widths, one rule per container (structure.md §6). The sidebar is drawn; the collapsed strip,
     the panel and the decision column are the rules of structure.md §2 and §3, reserved for the screens of phase 4. */
  --sidebar-width: round(down, clamp(18rem, calc(8vw + 12.5rem), 23.75rem), 1px);
  --sidebar-collapsed: 3.75rem;
  --panel-width: clamp(22.5rem, 28%, 30rem);
  --decision-width: clamp(18.75rem, 24%, 26.25rem);

  /* Small fixed pieces of content. */
  --key-size: 1.25rem; --action-verb-w: 3.5rem; --list-indent: 1.25rem; --newmsg-w: 8.5rem;
  --code-pad-y: 0.0625rem; --code-pad-x: 0.3125rem; --fade: 1.5rem; --link-offset: 0.2em;

  /* Motion: three durations and one standard curve; the spinner is the only loop. prefers-reduced-motion zeroes all of it. */
  --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 280ms;
  --duration-spin: 900ms; --duration-shimmer: 1400ms; --delay-tooltip: 500ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, 0, 1);
  --ease-exit: cubic-bezier(0.3, 0, 1, 1);

  /* Stacking: sticky heads, the item header, floating pieces, the dialog, toasts and tooltips. */
  --z-sticky: 2; --z-header: 3; --z-float: 4; --z-overlay: 50; --z-toast: 60; --z-tooltip: 70;

  /* Link underline: permanent and quiet, full on hover. The key hint on a primary button: the same in both modes. */
  --mix-link-line: 45%; --mix-key: 45%;
}

/* ---------------------------------------------------------------------
   LIGHT (the default)
   --------------------------------------------------------------------- */
:root, [data-theme="light"] {
  color-scheme: light;

  /* Surfaces in layers: 0 sunken (code, action groups, the quiet ask bar), 1 the ground (conversation, header),
     2 raised (cards, buttons, the selected tab), 3 floating (menus, tooltips' neighbors, dialogs, toasts).
     In light, 2 and 3 share white and differ by shadow. */
  --surface-0: oklch(0.962 0.004 65);
  --surface-1: oklch(0.995 0.001 65);
  --surface-2: oklch(1 0 0);
  --surface-3: oklch(1 0 0);
  --surface-input: oklch(1 0 0);
  --surface-user: oklch(0.95 0.005 60);

  /* The sidebar: in the tone of the page, one step down, with its own input, divider, control border and epic guide (3:1). */
  --surface-sidebar: oklch(0.945 0.007 68);
  --sidebar-input: oklch(0.975 0.004 68);
  --sidebar-line: oklch(0.885 0.008 68);
  --sidebar-control: oklch(0.595 0.011 68);

  /* Lines: 1 divider, 2 quiet border (buttons, chips), 3 control border at 3:1 (inputs, composer, dashed disabled). */
  --line-1: oklch(0.912 0.004 65);
  --line-2: oklch(0.86 0.005 65);
  --line-3: oklch(0.63 0.006 65);

  /* Ink: 1 text, 2 secondary, 3 muted (line 2 of a row, the agent's clock), 4 faint (meta, line 3, timestamps).
     1 to 3 pass 4.5:1 on every surface and veil of the system. 4 passes on the surfaces 0 to 3, the sidebar, the user
     message and the wait veil, and is NOT for: the open row (--brand-veil; the row lifts its meta to ink 3), a pressed
     or hovered open row, a pressed veil on the sidebar, --brand-tint and --state-wait-chip (dark). */
  --ink-1: oklch(0.2 0.01 60);
  --ink-2: oklch(0.36 0.009 60);
  --ink-3: oklch(0.455 0.007 60);
  --ink-4: oklch(0.495 0.006 60);

  /* Identity: the solid, its hover and press, the ink on it, the identity as text, the ring of the open row, the meter track. */
  --brand: oklch(0.52 0.175 260);
  --brand-hover: oklch(0.48 0.175 260);
  --brand-active: oklch(0.44 0.166 260);
  --brand-on: oklch(1 0 0);
  --brand-ink: oklch(0.49 0.17 260);
  --brand-ring: oklch(0.58 0.158 260);
  --brand-track: oklch(0.9 0.039 260);

  /* The ink of neutral veils (hover, press): a trace of the identity, never a gray from nowhere. */
  --veil-ink: oklch(0.3 0.061 260);

  /* Veil strengths, one per role. */
  --mix-hover: 6%; --mix-press: 10%; --mix-select: 12%; --mix-tint: 12%; --mix-tint-hover: 18%; --mix-tint-press: 24%;
  --mix-halo: 24%; --mix-seg: 26%; --mix-marker: 30%;

  /* Error: the loudest color, never alone: the diamond, the square chip with !, the rail. */
  --state-error: oklch(0.52 0.195 22);
  --state-error-hover: oklch(0.48 0.195 22);
  --state-error-press: oklch(0.44 0.185 22);
  --state-error-veil: oklch(0.962 0.02 22);
  --state-error-on: oklch(1 0 0);

  /* Waiting for you: amber. Text, glyph (and its contour), the veil of a request, its line, the time chip. */
  --state-wait: oklch(0.5 0.11 62);
  --state-wait-glyph: oklch(0.58 0.14 75);
  --state-wait-veil: oklch(0.965 0.035 85);
  --state-wait-line: oklch(0.86 0.08 80);
  --state-wait-chip: oklch(0.945 0.05 85);
  --state-wait-chip-ink: oklch(0.42 0.09 62);

  /* Ready to close: green, a ring and an outlined chip. */
  --state-close: oklch(0.5 0.13 145);

  /* Code: four hues at the lightness of the ink, the comment is faint ink. */
  --code-keyword: oklch(0.47 0.13 260);
  --code-string: oklch(0.47 0.1 150);
  --code-function: oklch(0.45 0.11 305);
  --code-number: oklch(0.5 0.12 55);

  /* Floating pieces: the tooltip is the one inverted surface; the scrim dims the app under a dialog. */
  --tooltip-surface: oklch(0.26 0.008 60);
  --tooltip-ink: oklch(0.97 0.003 60);
  --tooltip-ink-2: oklch(0.8 0.005 60);
  --scrim: oklch(0.2 0.01 60 / 0.28);

  /* Elevation: every shadow is the warm neutral, never black. Plane, button, xs (a raised control), card, float, overlay. */
  --shadow-hue: oklch(0.3 0.03 65);
  --sheen: oklch(1 0 0 / 0.12);
  --rim: color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 6%, transparent);
  --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 22%, transparent), inset 0 1px 0 var(--sheen);
  --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 8%, transparent), 0 0 0 1px var(--rim);
  --shadow-card: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 6%, transparent), 0 8px 20px color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 16%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 20%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(0 0 0 / 0.08);
}

/* ---------------------------------------------------------------------
   DARK: the same roles, lifted surfaces instead of shadows, lighter inks.
   Written twice: for the system setting and for a fixed choice or subtree.
   --------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: oklch(0.175 0.005 65); --surface-1: oklch(0.205 0.005 65); --surface-2: oklch(0.255 0.006 65); --surface-3: oklch(0.275 0.006 65);
    --surface-input: oklch(0.18 0.005 65); --surface-user: oklch(0.265 0.005 60);
    --surface-sidebar: oklch(0.165 0.008 62); --sidebar-input: oklch(0.2 0.008 62); --sidebar-line: oklch(0.245 0.008 62); --sidebar-control: oklch(0.505 0.01 62);
    --line-1: oklch(0.29 0.006 65); --line-2: oklch(0.35 0.007 65); --line-3: oklch(0.55 0.008 65);
    --ink-1: oklch(0.94 0.005 60); --ink-2: oklch(0.84 0.005 60); --ink-3: oklch(0.75 0.005 60); --ink-4: oklch(0.69 0.005 60);
    --brand: oklch(0.72 0.135 259); --brand-hover: oklch(0.77 0.135 259); --brand-active: oklch(0.67 0.135 259); --brand-on: oklch(0.16 0.041 259);
    --brand-ink: oklch(0.79 0.1 259); --brand-ring: oklch(0.6 0.122 259); --brand-track: oklch(0.3 0.047 259);
    --veil-ink: oklch(0.92 0.034 259);
    --mix-hover: 7%; --mix-press: 11%; --mix-select: 18%; --mix-tint: 16%; --mix-tint-hover: 22%; --mix-tint-press: 28%;
    --mix-halo: 32%; --mix-seg: 30%; --mix-marker: 36%;
    --state-error: oklch(0.72 0.16 25); --state-error-hover: oklch(0.77 0.15 25); --state-error-press: oklch(0.67 0.16 25);
    --state-error-veil: oklch(0.27 0.05 25); --state-error-on: oklch(0.16 0.03 25);
    --state-wait: oklch(0.83 0.13 80); --state-wait-glyph: oklch(0.8 0.15 78);
    --state-wait-veil: oklch(0.27 0.045 80); --state-wait-line: oklch(0.42 0.08 78); --state-wait-chip: oklch(0.33 0.07 78); --state-wait-chip-ink: oklch(0.9 0.1 85);
    --state-close: oklch(0.78 0.15 145);
    --code-keyword: oklch(0.8 0.1 260); --code-string: oklch(0.8 0.09 150); --code-function: oklch(0.82 0.08 305); --code-number: oklch(0.8 0.1 55);
    --tooltip-surface: oklch(0.34 0.006 65); --tooltip-ink: oklch(0.96 0.004 60); --tooltip-ink-2: oklch(0.82 0.005 60); --scrim: oklch(0.05 0.005 60 / 0.6);
    --shadow-hue: oklch(0.08 0.01 65); --sheen: oklch(1 0 0 / 0.2); --rim: oklch(1 0 0 / 0.07);
    --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 30%, transparent);
    --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 45%, transparent), inset 0 1px 0 var(--sheen);
    --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 40%, transparent), 0 0 0 1px var(--rim);
    --shadow-card: 0 0 0 1px oklch(1 0 0 / 0.04), 0 8px 24px color-mix(in srgb, var(--shadow-hue) 50%, transparent);
    --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 60%, transparent), 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 70%, transparent), 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.25), inset 0 0 0 1px oklch(0 0 0 / 0.12);
  }
}

  --surface-input: oklch(0.18 0.005 65); --surface-user: oklch(0.265 0.005 60);

  --brand-ink: oklch(0.79 0.1 259); --brand-ring: oklch(0.6 0.122 259); --brand-track: oklch(0.3 0.047 259);
  --veil-ink: oklch(0.92 0.034 259);
  --mix-hover: 7%; --mix-press: 11%; --mix-select: 18%; --mix-tint: 16%; --mix-tint-hover: 22%; --mix-tint-press: 28%;
  --mix-halo: 32%; --mix-seg: 30%; --mix-marker: 36%;

/* ---------------------------------------------------------------------
   ALIASES AND DERIVED: names that mean another token, and veils and washes
   mixed from the tokens above. Declared on every
   scope, so a subtree with its own data-theme mixes its own colors.
   --------------------------------------------------------------------- */
:root, [data-theme] {
  /* Aliases: the states without a situation are the neutral inks (the agent working in motion, GitHub, paused, idle). */
  --state-work: var(--ink-2); --state-work-track: var(--line-2); --state-github: var(--ink-3); --state-paused: var(--ink-3);
  --state-idle: var(--ink-4); --state-notice: var(--ink-2);
  /* Aliases: focus is the identity; the wait contour is the glyph unless a theme needs a darker one; the epic guide is the
     sidebar's control border; not-started glyphs and › separators use the control line; code comments are faint ink. */
  --focus: var(--brand); --state-wait-ring: var(--state-wait-glyph); --sidebar-guide: var(--sidebar-control);
  --line-deco: var(--line-3); --code-comment: var(--ink-4);

  /* Neutral veils, for hover and press on any surface; on a raised control they are mixed into it. */
  --veil-hover: color-mix(in srgb, var(--veil-ink) var(--mix-hover), transparent);
  --veil-press: color-mix(in srgb, var(--veil-ink) var(--mix-press), transparent);
  --surface-2-hover: color-mix(in srgb, var(--veil-ink) var(--mix-hover), var(--surface-2));
  --surface-2-press: color-mix(in srgb, var(--veil-ink) var(--mix-press), var(--surface-2));

  /* Identity washes: the open row on the sidebar (veil), a pressed or chosen control (tint), the same on the ground (tint-plane). */
  --brand-veil: color-mix(in srgb, var(--brand) var(--mix-select), var(--surface-sidebar));
  --brand-tint: color-mix(in srgb, var(--brand) var(--mix-tint), var(--surface-2));
  --brand-tint-hover: color-mix(in srgb, var(--brand) var(--mix-tint-hover), var(--surface-2));
  --brand-tint-press: color-mix(in srgb, var(--brand) var(--mix-tint-press), var(--surface-2));
  --brand-tint-plane: color-mix(in srgb, var(--brand) var(--mix-tint), var(--surface-1));

  /* Identity details: the segments still to do, the agent marker's ring, the key hint on a primary button, the focus halo. */
  --brand-seg-todo: color-mix(in srgb, var(--brand) var(--mix-seg), var(--surface-1));
  --brand-marker-ring: color-mix(in srgb, var(--brand) var(--mix-marker), transparent);
  --brand-key-ring: color-mix(in srgb, var(--brand-on) var(--mix-key), transparent);
  --focus-halo: color-mix(in srgb, var(--focus) var(--mix-halo), transparent);
}

/* ---------- Voices. The two agents differ by the avatar's form and, in a shared stream, by the reviewer's thread line. ---------- */

/* ---------- Handoff: the product's message between two sessions, collapsed to one line. ---------- */

/* ---------- The review of a Manual step: the changed files and their stage, in the request card. ---------- */

/* ---------- GitHub checks, by name, while the pull request waits. ---------- */

.gh.is-loading .gh-h b { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }

/* ---------- Findings to decide: the decision card (A) and the decision column (B) share the finding. ---------- */

.fnd { display: grid; grid-template-columns: var(--key-size) minmax(0, 1fr); column-gap: var(--space-3); row-gap: var(--space-1-5); padding: var(--space-3); border-radius: var(--radius-md); background: var(--surface-2); box-shadow: inset 0 0 0 var(--border) var(--line-2); transition: box-shadow var(--duration-fast) var(--ease-standard), background var(--duration-fast) var(--ease-standard); }

.convo-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
/* ---------- The way back to the end, carrying what happens there. ---------- */

.jump button { pointer-events: auto; display: inline-flex; align-items: center; gap: var(--space-2); height: var(--size-control-sm); padding: 0 var(--space-3) 0 var(--space-2-5); max-width: calc(var(--measure) - var(--space-12)); border-radius: var(--radius-pill); background: var(--surface-3); color: var(--ink-2); font-size: var(--text-meta); line-height: var(--leading-meta); box-shadow: var(--shadow-float); white-space: nowrap; transition: background var(--duration-fast) var(--ease-standard); }

.jump button:active, .jump button.is-active { background: var(--surface-2-press); }
.jump .nm { color: var(--brand-ink); font-weight: var(--weight-medium); }
.jump .live { display: inline-flex; gap: var(--space-1-5); align-items: center; color: var(--ink-3); min-width: 0; overflow: hidden; }

/* ---------- The auxiliary panel: a column when the reading column still fits beside it, else it covers. ---------- */

.panel.over { position: absolute; right: 0; top: 0; bottom: 0; z-index: var(--z-overlay); background: var(--surface-3); box-shadow: var(--shadow-overlay); }

.panel-b { flex: 1; overflow: auto; padding: var(--space-3) var(--space-4) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); font-size: var(--text-meta); line-height: var(--leading-meta); }

.pgrp h3 { margin: 0 0 var(--space-2); font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }

.plist li:hover { background: var(--veil-hover); }
.plist li .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist li .m { color: var(--ink-3); font-size: var(--text-micro); white-space: nowrap; }
.plist li.sub { padding-left: var(--space-6); }
@keyframes panel-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Polish 6: a place that changes fades in; a request that is born flashes once, in its veil. ---------- */
.enter { animation: place-in var(--duration-base) var(--ease-enter); }
@keyframes place-in { from { opacity: 0; } to { opacity: 1; } }
.ask-in.born { --flash: var(--state-wait-veil); animation: flash var(--duration-slow) var(--ease-standard) 2; }

/* ---------- The composer's addressee: whom a message goes to, when two sessions listen. ---------- */
.chip.to { gap: var(--space-1-5); }
.chip.to .av { width: var(--icon); height: var(--icon); border-radius: var(--radius-pill); display: inline-grid; place-items: center; background: var(--brand-tint-plane); color: var(--brand-ink); box-shadow: inset 0 0 0 var(--border) var(--brand-marker-ring); }
.chip.to .av.rev { background: transparent; box-shadow: inset 0 0 0 var(--border) var(--brand-ring); }
.chip.to .av svg { width: var(--icon-xs); height: var(--icon-xs); }
.cbox .cfoot .who-l { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); display: inline-flex; gap: var(--space-1-5); align-items: center; white-space: nowrap; }

/* ---------- The activity line at the end of a stream. ---------- */
.e-activity .mono { font-size: var(--text-micro); color: var(--ink-2); }
.e-activity .t { color: var(--ink-4); font-variant-numeric: tabular-nums; }

/* ---------- Loop beats: implement, review, address, commit. The agents' loop of a step in one line. ---------- */
.beats { display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); min-width: 0; }
.beat { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--size-control-xs); padding: 0 var(--space-1-5); border-radius: var(--radius-sm); white-space: nowrap; color: var(--ink-3); transition: background var(--duration-fast) var(--ease-standard); }
button.beat:hover, .beat.is-hover { background: var(--veil-hover); color: var(--ink-1); }
button.beat:active, .beat.is-active { background: var(--veil-press); }
.beat svg { width: var(--icon-xs); height: var(--icon-xs); }
.beat.done svg { color: var(--ink-3); }
.beat.cur { color: var(--ink-1); font-weight: var(--weight-strong); box-shadow: inset 0 0 0 var(--border) var(--line-2); background: var(--surface-2); }

.beat.next .st-todo { width: var(--glyph-sm); height: var(--glyph-sm); }
.beat:disabled, .beat.is-disabled { color: var(--ink-4); cursor: default; }
.beat.is-error { color: var(--state-error); }
.beats .gt { color: var(--line-deco); }
.beat .cap { color: var(--ink-4); font-weight: var(--weight-regular); }

/* ---------- The request that stays on screen while another conversation waits (both variations). ---------- */
.ask-in .two { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; }

/* ---------- Composer disabled and working footers, and the queue ---------- */
.queued-meta .btn { height: var(--size-control-xs); }

/* ---------- The mock's scene switcher: outside the product. ---------- */
.mockbar { position: fixed; right: var(--space-3); bottom: var(--space-3); z-index: var(--z-toast); display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3); border-radius: var(--radius-pill); background: var(--tooltip-surface); color: var(--tooltip-ink); box-shadow: var(--shadow-float); font-size: var(--text-micro); line-height: var(--leading-micro); opacity: 0.94; }
.mockbar select { background: transparent; color: var(--tooltip-ink); border: var(--border) solid var(--tooltip-ink-2); border-radius: var(--radius-pill); height: var(--size-control-xs); padding: 0 var(--space-2); font-size: var(--text-micro); }
.mockbar option { color: var(--ink-1); background: var(--surface-3); }
.mockbar a { color: var(--tooltip-ink); }
.noshots .mockbar { display: none; }

/* ---------- Popover (milestones, recipient) ---------- */
.pop { position: absolute; z-index: var(--z-overlay); background: var(--surface-3); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); padding: var(--space-2); min-width: var(--size-menu-min); animation: panel-in var(--duration-base) var(--ease-enter); }

/* ---------- Rich prose extras used by the agents' answers ---------- */
.prose ol { margin: 0 0 var(--space-3); padding-left: var(--list-indent); max-width: var(--measure-read); }
.prose h4 { margin: var(--space-3) 0 var(--space-1); font-size: var(--text-body); line-height: var(--leading-body); font-weight: var(--weight-strong); }
.prose table { border-collapse: collapse; margin: 0 0 var(--space-3); font-size: var(--text-meta); line-height: var(--leading-meta); }
.prose th, .prose td { text-align: left; padding: var(--space-1) var(--space-3) var(--space-1) 0; box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); }
.prose th { color: var(--ink-3); font-weight: var(--weight-medium); }
.prose td.num { font-variant-numeric: tabular-nums; }

/* ---------- Action rows: the description the agent wrote is the label; the command follows, faint. ---------- */
.acts li { display: grid; grid-template-columns: var(--icon-sm) auto minmax(0, 1fr) auto; column-gap: var(--space-2); }
.acts li.more-row, .acts li.sub-agent { display: block; padding: 0; }
.acts li .lbl2 { color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(var(--measure-read) / 2); }
.acts li .tg { color: var(--ink-3); }
.acts li.now .lbl2 { font-weight: var(--weight-medium); }
.acts li.e .lbl2 { color: var(--state-error); }
.acts li .s { font-variant-numeric: tabular-nums; }
.acts .nested { background: transparent; margin: var(--space-0-5) 0 var(--space-0-5) calc(var(--space-1) * -1); box-shadow: inset var(--border-2) 0 0 var(--line-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.acts .nested > summary { min-height: var(--size-control-sm); padding: 0 var(--space-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.acts .nested > summary .lbl2 { color: var(--ink-1); font-weight: var(--weight-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.acts .nested > summary .roll { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.acts .nested ul { box-shadow: none; padding: 0 var(--space-2) var(--space-1) var(--space-6); }

/* ---------- Quick replies: a question asked in text, answered in one key. ---------- */
.qr { display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; padding: var(--space-2) var(--space-3) 0; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.qr .chip { height: var(--size-control-xs); font-size: var(--text-meta); gap: var(--space-1-5); padding: 0 var(--space-2); }
.qr .chip .kn { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--ink-3); }
.qtext { position: relative; }
.qtext::before { content: ""; position: absolute; left: calc(var(--space-3) * -1); top: var(--space-1); bottom: var(--space-1); width: var(--border-2); border-radius: var(--radius-pill); background: var(--state-wait-ring); }

/* The ask bar of a task ready to close: the ending's green, on the quiet ground. */
.ask-in.close { background: var(--surface-0); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.ask-in.close .what .lbl { color: var(--state-close); }
/* The ask bar breaks into two lines before it hides an action, and its progress never cuts. */
.ask .adet { flex: 1 0 auto; max-width: 100%; white-space: normal; overflow: visible; }
.ask .acts-r { flex-wrap: wrap; justify-content: flex-end; min-width: 0; }

.acts .now-l, .acts .now-l .v { white-space: nowrap; } .acts .now-l { overflow: hidden; }

/* The voice filter hides the other voice's entries, never a request: its live cards stay in the stream. */

.lane.fl-out > .card:not(.answered) { margin-left: 0; }
.fl-note { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); display: flex; gap: var(--space-1-5); align-items: center; }

  if (S.none) {
    const keep = TREE.map((n) => ({ items: n.items, epics: n.epics }));
    TREE.forEach((n) => { n.items = []; n.epics = []; });
    h = sidebar().replace(/id="g-(tools|mob|plat)"><\/div>/g, 'id="g-$1"><div class="sb-empty" role="none">No active items.</div></div>').replace(/id="g-reviews"><\/div>/, 'id="g-reviews"><div class="sb-empty" role="none">No review in progress.</div></div>');
    TREE.forEach((n, k) => Object.assign(n, keep[k]));
  } else h = sidebar();
  h = h.replace(/ aria-current="page" aria-selected="true"/, "").replace(/class="it sel /, 'class="it ').replace(/tabindex="0"/, 'tabindex="-1"');
  h = h.replace(`id="g-tools"></div>`, `id="g-tools"><div class="sb-empty" role="none">No active items.</div></div>`);
  h = h.replace("<option>acme/billing</option>", "<option>acme/billing · not cloned</option>").replace("<option>acme/infra</option>", "<option>acme/infra · clone missing</option>");
  if (S.place === "board") {
    const id = S.board === "tools" ? "Internal Tools" : "Platform Roadmap";
    h = h.replace(new RegExp(`<div class="node board"([^>]*?)tabindex="-1" data-tip="Open the ${id} board">`), `<div class="node board cur"$1tabindex="0" aria-current="page" data-tip="${id} · open">`);
  }
  return h;
}

// ---------------- Helpers of the card ----------------
const norm = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const isFinal = (c) => !!STATUSES[c.s].final;
function matches(c) {
  if (S.stale === c.n) return false;
  if (S.q) { const q = norm(S.q.trim()).replace(/^#/, ""); if (!(norm(c.t).includes(q) || String(c.n).startsWith(q))) return false; }
  if (S.f.repo && c.repo !== S.f.repo) return false;
  if (S.f.status != null && c.s !== S.f.status) return false;
  if (S.f.assignee && !c.asg.includes(S.f.assignee)) return false;
  if (S.f.mine && !c.asg.includes(BOARD.viewer)) return false;
  return true;
}
const boardCards = () => (S.board === "tools" ? [] : CARDS);
function actionOf(c) {
  if (c.task) return "has_task"; if (c.closed) return "closed"; if (c.unmanaged) return "add_to_board"; if (c.other) return "other_board";
  if (NOCLONE[c.repo] && S.cloning !== "done") return "clone"; if (c.missing) return "clone_missing"; return "start";
}
const markable = (c) => !c.unmanaged && !c.other;
const unsat = (c) => (c.dep || []).filter((d) => DEPS[d] && !DEPS[d].sat);
const taskShort = (t) => t.row.replace(/^Question · |^Session error · /, "").replace(" · Reviewer pass 2", "");
const folded = (key, dflt) => (key in S.fold ? S.fold[key] : dflt);

// The columns a row may carry. A variation picks its own.
const COLS = {
  lead: (c) => S.selMode
    ? `<span class="lead"><span class="cb ${S.sel.has(c.n) ? "on" : ""} ${markable(c) ? "" : "off-limits"}" aria-hidden="true">${I("check")}</span></span>`
    : `<span class="lead">${c.epicOf ? I("epic") : ""}</span>`,
  num: (c) => `<span class="num">#${c.n}</span>`,
  title: (c) => `<span class="tl ${c.epicOf ? "is-epic" : ""}">${c.t}</span>`,
  epic: (c) => c.epicOf ? `<span class="col epc"><span class="t">Epic · ${epicDone(c.n)} of ${CARD[c.n].kids.length} finished</span></span>`
    : c.epic ? `<span class="col epc"><span class="t">${CARD[c.epic].t}</span></span>` : `<span class="col epc"></span>`,
  dep: (c) => { const u = unsat(c); return u.length ? `<span class="col dep" data-tip="Depends on #${u[0]} ${DEPS[u[0]].title} · open, ${DEPS[u[0]].status}. A warning: it never blocks.">${st("warn")}<span class="t">#${u[0]}</span></span>` : `<span class="col dep"></span>`; },
  task: (c) => {
    if (c.task) { const t = TASKS[c.task]; return `<span class="col tsk ${t.g}" data-tip="Task ${t.title} · ${t.long}">${st(t.g)}<span class="t"><span class="long">${t.row}</span><span class="short">${taskShort(t)}</span></span></span>`; }
    if (c.disc) return `<span class="col tsk disc" data-tip="In the discussion ${DISCS[c.disc].title}">${ty({ kind: "discussion" })}<span class="t">In discussion</span></span>`;
    return `<span class="col tsk"></span>`;
  },
  // The keys of the row, in their own column: they show on the focused row, and only the ones that act.
  keys: (c) => {
    const k = [];
    if (["start", "clone", "add_to_board"].includes(actionOf(c)) && S.stale !== c.n) k.push(`<span><kbd>S</kbd>start</span>`);
    if (markable(c) && !c.closed && S.stale !== c.n) k.push(`<span><kbd>D</kbd>discuss</span>`);
    return `<span class="keys" aria-hidden="true">${k.join("")}</span>`;
  },
  status: (c, o = {}) => o.quiet ? `<span class="col st-word" aria-hidden="true"></span>` : `<span class="col st-word">${isFinal(c) ? I("check") : ""}<span class="t">${STATUSES[c.s].name}</span></span>`,
};
function rowLabel(c) {
  const p = [`#${c.n} ${c.t}`, repoOf(c.repo), STATUSES[c.s].name];
  if (c.epicOf) p.push(`epic, ${epicDone(c.n)} of ${c.kids.length} cards finished`); else if (c.epic) p.push(`epic ${CARD[c.epic].t}`);
  unsat(c).forEach((d) => p.push(`depends on #${d}, not satisfied`));
  if (c.task) p.push(`task: ${TASKS[c.task].long}${TASKS[c.task].since ? `, waiting for you for ${TASKS[c.task].sinceLong}` : ""}`);
  if (c.disc) p.push(`in a discussion`);
  if (S.selMode) p.push(markable(c) ? (S.sel.has(c.n) ? "selected" : "not selected") : "can't be selected");
  return p.join(". ");
}
// A column list may hold an array: those columns sit in .meta, which is one column each on a wide list and a
// second line under the title on a narrow one, so the row keeps what decides the choice at any width.
function cardRow(c, level = 2, o = {}) {
  const open = S.open === c.n;
  const cols = V.cols.map((k) => Array.isArray(k) ? `<span class="meta">${k.map((x) => COLS[x](c, o)).join("")}</span>` : COLS[k](c, o)).join("");
  const has2 = /<span class="meta">[\s\S]*?<span class="col [^"]*"[^>]*>(?!<\/span>)/.test(cols);
  const cls = ["cr", o.cls || "", open ? "open" : "", has2 ? "has2" : "", c.closed && !isFinal(c) ? "closed" : "", S.stale === c.n ? "gone" : ""].join(" ");
  // a is a tree of rows; b is a list of disclosure buttons, so the card that opens under a row is not inside a tree.
  const role = V.inline ? `role="button" aria-expanded="${open}" ${open ? `aria-controls="cx${c.n}"` : ""}` : `role="treeitem" aria-level="${level}" aria-selected="${open}"`;
  const sel = S.selMode && markable(c) ? (V.inline ? `aria-pressed="${S.sel.has(c.n)}"` : `aria-checked="${S.sel.has(c.n)}"`) : "";
  return `<div class="${cls}" ${role} tabindex="-1" data-nav data-card="${c.n}" id="c${c.n}" ${sel} aria-label="${esc(rowLabel(c))}">${cols}</div>`;
}

// ---------------- The card's content, for the panel (a) and in place (b) ----------------
function cardActions(c) {
  if (S.stale === c.n) return `<div class="cd-acts"><button class="btn sm" disabled aria-describedby="stale-why">Start task</button><button class="btn sm" disabled aria-describedby="stale-why">Discuss</button></div>`;
  const a = actionOf(c);
  const disc = (on = markable(c)) => on ? `<button class="btn sm" data-act="discuss" data-card="${c.n}" data-tip="New discussion with this card · D">Discuss <span class="k">D</span></button>`
    : `<button class="btn sm" disabled aria-describedby="why-${c.n}">Discuss</button>`;
  if (a === "has_task") return `<div class="cd-acts">${disc()}</div>`;
  if (a === "closed") return `<div class="cd-acts">${disc()}<span class="cd-why">The issue is closed.</span></div>`;
  if (a === "clone") {
    if (S.cloning === c.repo) return `<div class="cd-acts"><button class="btn primary sm is-loading" aria-busy="true"><span class="spin"></span>Cloning ${repoOf(c.repo)}…</button>${disc()}</div><span class="cd-why">The dialog opens when the clone ends. You can leave the board meanwhile.</span>`;
    return `<div class="cd-acts"><button class="btn primary sm" data-act="clone" data-card="${c.n}" data-tip="Clone into ~/code, then open New task · S">${I("clone")}Clone and continue <span class="k">S</span></button>${disc()}</div><span class="cd-why" id="why-${c.n}">${repoOf(c.repo)} isn't cloned yet. A task needs a clone.</span>`;
  }
  if (a === "clone_missing") return `<div class="cd-acts"><button class="btn primary sm" disabled aria-describedby="why-${c.n}">Start task</button><button class="btn sm">Change path…</button>${disc()}</div><span class="cd-why" id="why-${c.n}">The clone at ~/code/${c.repo} is missing.</span>`;
  if (a === "add_to_board") return `<div class="cd-acts"><button class="btn primary sm" data-act="add-board" data-card="${c.n}">Start task <span class="k">S</span></button>${disc(false)}</div><span class="cd-why" id="why-${c.n}">${repoOf(c.repo)} isn't managed by this board. Start task adds it first.</span>`;
  if (a === "other_board") return `<div class="cd-acts"><button class="btn primary sm" disabled aria-describedby="why-${c.n}">Start task</button>${disc(false)}</div><span class="cd-why" id="why-${c.n}">${repoOf(c.repo)} belongs to the board ${c.other}.</span>`;
  return `<div class="cd-acts"><button class="btn primary sm" data-act="start" data-card="${c.n}" data-tip="New task from this card · S">Start task <span class="k">S</span></button>${disc()}</div>`;
}
function cardNotes(c) {
  const u = unsat(c).map((d) => `<div class="cd-note">${st("warn")}<span class="l"><span><b>Depends on #${d}</b> ${DEPS[d].title}</span><span>${repoOf(DEPS[d].repo)} · ${DEPS[d].state} · ${DEPS[d].status} · no pull request. A warning only: it never blocks.</span></span></div>`).join("");
  const stale = S.stale === c.n ? `<div class="cd-stale" role="status"><span class="lbl">${st("warn")}This card isn't in the last reading of the board.</span><span class="det" id="stale-why">It left the board, or its issue closed more than 14 days ago. The reading of 14:08 doesn't have it, so a task or a discussion can't start from it.</span><span><button class="btn sm" data-act="close-card">Close</button></span></div>` : "";

}
function cardTask(c) {
  if (c.task) { const t = TASKS[c.task];
    return `<div class="cd-task">${ty({ kind: "task" })}<span class="nm">${t.title}</span><button class="btn sm" data-act="open-task" data-tip="Open the task">Open</button><span class="l2">${st(t.g)}${t.long}${t.since ? tw({ sev: t.g === "error" ? "error" : "wait", since: t.since, long: t.sinceLong }) : ""}</span></div>`; }
  if (c.archived) return `<div class="cd-sub">Archived task: <a href="#">${c.archived}</a></div>`;
  if (c.disc) return `<div class="cd-sub">${ty({ kind: "discussion" })} In the discussion <a href="#">${DISCS[c.disc].title}</a></div>`;

}
function cardFacts(c) {
  const kv = [["Module", c.module], ["Estimate", c.est], ["Assignees", (c.asg || []).join(", ")], ["Start", c.start]].filter((x) => x[1]);
  return kv.length ? `<dl class="cd-kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "";
}
const statusWord = (n) => { const x = CARD[n]; return `${isFinal(x) ? I("check") : ""}${STATUSES[x.s].name}`; };
function cardRelations(c) {
  let h = "";
  if (c.epic) { const e = CARD[c.epic], sib = SIBL(c);
    h += `<section><h3 class="cd-h">Epic</h3><ul class="cd-rel"><li><button class="rel" data-goto="${e.n}"><span class="num">#${e.n}</span><span class="t">${e.t}</span><span class="s">${epicDone(e.n)} of ${e.kids.length} finished</span></button></li></ul></section>
      <section><h3 class="cd-h">Cards of the epic · ${sib.length}</h3><ul class="cd-rel">${sib.map((n) => `<li><button class="rel" data-goto="${n}"><span class="num">#${n}</span><span class="t">${CARD[n].t}</span><span class="s">${statusWord(n)}</span></button></li>`).join("")}</ul></section>`; }
  if (c.epicOf) h += `<section><h3 class="cd-h">Cards · ${c.kids.length}</h3><ul class="cd-rel">${c.kids.map((n) => `<li><button class="rel" data-goto="${n}"><span class="num">#${n}</span><span class="t">${CARD[n].t}</span><span class="s">${statusWord(n)}</span></button></li>`).join("")}</ul></section>`;
  if (c.dep) h += `<section><h3 class="cd-h">Dependencies</h3><ul class="cd-rel">${c.dep.map((d) => `<li><button class="rel" data-goto="${d}"><span class="num">#${d}</span><span class="t">${DEPS[d].title}</span><span class="s">${st("warn")}Not satisfied</span></button></li>`).join("")}</ul></section>`;
  const prs = c.prOpen ? [`${repoOf(c.repo)}#${c.prOpen} · Open`] : (c.pr || []).map((p) => `${repoOf(c.repo)}#${p.n} · Merged`);
  if (prs.length) h += `<section><h3 class="cd-h">Pull requests</h3><ul class="cd-rel">${prs.map((p) => `<li><a class="rel" href="#"><span class="t">${p}</span></a></li>`).join("")}</ul></section>`;

// ---------------- The header of a place that is not an item ----------------
function navBtns(back) {

}
function readState() {

// ---------------- The filter bar, or the bar of the select mode ----------------
function fbar() {
  if (S.selMode) {
    const n = S.sel.size;
    return `<div class="fbar" role="toolbar" aria-label="Selected cards"><div class="selbar"><span class="n" role="status">${n} selected</span><span class="which trunc">${[...S.sel].map((x) => `#${x}`).join(" ")}</span>
      <button class="btn primary sm" data-act="sel-discuss" ${n ? "" : 'disabled aria-describedby="sel-why"'} data-tip="New discussion with the selected cards · D">Discuss ${n || ""} card${n === 1 ? "" : "s"} <span class="k">D</span></button>
      ${n ? "" : `<span class="why" id="sel-why">Select a card with Space</span>`}

    ${any ? `<button class="btn ghost sm" data-act="clear">Clear filters</button>` : ""}

// ---------------- The board place ----------------
function boardMain() {
  const all = boardCards(), cards = all.filter(matches);
  let content;

  else if (!cards.filter((c) => !c.epicOf || V.key === "a").length) content = fbar() + `<div class="bempty"><p class="t">No cards match the filters.</p><p class="s">${S.q ? `Nothing on the board has “${esc(S.q)}” in the title or the number` : "Nothing matches"}${S.f.assignee ? `, assigned to ${S.f.assignee}` : ""}.</p><button class="btn sm" data-act="clear">Clear filters</button></div>`;

  return `<main class="main" id="main">${boardHeader()}<div class="bbody"><div class="lstw" id="lstw"><div class="lst-in">${fail}${content}</div></div>${V.panel ? V.panel() : ""}</div>

  if (e.target.id === "d-what" || e.target.id === "d-title") { S.ddlg[e.target.id === "d-what" ? "what" : "title"] = e.target.value; const b = document.querySelector('[data-act="start-disc"]'), ok = S.ddlg.what.trim() || S.ddlg.cards.length; b.disabled = !ok; document.getElementById("why-disc").textContent = ok ? "" : "Write what to discuss or select at least one card."; }
  if (e.target.id === "t-ctx") { S.dlg.ctx = e.target.value; const why = document.getElementById("why-create"); const ok = e.target.value.trim() && S.dlg.name && !nameProblem(S.dlg.name, S.dlg.repo); const b = document.querySelector('[data-act="create"]'); b.disabled = !ok; why.textContent = ok ? "" : !e.target.value.trim() ? "Say what you want to build." : why.textContent; }
});
document.addEventListener("keydown", (e) => {
  const inField = e.target.closest && e.target.closest("input, textarea, select");
  if (S.dialog) {
    if (e.key === "Escape" && S.dialog === "disc" && S.ddlg.menu) { e.preventDefault(); S.ddlg.menu = false; render(); document.getElementById("d-board").focus(); return; }
    if (e.key === "Escape") { e.preventDefault(); return closeDialog(); }
    const opt = e.target.closest && e.target.closest("#d-boards .mi");
    if (opt && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); const all = [...document.querySelectorAll("#d-boards .mi")]; const k = all.indexOf(opt); all[(k + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length].focus(); return; }
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { const b = document.querySelector('[data-act="create"], [data-act="start-disc"]'); if (b && !b.disabled) b.click(); return; }
    const sw = e.target.closest && e.target.closest(".sw");
    if (sw && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); const sib = [...sw.parentElement.children], k = sib.indexOf(sw); sib[(k + 1) % sib.length].click(); return; }
    if (e.key === "Tab") { const f = [...document.querySelectorAll(".dlg button:not(:disabled), .dlg input, .dlg textarea, .dlg a[href], .dlg [tabindex='0']")].filter((x) => x.offsetParent); const k = f.indexOf(document.activeElement); if (e.shiftKey && k <= 0) { e.preventDefault(); f[f.length - 1].focus(); } else if (!e.shiftKey && k === f.length - 1) { e.preventDefault(); f[0].focus(); } }
    return;
  }
  if (S.menu) {
    if (e.key === "Escape") { const b = S.menu === "board" ? "bmenu-btn" : "fmenu-btn"; S.menu = null; render(); document.getElementById(b).focus(); return; }
    const mi = e.target.closest && e.target.closest("#menu .mi");
    if (mi && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); const all = [...document.querySelectorAll("#menu .mi")]; const k = all.indexOf(mi); all[(k + (e.key === "ArrowDown" ? 1 : all.length - 1)) % all.length].focus(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "n") { e.preventDefault(); document.querySelector('[data-act="new-task"]') ? document.querySelector('[data-act="new-task"]').click() : (S.dialog = "free", S.dlg = { repo: "api", name: "", ctx: "", mode: "Structured", review: "Agent", models: false, own: {} }, render(), focusDialog()); return; }
  if (inField) { if (e.key === "Escape" && e.target.id === "q") { e.target.blur(); const r = document.querySelector('#lst [tabindex="0"]'); if (r) r.focus(); } if (e.key === "ArrowDown" && e.target.id === "q") { e.preventDefault(); const r = document.querySelector('#lst [tabindex="0"]'); if (r) r.focus(); } return; }
  if (e.key.toLowerCase() === "n" && !e.ctrlKey && !e.metaKey && !e.altKey && S.place === "board") { e.preventDefault(); return discuss([]); }
  if (e.key === "/" && S.place === "board") { e.preventDefault(); const q = document.getElementById("q"); if (q) q.focus(); return; }
  if (e.key === "Escape") {
    if (S.open) { const n = S.open; S.open = null; if (S.stale === n) S.stale = null; render(document.getElementById(`c${n}`) ? `c${n}` : null); return; }
    if (S.selMode) { S.selMode = false; S.sel.clear(); render(); return; }
  }
  const el = e.target.closest && e.target.closest("#lst [data-nav]"); if (!el) return;
  const all = navs(), k = all.indexOf(el), n = el.dataset.card ? +el.dataset.card : null, c = n ? CARD[n] : null;
  const move = (to) => { if (!to) return; all.forEach((x) => { x.tabIndex = -1; }); to.tabIndex = 0; to.focus(); to.scrollIntoView({ block: "nearest" }); S.focusId = to.id; };
  if (e.key === "ArrowDown") { e.preventDefault(); move(all[k + 1]); }
  else if (e.key === "ArrowUp") { e.preventDefault(); move(all[k - 1]); }
  else if (e.key === "Home") { e.preventDefault(); move(all[0]); }
  else if (e.key === "End") { e.preventDefault(); move(all[all.length - 1]); }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    e.preventDefault();
    const exp = e.key === "ArrowRight";
    if (el.dataset.grp && el.hasAttribute("aria-expanded")) { S.fold[el.dataset.grp] = !exp; render(el.id); }
    else if (!exp && V.key === "a") { let h = el; while (h && !h.dataset.grp) h = all[all.indexOf(h) - 1]; if (h) { S.fold[h.dataset.grp] = true; render(h.id); } }
  }
  else if (e.key === "Enter") { e.preventDefault(); if (c) openCard(n); else if (V.onHeaderKey) V.onHeaderKey(el); else if (el.hasAttribute("aria-expanded")) { S.fold[el.dataset.grp] = el.getAttribute("aria-expanded") === "true"; render(el.id); } }
  else if (e.key === " " && c) { e.preventDefault(); if (!markable(c)) { toast(`#${c.n} can't go into a discussion`, `${repoOf(c.repo)} isn't a repository of this board.`); return; } if (!S.selMode) S.selMode = true; S.sel.has(n) ? S.sel.delete(n) : S.sel.add(n); render(el.id); }
  else if (e.key.toLowerCase() === "s" && c && !e.ctrlKey) { e.preventDefault(); startFrom(c); }
  else if (e.key.toLowerCase() === "d" && !e.ctrlKey) { e.preventDefault(); if (S.selMode && S.sel.size) discuss([...S.sel]); else if (c && markable(c) && !c.closed) discuss([n]); }
});

// ---------------- ?audit: the audit of round 10, with this round's geometry ----------------
function auditB() {
  audit();
  const pre = document.getElementById("report"), out = JSON.parse(pre.textContent);
  const frac = (v) => Math.abs(v - Math.round(v)) > 0.01; const bad = []; let n = 0;
  [".cr", ".sech", ".eh", ".fin", ".fbar", ".srch", ".lst-in", ".cardp", ".cx", ".dlg", ".cont", ".hr", ".home", ".readfail", ".selbar"].forEach((sel) => document.querySelectorAll(sel).forEach((el) => {
    const r = el.getBoundingClientRect(); if (!r.width && !r.height) return; n++;
    const f = ["left", "top", "width", "height"].filter((k) => frac(r[k])); if (f.length) bad.push(`${sel} ${f.map((k) => `${k}=${r[k].toFixed(2)}`).join(" ")}`);
  }));
  const cutRows = [...document.querySelectorAll(".cr .tl, .cr .col .t, .rel .t, .cont .nm, .hr .tx .s")].filter((el) => el.offsetParent && el.scrollWidth > el.clientWidth + 0.5 && !el.dataset.tip).map((el) => el.textContent.trim().slice(0, 40));
  // A row's title must keep at least a third of the row.
  const narrow = [...document.querySelectorAll(".cr .tl")].filter((el) => el.offsetParent && el.clientWidth < el.closest(".cr").clientWidth / 3).length;
  Object.assign(out, { roundGeometryChecked: n, roundGeometryFractional: bad, roundCutWithoutTooltip: cutRows, rowsWithTitleUnderAThird: narrow, rows: document.querySelectorAll(".cr").length });
  pre.textContent = JSON.stringify(out, null, 1);
}
document.addEventListener("DOMContentLoaded", () => {
  if (window.SPECIMEN) return;
  document.body.insertAdjacentHTML("beforeend", `<div id="app" class="app ${V.key}"></div><div class="toasts" role="status" aria-live="polite" aria-label="Notifications"></div><pre id="report" class="report" hidden></pre>`);
  bootCommon(() => render());
  document.body.insertAdjacentHTML("afterbegin", SPRITE_B);
  addEventListener("resize", layout);
  render(S.focusId);
  if (S.place === "home" && !S.dialog) { const c = document.getElementById("cont"); if (c) c.focus(); }
  if (S.dialog) focusDialog();
  if (S.open) { const r = document.getElementById(`c${S.open}`) || document.querySelector(".cardp .btn"); if (r) r.scrollIntoView({ block: "center" }); }
  if (document.fonts) document.fonts.ready.then(() => { layout(); markTruncated(); });
  if (Q.has("audit")) setTimeout(auditB, 1400);
});

/* =====================================================================
   B · By epic. The cards of an epic together, under the epic's own card
   as the header, with its progress; the status as a word on the row; the
   cards without an epic after them. The finished cards of each group fold
   into one line, and the finished epics into one line at the end. The card
   opens in place: the row grows into the card.
   The list is not a tree: each row is a disclosure button, and the card it
   opens is a region right after it (WAI-ARIA disclosure), so no region ever
   sits inside a tree. The arrows still move between the rows.
   ===================================================================== */
S.full = false;
const byOrder = (x, y) => x.s - y.s || CARDS.indexOf(x) - CARDS.indexOf(y);
// The status word shows on the first card of each run: the rest of the run is quiet, the name says it.
let RUN = null;
function rowOrCard(c) { const quiet = RUN === c.s && S.open !== c.n; RUN = S.open === c.n ? null : c.s; return cardRow(c, 2, { quiet }) + (S.open === c.n ? inlineCard(c) : ""); }
const runs = (list) => { RUN = null; const h = list.map(rowOrCard).join(""); RUN = null; return h; };
function finRow(key, fin, shut, label) {
  if (!fin.length) return "";
  const tip = STATUSES.filter((s) => s.final).map((s) => `${s.name} ${fin.filter((c) => STATUSES[c.s] === s).length}`).filter((x) => !/ 0$/.test(x)).join(" · ");
  return `<div class="fin" role="button" aria-expanded="${!shut}" tabindex="-1" data-nav data-grp="${key}" id="h-${key}" data-tip="${label ? "Epics whose cards are all finished" : tip}" aria-label="${label || `${fin.length} finished cards: ${tip}`}">${I("down", "i chev")}<span>${label || `${fin.length} finished`}</span></div>`
    + (shut ? "" : runs(fin.sort(byOrder)));
}
function inlineCard(c) {
  return `<div class="cx" role="region" id="cx${c.n}" aria-label="Card #${c.n} ${esc(c.t)}">
    <button class="btn ghost sm icon cx-x" data-act="close-card" aria-label="Close the card" data-tip="Close · Esc">${I("x")}</button>
    <div class="cx-main">${S.stale === c.n ? cardNotes(c) : ""}
      <div class="cx-bar">${cardActions(c)}<span class="grow"></span><span class="cd-ref"><span>${repoOf(c.repo)}</span><a href="#" data-tip="Open on GitHub">GitHub</a></span></div>
      ${S.stale === c.n ? "" : cardNotes(c)}${cardTask(c)}
      <div class="cx-body ${S.full ? "" : "clamp"}" id="cxb${c.n}">${cardBody(c)}</div>
      <button class="btn ghost xs cx-more" data-act="full" aria-expanded="${S.full}" aria-controls="cxb${c.n}">${S.full ? "Show less" : "Show the whole card"}</button></div>
    <div class="cx-side">${cardFacts(c)}${cardRelations(c)}</div></div>`;
}
// The epic's header is the epic's card: one target. A click or Enter opens the card, S and D act on it.
function epicHead(e) {
  const done = epicDone(e.n), all = e.kids.length, pct = Math.round((done / all) * 100), open = S.open === e.n;
  const lead = S.selMode ? `<span class="lead"><span class="cb ${S.sel.has(e.n) ? "on" : ""}" aria-hidden="true">${I("check")}</span></span>` : `<span class="lead">${I("epic")}</span>`;
  return `<div class="eh ${open ? "open" : ""}" role="button" aria-expanded="${open}" ${open ? `aria-controls="cx${e.n}"` : ""} ${S.selMode ? `aria-pressed="${S.sel.has(e.n)}"` : ""} tabindex="-1" data-nav data-card="${e.n}" id="c${e.n}"
    aria-label="Epic #${e.n} ${e.t}, ${STATUSES[e.s].name}, ${done} of ${all} cards finished">${lead}
    <span class="nm"><span class="t">${e.t}</span><span class="cnt">#${e.n}</span></span>
    <span class="prog"><span class="pt">${done} of ${all} finished</span><span class="bar" aria-hidden="true"><i style="--p:${pct}"></i></span><span class="keys" aria-hidden="true"><span><kbd>S</kbd>start</span><span><kbd>D</kbd>discuss</span></span></span></div>`
    + (open ? inlineCard(e) : "");
}
const V = {
  key: "b", inline: true,
  cols: ["lead", "status", "num", "title", ["dep", "task"], "keys"],
  list(cards) {
    const ids = new Set(cards.map((c) => c.n));
    // A card that left the reading while open stays in place, struck, until it is closed.
    if (S.stale && S.open === S.stale) ids.add(S.stale);
    const openEpics = CARDS.filter((c) => c.epicOf && c.kids.some((k) => !isFinal(CARD[k])));
    const doneEpics = CARDS.filter((c) => c.epicOf && !openEpics.includes(c));
    let h = "";
    openEpics.forEach((e) => {
      const kids = e.kids.map((k) => CARD[k]).filter((c) => ids.has(c.n));
      if (!kids.length && !ids.has(e.n)) return;
      const open = kids.filter((c) => !isFinal(c)).sort(byOrder), fin = kids.filter(isFinal), key = `e${e.n}`;
      h += `<section class="egrp" aria-labelledby="c${e.n}">${epicHead(e)}<div class="grpb">${runs(open)}${finRow(`f-${key}`, fin, folded(`f-${key}`, true))}</div></section>`;
    });
    const none = cards.filter((c) => !c.epic && !c.epicOf), nOpen = none.filter((c) => !isFinal(c)).sort(byOrder), nFin = none.filter(isFinal);
    if (none.length) h += `<section class="egrp" aria-labelledby="h-none"><h3 class="eh plain" id="h-none"><span class="lead"></span><span class="nm"><span class="t">No epic</span></span><span class="prog"><span class="pt">${nOpen.length} open</span></span></h3><div class="grpb">${runs(nOpen)}${finRow("f-none", nFin, folded("f-none", true))}</div></section>`;
    const de = doneEpics.filter((e) => ids.has(e.n) || e.kids.some((k) => ids.has(k)));
    if (de.length) h += `<section class="egrp done" aria-label="Finished epics"><div class="grpb">${finRow("done-epics", de, folded("done-epics", true), `${de.length} finished epics`)}</div></section>`;
    return `<div class="lst" id="lst" role="group" aria-label="Cards of ${BOARD.title}, by epic">${h}</div>`;
  },
  panel: null,
};
document.addEventListener("click", (e) => { const f = e.target.closest('[data-act="full"]'); if (f) { S.full = !S.full; render(); const b = document.querySelector('[data-act="full"]'); if (b) b.focus(); } }, true);


</script>
