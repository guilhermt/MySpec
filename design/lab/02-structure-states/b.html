<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b · Rich line</title>
<style>
/* Wireframe base: grayscale, system font, no final typography. */
:root {
  --bg: #f5f5f5;
  --surface: #ffffff;
  --sunken: #eeeeee;
  --hover: #e8e8e8;
  --selected: #dedede;
  --line: #dcdcdc;
  --line-2: #c4c4c4;
  --deco: #a8a8a8;
  --ink: #121212;
  --ink-2: #3a3a3a;
  --ink-3: #555555;
  --ink-4: #6e6e6e;
  --strong: #161616;
  --on-strong: #ffffff;
  --fs-xs: 11px;
  --fs-s: 12px;
  --fs-m: 13px;
  --fs-l: 15px;
  --fs-xl: 19px;
  --r: 4px;
  --measure: 800px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.strong { font-weight: 650; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 8px 2px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
kbd {
  font: 10px/1 ui-monospace, monospace; color: var(--ink-3);
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px;
  padding: 2px 4px; background: var(--surface); white-space: nowrap;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
  border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface);
  font-size: var(--fs-s); white-space: nowrap; color: var(--ink-2); flex: none;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.on { background: var(--selected); border-color: var(--line-2); color: var(--ink); }
.btn.sm { height: 22px; padding: 0 7px; font-size: var(--fs-xs); }
.iconbtn { width: 26px; justify-content: center; padding: 0; }
.btn.sm.iconbtn { width: 22px; }
/* Disabled reads as disabled: dashed, faint, no fill, and the reason sits next to it. */
.btn:disabled, .btn.primary:disabled {
  background: transparent; border-style: dashed; border-color: var(--line-2); color: var(--ink-4); cursor: not-allowed;
}
.btn.ghost:disabled { border-color: transparent; }
.why { font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }

/* Status glyphs: shape + label, never shape alone. */
.st { display: inline-block; width: 9px; height: 9px; flex: none; border-radius: 50%; }
.st.error { border-radius: 1px; background: var(--strong); transform: rotate(45deg) scale(.88); }
.st.wait { background: var(--strong); }
.st.close { border: 2.5px solid var(--strong); }
.st.run { border: 2px solid var(--ink-2); background: conic-gradient(var(--ink-2) 0 25%, transparent 0); animation: spin 1.4s linear infinite; }
.st.gh { border: 1.5px dashed var(--ink-3); }
.st.idle { border: 1.5px solid var(--ink-4); }
.st.paused { border-radius: 0; width: 8px; background: linear-gradient(90deg, var(--ink-3) 0 34%, transparent 34% 66%, var(--ink-3) 66%); }
.st.done { border-radius: 0; width: 9px; height: 5px; border-left: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg) translate(1px, -1px); }
.st.warn { border-radius: 1px; border: 1.5px solid var(--ink-2); transform: rotate(45deg) scale(.8); }
.st.todo { border: 1px solid var(--deco); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { 0% { opacity: .55; } 50% { opacity: 1; } 100% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Type glyph: placeholder for the type icon. */
.ty {
  display: inline-grid; place-items: center; flex: none; width: 17px; height: 17px;
  border: 1px solid var(--ink-3); border-radius: 3px; font-size: 9px; font-weight: 700; color: var(--ink-2);
}
.ty.review { border-radius: 50%; }
.ty.discussion { border-style: dashed; }

/* Times. Waiting for you: a filled chip. Agent turn: plain text after a small spinner. */
.tw {
  display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px; flex: none;
  background: var(--strong); color: var(--on-strong); font-size: var(--fs-xs); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.tw.close { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--strong); }
.tt { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.tt .st { width: 7px; height: 7px; border-width: 1.5px; }

/* Context meter, compact */
.ctx { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.ctx i { display: inline-block; width: 22px; height: 5px; border: 1px solid var(--ink-4); border-radius: 2px; position: relative; overflow: hidden; }
.ctx i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--ink-3); }

/* Stage track: done stages are buttons (back to a stage). */
.track { display: flex; align-items: center; gap: 2px; font-size: var(--fs-s); color: var(--ink-3); min-width: 0; overflow: hidden; }
.track .stg { padding: 2px 7px; border-radius: 3px; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; height: 24px; }
.track button.stg:hover { background: var(--hover); color: var(--ink); }
.track .stg.done { color: var(--ink-2); }
.track .stg.done::before { content: "✓"; font-size: 10px; }
.track .stg.cur { background: var(--selected); color: var(--ink); font-weight: 650; }
.track .stg.cur .sub { font-weight: 400; color: var(--ink-2); }
.track .gt { color: var(--deco); font-size: 10px; }

/* Bars attached to an item */
.bar {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 5px 16px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; flex: none;
}
.bar .lbl { font-weight: 650; white-space: nowrap; }
.bar .state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.bar .acts { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.bar.note { min-height: 34px; background: var(--bg); font-size: var(--fs-s); }
.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.tabs .tab { display: inline-flex; gap: 6px; align-items: center; padding: 8px 10px 7px; border-bottom: 2px solid transparent; color: var(--ink-3); font-size: var(--fs-s); white-space: nowrap; }
.tabs .tab.on { border-bottom-color: var(--ink); color: var(--ink); font-weight: 650; }
.tabs .tab .tw, .tabs .tab .tt { font-weight: 650; }

/* Conversation */
.convo { flex: 1 1 auto; overflow: auto; min-height: 0; }
.convo-in { max-width: var(--measure); margin: 0 auto; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.e-marker { display: flex; align-items: center; gap: 10px; font-size: var(--fs-xs); color: var(--ink-3); }
.e-marker::before, .e-marker::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.e-user { align-self: flex-end; max-width: 78%; background: var(--sunken); border-radius: 8px; padding: 8px 12px; }
.e-app { border-left: 2px solid var(--line-2); padding: 2px 0 2px 12px; color: var(--ink-2); }
.e-app .who, .e-agent .who { font-size: var(--fs-xs); color: var(--ink-3); margin-bottom: 2px; }
.e-agent p { margin: 0 0 6px; }
.e-agent code, .e-app code, .finding code, .notice code { font-family: ui-monospace, monospace; font-size: 12px; background: var(--sunken); padding: 0 3px; border-radius: 2px; }
.e-actions { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: var(--fs-s); }
.e-actions summary { display: flex; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; list-style: none; color: var(--ink-2); }
.e-actions summary::-webkit-details-marker { display: none; }
.e-actions ul { list-style: none; margin: 0; padding: 4px 10px 8px 28px; border-top: 1px solid var(--line); }
.e-actions li { display: flex; gap: 8px; padding: 2px 0; color: var(--ink-2); }
.e-actions li .k { width: 44px; color: var(--ink-3); flex: none; }
.e-activity { display: flex; gap: 8px; align-items: center; font-size: var(--fs-s); color: var(--ink-2); }
.e-status { border: 1px dashed var(--line-2); border-radius: 6px; padding: 10px 12px; font-size: var(--fs-s); }
.e-block { border: 2px solid var(--strong); border-radius: 8px; padding: 12px 14px; background: var(--surface); }
.e-block pre { margin: 8px 0; padding: 8px 10px; background: var(--sunken); border-radius: 4px; font: 12px/1.5 ui-monospace, monospace; overflow: auto; }
.card-q { border: 2px solid var(--strong); border-radius: 8px; background: var(--surface); padding: 12px 14px; }
.card-q .hd { display: flex; gap: 8px; align-items: center; font-size: var(--fs-xs); color: var(--ink-2); margin-bottom: 6px; }
.card-q .q { font-weight: 650; font-size: var(--fs-l); margin-bottom: 8px; }
.card-q .opt { display: flex; gap: 10px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 5px; margin-top: 6px; width: 100%; }
.card-q .opt:hover { background: var(--hover); }
.card-q .opt .n { font: 11px ui-monospace, monospace; border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; height: 17px; flex: none; }
.card-q .opt small { display: block; color: var(--ink-3); }
.card-q pre { margin: 6px 0 8px; padding: 8px 10px; background: var(--sunken); border-radius: 4px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
.card-q .btns { display: flex; gap: 6px; flex-wrap: wrap; }

/* Composer */
.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 24px 12px; flex: none; }
.composer-in { max-width: var(--measure); margin: 0 auto; }
.composer .box { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-height: 58px; color: var(--ink-4); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
.composer .box .row { color: var(--ink-3); font-size: var(--fs-xs); }

/* Findings */
.finding { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); font-size: var(--fs-s); }
.finding .loc { color: var(--ink-3); font: 11px ui-monospace, monospace; }
.finding.undecided { border-color: var(--ink-2); }
.finding.decided { color: var(--ink-3); }
.finding.focus { box-shadow: 0 0 0 2px var(--ink); }
.finding .dec { display: flex; gap: 6px; margin-top: 6px; }
.progress { height: 4px; background: var(--sunken); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink-2); width: var(--p); }

/* Places: lists */
.place { display: flex; flex-direction: column; min-height: 0; height: 100%; background: var(--surface); flex: 1; }
.place-hd { display: flex; align-items: center; gap: 10px; padding: 0 20px; min-height: 48px; border-bottom: 1px solid var(--line); flex: none; flex-wrap: wrap; }
.place-hd h1 { font-size: var(--fs-l); margin: 0; }
.filters { display: flex; gap: 6px; padding: 8px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 12px; font-size: var(--fs-xs); color: var(--ink-2); background: var(--surface); }
.chip.on { background: var(--selected); color: var(--ink); }
.place-body { overflow: auto; flex: 1; min-height: 0; }
.sec-hd { display: flex; gap: 8px; align-items: center; padding: 10px 20px 4px; font-size: var(--fs-xs); color: var(--ink-3); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 7px 20px; border-bottom: 1px solid var(--sunken); min-width: 0; width: 100%; }
.lrow:hover { background: var(--hover); }
.lrow.hl { background: var(--selected); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; height: 18px; color: var(--ink-2); white-space: nowrap; }
.tag.strong { border-color: var(--strong); color: var(--ink); font-weight: 650; }
.notice { margin: 10px 20px 0; border: 1px dashed var(--ink-3); border-radius: 5px; padding: 7px 10px; font-size: var(--fs-s); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Documents and skeleton text */
.doc { padding: 16px 20px; overflow: auto; flex: 1; min-height: 0; }
.doc h2 { font-size: var(--fs-l); margin: 0 0 8px; }
.doc h3 { font-size: var(--fs-m); margin: 14px 0 6px; }
.ln { height: 8px; background: var(--sunken); border-radius: 2px; margin: 7px 0; }
.sk { background: var(--sunken); border-radius: 3px; height: 10px; animation: shimmer 1.6s ease-in-out infinite; }

/* Aux panel */
.aux { display: flex; flex-direction: column; background: var(--surface); min-height: 0; height: 100%; }
.aux-hd { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 14px; height: 44px; border-bottom: 1px solid var(--line); flex: none; }
.vtrack { list-style: none; margin: 0; padding: 0; font-size: var(--fs-s); }
.vtrack li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; color: var(--ink-3); }
.vtrack li.done { color: var(--ink-2); }
.vtrack li.cur { color: var(--ink); }
.vtrack .mk { width: 12px; flex: none; text-align: center; font-size: 10px; display: inline-grid; place-items: center; }

/* Popover and menu */
.pop {
  position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .16); min-width: 240px; max-width: 380px; padding: 6px; font-size: var(--fs-s);
}
.pop .ph { padding: 4px 8px 6px; font-size: var(--fs-xs); color: var(--ink-3); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
.pop .mi { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 4px; min-width: 0; }
.pop .mi:hover, .pop .mi:focus-visible { background: var(--hover); }
.pop .mi small { display: block; color: var(--ink-3); }
.pop .mi:disabled { color: var(--ink-4); cursor: not-allowed; background: none; }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.pop .kv { display: flex; gap: 8px; padding: 4px 8px; align-items: center; }

/* Item that left while open */
.gone { max-width: 600px; margin: 9vh auto 0; padding: 0 24px; display: flex; flex-direction: column; gap: 14px; }
.gone h1 { font-size: var(--fs-xl); margin: 0; }
.gone .res { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; background: var(--bg); }
.gone .res div { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-size: var(--fs-s); }
.gone .next { display: flex; gap: 8px; flex-wrap: wrap; }

/* Start page */
.start { overflow: auto; flex: 1; }
.start-in { max-width: 760px; margin: 0 auto; padding: 48px 24px; display: flex; flex-direction: column; gap: 26px; }
.start h1 { font-size: var(--fs-xl); margin: 0; }
.start h2 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 0 0 8px; }
.cont { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; width: 100%; }
.cont:hover { background: var(--hover); }
.acts3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.act { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.act:hover { background: var(--hover); }
.act kbd { align-self: flex-start; }
.act .t { font-weight: 650; display: flex; gap: 8px; align-items: center; }
.boards .lrow { padding-left: 0; padding-right: 0; }
.keys { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-3); font-size: var(--fs-s); }

/* Shell common to both variants */
.app { display: grid; grid-template-columns: var(--sb) minmax(0, 1fr); height: 100vh; }
.app.sb-collapsed { --sb: 60px; }
.sb { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); min-height: 0; min-width: 0; container: sb / inline-size; }
.sb-top { display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px 0 14px; flex: none; }
.sb-top .brand { font-weight: 700; letter-spacing: -.01em; }
.sb-filter { padding: 0 8px 6px; flex: none; }
.sb-filter select { width: 100%; height: 26px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); font: inherit; font-size: var(--fs-s); color: var(--ink-2); padding: 0 6px; }
.sb-tree { flex: 1; overflow: auto; padding: 2px 6px 10px; }
.sb-foot { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px; border-top: 1px solid var(--line); flex: none; }
.sb-foot .cnt { font-size: var(--fs-xs); color: var(--ink-3); }
.sb-empty { padding: 8px 10px; color: var(--ink-3); font-size: var(--fs-s); }
[role="treeitem"]:focus-visible { outline-offset: -2px; }

/* Collapsed sidebar: a strip that keeps kind, severity and time as text */
.strip { display: none; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; flex: 1; overflow: auto; }
.strip .tile { position: relative; width: 50px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 0 4px; border-radius: 5px; }
.strip .tile:hover, .strip .tile.sel { background: var(--selected); }
.strip .tile .gl { position: relative; }
.strip .tile .gl .st { position: absolute; right: -5px; bottom: -3px; box-shadow: 0 0 0 2px var(--bg); }
.strip .tile .tx { font-size: 10px; line-height: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
.strip .tile .tx.w { background: var(--strong); color: var(--on-strong); border-radius: 7px; padding: 0 4px; }
.strip .tile .tx.c { box-shadow: inset 0 0 0 1.5px var(--strong); border-radius: 7px; padding: 0 4px; }
.strip .tile .tx.m { font-weight: 400; color: var(--ink-3); }
.strip .grp { width: 34px; border-top: 1px solid var(--line); margin: 5px 0 2px; position: relative; display: flex; justify-content: center; }
.strip .grp .st { position: absolute; top: -5px; background: var(--bg); box-shadow: 0 0 0 2px var(--bg); }
.app.sb-collapsed .sb-filter, .app.sb-collapsed .sb-tree, .app.sb-collapsed .sb-top .brand, .app.sb-collapsed .sb-top .newbtn, .app.sb-collapsed .sb-foot .wide { display: none; }
.app.sb-collapsed .strip { display: flex; }
.app.sb-collapsed .sb-top { padding: 0; justify-content: center; }
.app.sb-collapsed .sb-foot { flex-direction: column; height: auto; padding: 6px 0; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); position: relative; container: main / inline-size; }
.hdr { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 8px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; font-size: var(--fs-s); color: var(--ink-3); }
.crumbs .here { color: var(--ink); font-size: var(--fs-l); font-weight: 650; }
.crumbs button:hover { text-decoration: underline; }
.crumbs .up { white-space: nowrap; }
.hdr .tools { display: flex; align-items: center; gap: 4px; flex: none; }
.trackbar { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; }
.body { flex: 1; display: flex; min-height: 0; position: relative; }
.colconvo { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.drawer { width: clamp(380px, 26vw, 560px); border-left: 1px solid var(--line); flex: none; background: var(--surface); }
.drawer.overlay { position: absolute; right: 0; top: 0; bottom: 0; box-shadow: -8px 0 24px rgba(0, 0, 0, .12); z-index: 5; max-width: calc(100% - 40px); }
.nw { display: none; }
@container main (max-width: 1020px) {
  .hdr .opt { display: none; }
  .hdr .nw { display: inline-flex; }
  .bar .long { display: none; }
}
@container main (max-width: 900px) {
  .crumbs .up { display: none; }
  .crumbs .meta { display: none; }
}

/* Loading skeleton */
.skrow { display: grid; gap: 6px; padding: 8px 10px; }

/* Mock-only chrome: dashed, clearly not part of the UI */
.mock { position: fixed; z-index: 90; font: 11px/1.3 ui-monospace, monospace; color: #333; background: #fffef4; border: 1px dashed #888; border-radius: 4px; }

/* ===== b · Rich line ===== */

.it { display: grid; gap: 3px; width: 100%; padding: 7px 8px 8px calc(10px + var(--d, 0) * 14px); border-radius: 6px; margin: 2px 0; cursor: pointer; border: 1px solid transparent; }

<script>
// ================= Common to both variants =================
const Q = new URLSearchParams(location.search);
const SCENES = ["item", "home", "loading", "reading", "archived", "empty", "welcome"];

// ---------- Fake data ----------

const ITEMS = {

    ctx: 12, model: "Sonnet · medium", branch: "offline-sync-for-drafts", created: "Sep 23 · 08:40", updated: "40s ago",

    pos: "Paused · PRD", posShort: "Paused · PRD",

    pos: "Pass 1 · 9 findings", posShort: "Pass 1",
    sits: [{ sev: "wait", label: "Decide findings", place: "5 of 9 decided", since: "34m", long: "34 minutes", min: 34 }],

// The tree, in the product's order: Reviews, each board (epics first, then tasks, then discussions), then No board.
const TREE_BASE = [
  { id: "reviews", label: "Reviews", place: "reviews", items: ["r1", "r2"] },
  { id: "plat", label: "Platform Roadmap", place: "board:plat", board: "plat", epics: [{ id: "ep-api", label: "API hardening", items: ["t1", "t7"] }], items: ["t3", "d1"] },
  { id: "mob", label: "Mobile App", place: "board:mob", board: "mob", items: ["t2", "t4", "t5"] },
  { id: "nob", label: "No board", items: ["t6"], notices: ["infra"] },

// Scene tweaks to the data
const ARCHIVED_ID = SCENE === "archived" ? (ITEMS[Q.get("open")] ? Q.get("open") : "t4") : null;
const GONE = new Set(SCENE === "archived" ? [ARCHIVED_ID] : SCENE === "empty" || SCENE === "welcome" ? Object.keys(ITEMS) : []);
const READING = SCENE === "reading";

// ---------- Derived ----------
const sortSits = (s) => [...(s || [])].sort((a, b) => SEV[a.sev] - SEV[b.sev] || b.min - a.min);
function tone(i) {
  if (i.sits && i.sits.length) return sortSits(i.sits)[0].sev;
  if (i.run) return "run";
  if (i.gh) return "gh";
  if (i.paused) return "paused";
  return "idle";
}
const needsYou = (i) => !!(i.sits && i.sits.length);
const topSit = (i) => sortSits(i.sits)[0];
const oldest = (i) => [...i.sits].sort((a, b) => b.min - a.min)[0];
function urgencyOrder() {
  return Object.values(ITEMS).filter((i) => !GONE.has(i.id) && needsYou(i))
    .sort((a, b) => SEV[topSit(a).sev] - SEV[topSit(b).sev] || oldest(b).min - oldest(a).min).map((i) => i.id);
}
const boardOf = (id) => BOARDS[id];
function meta(i) {
  if (i.kind === "task") return i.card ? `${i.repo}#${i.card}` : i.repo;
  if (i.kind === "review") return `${i.repo}#${i.pr}`;
  return `#${i.cards.join(" #")}`;
}
function sitText(s) { return `${s.label} · ${s.place}`; }
function ariaFor(i) {
  const parts = [`${i.kind} ${i.name}`];
  if (needsYou(i)) parts.push(sortSits(i.sits).map((s) => `${TONE_WORD[s.sev]}: ${sitText(s)}, for ${s.long}`).join("; "));
  else parts.push(TONE_WORD[tone(i)] + ", " + i.pos);
  if (i.run) parts.push(`${i.run.who} working for ${i.run.long}: ${i.run.act}`, `context ${i.ctx}% used`);
  return parts.join(". ");
}
function counts(items) {
  const c = { error: 0, wait: 0, close: 0, run: 0, gh: 0, paused: 0, idle: 0 };
  items.forEach((i) => { c[tone(i)]++; });
  return c;
}

// ---------- Atoms ----------
const st = (t, label) => `<span class="st ${t}" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}></span>`;
const TY = { task: "T", review: "R", discussion: "D" };
const ty = (kind) => `<span class="ty ${kind}" aria-hidden="true" title="${kind}">${TY[kind]}</span>`;
const kbd = (k) => `<kbd>${k}</kbd>`;
const ctxm = (p) => `<span class="ctx" title="Context window ${p}% used"><i style="--p:${p}%"></i>${p}%</span>`;
const tw = (s) => `<span class="tw ${s.sev === "close" ? "close" : ""}" title="Waiting for you for ${s.long}"><span class="sr">waiting for you </span>${s.since}</span>`;
const tt = (r) => `<span class="tt" title="Agent working on this turn for ${r.long}">${st("run")}<span class="sr">agent working </span>${r.turn}</span>`;
const lines = (n, widths = [96, 88, 92, 70]) => Array.from({ length: n }, (_, k) => `<div class="ln" style="width:${widths[k % widths.length]}%"></div>`).join("");
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600);
}

// ---------- Stages ----------
const STAGES = {
  Structured: ["PRD", "Tech spec", "Plan", "Implementation", "PR", "PR review", "Closing"],
  "One-Shot": ["Planning", "Implementation", "PR", "PR review", "Closing"],
};
const PLANNING = ["PRD", "Tech spec", "Plan", "Planning"];
function track(i) {
  const s = STAGES[i.flow], cur = s.indexOf(i.stage);
  return `<nav class="track" aria-label="Stages">${s.map((n, k) => {
    if (k === cur) {
      const t = tone(i);
      const back = PLANNING.includes(n);
      const inner = `${st(t)}${n}<span class="sub">· ${i.chipSub}</span>`;
      return back ? `<button class="stg cur" aria-current="step" data-pop="stage:${n}" aria-haspopup="menu" title="${n}: discard and restart">${inner}</button>`
        : `<span class="stg cur" aria-current="step">${inner}</span>`;
    }
    if (k < cur && PLANNING.includes(n)) return `<button class="stg done" data-pop="stage:${n}" aria-haspopup="menu" title="Back to ${n}…">${n}</button>`;
    return `<span class="stg ${k < cur ? "done" : ""}">${n}</span>`;
  }).join('<span class="gt" aria-hidden="true">›</span>')}</nav>`;
}
function losesFor(i, stage) {
  const s = STAGES[i.flow], k = s.indexOf(stage), later = s.slice(k + 1, s.indexOf(i.stage) + 1);
  const bits = [];
  if (later.includes("Tech spec")) bits.push("the tech spec");
  if (later.includes("Plan")) bits.push(i.step ? `the ${i.step.of} step files` : "the plan");
  if (later.includes("Implementation") || i.stage === "Implementation") bits.push("the worktree and branch <code>" + i.branch + "</code>", "the commits of the steps", "the review reports");
  if (later.includes("PR")) bits.push("the pull request draft");
  bits.push("their conversations");
  return bits.join(", ");
}
function stagePop(i, stage) {
  const cur = STAGES[i.flow].indexOf(i.stage), k = STAGES[i.flow].indexOf(stage);
  if (k === cur) {
    return `<div class="ph">${stage}</div><button class="mi" data-act="toast:Confirmation lists what is lost, then a new ${stage} session starts"><span>Discard and restart ${stage}…<small>Deletes this stage's conversation and document and starts over now.</small></span></button>`;
  }
  let h = `<div class="ph">${stage} · done</div><button class="mi" data-act="toast:Confirmation lists exactly what is lost"><span>Back to ${stage}…<small>Reopens ${stage} to revise it. Deletes ${losesFor(i, stage)}. The task waits for Continue.</small></span></button>`;

function modelsPop(i) {
  const rows = i.flow === "One-Shot" ? ["One-Shot planning", "Implementation", "Step review", "PR", "PR review"] : ["PRD", "Tech spec", "Plan", "Implementation", "Step review", "PR", "PR review"];

function revealInTree(id) {

// ---------- Tree (shared scaffolding; rows come from the variant) ----------
function visibleTree() {
  const f = S.filter;
  const keep = (id) => !GONE.has(id) && (f === "all" || ITEMS[id].kind !== "task" || ITEMS[id].repo === f);
  return TREE_BASE.map((n) => {
    if (f !== "all" && n.id !== "reviews") {
      const repoBoard = REPOS[f].board;
      if (n.board && n.board !== repoBoard) return null;
      if (!n.board && repoBoard) return null;
    }
    const epics = (n.epics || []).map((e) => ({ ...e, items: e.items.filter(keep) })).filter((e) => e.items.length);
    const items = (n.items || []).filter(keep);
    const notices = (n.notices || []).filter((r) => f === "all" || r === f);
    if (n.id === "nob" && !items.length && !epics.length && !notices.length) return null;
    return { ...n, epics, items, notices, all: [...epics.flatMap((e) => e.items), ...items].map((id) => ITEMS[id]) };
  }).filter(Boolean);
}
function nodeRow(n, level, summaryHtml, extra) {
  const c = !!S.collapsed[n.id];
  const sel = n.place && key(S.cur) === n.place;
  return `<div class="node ${n.epic ? "epic" : ""} ${sel ? "sel" : ""}" role="treeitem" aria-level="${level}" aria-expanded="${!c}" tabindex="-1" data-tid="node:${n.id}" ${n.place ? `data-open="${n.place}"` : ""} style="--d:${level - 1}">
    <button class="chev" tabindex="-1" data-act="fold:${n.id}" aria-hidden="true">${c ? "▸" : "▾"}</button>
    <span class="nt trunc">${n.label}</span>${c ? summaryHtml : ""}${extra || ""}</div>`;
}
function treeHtml() {
  if (SCENE === "welcome") return `<div class="sb-empty">Nothing registered yet.</div>`;
  const vt = visibleTree();
  let h = "";
  vt.forEach((n) => {
    const c = S.collapsed[n.id];
    h += nodeRow(n, 1, V.nodeSummary(n.all, n), V.nodeExtra(n));
    if (c) return;
    n.notices.forEach((r) => { h += V.notice(r); });
    n.epics.forEach((e) => {
      const ec = S.collapsed[e.id];
      h += nodeRow({ ...e, epic: true }, 2, V.nodeSummary(e.items.map((id) => ITEMS[id]), e), "");
      if (!ec) e.items.forEach((id) => { h += V.row(ITEMS[id], 3); });
    });
    n.items.forEach((id) => { h += V.row(ITEMS[id], 2); });
    if (n.board && !n.all.length) h += `<div class="sb-empty" style="padding-left:30px">No active tasks. ${S.filter === "all" ? "" : ""}</div>`;
  });
  if (S.filter !== "all" && !vt.some((n) => n.id !== "reviews" && n.all.some((i) => i.kind === "task"))) {
    h += `<div class="sb-empty">No tasks in ${S.filter}.</div>`;
  }
  return h;
}

function handleAct(v, el) {

  if (v.startsWith("aux:")) { const k = v.slice(4); S.aux = S.aux === k ? null : k; S.pop = null; render(); return true; }

function treeKeys(e) {
  const tree = document.getElementById("tree");
  if (!tree || !tree.contains(document.activeElement)) return false;
  const rows = [...tree.querySelectorAll('[role="treeitem"]')];
  const cur = document.activeElement.closest('[role="treeitem"]');
  const k = rows.indexOf(cur);
  if (k < 0) return false;
  const focus = (r) => { if (!r) return; rows.forEach((x) => (x.tabIndex = -1)); r.tabIndex = 0; S.treeFocus = r.dataset.tid; r.focus(); };
  const level = (r) => +r.getAttribute("aria-level");
  const isNode = cur.dataset.tid.startsWith("node:");
  const expanded = cur.getAttribute("aria-expanded") === "true";
  switch (e.key) {
    case "ArrowDown": e.preventDefault(); focus(rows[Math.min(rows.length - 1, k + 1)]); return true;
    case "ArrowUp": e.preventDefault(); focus(rows[Math.max(0, k - 1)]); return true;
    case "Home": e.preventDefault(); focus(rows[0]); return true;
    case "End": e.preventDefault(); focus(rows[rows.length - 1]); return true;
    case "ArrowRight":
      e.preventDefault();
      if (isNode && !expanded) { S.collapsed[cur.dataset.tid.slice(5)] = false; S.treeFocus = cur.dataset.tid; render(); }
      else if (isNode) focus(rows[k + 1]);
      return true;
    case "ArrowLeft": {
      e.preventDefault();
      if (isNode && expanded) { S.collapsed[cur.dataset.tid.slice(5)] = true; S.treeFocus = cur.dataset.tid; render(); return true; }
      for (let j = k - 1; j >= 0; j--) if (level(rows[j]) < level(cur)) { focus(rows[j]); break; }
      return true;
    }
    case "Enter": case " ": {
      e.preventDefault();
      if (cur.dataset.go) go(parse(cur.dataset.go));
      else if (cur.dataset.open) go(parse(cur.dataset.open));
      else if (isNode) { S.collapsed[cur.dataset.tid.slice(5)] = expanded; render(); }
      return true;
    }
  }
  return false;
}
addEventListener("keydown", (e) => {

});

  const s = STAGES[i.flow], cur = s.indexOf(i.stage);
  let h = `<div class="ph">Task</div>
    <button class="mi" data-act="side-focus:det-rmode"><span class="grow">Review mode<small>${i.reviewMode} · in Details</small></span></button>
    <button class="mi" data-act="side-focus:det-models"><span class="grow">Models<small>Per stage · in Details</small></span></button><hr>`;
  s.slice(0, cur).filter((n) => PLANNING.includes(n)).forEach((n) => { h += `<button class="mi" data-act="pop:stage:${n}"><span class="grow">Back to ${n}…</span>▸</button>`; });
  if (PLANNING.includes(i.stage)) h += `<button class="mi" data-act="pop:stage:${i.stage}"><span class="grow">Discard and restart ${i.stage}…</span>▸</button>`;
  if (i.step) h += `<button class="mi" data-act="toast:Confirmation: ends both sessions, deletes the conversations and reports of step ${i.step.n}">Discard step ${i.step.n}…</button>`;
  return h + `<hr><button class="mi" data-act="toast:The preview lists the worktree, branch and pull request before deleting">Delete task…</button>`;
};

// Details: progress with nested steps, checks by name, facts of the item (editable where the product allows).
function detProgress(i) {
  const s = STAGES[i.flow], cur = s.indexOf(i.stage);
  const steps = stepsOf(i);
  const extra = { PRD: "PRD.md", "Tech spec": "tech-spec.md", Plan: i.step ? `${i.step.of} steps` : "", Planning: "one-shot.md", Implementation: i.flow === "One-Shot" ? "1 commit · 3c9a1e2" : "", PR: i.pr ? `#${i.pr} opened` : "" };
  return `<h3>Progress</h3><ol class="vtrack" aria-label="Stages">${s.map((n, k) => {
    const cls = k < cur ? "done" : k === cur ? "cur" : "";
    const mk = k < cur ? "✓" : k === cur ? st(tone(i)) : "○";
    let sub = k < cur ? extra[n] || "" : k === cur ? i.chipSub : "";
    let nested = "";
    if (n === "Implementation" && steps.length) {
      nested = `<ol class="steps">${steps.map(([t, c, m], j) => {
        const sm = c === "done" ? "✓" : c === "cur" ? st(tone(i)) : `<span class="faint">${j + 1}</span>`;
        const ctl = c ? "" : `<div class="ctl"><button class="btn sm ghost">Opus · high ▾</button><button class="btn sm ghost">${i.reviewMode} ▾</button></div>`;
        const sit = c === "cur" && i.sits ? `<div class="strong" style="font-size:11px">${sortSits(i.sits).map(sitText).join(" + ")}</div>` : "";
        return `<li class="${c}"><span class="mk">${sm}</span><span class="grow"><span style="display:block">${j + 1} · ${t}</span><span class="faint" style="font-size:11px">${m}</span>${sit}${ctl}</span></li>`;
      }).join("")}</ol>`;
    }
    const back = k < cur && PLANNING.includes(n) ? `<button class="btn sm ghost" data-pop="stage:${n}">Back…</button>` : "";
    return `<li class="${cls}"><span class="mk">${mk}</span><span class="grow"><span class="row" style="gap:6px"><span class="${k === cur ? "strong" : ""}">${n}</span><span class="faint" style="font-size:11px">${sub}</span><span class="grow"></span>${back}</span>${nested}</span></li>`;
  }).join("")}</ol>`;
}
function detChecks(list, head) {
  const g = { pass: "✓", running: st("run"), queued: st("todo"), fail: st("error") };
  return `<h3>${head}</h3>${list.map(([n, s, d]) => `<div class="chk"><span class="mk" style="width:12px;display:inline-grid;place-items:center">${g[s]}</span><span class="grow ${s === "running" ? "strong" : ""}">${n}</span><span class="faint" style="font-size:11px">${s === "pass" ? "passed" : s}${d ? " · " + d : ""}</span></div>`).join("")}`;
}
const kv = (k, v, id) => `<div class="kv" ${id ? `id="${id}"` : ""}><span>${k}</span><span>${v}</span></div>`;
function detailsPanel(i) {
  let h = "";
  if (i.kind === "task") {
    h += detProgress(i);
    if (i.id === "t2") h += detChecks(i.gh.checks, `Checks · ${i.gh.passed} of ${i.gh.total} · checked ${i.gh.checkedAt}`) + `<div class="faint" style="font-size:11px;margin-top:4px">The review pass starts when every check finishes.</div>`;
    if (i.id === "t4") h += detChecks([["lint", "pass", ""], ["unit-tests", "pass", ""], ["build-ios", "pass", ""], ["ui-tests", "pass", ""]], "Checks · all passed");
    h += `<h3>Task</h3>` + kv("Repository", `${REPOS[i.repo].full}${REPOS[i.repo].missing ? ` <span class="row" style="display:inline-flex;gap:4px">${st("warn")}<span>clone missing</span></span>` : ""}`) +
      kv("Card", i.card ? `#${i.card} · In progress <button class="btn sm ghost" data-act="side:Card">Open</button>` : `<span class="faint">none, created from scratch</span>`) +
      (i.epic ? kv("Epic", i.epic) : "") + kv("Mode", i.flow) +
      kv("Branch", `<span class="mono">${i.branch}</span> → dev`) +
      (i.stage === "Implementation" || i.pr ? kv("Worktree", `<span class="mono">~/.local/share/myspec/worktrees/acme/${i.repo}/${i.branch}</span>`) : "") +
      kv("Review mode", `<button class="btn sm" data-pop="rmode">${i.reviewMode} ▾</button> <span class="faint" style="font-size:11px">${i.stepsLeft ? `${i.stepsLeft} steps not started` : "no step left to start"}</span>`, "det-rmode") +
      kv("Models", `<button class="btn sm" data-pop="models">${i.flow === "One-Shot" ? 5 : 7} stages ▾</button> <span class="faint" style="font-size:11px">now: ${i.model}</span>`, "det-models") +
      kv("Created", `${i.created} · updated ${i.updated}`);
  } else if (i.kind === "review") {
    h += `<h3>Pull request</h3>` + kv("Number", `${REPOS[i.repo].full}#${i.pr} <button class="btn sm ghost">Open ↗</button>`) + kv("Author", i.author) +
      kv("Branch", `<span class="mono">${i.id === "r1" ? "settings-rhf" : "fix-share-offline"}</span> → main`) + kv("Card", `#${i.card} ${i.cardTitle} · In progress`) + kv("Labels", i.id === "r1" ? "ui · refactor" : "bug") + kv("Mode", i.rmode) + kv("Started", i.created);
    h += detChecks([["lint", "pass", ""], ["typecheck", "pass", ""], ["unit", "pass", ""], ["e2e", "pass", ""]], "Checks at pass 1 · all passed");
    h += `<h3>Passes</h3>` + kv("Pass 1", i.id === "r1" ? "changes · 9 findings · 09:31" : "changes · 3 findings · published 11:31");
    if (i.id === "r1") h += `<h3>Findings · 5 of 9 decided</h3><div class="fidx">${FINDINGS.map((f, k) => `<button class="${f[2] ? "dec" : "open"}" data-act="finding:${k + 1}" title="${f[0]} · ${f[2] || "to decide"}">${k + 1}</button>`).join("")}</div>`;
  } else {
    h += `<h3>Discussion</h3>` + kv("Board", "Platform Roadmap") + kv("Cards in", "#455 Usage metering events<br>#461 Pricing page tiers") + kv("Reads", "acme/api, acme/web (clones, read only)") + kv("Document", `<span class="faint">not written yet</span>`) + kv("Drafts", `<span class="faint">none yet</span>`) + kv("Started", i.created);
  }
  return h;
}
function decisionBar(i) {
  if (i.id === "r1") {
    return `<div class="decbar" role="region" aria-label="Findings to decide"><div class="decbar-in">${st("wait")}<span class="strong">4 findings to decide</span><span class="progress"><i style="--p:55%"></i></span><span class="muted num">5 of 9</span>
      <button class="btn sm" data-act="prev-finding" title="Previous to decide (Alt+↑)">↑</button><button class="btn sm" data-act="next-finding" title="Next to decide (Alt+↓)">Next ↓ ${kbd("Alt ↓")}</button>
      <span class="grow"></span><span class="why">Decide 4 more to publish</span><button class="btn sm" disabled>Publish review</button></div></div>`;
  }
  if (i.id === "t1") {
    const other = (S.tab.t1 || "Implementer") === "Reviewer" ? ["Implementer", i.sits[1]] : ["Reviewer", i.sits[0]];
    return `<div class="decbar" role="region" aria-label="Also waiting for you"><div class="decbar-in">${st("wait")}<span class="strong">Also waiting in ${other[0]}</span><span class="muted">${other[1].label}</span>${tw(other[1])}<span class="grow"></span><button class="btn sm" data-act="tab:${other[0]}">Open ${other[0]}</button></div></div>`;
  }
  return "";
}
function inlineFindings() {
  return `<div class="e-findings" role="group" aria-label="Findings of review 1"><div class="fh"><span class="strong">Review 1 · 9 findings</span><span>· decide each one here</span></div>${FINDINGS.map((f, k) => findingCard(f, k, { compactDecided: true })).join("")}</div>`;
}

V.itemView = (i) => {
  const wide = innerWidth >= 1900;
  const side = sideOf();
  const close = `<button class="btn ghost sm iconbtn" data-act="side:${side}" title="Close (Esc)" aria-label="Close panel">✕</button>`;
  let panel = "";
  if (side === "Details") panel = `<div class="aux-hd"><span class="strong">Details</span><span class="grow"></span>${wide ? `<span class="faint" style="font-size:11px">stays open on wide windows</span>` : ""}${close}</div><div class="det">${detailsPanel(i)}</div>`;
  else if (side) panel = `<div class="aux">${auxContent(i, side, close)}</div>`;
  const sideHtml = side ? `<aside class="side ${wide ? "" : "overlay"}" aria-label="${side}">${panel}</aside>` : "";
  return `<div class="hdr">${crumbs(S.cur)}${toolsB(i)}</div>${itemBars(i)}
    <div class="body"><div class="colconvo">${conversation(i, i.id === "r1" ? { inlineFindings: inlineFindings() } : {})}${decisionBar(i)}${composer(i)}</div>${sideHtml}</div>`;
};

function moveFinding(dir) {
  const open = FINDINGS.map((f, k) => (f[2] ? null : k + 1)).filter(Boolean);
  let k = open.indexOf(S.focusFinding);
  k = k < 0 ? (dir > 0 ? 0 : open.length - 1) : (k + dir + open.length) % open.length;
  S.focusFinding = open[k]; render();
  const f = document.getElementById("f" + S.focusFinding); if (f) { f.scrollIntoView({ block: "center" }); f.focus(); }
}
V.act = (v) => {
  if (v.startsWith("side:")) {
    const k = v.slice(5), wide = innerWidth >= 1900, cur = sideOf();
    if (cur === k) { S.aux = null; if (wide) S.detailsClosed = true; }
    else { S.aux = k === "Details" ? null : k; if (k === "Details") { S.detailsClosed = false; if (!wide) S.aux = "Details"; } }
    S.pop = null; render(); return true;
  }
  if (v.startsWith("side-focus:")) {
    S.detailsClosed = false; if (innerWidth < 1900) S.aux = "Details"; else S.aux = null;
    render(); const el = document.getElementById(v.slice(11)); if (el) { el.scrollIntoView({ block: "center" }); const b = el.querySelector("button"); if (b) b.focus(); }
    return true;
  }
  if (v === "next-finding") { moveFinding(1); return true; }
  if (v === "prev-finding") { moveFinding(-1); return true; }
  if (v.startsWith("finding:")) { S.focusFinding = +v.slice(8); render(); const f = document.getElementById("f" + S.focusFinding); if (f) { f.scrollIntoView({ block: "center" }); f.focus(); } return true; }
  return false;
};
V.escape = () => {
  const side = sideOf();
  if (side && (innerWidth < 1900 || S.aux)) { S.aux = null; render(); return true; }
  return false;
};
V.keydown = (e) => {
  if (e.altKey && (e.key === "ArrowDown" || e.key === "ArrowUp") && S.cur.t === "item" && S.cur.id === "r1") { e.preventDefault(); moveFinding(e.key === "ArrowDown" ? 1 : -1); return true; }
  return false;
};

render();
mockChrome(`<h2>b · Rich line</h2>
<ul>
<li><b>Row</b>: everything §5 of the brief asks for, at any width, wrapping instead of truncating. Name (2 lines max) and repo#card; the status line with severity, what it asks and the time in words-and-shape (filled chip = waiting for you; spinner + minutes = the agent's turn); then one line per situation when there is more than one, or the current action and the context meter, or the checks by name; then where the item is (stage pips, step, pass).</li>
<li>Rows that need you are framed; the others are flat.</li>
<li><b>Collapsed node</b>: the counts in words on their own line (<code>1 error · 1 to close · 1 on GitHub</code>).</li>
<li><b>Item</b>: stage track, step bar, tabs and the conversation as in a. What the item asks sits in a <b>decision bar above the composer</b> (findings: next/prev with Alt+↓/↑, Publish with its reason; a second situation: jump to the other conversation). Findings are decided inside the conversation, at the report.</li>
<li><b>Details panel</b>: progress with the steps nested (and their model and mode), checks by name, facts of the item, Review mode and Models. Anchored and open from 1900px, closable (remembered); below 1900px it opens over the conversation from the header. Artifacts, Card, Reports and Documents use the same slot.</li>
<li><b>Keys</b>: Ctrl+J, Alt+← →, Ctrl+, · tree ↑↓ ←→ Enter · Alt+↓/↑ between open findings.</li>
</ul>${LEGEND}`);

</script>
</body>
</html>
