/* BEGIN design/system/tokens.css */
/* =====================================================================
   MySpec design tokens · theme Grafite quente
   Phase 3, approved 2026-09-24. The single source of the tokens.

   How to read it
   - Every value the interface paints or measures lives here. Components use
     these names and nothing else: no color, size or duration outside this file.
   - Three layers of blocks:
       1. :root                            values that do not depend on the mode;
       2. :root, [data-theme="light"]      the light colors (the default);
          @media dark, :root without light the dark colors, following the system;
          [data-theme="dark"]              the dark colors, fixed by the user or
                                           forced on a subtree (the specimen);
       3. :root, [data-theme]              derived tokens (washes and veils),
                                           declared on every scope so they
                                           resolve against that scope's colors.
   - Sizes are rem at a 16px root and land on whole pixels: WebKitGTK blurs
     half pixels (brief.md §9).
   - Colors are OKLCH. The neutral carries a trace of warmth: surfaces and lines
     at hue 65 (chroma 0.004), inks at hue 60 (chroma 0.01), the sidebar at 68 in
     light and 62 in dark. The identity is an electric blue eased toward cobalt,
     hue 260.
   - A token that means the same as another is written as var(), never as a copy
     of its value: the aliases live in the last block.
   - The dark colors are written twice: for the system setting, and for a fixed
     choice or a subtree forced dark. In the app the theme is always set by script
     on data-theme, so the implementation keeps only the [data-theme="dark"] block.
   ===================================================================== */

:root {
  /* Type families: one sans for chrome and reading, one mono for code, paths and keys. */
  --font-ui: "Fira Sans", system-ui, sans-serif;
  --font-read: "Fira Sans", system-ui, sans-serif;
  --font-mono: "Fira Code", ui-monospace, monospace;

  /* Type sizes and leading, paired: the chrome register (caps to ui) and the reading register (body, read, code). */
  --text-caps: 0.6875rem;    --leading-caps: 1rem;
  --text-micro: 0.75rem;     --leading-micro: 1rem;
  --text-meta: 0.8125rem;    --leading-meta: 1.125rem;
  --text-ui: 0.875rem;       --leading-ui: 1.25rem;
  --text-body: 0.9375rem;    --leading-body: 1.375rem;
  --text-read: 1rem;         --leading-read: 1.625rem;
  --text-title: 1.125rem;    --leading-title: 1.5rem;
  --text-display: 1.375rem;  --leading-display: 1.75rem;
  --text-code: 0.8125rem;    --leading-code: 1.25rem;
  --text-code-read: 0.875rem;  /* inline code inside the reading register; it takes the line's leading */

  /* Weights: hierarchy comes from weight before color. A name that waits for you is 600, any other name 400. */
  --weight-regular: 400; --weight-medium: 500; --weight-strong: 600; --weight-bold: 700;
  --weight-name: 400; --weight-name-waiting: 600;
  --tracking-caps: 0.07em;

  /* Measure: the conversation column and the reading line inside it. */
  --measure: 50rem;
  --measure-read: 42rem;

  /* Space: a 4px grid with two half steps for tight chrome. */
  --space-0-5: 0.125rem; --space-1: 0.25rem; --space-1-5: 0.375rem; --space-2: 0.5rem; --space-2-5: 0.625rem;
  --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;

  /* Radius: grows with the size and the elevation of the object. */
  --radius-xs: 0.1875rem; --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-pill: 999px;

  /* Strokes: borders, the error rail, focus. Focus sits outside with a gap; selection sits inside. */
  --border: 1px; --border-2: 2px; --error-rail: 3px; --radius-glyph: 1px;
  --focus-width: 2px; --focus-offset: 2px; --halo: 3px;

  /* Control and chrome sizes. */
  --size-control: 2rem; --size-control-sm: 1.75rem; --size-control-xs: 1.375rem;
  --size-chip: 1.75rem; --size-time-chip: 1.125rem; --size-kbd: 1.125rem; --size-kbd-sm: 1rem;
  --size-head: 3rem; --size-progress: 2.5rem; --size-node: 1.75rem; --size-tab: 1.75rem; --size-ask: 2.75rem;
  --size-composer-min: 3.5rem; --size-mark: 1.5rem; --size-avatar: 1.5rem; --size-more-below: 1.75rem;
  --size-menu-min: 14rem; --size-dialog: 30rem; --size-toast: 22rem; --size-tooltip-max: 20rem;

  /* Icons and status glyphs. Glyphs are even so they center on a whole pixel. */
  --icon: 1rem; --icon-sm: 0.875rem; --icon-xs: 0.75rem; --icon-stroke: 1.5;
  --glyph: 0.625rem; --glyph-sm: 0.5rem; --glyph-diamond: 0.5rem; --glyph-bar: 0.1875rem;

  /* Meters: the context meter and the step segments of the current stage. */
  --meter-w: 2.5rem; --meter-h: 0.25rem; --meter-label: 2rem;
  --seg-w: 0.75rem; --seg-w-current: 1.25rem; --seg-h: 0.25rem; --seg-gap: 0.1875rem;

  /* The tree: row rhythm, the epic indent and its guide under the epic's chevron. */
  --tree-pad: 0.5rem; --row-pad-y: 0.375rem; --row-gap: 0.25rem; --line-gap: 0.125rem; --section-gap: 1.5rem;
  --epic-indent: 1rem; --guide-x: 0.9375rem;

  /* Layout: continuous widths, one rule per container (structure.md §6). The sidebar is drawn; the collapsed strip,
     the panel and the decision column are the rules of structure.md §2 and §3, reserved for the screens of phase 4. */
  --sidebar-width: round(down, clamp(18rem, calc(8vw + 12.5rem), 23.75rem), 1px);
  --sidebar-collapsed: 3.75rem;
  --panel-width: clamp(22.5rem, 28%, 30rem);
  --decision-width: clamp(18.75rem, 24%, 26.25rem);

  /* Small fixed pieces of content. */
  --key-size: 1.25rem; --action-verb-w: 3.5rem; --list-indent: 1.25rem; --newmsg-w: 8.5rem;
  --code-pad-y: 0.0625rem; --code-pad-x: 0.3125rem; --fade: 1.5rem; --link-offset: 0.2em;

  /* Motion: three durations and one standard curve; the spinner is the only loop. prefers-reduced-motion zeroes all of it. */
  --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 280ms;
  --duration-spin: 900ms; --duration-shimmer: 1400ms; --delay-tooltip: 500ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, 0, 1);
  --ease-exit: cubic-bezier(0.3, 0, 1, 1);

  /* Stacking: sticky heads, the item header, floating pieces, the dialog, toasts and tooltips. */
  --z-sticky: 2; --z-header: 3; --z-float: 4; --z-overlay: 50; --z-toast: 60; --z-tooltip: 70;

  /* Link underline: permanent and quiet, full on hover. The key hint on a primary button: the same in both modes. */
  --mix-link-line: 45%; --mix-key: 45%;
}

/* ---------------------------------------------------------------------
   LIGHT (the default)
   --------------------------------------------------------------------- */
:root, [data-theme="light"] {
  color-scheme: light;

  /* Surfaces in layers: 0 sunken (code, action groups, the quiet ask bar), 1 the ground (conversation, header),
     2 raised (cards, buttons, the selected tab), 3 floating (menus, tooltips' neighbors, dialogs, toasts).
     In light, 2 and 3 share white and differ by shadow. */
  --surface-0: oklch(0.962 0.004 65);
  --surface-1: oklch(0.995 0.001 65);
  --surface-2: oklch(1 0 0);
  --surface-3: oklch(1 0 0);
  --surface-input: oklch(1 0 0);
  --surface-user: oklch(0.95 0.005 60);

  /* The sidebar: in the tone of the page, one step down, with its own input, divider, control border and epic guide (3:1). */
  --surface-sidebar: oklch(0.945 0.007 68);
  --sidebar-input: oklch(0.975 0.004 68);
  --sidebar-line: oklch(0.885 0.008 68);
  --sidebar-control: oklch(0.595 0.011 68);

  /* Lines: 1 divider, 2 quiet border (buttons, chips), 3 control border at 3:1 (inputs, composer, dashed disabled). */
  --line-1: oklch(0.912 0.004 65);
  --line-2: oklch(0.86 0.005 65);
  --line-3: oklch(0.63 0.006 65);

  /* Ink: 1 text, 2 secondary, 3 muted (line 2 of a row, the agent's clock), 4 faint (meta, line 3, timestamps).
     1 to 3 pass 4.5:1 on every surface and veil of the system. 4 passes on the surfaces 0 to 3, the sidebar, the user
     message and the wait veil, and is NOT for: the open row (--brand-veil; the row lifts its meta to ink 3), a pressed
     or hovered open row, a pressed veil on the sidebar, --brand-tint and --state-wait-chip (dark). */
  --ink-1: oklch(0.2 0.01 60);
  --ink-2: oklch(0.36 0.009 60);
  --ink-3: oklch(0.455 0.007 60);
  --ink-4: oklch(0.495 0.006 60);

  /* Identity: the solid, its hover and press, the ink on it, the identity as text, the ring of the open row, the meter track. */
  --brand: oklch(0.52 0.175 260);
  --brand-hover: oklch(0.48 0.175 260);
  --brand-active: oklch(0.44 0.166 260);
  --brand-on: oklch(1 0 0);
  --brand-ink: oklch(0.49 0.17 260);
  --brand-ring: oklch(0.58 0.158 260);
  --brand-track: oklch(0.9 0.039 260);

  /* The ink of neutral veils (hover, press): a trace of the identity, never a gray from nowhere. */
  --veil-ink: oklch(0.3 0.061 260);

  /* Veil strengths, one per role. */
  --mix-hover: 6%; --mix-press: 10%; --mix-select: 12%; --mix-tint: 12%; --mix-tint-hover: 18%; --mix-tint-press: 24%;
  --mix-halo: 24%; --mix-seg: 26%; --mix-marker: 30%;

  /* Error: the loudest color, never alone: the diamond, the square chip with !, the rail. */
  --state-error: oklch(0.52 0.195 22);
  --state-error-hover: oklch(0.48 0.195 22);
  --state-error-press: oklch(0.44 0.185 22);
  --state-error-veil: oklch(0.962 0.02 22);
  --state-error-on: oklch(1 0 0);

  /* Waiting for you: amber. Text, glyph (and its contour), the veil of a request, its line, the time chip. */
  --state-wait: oklch(0.5 0.11 62);
  --state-wait-glyph: oklch(0.58 0.14 75);
  --state-wait-veil: oklch(0.965 0.035 85);
  --state-wait-line: oklch(0.86 0.08 80);
  --state-wait-chip: oklch(0.945 0.05 85);
  --state-wait-chip-ink: oklch(0.42 0.09 62);

  /* Ready to close: green, a ring and an outlined chip. */
  --state-close: oklch(0.5 0.13 145);

  /* Code: four hues at the lightness of the ink, the comment is faint ink. */
  --code-keyword: oklch(0.47 0.13 260);
  --code-string: oklch(0.47 0.1 150);
  --code-function: oklch(0.45 0.11 305);
  --code-number: oklch(0.5 0.12 55);

  /* Floating pieces: the tooltip is the one inverted surface; the scrim dims the app under a dialog. */
  --tooltip-surface: oklch(0.26 0.008 60);
  --tooltip-ink: oklch(0.97 0.003 60);
  --tooltip-ink-2: oklch(0.8 0.005 60);
  --scrim: oklch(0.2 0.01 60 / 0.28);

  /* Elevation: every shadow is the warm neutral, never black. Plane, button, xs (a raised control), card, float, overlay. */
  --shadow-hue: oklch(0.3 0.03 65);
  --sheen: oklch(1 0 0 / 0.12);
  --rim: color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 6%, transparent);
  --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 22%, transparent), inset 0 1px 0 var(--sheen);
  --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 8%, transparent), 0 0 0 1px var(--rim);
  --shadow-card: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 6%, transparent), 0 8px 20px color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 16%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 20%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(0 0 0 / 0.08);
}

    --tooltip-surface: oklch(0.34 0.006 65); --tooltip-ink: oklch(0.96 0.004 60); --tooltip-ink-2: oklch(0.82 0.005 60); --scrim: oklch(0.05 0.005 60 / 0.6);
    --shadow-hue: oklch(0.08 0.01 65); --sheen: oklch(1 0 0 / 0.2); --rim: oklch(1 0 0 / 0.07);
    --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 30%, transparent);
    --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 45%, transparent), inset 0 1px 0 var(--sheen);
    --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 40%, transparent), 0 0 0 1px var(--rim);
    --shadow-card: 0 0 0 1px oklch(1 0 0 / 0.04), 0 8px 24px color-mix(in srgb, var(--shadow-hue) 50%, transparent);

/* ---------------------------------------------------------------------
   ALIASES AND DERIVED: names that mean another token, and veils and washes
   mixed from the tokens above. Declared on every
   scope, so a subtree with its own data-theme mixes its own colors.
   --------------------------------------------------------------------- */
:root, [data-theme] {
  /* Aliases: the states without a situation are the neutral inks (the agent working in motion, GitHub, paused, idle). */
  --state-work: var(--ink-2); --state-work-track: var(--line-2); --state-github: var(--ink-3); --state-paused: var(--ink-3);
  --state-idle: var(--ink-4); --state-notice: var(--ink-2);
  /* Aliases: focus is the identity; the wait contour is the glyph unless a theme needs a darker one; the epic guide is the
     sidebar's control border; not-started glyphs and › separators use the control line; code comments are faint ink. */
  --focus: var(--brand); --state-wait-ring: var(--state-wait-glyph); --sidebar-guide: var(--sidebar-control);
  --line-deco: var(--line-3); --code-comment: var(--ink-4);

  /* Neutral veils, for hover and press on any surface; on a raised control they are mixed into it. */
  --veil-hover: color-mix(in srgb, var(--veil-ink) var(--mix-hover), transparent);
  --veil-press: color-mix(in srgb, var(--veil-ink) var(--mix-press), transparent);
  --surface-2-hover: color-mix(in srgb, var(--veil-ink) var(--mix-hover), var(--surface-2));
  --surface-2-press: color-mix(in srgb, var(--veil-ink) var(--mix-press), var(--surface-2));

  /* Identity washes: the open row on the sidebar (veil), a pressed or chosen control (tint), the same on the ground (tint-plane). */
  --brand-veil: color-mix(in srgb, var(--brand) var(--mix-select), var(--surface-sidebar));
  --brand-tint: color-mix(in srgb, var(--brand) var(--mix-tint), var(--surface-2));
  --brand-tint-hover: color-mix(in srgb, var(--brand) var(--mix-tint-hover), var(--surface-2));
  --brand-tint-press: color-mix(in srgb, var(--brand) var(--mix-tint-press), var(--surface-2));
  --brand-tint-plane: color-mix(in srgb, var(--brand) var(--mix-tint), var(--surface-1));

  /* Identity details: the segments still to do, the agent marker's ring, the key hint on a primary button, the focus halo. */
  --brand-seg-todo: color-mix(in srgb, var(--brand) var(--mix-seg), var(--surface-1));
  --brand-marker-ring: color-mix(in srgb, var(--brand) var(--mix-marker), transparent);
  --brand-key-ring: color-mix(in srgb, var(--brand-on) var(--mix-key), transparent);
  --focus-halo: color-mix(in srgb, var(--focus) var(--mix-halo), transparent);
}

/* ---------- Voices. The two agents differ by the avatar's form and, in a shared stream, by the reviewer's thread line. ---------- */

/* ---------- Handoff: the product's message between two sessions, collapsed to one line. ---------- */

/* ---------- The review of a Manual step: the changed files and their stage, in the request card. ---------- */

/* ---------- GitHub checks, by name, while the pull request waits. ---------- */

.gh.is-loading .gh-h b { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }

/* ---------- Findings to decide: the decision card (A) and the decision column (B) share the finding. ---------- */

.fnd { display: grid; grid-template-columns: var(--key-size) minmax(0, 1fr); column-gap: var(--space-3); row-gap: var(--space-1-5); padding: var(--space-3); border-radius: var(--radius-md); background: var(--surface-2); box-shadow: inset 0 0 0 var(--border) var(--line-2); transition: box-shadow var(--duration-fast) var(--ease-standard), background var(--duration-fast) var(--ease-standard); }

.convo-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; position: relative; }
/* ---------- The way back to the end, carrying what happens there. ---------- */

.jump button { pointer-events: auto; display: inline-flex; align-items: center; gap: var(--space-2); height: var(--size-control-sm); padding: 0 var(--space-3) 0 var(--space-2-5); max-width: calc(var(--measure) - var(--space-12)); border-radius: var(--radius-pill); background: var(--surface-3); color: var(--ink-2); font-size: var(--text-meta); line-height: var(--leading-meta); box-shadow: var(--shadow-float); white-space: nowrap; transition: background var(--duration-fast) var(--ease-standard); }

.jump button:active, .jump button.is-active { background: var(--surface-2-press); }
.jump .nm { color: var(--brand-ink); font-weight: var(--weight-medium); }
.jump .live { display: inline-flex; gap: var(--space-1-5); align-items: center; color: var(--ink-3); min-width: 0; overflow: hidden; }

/* ---------- The auxiliary panel: a column when the reading column still fits beside it, else it covers. ---------- */

.panel.over { position: absolute; right: 0; top: 0; bottom: 0; z-index: var(--z-overlay); background: var(--surface-3); box-shadow: var(--shadow-overlay); }

.panel-b { flex: 1; overflow: auto; padding: var(--space-3) var(--space-4) var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); font-size: var(--text-meta); line-height: var(--leading-meta); }

.pgrp h3 { margin: 0 0 var(--space-2); font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }

.plist li:hover { background: var(--veil-hover); }
.plist li .grow { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist li .m { color: var(--ink-3); font-size: var(--text-micro); white-space: nowrap; }
.plist li.sub { padding-left: var(--space-6); }
@keyframes panel-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Polish 6: a place that changes fades in; a request that is born flashes once, in its veil. ---------- */
.enter { animation: place-in var(--duration-base) var(--ease-enter); }
@keyframes place-in { from { opacity: 0; } to { opacity: 1; } }
.ask-in.born { --flash: var(--state-wait-veil); animation: flash var(--duration-slow) var(--ease-standard) 2; }

/* ---------- The composer's addressee: whom a message goes to, when two sessions listen. ---------- */
.chip.to { gap: var(--space-1-5); }
.chip.to .av { width: var(--icon); height: var(--icon); border-radius: var(--radius-pill); display: inline-grid; place-items: center; background: var(--brand-tint-plane); color: var(--brand-ink); box-shadow: inset 0 0 0 var(--border) var(--brand-marker-ring); }
.chip.to .av.rev { background: transparent; box-shadow: inset 0 0 0 var(--border) var(--brand-ring); }
.chip.to .av svg { width: var(--icon-xs); height: var(--icon-xs); }
.cbox .cfoot .who-l { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); display: inline-flex; gap: var(--space-1-5); align-items: center; white-space: nowrap; }

/* ---------- The activity line at the end of a stream. ---------- */
.e-activity .mono { font-size: var(--text-micro); color: var(--ink-2); }
.e-activity .t { color: var(--ink-4); font-variant-numeric: tabular-nums; }

/* ---------- Loop beats: implement, review, address, commit. The agents' loop of a step in one line. ---------- */
.beats { display: flex; align-items: center; gap: var(--space-1); flex-wrap: wrap; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); min-width: 0; }
.beat { display: inline-flex; align-items: center; gap: var(--space-1); height: var(--size-control-xs); padding: 0 var(--space-1-5); border-radius: var(--radius-sm); white-space: nowrap; color: var(--ink-3); transition: background var(--duration-fast) var(--ease-standard); }
button.beat:hover, .beat.is-hover { background: var(--veil-hover); color: var(--ink-1); }
button.beat:active, .beat.is-active { background: var(--veil-press); }
.beat svg { width: var(--icon-xs); height: var(--icon-xs); }
.beat.done svg { color: var(--ink-3); }
.beat.cur { color: var(--ink-1); font-weight: var(--weight-strong); box-shadow: inset 0 0 0 var(--border) var(--line-2); background: var(--surface-2); }

.beat.next .st-todo { width: var(--glyph-sm); height: var(--glyph-sm); }
.beat:disabled, .beat.is-disabled { color: var(--ink-4); cursor: default; }
.beat.is-error { color: var(--state-error); }
.beats .gt { color: var(--line-deco); }
.beat .cap { color: var(--ink-4); font-weight: var(--weight-regular); }

/* ---------- The request that stays on screen while another conversation waits (both variations). ---------- */
.ask-in .two { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-3); align-items: center; }

/* ---------- Composer disabled and working footers, and the queue ---------- */
.queued-meta .btn { height: var(--size-control-xs); }

/* ---------- The mock's scene switcher: outside the product. ---------- */
.mockbar { position: fixed; right: var(--space-3); bottom: var(--space-3); z-index: var(--z-toast); display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3); border-radius: var(--radius-pill); background: var(--tooltip-surface); color: var(--tooltip-ink); box-shadow: var(--shadow-float); font-size: var(--text-micro); line-height: var(--leading-micro); opacity: 0.94; }
.mockbar select { background: transparent; color: var(--tooltip-ink); border: var(--border) solid var(--tooltip-ink-2); border-radius: var(--radius-pill); height: var(--size-control-xs); padding: 0 var(--space-2); font-size: var(--text-micro); }
.mockbar option { color: var(--ink-1); background: var(--surface-3); }
.mockbar a { color: var(--tooltip-ink); }
.noshots .mockbar { display: none; }

/* ---------- Popover (milestones, recipient) ---------- */
.pop { position: absolute; z-index: var(--z-overlay); background: var(--surface-3); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); padding: var(--space-2); min-width: var(--size-menu-min); animation: panel-in var(--duration-base) var(--ease-enter); }

/* ---------- Rich prose extras used by the agents' answers ---------- */
.prose ol { margin: 0 0 var(--space-3); padding-left: var(--list-indent); max-width: var(--measure-read); }
.prose h4 { margin: var(--space-3) 0 var(--space-1); font-size: var(--text-body); line-height: var(--leading-body); font-weight: var(--weight-strong); }
.prose table { border-collapse: collapse; margin: 0 0 var(--space-3); font-size: var(--text-meta); line-height: var(--leading-meta); }
.prose th, .prose td { text-align: left; padding: var(--space-1) var(--space-3) var(--space-1) 0; box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); }
.prose th { color: var(--ink-3); font-weight: var(--weight-medium); }
.prose td.num { font-variant-numeric: tabular-nums; }

/* ---------- Action rows: the description the agent wrote is the label; the command follows, faint. ---------- */
.acts li { display: grid; grid-template-columns: var(--icon-sm) auto minmax(0, 1fr) auto; column-gap: var(--space-2); }
.acts li.more-row, .acts li.sub-agent { display: block; padding: 0; }
.acts li .lbl2 { color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(var(--measure-read) / 2); }
.acts li .tg { color: var(--ink-3); }
.acts li.now .lbl2 { font-weight: var(--weight-medium); }
.acts li.e .lbl2 { color: var(--state-error); }
.acts li .s { font-variant-numeric: tabular-nums; }
.acts .nested { background: transparent; margin: var(--space-0-5) 0 var(--space-0-5) calc(var(--space-1) * -1); box-shadow: inset var(--border-2) 0 0 var(--line-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.acts .nested > summary { min-height: var(--size-control-sm); padding: 0 var(--space-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.acts .nested > summary .lbl2 { color: var(--ink-1); font-weight: var(--weight-medium); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.acts .nested > summary .roll { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
.acts .nested ul { box-shadow: none; padding: 0 var(--space-2) var(--space-1) var(--space-6); }

/* ---------- Quick replies: a question asked in text, answered in one key. ---------- */
.qr { display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; padding: var(--space-2) var(--space-3) 0; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.qr .chip { height: var(--size-control-xs); font-size: var(--text-meta); gap: var(--space-1-5); padding: 0 var(--space-2); }
.qr .chip .kn { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--ink-3); }
.qtext { position: relative; }
.qtext::before { content: ""; position: absolute; left: calc(var(--space-3) * -1); top: var(--space-1); bottom: var(--space-1); width: var(--border-2); border-radius: var(--radius-pill); background: var(--state-wait-ring); }

/* The ask bar of a task ready to close: the ending's green, on the quiet ground. */
.ask-in.close { background: var(--surface-0); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.ask-in.close .what .lbl { color: var(--state-close); }
/* The ask bar breaks into two lines before it hides an action, and its progress never cuts. */
.ask .adet { flex: 1 0 auto; max-width: 100%; white-space: normal; overflow: visible; }
.ask .acts-r { flex-wrap: wrap; justify-content: flex-end; min-width: 0; }

.acts .now-l, .acts .now-l .v { white-space: nowrap; } .acts .now-l { overflow: hidden; }

/* The voice filter hides the other voice's entries, never a request: its live cards stay in the stream. */

.lane.fl-out > .card:not(.answered) { margin-left: 0; }
.fl-note { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); display: flex; gap: var(--space-1-5); align-items: center; }
/* Steps that have not started are text, not disabled buttons. */
span.beat.next, span.oi.next { cursor: default; }
/* A radio in a segmented control shows its choice the way the selected tab does. */
.sw[aria-checked="true"] { color: var(--ink-1); background: var(--surface-2); box-shadow: var(--shadow-xs), inset 0 0 0 var(--border) var(--line-3); }

/* =====================================================================
   ROUND 10 · the minimal task screen, shared by a and b. On top of
   base.css (round 08) and core.css (round 09). Every value is a token of
   design/system/tokens.css; the bare lengths are geometry (0, 50%, 100%)
   and container-query limits, which a query cannot read from a token.
   ===================================================================== */

/* ---------- The header: breadcrumb, title, progress, then the tools. ---------- */
.mh { gap: var(--space-3); padding: 0 var(--space-3) 0 var(--space-2); }
.mh .navbtns { margin-right: calc(var(--space-1) * -1); }
.mh .ih-title { font-size: var(--text-body); line-height: var(--leading-body); flex: 0 1 auto; min-width: calc(var(--space-16) * 2); }
.mh .crumbs { flex: none; overflow: visible; }
.mh .crumbs .up { display: flex; }
.mh .ih-tools { gap: var(--space-1); }
.mh .ih-tools .ctx { margin-right: var(--space-1); }
.mh .tgroup { margin-left: var(--space-1); }
.mh .pbtn svg { display: none; }
.mh .pz .pl { display: inline; }
.mh .short { display: none; }

/* The conversation passes under the header through a short fade, not a cut. */
.mh::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--space-4); background: linear-gradient(var(--surface-1), color-mix(in srgb, var(--surface-1) 0%, transparent)); pointer-events: none; }
.vtabs { position: relative; z-index: var(--z-sticky); }
.vtabs::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--space-4); background: linear-gradient(var(--surface-1), color-mix(in srgb, var(--surface-1) 0%, transparent)); pointer-events: none; }
/* Forward exists only when there is somewhere to go. */
.mh .navbtns .btn:disabled { display: none; }

/* ---------- The ⋯ menu: the item's tools that are not the screen's. ---------- */
.pop.menu.more { position: absolute; z-index: var(--z-overlay); padding: var(--space-1); min-width: calc(var(--size-menu-min) + var(--space-8)); }
.menu .mi { font-size: var(--text-ui); line-height: var(--leading-ui); }
.menu .mi .sub { margin-left: var(--space-1); }
.menu .mi.danger:hover { background: var(--state-error-veil); }
.menu .menu-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(var(--size-menu-min) + var(--space-8)); }

/* ---------- The conversation: more air, and the workflow's events as quiet lines. ---------- */
.m .convo-in { padding-top: var(--space-8); padding-bottom: var(--space-6); gap: var(--space-6); }
.m .stream { gap: var(--space-6); }
.m .who .role, .m .who .to { display: none; }
/* A marker (a document written, a step started, a message of the product, a commit) is one discreet line:
   a small icon, the words in ink 2, the time. The content is one click away, in place. */
.m .ev { grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2); align-items: center; color: var(--ink-3); }
.m .ev .ev-ic { width: var(--icon); height: var(--icon); background: transparent; box-shadow: none; color: var(--ink-4); border-radius: 0; }
.m .ev .ev-ic svg { width: var(--icon-sm); height: var(--icon-sm); }
.m .ev .ev-tx { padding-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .ev .ev-l { font-weight: var(--weight-regular); color: var(--ink-2); }
.m .ev .ev-l .n, .m .hand .n { color: var(--ink-3); }
.m .ev .ev-sub { display: none; }
.m .ev .sha { color: var(--ink-3); }
.m .evx > summary { padding: var(--space-1) var(--space-2); margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1); }
.m .evx .rd { padding-top: 0; color: var(--ink-4); }
.m .evx .rd .closed-l, .m .evx .rd .open-l { display: none; }
.m .hand > summary .ev-l { font-weight: var(--weight-regular); }
.m .docbody, .m .docfoot, .m .appbody { margin-left: calc(var(--icon) + var(--space-2)); }
/* An action group at rest is a line too: no block until it opens. */
.m .acts { background: transparent; }
.m .acts > summary { min-height: var(--size-control-sm); padding: 0 var(--space-2); margin: 0 calc(var(--space-2) * -1); color: var(--ink-3); }
.m .acts > summary .n { color: var(--ink-2); }
.m .acts[open] { background: var(--surface-0); }
.m .acts[open] > summary { margin: 0; padding: 0 var(--space-3); }
.m .acts > summary .chev { order: 9; margin-left: var(--space-1); }
.m .acts > summary .dur { margin-left: auto; }

/* ---------- A place with no conversation yet: what it waits for, and the checks by name. ---------- */
.empty { display: flex; flex-direction: column; gap: var(--space-2); padding-top: calc(var(--space-16) * 2); }
.empty .em-t { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); color: var(--ink-1); }
.empty .em-s { margin: 0 0 var(--space-3); font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-3); max-width: var(--measure-read); }

/* ---------- The ask bar: the request of the agent on screen, and the other agent's below it (A). ---------- */
.ask-in.two-rows { flex-direction: column; align-items: stretch; gap: var(--space-1); padding-top: var(--space-1); padding-bottom: var(--space-1); }
.ask-in.two-rows .req { min-height: var(--size-control); }
.ask-in .req .btn { margin-left: auto; }
.ask-in .req.other + .req, .ask-in .req + .req.other { padding-left: 0; box-shadow: inset 0 var(--border) 0 var(--line-1); padding-top: var(--space-1); }
.ask-in .req.other .muted { color: var(--ink-2); }
.ask-in .req { flex: 1 1 auto; }

/* ---------- An earlier conversation, opened from Details: read only, one way back. ---------- */
.pastfoot { display: flex; align-items: center; gap: var(--space-3); min-height: var(--size-ask); padding: var(--space-1-5) var(--space-1-5) var(--space-1-5) var(--space-4); border-radius: var(--radius-md); background: var(--surface-0); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.pastfoot > span { display: inline-flex; align-items: center; gap: var(--space-2); flex: 1; min-width: 0; }
.pastfoot b { color: var(--ink-1); font-weight: var(--weight-strong); }
.pastfoot svg { color: var(--ink-3); }

/* ---------- The words of a state: the ink of its situation (wait, error, close), neutral otherwise. ---------- */
.st-wait-t { color: var(--state-wait); }
.st-error-t { color: var(--state-error); }
.st-close-t { color: var(--state-close); }
.st-run-t { color: var(--ink-2); }
.st-gh-t, .st-idle-t, .st-paused-t { color: var(--ink-3); }

/* ---------- The panels: Details holds the steps, the earlier conversations and the reports. ---------- */
.pl-list { display: flex; flex-direction: column; }
.pl-row { display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: var(--size-control-sm); padding: 0 var(--space-2); margin: 0 calc(var(--space-2) * -1); width: calc(100% + var(--space-4)); border-radius: var(--radius-sm); color: var(--ink-1); font-size: var(--text-meta); line-height: var(--leading-meta); transition: background var(--duration-fast) var(--ease-standard); }
button.pl-row:hover, .pl-row.is-hover { background: var(--veil-hover); }
button.pl-row:active, .pl-row.is-active { background: var(--veil-press); }
.pl-row.is-on { background: var(--brand-tint-plane); color: var(--brand-ink); box-shadow: inset 0 0 0 var(--border) var(--brand-marker-ring); }
.pl-row[aria-disabled="true"] { color: var(--ink-4); cursor: default; background: transparent; }
.pl-row svg { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-3); flex: none; }
.pl-row .c1 { width: var(--icon-sm); display: inline-grid; place-items: center; flex: none; }
.pl-row .m { color: var(--ink-3); font-size: var(--text-micro); line-height: var(--leading-micro); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pl-row .m.mono { font-family: var(--font-mono); }
.pl-row .m.now { color: var(--brand-ink); font-weight: var(--weight-medium); }
.pl-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pl-step .head { cursor: default; }
.pl-step.todo .head { color: var(--ink-3); }
.pl-step.cur .head { font-weight: var(--weight-strong); }
.pl-kids { display: flex; flex-direction: column; padding-left: calc(var(--icon-sm) + var(--space-2)); }
.pl-kids .pl-row { color: var(--ink-2); min-height: var(--size-control-xs); }
.pl-prose { font-size: var(--text-body); line-height: var(--leading-body); }

/* ---------- The quick replies sit inside the composer box, above the text. ---------- */
.m .qr { padding: var(--space-2) var(--space-3) 0; }

/* The review of a Manual step: the files in the card, the progress and the actions in the bar. */
.m .stagebar { display: none; }
.m .card.dec .hd .prog { display: none; }
.composer-end { flex: none; height: var(--space-4); }
/* The last step before the title gives way: the context meter keeps its percentage, without the track. */
.mh.f6 .ctx .trk { display: none; }
/* What the card's buttons, keys and the placeholder already say is not said again under the card. */
.m .opts + .foot, .m .files + .foot, .m .fnds + .foot { display: none; }
/* The panel lands on a whole pixel. */
.m .panel { width: round(down, var(--panel-width), 1px); }

/* ---------- The situation is said once. The bar says what the item asks; the card holds only the content. ---------- */
.m fieldset.card:not(.answered):not(.plain) > .hd { display: none; }
.m .e-error .h { display: none; }
/* A card whose request the tinted bar carries (the files of a Manual step, the findings) is neutral content. */
.m .card.plain { box-shadow: var(--shadow-xs); }
.m .card.plain > .hd { background: transparent; box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); font-weight: var(--weight-medium); }

/* ---------- Review mode and models: popovers from ⋯ and from Details; a listbox for one choice. ---------- */
.popm { width: calc(var(--space-16) * 5.5); padding: var(--space-2); display: flex; flex-direction: column; gap: var(--space-1); }
.pop-h { padding: var(--space-1) var(--space-2) var(--space-1-5); font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: var(--weight-strong); color: var(--ink-1); }
.pop-opt { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) var(--icon); gap: var(--space-2); align-items: start; width: 100%; padding: var(--space-2); border-radius: var(--radius-md); color: var(--ink-1); transition: background var(--duration-fast) var(--ease-standard); }
.pop-opt:hover, .pop-opt.is-hover { background: var(--veil-hover); }
.pop-opt:active, .pop-opt.is-active { background: var(--veil-press); }
.pop-opt[aria-checked="true"] { background: var(--brand-tint); box-shadow: inset 0 0 0 var(--border) var(--brand-ring); }
.pop-opt[aria-disabled="true"] { color: var(--ink-4); cursor: not-allowed; background: transparent; box-shadow: inset 0 0 0 var(--border) transparent; outline: var(--border) dashed var(--line-3); outline-offset: calc(var(--border) * -1); }
.pop-opt[aria-disabled="true"] small { color: var(--ink-4); }
.pop-opt > svg { margin-top: var(--space-0-5); color: var(--ink-3); }
.pop-opt .po-t { display: flex; flex-direction: column; gap: var(--space-0-5); font-size: var(--text-ui); line-height: var(--leading-ui); }
.pop-opt .po-t b { font-weight: var(--weight-medium); }
.pop-opt small { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.pop-opt .ck { color: var(--brand-ink); visibility: hidden; margin-top: var(--space-0-5); }
.pop-opt[aria-checked="true"] .ck { visibility: visible; }
.pop-note { margin: var(--space-1) var(--space-2) var(--space-1); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.pm { display: flex; flex-direction: column; }
.pm-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: var(--size-control); padding: 0 var(--space-2); font-size: var(--text-ui); line-height: var(--leading-ui); }
.pm-row + .pm-row { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.pm-n { color: var(--ink-1); }
.pm-v { color: var(--ink-2); font-size: var(--text-meta); line-height: var(--leading-meta); }
.popl { position: absolute; z-index: var(--z-overlay); min-width: calc(var(--space-16) * 3); }
.popl .mi svg { width: var(--icon-sm); height: var(--icon-sm); }
.popl .mi .ck { visibility: hidden; color: var(--brand-ink); }
.popl .mi[aria-selected="true"] .ck { visibility: visible; }
.popm, .popl { position: absolute; z-index: var(--z-overlay); }
.chip.sm { height: var(--size-control-sm); }
.chip.xs { height: var(--size-control-xs); padding: 0 var(--space-2); gap: var(--space-1); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.chip.xs svg { width: var(--icon-xs); height: var(--icon-xs); }
.chip.xs.own { color: var(--ink-1); font-weight: var(--weight-medium); }
.pl-sel { display: inline-flex; gap: var(--space-1); flex: none; }
.pl-step .head { min-height: var(--size-control); }

/* =====================================================================
   B · The stepper. The stages as points with names, the current one as a pill.
   ===================================================================== */
.stepper { list-style: none; margin: 0 0 0 var(--space-2); padding: 0; display: flex; align-items: center; gap: var(--space-1-5); flex: none; font-size: var(--text-meta); line-height: var(--leading-meta); white-space: nowrap; }
.sp { display: inline-flex; align-items: center; gap: var(--space-1-5); color: var(--ink-3); position: relative; }
.sp .mk { display: inline-grid; place-items: center; width: var(--icon-xs); height: var(--icon-xs); }
.sp .mk svg { width: var(--icon-xs); height: var(--icon-xs); color: var(--ink-3); }
.sp.todo { color: var(--ink-4); }
.sp.todo .st-todo { width: var(--glyph-sm); height: var(--glyph-sm); }
.cn { width: var(--space-3); height: var(--border); background: var(--line-2); flex: none; }
.sp.cur .pill { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--size-control-sm); padding: 0 var(--space-3); border-radius: var(--radius-pill); background: var(--brand-tint-plane); box-shadow: inset 0 0 0 var(--border) var(--brand-marker-ring); }
.sp.cur .lb-c { color: var(--brand-ink); font-weight: var(--weight-strong); }
.sp.cur .pos { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sp.cur .stw { display: inline-flex; align-items: center; gap: var(--space-1-5); font-weight: var(--weight-medium); }
.sp.cur .stw.st-run-t, .sp.cur .stw.st-gh-t { font-weight: var(--weight-regular); }
.sp.cur .stw::before { content: ""; width: var(--border); height: var(--space-3); background: var(--brand-marker-ring); margin-right: var(--space-0-5); }
/* States of the stepper: paused, loading, and the pill of an error. */
.stepper.is-paused .sp.cur .pill { background: var(--surface-0); box-shadow: inset 0 0 0 var(--border) var(--line-2); }
.stepper.is-paused .sp.cur .lb-c { color: var(--ink-2); }
.stepper.is-loading .sp .lb, .stepper.is-loading .lb-c { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
.stepper.is-focus { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); border-radius: var(--radius-sm); }
.stepper .is-hover .lb { color: var(--ink-1); }
.fold .sp.done .lb, .fold .sp.todo .lb { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fold .cn { width: var(--space-2); }

/* ---------- Two small tabs above the conversation, only while the step has both agents. ---------- */
.vtabs { flex: none; padding: var(--space-1) var(--space-6) 0; background: var(--surface-1); }
.vtabs-in { max-width: calc(var(--measure) - var(--space-6) * 2); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure) + var(--space-6) * 2) / 2), 1px)); display: flex; gap: var(--space-5); height: var(--size-control); box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); }
.vt { position: relative; display: inline-flex; align-items: center; gap: var(--space-1-5); height: 100%; padding: 0 var(--space-0-5); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); transition: color var(--duration-fast) var(--ease-standard); }
.vt .st { width: var(--glyph-sm); height: var(--glyph-sm); }
.vt:hover, .vt.is-hover { color: var(--ink-1); }
.vt:active, .vt.is-active { color: var(--ink-1); }
.vt[aria-selected="true"] { color: var(--ink-1); font-weight: var(--weight-strong); }
.vt[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--border-2); border-radius: var(--radius-pill) var(--radius-pill) 0 0; background: var(--brand); }
.vt:focus-visible, .vt.is-focus { outline-offset: calc(var(--focus-offset) * -1); border-radius: var(--radius-sm); }
.vt .vw { color: var(--state-wait); font-weight: var(--weight-medium); }
.vt .vw.err { color: var(--state-error); }
.vt .vw.dis { color: var(--ink-4); font-weight: var(--weight-regular); }
.vt.is-loading .vw.dis { color: var(--ink-3); }
.vt:disabled, .vt.is-disabled { color: var(--ink-4); cursor: not-allowed; outline: var(--border) dashed var(--line-3); outline-offset: calc(var(--border) * -1); border-radius: var(--radius-sm); }
.vt.is-loading { cursor: progress; }
.vt.is-error .vw { color: var(--state-error); }
.m .convo-in { padding-top: var(--space-6); }

/* ---------- The top gives way by the width of the main area alone, in a fixed order: first what is
   around the stepper (the breadcrumb, the labels of the tools, the context meter's track), then the stages
   done fold to their mark (the name in the tooltip), then the loop and the working word of the pill, and the
   names of the current stage and of the stages to come last. They hold at half the monitor (1250 to 1300 px
   of window, 950 to 1000 px of main area). The title gives way after all of it.
   Below 1660 px the breadcrumb folds · 1440 the panels keep their icons · 1360 Pause keeps its icon
   · 1300 the context meter keeps its percentage, the connectors go · 1200 the stages done keep their mark
   · 1040 the pill drops the loop (3/7) and keeps the spinner without the word · 900 the stages to come keep
   their circle. ---------- */
@container main (max-width: 1660px) { .mh .crumbs .board, .mh .crumbs .epicl { display: none; } .mh .crumbs .ellb { display: inline-flex; } }
@container main (max-width: 1440px) { .mh .pbtn .pl { display: none; } .mh .pbtn svg { display: inline-block; } .mh .pbtn { width: var(--size-control-xs); padding: 0; justify-content: center; } }
@container main (max-width: 1360px) { .mh .pz .pl { display: none; } .mh .pz { width: var(--size-control-sm); padding: 0; justify-content: center; } }
@container main (max-width: 1300px) { .mh .ctx .trk { display: none; } .mh .cn { display: none; } .mh .stepper { gap: var(--space-2-5); } }
@container main (max-width: 1200px) { .mh .sp.done .lb { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .mh .stepper { gap: var(--space-2); } }
@container main (max-width: 1040px) { .mh .sp.cur .lp { display: none; } .mh .sp.cur .stw .long { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .mh { gap: var(--space-2); } .mh .stepper { margin-left: 0; } .mh .sp { gap: var(--space-1); } .mh .sp.cur .pill { padding: 0 var(--space-2-5); } }
@container main (max-width: 900px) { .mh .sp.todo .lb { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }

/* =====================================================================
   ROUND 11 · Home, the board and the creation of a task, shared by a and b.
   On top of base.css (round 08) and core.css (round 09), unchanged. Every
   value is a token of design/system/tokens.css or a calc() of tokens. The
   bare lengths are geometry (0, 50%, 100%) and container-query limits,
   which a query cannot read from a token.
   ===================================================================== */

/* Two sizes this round needs and the system does not have yet. Proposed tokens, see the README. */
:root {
  --panel-card-width: clamp(22.5rem, 42%, 40rem);                 /* the Card panel of the board: the body is read there */
  --size-dialog-wide: calc(var(--size-dialog) + var(--space-16)); /* the creation dialog: a task name of 64 characters fits */
  --list-measure: calc(var(--measure) + var(--space-16) * 5);     /* the board list: 70rem, the scan width of a row */
  --col-num: var(--space-12);
  --col-epic: calc(var(--space-16) * 2.25);
  --col-dep: calc(var(--space-12) + var(--space-2));
  --col-task: calc(var(--space-16) * 3);
  --col-keys: calc(var(--space-16) + var(--space-12));
  --col-status: calc(var(--space-16) + var(--space-12));
  --size-row: var(--size-control);
}

/* ---------- The shell's place in the tree: the board node is the open place. ---------- */
.node.cur { background: var(--brand-veil); box-shadow: inset 0 0 0 var(--border) var(--brand-ring); color: var(--ink-1); }
.node.cur .go { opacity: 1; color: var(--brand-ink); }
.node .x.is-reading { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
.sb-empty { padding: var(--space-1) var(--space-2) 0 calc(var(--tree-pad) + var(--icon) + var(--space-2-5)); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-4); }

/* ---------- The header of a place that is not an item: title, then the reading and its tools. ---------- */
.bh .ih-title { font-size: var(--text-body); line-height: var(--leading-body); }
.rs { display: inline-flex; align-items: center; gap: var(--space-1-5); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-4); white-space: nowrap; padding: 0 var(--space-1); }

.rs.is-failed { color: var(--ink-2); }

.pop-menu { position: absolute; z-index: var(--z-overlay); }

/* ---------- The body of the board: the list column, and in a, the Card panel beside it. ---------- */
.bbody { flex: 1; display: flex; min-height: 0; position: relative; }
.lstw { flex: 1 1 auto; min-width: 0; overflow: auto; container: list / inline-size; scroll-padding-top: calc(var(--size-control) + var(--space-8)); }
.lst-in { max-width: var(--list-measure); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--list-measure)) / 2), 1px)); padding: 0 var(--space-6) var(--space-12); }

/* The strip under the header that says the reading failed. Never red: a failed reading is not a situation. */
.readfail { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-4); min-height: var(--size-ask); padding: var(--space-1-5) var(--space-1-5) var(--space-1-5) var(--space-4); border-radius: var(--radius-md); background: var(--surface-0); font-size: var(--text-ui); line-height: var(--leading-ui); }
.readfail .lbl { font-weight: var(--weight-strong); color: var(--ink-1); white-space: nowrap; }
.readfail .det { flex: 1 1 0; min-width: 0; color: var(--ink-2); font-size: var(--text-meta); line-height: var(--leading-meta); }

/* ---------- The filter bar: search, one toggle, one menu, and the select mode. Sticky over the list. ---------- */
.fbar { position: sticky; top: 0; z-index: var(--z-sticky); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-4) 0 var(--space-3); background: var(--surface-1); }
.fbar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--space-3); background: linear-gradient(var(--surface-1), color-mix(in srgb, var(--surface-1) 0%, transparent)); pointer-events: none; }
.srch { width: calc(var(--space-16) * 4); height: var(--size-control-sm); padding: 0 var(--space-1) 0 var(--space-2); gap: var(--space-1-5); cursor: text; flex: none; }
.srch svg { color: var(--ink-3); width: var(--icon-sm); height: var(--icon-sm); }

.srch .clr { display: inline-grid; place-items: center; width: var(--size-control-xs); height: var(--size-control-xs); border-radius: var(--radius-xs); color: var(--ink-3); }
.srch .clr:hover { background: var(--veil-hover); color: var(--ink-1); }
.fchip { height: var(--size-control-sm); }
.fchip svg { width: var(--icon-xs); height: var(--icon-xs); }
.fchip.on { background: var(--brand-tint); color: var(--brand-ink); border-color: var(--brand-ring); }
.fchip.on .x { display: inline-grid; place-items: center; margin-right: calc(var(--space-1) * -1); width: var(--size-kbd-sm); height: var(--size-kbd-sm); border-radius: var(--radius-pill); }
.fchip.on .x:hover { background: var(--brand-tint-press); }
.fbar .sp { flex: 1 1 auto; }
/* Select mode: the bar says what is selected and what it does, the rows grow a checkbox. */
.selbar { display: flex; align-items: center; gap: var(--space-2); flex: 1 1 auto; min-height: var(--size-control-sm); padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3); border-radius: var(--radius-md); background: var(--brand-tint-plane); box-shadow: inset 0 0 0 var(--border) var(--brand-marker-ring); }
.selbar .n { font-weight: var(--weight-strong); color: var(--ink-1); white-space: nowrap; }
.selbar .which { color: var(--ink-3); font-size: var(--text-meta); line-height: var(--leading-meta); flex: 1 1 0; min-width: 0; }
.selbar .btn.ghost { color: var(--ink-2); }

/* ---------- The list: one tree, headers and rows. ---------- */
.lst { display: flex; flex-direction: column; padding-top: var(--space-1); }
.grpb { display: flex; flex-direction: column; gap: var(--space-0-5); }
.grpb + .grpb, .lst > .sech + .sech, .lst > .grpb + .sech { margin-top: var(--space-4); }
.lst > .sech + .grpb, .lst > .eh + .grpb { margin-top: var(--space-1); }
.lst > .grpb + .eh { margin-top: var(--space-5); }

/* A group header: a status (a) or an epic (b). Chevron, name, count or progress. */
.sech, .eh { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; align-items: center; column-gap: var(--space-2); min-height: var(--size-node); padding: 0 var(--space-2); border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-2);
  transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }

.sech:active, .sech.is-active, .eh:active, .eh.is-active { background: var(--veil-press); }
.sech .chev, .eh .chev, .fin .chev { width: var(--icon-xs); height: var(--icon-xs); color: var(--ink-4); justify-self: center; transition: transform var(--duration-fast) var(--ease-standard); }
.sech[aria-expanded="false"] .chev, .eh[aria-expanded="false"] .chev, .fin[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.sech .nm { display: inline-flex; align-items: baseline; gap: var(--space-2); min-width: 0; font-size: var(--text-meta); line-height: var(--leading-meta); font-weight: var(--weight-strong); }
.sech .cnt, .eh .cnt { font-weight: var(--weight-regular); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-4); font-variant-numeric: tabular-nums; }
.sech .fl { font-weight: var(--weight-regular); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-4); }
.sech.is-empty { cursor: default; }
.sech.is-empty:hover { background: transparent; color: var(--ink-2); }
.sech.is-empty .chev { visibility: hidden; }
.sech.is-disabled, .eh.is-disabled { color: var(--ink-4); cursor: not-allowed; outline: var(--border) dashed var(--line-3); outline-offset: calc(var(--border) * -1); }
.sech.is-loading .nm, .eh.is-loading .nm { color: var(--ink-3); }
.sech.is-error .cnt, .eh.is-error .cnt { color: var(--state-error); }

/* ---------- The card row: only what decides the choice. ---------- */
.cr { display: grid; align-items: center; column-gap: var(--space-2); min-height: var(--size-row); padding: 0 var(--space-2); border-radius: var(--radius-sm); cursor: pointer; color: var(--ink-1); font-size: var(--text-ui); line-height: var(--leading-ui); position: relative;
  transition: background var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard); }
.cr:hover, .cr.is-hover { background: var(--veil-hover); }
.cr:active, .cr.is-active { background: var(--veil-press); }
.cr.open { background: var(--brand-tint-plane); box-shadow: inset 0 0 0 var(--border) var(--brand-ring); }
.cr.open .num { color: var(--ink-3); }
.cr .lead { display: grid; place-items: center; width: var(--icon); height: var(--icon); color: var(--ink-4); }
.cr .lead svg { width: var(--icon-sm); height: var(--icon-sm); }
.cr.open .lead svg { color: var(--brand-ink); }
.cr .num { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-4); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cr .tl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr .tl.is-epic { font-weight: var(--weight-medium); }
.cr .col { min-width: 0; display: inline-flex; align-items: center; gap: var(--space-1-5); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); white-space: nowrap; }
.cr .col > .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cr .epc { color: var(--ink-3); }
.cr .dep { color: var(--ink-3); }
.cr .dep .st-warn { margin: 0 var(--space-0-5); }

.cr .tsk .t { color: var(--ink-2); }
.cr .tsk.wait .t, .cr .tsk.error .t { color: var(--ink-1); font-weight: var(--weight-medium); }
.cr .tsk.disc .t { color: var(--ink-3); }
/* The keys: their own column, so showing them on the focused row never takes width from the title. */
.keys { display: inline-flex; justify-content: flex-end; gap: var(--space-2); align-items: center; visibility: hidden; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); white-space: nowrap; }
.keys > span { display: inline-flex; align-items: center; gap: var(--space-1); }
.keys kbd { height: var(--size-kbd-sm); }
.cr:focus-visible .keys, .cr.is-focus .keys, .eh:focus-visible .keys, .eh.is-focus .keys { visibility: visible; }
/* The meta (epic, dependency, task): a column each on a wide list. */
.cr .meta { display: contents; }
.cr .st-word { color: var(--ink-3); }
.cr .st-word svg { width: var(--icon-xs); height: var(--icon-xs); color: var(--ink-4); }
.cr.closed .tl { color: var(--ink-4); }
.cr.is-disabled { cursor: not-allowed; outline: var(--border) dashed var(--line-3); outline-offset: calc(var(--border) * -1); }
.cr.is-disabled .tl { color: var(--ink-4); }
.cr.is-loading .tl { color: var(--ink-3); }
.cr.is-error { box-shadow: inset var(--error-rail) 0 0 var(--state-error); }
.cr.gone { cursor: default; }
.cr.gone .tl { color: var(--ink-4); text-decoration: line-through; text-decoration-color: var(--line-3); }
/* The flash of a card that a new reading brings, once, in the neutral veil. */
.cr.born { animation: flash var(--duration-slow) var(--ease-standard) 2; --flash: var(--veil-press); }

/* The checkbox of the select mode (new in this round). */
.cb { display: inline-grid; place-items: center; width: var(--icon); height: var(--icon); border-radius: var(--radius-xs); border: var(--border) solid var(--line-3); background: var(--surface-input); color: var(--brand-on); flex: none; transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard); }
.cb svg { width: var(--icon-xs); height: var(--icon-xs); visibility: hidden; stroke-width: var(--border-2); }
.cb.on { background: var(--brand); border-color: var(--brand); }
.cb.on svg { visibility: visible; }
.cr:hover .cb:not(.on), .cb.is-hover:not(.on) { border-color: var(--ink-3); }
.cb.is-focus { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); }
.cb.is-active { background: var(--brand-tint-press); border-color: var(--brand-ring); }
.cb.off-limits { border-style: dashed; background: transparent; }
.cb.is-loading { border-color: var(--ink-3); background: transparent; }
.cb.is-loading::after { content: ""; width: var(--glyph-sm); height: var(--glyph-sm); border-radius: 50%; border: var(--border) solid var(--state-work-track); border-top-color: var(--state-work); animation: spin var(--duration-spin) linear infinite; }
.cb.is-error { border-color: var(--state-error); background: var(--state-error-veil); }

/* ---------- The card: the same content in the panel (a) and in place (b). ---------- */
.cd-ref { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); min-width: 0; }
.cd-ref .mono { font-size: var(--text-meta); }
.cd-title { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); color: var(--ink-1); text-wrap: balance; }

.cd-sub b { font-weight: var(--weight-medium); color: var(--ink-2); }
.cd-acts { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }

.cd-task { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2); row-gap: var(--space-0-5); align-items: center; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-2); box-shadow: var(--shadow-xs); }
.cd-task .ty { color: var(--brand-ink); }
.cd-task .nm { font-weight: var(--weight-medium); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd-task .l2 { grid-column: 2; display: inline-flex; align-items: center; gap: var(--space-1-5); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.cd-task .btn { grid-row: 1 / 3; grid-column: 3; }
.cd-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-1) var(--space-4); margin: 0; font-size: var(--text-meta); line-height: var(--leading-meta); }
.cd-kv dt { color: var(--ink-3); }
.cd-kv dd { margin: 0; color: var(--ink-1); min-width: 0; }
.cd-h { margin: 0 0 var(--space-1-5); font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }
.cd-rel { display: flex; flex-direction: column; gap: var(--space-0-5); margin: 0; padding: 0; list-style: none; }
.cd-rel li { min-width: 0; }
.rel { display: grid; grid-template-columns: var(--col-num) minmax(0, 1fr) auto; column-gap: var(--space-2); align-items: center; width: 100%; min-height: var(--size-control-sm); padding: 0 var(--space-2); margin: 0 calc(var(--space-2) * -1); border-radius: var(--radius-sm); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-1); }
button.rel:hover, .rel.is-hover { background: var(--veil-hover); }
.rel .num { color: var(--ink-4); font-variant-numeric: tabular-nums; }
.rel .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel .s { color: var(--ink-3); white-space: nowrap; display: inline-flex; align-items: center; gap: var(--space-1); }
.rel .s svg { width: var(--icon-xs); height: var(--icon-xs); }
.cbody { font-size: var(--text-read); line-height: var(--leading-read); }
.cbody h4 { margin: var(--space-4) 0 var(--space-1); font-size: var(--text-body); line-height: var(--leading-body); font-weight: var(--weight-strong); color: var(--ink-1); }
.cbody h4:first-child { margin-top: 0; }
.cbody p, .cbody ul { max-width: var(--measure-read); }
.cbody code { font-family: var(--font-mono); font-size: var(--text-code-read); padding: var(--code-pad-y) var(--code-pad-x); border-radius: var(--radius-xs); background: var(--surface-0); }

.cd-stale { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface-0); }
.cd-stale .lbl { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: var(--weight-strong); color: var(--ink-1); }
.cd-stale .det { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }

/* ---------- Empty and loading pages of the board. ---------- */
.bempty { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-2); padding-top: var(--space-16); }

.skel i { display: block; height: var(--space-5); border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--surface-0) 40%, var(--line-1) 50%, var(--surface-0) 60%) 0 0 / 300% 100%; animation: shimmer var(--duration-shimmer) linear infinite; }

.cont { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2-5); row-gap: var(--space-0-5); align-items: center; width: 100%; padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
  border-radius: var(--radius-lg); background: var(--surface-2); box-shadow: var(--shadow-xs); color: var(--ink-1); text-align: left;
  transition: background var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard); }
.cont:hover, .cont.is-hover { background: var(--surface-2-hover); }

.cont .l2 { grid-column: 2; display: inline-flex; align-items: center; gap: var(--space-1-5); min-width: 0; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.cont .l2 .st { margin-right: var(--space-0-5); }

.cont .c1 { display: grid; place-items: center; width: var(--icon); }

.cont:disabled .ty, .cont.is-disabled .ty { color: var(--ink-4); }
.hl { display: flex; flex-direction: column; gap: var(--space-0-5); margin: 0 calc(var(--space-2) * -1); padding: 0; list-style: none; }
.hr { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2-5); align-items: center; width: 100%; min-height: var(--size-control); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); color: var(--ink-1); text-align: left;
  transition: background var(--duration-fast) var(--ease-standard); }
button.hr:hover, .hr.is-hover { background: var(--veil-hover); }
button.hr:active, .hr.is-active { background: var(--veil-press); }
.hr:disabled, .hr.is-disabled { color: var(--ink-4); cursor: not-allowed; outline: var(--border) dashed var(--line-3); outline-offset: calc(var(--border) * -1); background: transparent; }
.hr.is-loading { cursor: progress; }

.hr .r { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); white-space: nowrap; }
.hr .r.warn { color: var(--ink-2); }
.hr .r .rd { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
.hr-sub { display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-control-sm); padding: 0 var(--space-2) 0 calc(var(--space-2) + var(--icon) + var(--space-2-5)); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
