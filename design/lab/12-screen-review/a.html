.keysline span { display: inline-flex; align-items: center; gap: var(--space-1-5); }
.home .nothing { display: flex; flex-direction: column; gap: var(--space-1); }
.home .nothing .t { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); color: var(--ink-1); }
.home .nothing .s { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-3); }

/* ---------- The creation dialog: few fields, good defaults, the rest one click away. ---------- */
/* The dialog sits at a fixed height from the top, on a whole pixel, and grows down: opening Models never moves its title. */
.scrim:has(.dlg.wide) { align-items: start; }
.dlg.wide { width: min(var(--size-dialog-wide), 100%); margin-top: round(down, 8vh, 1px); max-height: calc(100vh - round(down, 8vh, 1px) - var(--space-16)); }
.dlg.wide .dlg-bd { gap: var(--space-4); overflow: auto; padding-top: var(--space-2); }
.dlg-hd .x { margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1) 0 0; }
.cardsum { display: grid; grid-template-columns: var(--col-num) minmax(0, 1fr); column-gap: var(--space-2); row-gap: var(--space-0-5); padding: var(--space-2-5) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); }
.cardsum .num { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: var(--space-0-5); }
.cardsum .t { color: var(--ink-1); font-weight: var(--weight-medium); font-size: var(--text-ui); line-height: var(--leading-ui); }
.cardsum .s { grid-column: 2; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.fld { display: flex; flex-direction: column; gap: var(--space-1-5); }
.fld > .lb { display: flex; align-items: baseline; gap: var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); font-weight: var(--weight-medium); color: var(--ink-2); }
.fld > .lb .opt-l { font-weight: var(--weight-regular); color: var(--ink-4); }
.fld .help { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.fld .help.err { color: var(--state-error); font-size: var(--text-meta); line-height: var(--leading-meta); }
.fld .help.err a { color: var(--state-error); }
.fld .input.mono input, .fld .input.mono { font-family: var(--font-mono); font-size: var(--text-meta); }
.fld .input input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 0; font: inherit; color: var(--ink-1); }
.fld .input:focus-within { border-color: var(--focus); box-shadow: 0 0 0 var(--halo) var(--focus-halo); }
.fld .input.is-error:focus-within { border-color: var(--state-error); box-shadow: inset var(--error-rail) 0 0 var(--state-error), 0 0 0 var(--halo) var(--focus-halo); }
.fld .desc { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.fld .switch { align-self: flex-start; }
.fld .switch .sw { height: var(--size-control-xs); font-size: var(--text-meta); line-height: var(--leading-meta); padding: 0 var(--space-2-5); }
.fld .switch .sw svg { width: var(--icon-sm); height: var(--icon-sm); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.ctxrow { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.ctxrow .w { flex: 1 1 0; min-width: 0; }
.ctxrow .w b { font-weight: var(--weight-medium); color: var(--ink-1); }
.ctxrow .w .rd { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
.ctxprev { max-height: calc(var(--leading-read) * 9); overflow: auto; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); font-size: var(--text-body); line-height: var(--leading-body); }
.ctxprev.cbody { font-size: var(--text-body); line-height: var(--leading-body); }
.mdl { display: flex; flex-direction: column; }
.mdl-sum { display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: var(--size-control); padding: 0 var(--space-2); margin: 0 calc(var(--space-2) * -1); border-radius: var(--radius-sm); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.mdl-sum:hover { background: var(--veil-hover); color: var(--ink-1); }
.mdl-sum .l { font-weight: var(--weight-medium); }
.mdl-sum .v { color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mdl-sum .chev { width: var(--icon-xs); height: var(--icon-xs); color: var(--ink-4); transition: transform var(--duration-fast) var(--ease-standard); transform: rotate(-90deg); }
.mdl-sum[aria-expanded="true"] .chev { transform: none; }
.mdl-list { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-1) var(--space-4); align-items: center; padding: var(--space-1) 0 0 calc(var(--icon-xs) + var(--space-2)); font-size: var(--text-meta); line-height: var(--leading-meta); }
.mdl-list .st-l { color: var(--ink-3); }
.mdl-list .chip { justify-self: start; height: var(--size-control-xs); }
.mdl-list .chip.own { color: var(--ink-1); border-color: var(--line-3); }
.mdl-list .chip svg { width: var(--icon-xs); height: var(--icon-xs); }
.dlg-ft .why.err { color: var(--state-error); white-space: normal; }
.dlg-ft .why { white-space: normal; }
.dlg .stalebox { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--ink-1); }

/* ---------- Widths: the row gives way to the title, in fixed limits of the list's own width. ---------- */
/* On a narrow list (the half of the monitor, or the list beside the Card panel) the meta goes to a second line
   under the title, whole: the epic, the dependency and the task with its label. Nothing that decides the choice goes. */
@container list (max-width: 1040px) {
  .cr .meta { display: none; grid-row: 2; grid-column: 3 / -1; align-items: center; gap: var(--space-1) var(--space-4); flex-wrap: wrap; min-width: 0; }
  .cr.has2 .meta { display: flex; }
  .cr.has2 { padding-top: var(--space-1-5); padding-bottom: var(--space-1-5); row-gap: var(--space-0-5); }
  .cr .meta .col:empty { display: none; }
  .cr .meta .epc { max-width: calc(var(--col-epic) + var(--space-8)); }
}
@container list (max-width: 620px) {
  .fbar .srch { width: calc(var(--space-16) * 3); }
}
@media (prefers-reduced-motion: reduce) { .skel i, .ctxrow .w .rd, .hr .r .rd, .node .x.is-reading { animation: none; background: none; color: var(--ink-3); } }
.st-gap { display: inline-flex; margin-right: var(--space-2); vertical-align: middle; }
.sb-more[hidden] { display: none; }

/* =====================================================================
   ROUND 12 · the review center and the screen of a review, shared by a and b.
   On top of base.css and core.css (rounds 08 and 09), m.css and b.css (the
   decided task screen, round 10) and board.css (the decided board, round 11),
   all unchanged. Every value is a token of design/system/tokens.css or a
   calc() of tokens; the bare lengths are geometry and container limits.
   ===================================================================== */

/* The columns of a pull request row. Proposed tokens, see the README. */
:root {
  --col-ref: calc(var(--space-16) + var(--space-8));       /* web#2291, gateway#88 */
  --col-author: calc(var(--space-16) + var(--space-8));    /* dependabot */
  --col-state: calc(var(--space-16) * 3 + var(--space-4)); /* Decide findings · pass 1 · 1/3 */
}

/* ---------- The list: the rows of the board, with the columns of a pull request. ---------- */
.prr { grid-template-columns: var(--col-ref) minmax(0, 1fr) var(--col-author) var(--col-state) var(--col-keys); }
.prr .ref { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-4); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prr.open .ref { color: var(--ink-3); }
.prr .tlw { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.prr .tlw .tl { flex: 0 1 auto; }
.dtag { display: inline-flex; align-items: center; height: var(--size-kbd); padding: 0 var(--space-1-5); border-radius: var(--radius-xs); box-shadow: inset 0 0 0 var(--border) var(--line-2); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); white-space: nowrap; flex: none; }
.prr .aut .t { color: var(--ink-3); }
.prr .rst .t { color: var(--ink-2); }
.prr .rst.wait .t, .prr .rst.error .t { color: var(--ink-1); font-weight: var(--weight-medium); }
.prr .rst .ty { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-3); }
.prr .rst .short { display: none; }
/* On a narrow list the author and the state go under the title, whole. */
@container list (max-width: 1040px) {
  .prr { grid-template-columns: var(--col-ref) minmax(0, 1fr) var(--col-keys); }
  .prr .meta { grid-column: 2 / -1; }
}
.lst .sech .fl { margin-left: var(--space-2); }

/* The reading of the list, per repository: the strip names the repository and keeps its last reading. */
.readfail .rep { font-family: var(--font-mono); font-size: var(--text-meta); }
.readfail .lines { display: flex; flex-direction: column; gap: var(--space-0-5); flex: 1 1 0; min-width: 0; }

/* The filter menu: Author and Label cycle between nothing, out (−) and in (+). */
.fmenu .mi .tri { display: inline-grid; place-items: center; width: var(--icon); height: var(--icon); flex: none; font-family: var(--font-mono); font-size: var(--text-meta); color: var(--ink-3); }
.fmenu .mi[data-tri="-"] .tri, .fmenu .mi[data-tri="+"] .tri { color: var(--brand-ink); font-weight: var(--weight-strong); }
.fmenu { max-height: calc(100vh - var(--space-16) * 3); overflow: auto; }

/* ---------- The panel of a pull request: the card panel of the board, with the review's facts. ---------- */
.prp .cd-tags { display: inline-flex; gap: var(--space-1-5); margin-left: var(--space-1); vertical-align: middle; }
.prp .cd-acts .btn.primary { min-width: calc(var(--space-16) * 2); }
.prp .gh { background: transparent; }
.prp .gh .gh-h { box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); }
.cd-rev { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2); row-gap: var(--space-0-5); align-items: center; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-2); box-shadow: var(--shadow-xs); }
.cd-rev .ty { color: var(--brand-ink); }
.cd-rev .nm { font-weight: var(--weight-medium); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd-rev .l2 { grid-column: 2; display: inline-flex; align-items: center; gap: var(--space-1-5); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); min-width: 0; }
.cd-rev .btn { grid-row: 1 / 3; grid-column: 3; }

/* ---------- The start dialog: the pull request, the model, and the rest on request. ---------- */
.dlg .modelrow { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.dlg .modelrow .chip { height: var(--size-control-sm); }
.dlg .modelrow .desc { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.dlg .morebtns { display: flex; gap: var(--space-1); flex-wrap: wrap; margin-left: calc(var(--space-2) * -1); }
.dlg .ctxrow .st { margin-right: var(--space-0-5); }

/* ---------- The review screen: the header's one pill, the checks of the first pass. ---------- */
.stepper.one { margin-left: var(--space-1); }
.gh .gh-note { padding: 0 var(--space-3) var(--space-2-5); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.gh .gh-h .btn { margin-left: var(--space-1); }

/* ---------- A finding: the title, the place (GitHub first, the editor second), the text, the decision. ---------- */
.fnd .fh { display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
.fnd .fh .fti { font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: var(--weight-strong); color: var(--ink-1); }
.fnd .ft code, .frb .ft code { font-family: var(--font-mono); font-size: var(--text-code); padding: var(--code-pad-y) var(--code-pad-x); border-radius: var(--radius-xs); background: var(--surface-0); font-variant-ligatures: none; }
.fnd .ft:hover { box-shadow: none; background: transparent; }
.fnd.ok .fh .fti { color: var(--ink-1); }
/* A decided finding keeps its text legible (structure.md §3): a discarded one only steps down to ink 2. */
.fnd.no-go .fh .fti { color: var(--ink-2); }
/* The place of a finding: a link to the line on GitHub, then the editor as a small second way. */
.locrow { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
.locrow .loc svg { width: var(--icon-xs); height: var(--icon-xs); flex: none; }
.locrow .btn.icon { width: var(--size-control-xs); color: var(--ink-3); }
.fnd .fa .grow { flex: 1 1 auto; }
.fedit { display: flex; flex-direction: column; gap: var(--space-1-5); }
.fedit .textarea { font-size: var(--text-body); line-height: var(--leading-body); }
.fedit .row { justify-content: flex-end; }
.fedit .help { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); margin-right: auto; }

/* ---------- The review that left while open: what happened, the result, and the ways on. ---------- */
.leftw { flex: 1; overflow: auto; }
.left { max-width: var(--measure-read); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure-read)) / 2), 1px)); padding: calc(var(--space-16) + var(--space-8)) var(--space-6) var(--space-12); display: flex; flex-direction: column; gap: var(--space-5); }
.left .hd { display: flex; flex-direction: column; gap: var(--space-2); }
.left .hd .ic { display: inline-grid; place-items: center; width: var(--size-control); height: var(--size-control); border-radius: var(--radius-md); background: var(--surface-0); box-shadow: inset 0 0 0 var(--border) var(--line-1); color: var(--ink-2); }
.left h2 { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); color: var(--ink-1); text-wrap: balance; }
.left p { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-2); }
.left .res { display: flex; flex-direction: column; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); background: var(--surface-0); }
.left .res li { display: grid; grid-template-columns: calc(var(--space-16) + var(--space-2)) minmax(0, 1fr) auto; column-gap: var(--space-3); align-items: center; min-height: var(--size-control); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); list-style: none; }
.left .res li + li { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.left .res .p { color: var(--ink-1); font-weight: var(--weight-medium); }
.left .res .t { color: var(--ink-4); font-variant-numeric: tabular-nums; }
.left .res ul { margin: 0; padding: 0; }
.left .acts2 { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ---------- The review's panels: Details and Reports. ---------- */
.panel .pchk { display: flex; flex-direction: column; }
.panel .pchk .chk { min-height: var(--size-control-xs); }
.dlg .cardsum { grid-template-columns: var(--col-ref) minmax(0, 1fr); }
/* The open Reviews node lifts its count from ink 4, as the open row lifts its meta. */
.node.cur .x { color: var(--ink-3); }
/* The review's dialogs sit at a fixed height from the top, on a whole pixel, like the creation dialog. */
.scrim:has(.dlg.pubd), .scrim:has(.dlg.agd) { align-items: start; }
.dlg.pubd, .dlg.agd { margin-top: round(down, 8vh, 1px); }

/* The reading of every minute that failed: a strip under the header, sunken, never red; not a situation. */
.warnstrip { flex: none; position: relative; padding: var(--space-4) var(--space-6) var(--space-1); background: var(--surface-1); }
.warnstrip::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--space-4); z-index: var(--z-sticky); background: linear-gradient(var(--surface-1), color-mix(in srgb, var(--surface-1) 0%, transparent)); pointer-events: none; }
.warnstrip .readfail { margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure) + var(--space-6) * 2) / 2), 1px)); max-width: calc(var(--measure) - var(--space-6) * 2); }
/* A note inside a card or a dialog: commits after the pass, decisions that a new pass discards. */
.stale { display: flex; align-items: flex-start; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.stale .st-warn { margin-top: calc((var(--leading-meta) - var(--glyph-diamond)) / 2); }
.stale .l { flex: 1 1 0; min-width: 0; }
.stale b { font-weight: var(--weight-strong); color: var(--ink-1); }
.dlg .dp { margin: 0; }

/* =====================================================================
   A · Cards in the conversation: the findings card and the publication card.
   ===================================================================== */
.pubc .bd { gap: var(--space-4); }
.pubc .vsw .sw { gap: var(--space-1-5); }
.pubc .vsw .kn, .pubd .kn2 { font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
/* The chosen verdict is a chosen control (principle 2): the identity's tint with its ring, never the raised form alone. */
.pubc .vsw .sw[aria-checked="true"] { background: var(--brand-tint); color: var(--brand-ink); box-shadow: inset 0 0 0 var(--border) var(--brand-ring); }
.pubc .vsw .sw[aria-checked="true"] .kn { color: var(--brand-ink); }
.pubc .vsw .sw:hover:not([aria-checked="true"]):not(:disabled), .pubc .vsw .sw.is-hover { background: var(--veil-hover); color: var(--ink-1); }
.pubc .vsw .sw:disabled, .pubc .vsw .sw:disabled[aria-checked="true"] { color: var(--ink-4); cursor: not-allowed; outline: var(--border) dashed var(--line-3); outline-offset: calc(var(--border) * -1); background: transparent; box-shadow: none; }
.pubc .vsw .sw:disabled .kn { color: var(--ink-4); }
.lbr { display: flex; align-items: center; gap: var(--space-2); }
.lbr .lb { font-size: var(--text-meta); line-height: var(--leading-meta); font-weight: var(--weight-medium); color: var(--ink-2); flex: 1; }
.pgo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pgo li { display: grid; grid-template-columns: var(--key-size) minmax(0, 1fr) auto; column-gap: var(--space-2); align-items: center; min-height: var(--size-control-xs); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-1); }
.pgo li + li { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.pgo .no { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--ink-3); text-align: right; }
.pgo .mono { font-size: var(--text-micro); }
.pgo .w { color: var(--ink-2); white-space: nowrap; }
.pgo li.off, .pgo li.off .w { color: var(--ink-3); }
.pubc.born { animation: flash var(--duration-slow) var(--ease-standard) 2; --flash: var(--state-wait-veil); }

/* =====================================================================
   B · A list of findings: the decision column beside a quiet conversation,
   and the publication in a small dialog.
   ===================================================================== */
.fcol { flex: none; width: round(down, var(--decision-width), 1px); background: var(--surface-0); display: flex; flex-direction: column; min-height: 0; animation: panel-in var(--duration-base) var(--ease-enter); }
.fcol-h { display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-control); padding: var(--space-3) var(--space-4) var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.fcol-h b { color: var(--ink-1); font-weight: var(--weight-strong); }
.fcol-h .prog { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.flist2 { flex: 1 1 auto; overflow: auto; padding: 0 var(--space-2) var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); }
.fcol-k { margin: 0; padding: var(--space-2) var(--space-4) var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); box-shadow: inset 0 var(--border) 0 var(--line-1); }
.fcol-k kbd { height: var(--size-kbd-sm); }
.fcol-k kbd:not(:first-child) { margin-left: var(--space-2); }
.fr { border-radius: var(--radius-md); transition: background var(--duration-fast) var(--ease-standard); }
.fr.cur { background: var(--surface-2); box-shadow: var(--shadow-xs); }
.fr-h { white-space: normal; display: grid; grid-template-columns: var(--key-size) var(--icon) minmax(0, 1fr); align-items: start; column-gap: var(--space-2); width: 100%; padding: var(--space-2); border-radius: var(--radius-md); text-align: left; color: var(--ink-1); transition: background var(--duration-fast) var(--ease-standard); }
.fr-h:hover, .fr-h.is-hover { background: var(--veil-hover); }
.fr-h:active, .fr-h.is-active { background: var(--veil-press); }
.fr.cur .fr-h:hover { background: transparent; }
.fr-h:focus-visible, .fr-h.is-focus { outline: var(--focus-width) solid var(--focus); outline-offset: calc(var(--focus-offset) * -1); }
.fr-h .no { font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-ui); color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }

// ---------------- Tooltips and truncation (round 08) ----------------
const within = (root, sel) => [...(root.matches && root.matches(sel) ? [root] : []), ...root.querySelectorAll(sel)];
function markTruncated(root = document) {
  within(root, ".it[data-meta]").forEach((row) => {
    if (row.classList.contains("jk-row")) return;
    const nm = row.querySelector(".nm"), r1 = row.querySelector(".r1"); if (!nm || !r1) return;
    row.classList.remove("meta-fits");
    r1.style.display = "inline-flex"; const mw = r1.offsetWidth; r1.style.display = "";
    const gap = parseFloat(getComputedStyle(row).columnGap) || 0;
    const rg = document.createRange(); rg.selectNodeContents(nm); const need = Math.ceil(rg.getBoundingClientRect().width);
    if (need + gap + mw <= nm.clientWidth) row.classList.add("meta-fits");
  });
  within(root, ".it .l3").forEach((el) => { el.classList.remove("fit-short"); if (el.scrollWidth > el.clientWidth + 0.5) el.classList.add("fit-short"); });
  within(root, ".trunc").forEach((el) => {
    const long = el.querySelector(".long"); let full = (long || el).textContent.trim().replace(/\s+/g, " ");
    const row = el.classList.contains("nm") && el.closest(".it[data-meta]:not(.meta-fits):not(.jk-row)");
    if (row) full += " · " + row.dataset.meta;
    const cut = !!row || el.scrollWidth > el.clientWidth + 0.5 || (long && getComputedStyle(long).display === "none");
    if (cut) { if (!el.dataset.tip || el.dataset.cut) { el.dataset.tip = full; el.dataset.cut = "1"; } }

  const pubBtn = S.publishing ? `<button class="btn primary is-loading" aria-busy="true"><span class="spin"></span>Publishing…</button>`
    : `<button class="btn primary" data-act="publish" ${v ? "" : 'disabled aria-describedby="why-pub2"'}>Publish${v ? ` · ${v}` : ""} <span class="k">Ctrl ↵</span></button>`;
  return `<div class="scrim" id="scrim"><div class="dlg pubd" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="dlg-hd"><h2 id="dlg-t">Publish the review of web#2291</h2><button class="btn ghost sm icon x" data-act="dlg-close" aria-label="Close" data-tip="Close · Esc">${I("x")}</button></div>
    <div class="dlg-bd">${staleNote()}<div class="fld"><span class="lb" id="vd-l">Verdict</span><div class="opts" role="radiogroup" aria-labelledby="vd-l">${opts}</div>${why ? `<span class="help" id="vd-why">${why}</span>` : ""}</div>
      <div class="ctxrow"><span class="w"><b>${FIND.length ? goesLine() : `A clean pass · ${goesLine().toLowerCase()}`}</b>${disc ? ` · ${plural(disc, "finding")} discarded, not published` : ""}</span></div>
      <div class="fld"><label class="cbl" for="sum-on"><input type="checkbox" class="sr" id="sum-on" ${S.sumOn ? "checked" : ""}><span class="cb ${S.sumOn ? "on" : ""}" aria-hidden="true">${I("check")}</span>Include the summary</label>${sum}</div></div>
    <div class="dlg-ft"><span class="why" id="why-pub2">${v ? "" : ok.length ? "Choose a verdict" : "Nothing GitHub takes yet"}</span><button class="btn ghost" data-act="dlg-close" ${S.publishing ? "disabled" : ""}>Cancel</button>${pubBtn}</div></div></div>`;
}
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-verdictb]"); if (!v || v.disabled || window.SPECIMEN) return;
  S.verdict = v.dataset.verdictb; S.touched = true; render(`[data-verdictb="${S.verdict}"]`);
});

if ((SCN === "publish" || CLEAN) && !APPLY) S.dialog = "publish";
/* =====================================================================
   A · Cards in the conversation. As in the task screen: the report is a
   marker, and the findings are one card in the conversation with the ask
   bar as the decision bar (Next to decide, Publish review). When every
   finding is decided, a second card is born at the end: the publication,
   with the verdict already chosen by the decisions and the summary to edit.
   The publication is the dialog of b: the verdict chosen by you,
   suggested by the decisions and never marked, the summary optional.
   ===================================================================== */
const V = {
  key: "a",
  after() {
    const card = FIND.length ? `<fieldset class="card dec plain" id="fcard" aria-labelledby="fc-t"><div class="hd"><span id="fc-t">Findings</span><span class="grow"></span><span class="faint num">${FIND.length}</span></div>
      <div class="bd"><div class="fnds">${FIND.map(fndA).join("")}</div></div></fieldset>` : "";
    return card;
  },
  column: () => "",
  publishDialog: () => publishDialogB(),
  bar: () => VA_BAR(),
  next() {
    const open = FIND.filter((f) => !S.dec[f.n]); const after = open.find((f) => f.n > S.cur) || open[0];
    const to = after ? after.n : S.cur; S.cur = to; render(`#fnd-${to}`); document.getElementById(`fnd-${to}`).scrollIntoView({ block: "center" });
  },
  afterDecide(n) {
    const nx = S.dec[n] ? nextOpen(n) : null; if (nx) S.cur = nx;
    render(`#fnd-${S.cur}`); const f = document.getElementById(`fnd-${S.cur}`); if (f && nx) f.scrollIntoView({ block: "center" });
  },
  onKey(e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && allDecided() && S.phase === "decide" && !APPLY) { e.preventDefault(); S.dialog = "publish"; render(); focusDialog(); return true; }
    const f = e.target.closest && e.target.closest(".fnd");
    if (f && e.key === "e" && !e.ctrlKey) { e.preventDefault(); S.edit = +f.dataset.fnum; render(); document.getElementById(`fe-${f.dataset.fnum}`).focus(); return true; }
    if (f && e.key === "o") { e.preventDefault(); openLine(+f.dataset.fnum, "gh"); return true; }
    if (f && e.key.toLowerCase() === "e" && e.ctrlKey) { e.preventDefault(); openLine(+f.dataset.fnum, "ed"); return true; }
    return false;
  },
  initFocus() {
    if (SCN === "findings") { const f = document.getElementById(`fnd-${S.cur}`); if (f) { f.focus({ preventScroll: true }); f.scrollIntoView({ block: "center" }); } }

  },
};


</script>
</body>
