/* Aliases: declared on every scope so they resolve against that scope's colors. */
:root, .scope-light, .scope-dark {
  --primary: var(--brand); --primary-hover: var(--brand-hover); --primary-active: var(--brand-active); --primary-on: var(--brand-on);
  --focus: var(--brand); --focus-halo: color-mix(in srgb, var(--brand) var(--halo-mix), transparent);
  --link: var(--brand-ink);
  --bg-hover: color-mix(in srgb, var(--tint-ink) var(--hover-mix), transparent);
  --bg-active: color-mix(in srgb, var(--tint-ink) var(--active-mix), transparent);
  --bg-selected: color-mix(in srgb, var(--brand) var(--sel-mix), var(--bg-sidebar));
  --sel-ring: var(--brand-line);
}

/* =====================================================================
   SHARED STRUCTURE · identical in the three variations, styled only
   through the tokens. The variation block at the end sets the regions.
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg-app); color: var(--ink);
  font-family: var(--font-ui); font-size: var(--fs-ui); line-height: var(--lh-ui);
  font-feature-settings: var(--ff-ui); text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-off); }
a { color: var(--link); text-decoration: underline; text-decoration-thickness: var(--bw); text-underline-offset: 0.2em; text-decoration-color: color-mix(in srgb, currentColor 45%, transparent); }
a:hover { text-decoration-color: currentColor; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mono { font-family: var(--font-mono); font-feature-settings: normal; }
/* Code shows what the agent wrote: no ligatures turning != into a symbol. */
.mono, code, pre, kbd, .tag, .it .l3, .acts li .tg, .ih-ref { font-variant-ligatures: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.row { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }
svg.i .fill, .ty .fill { fill: currentColor; stroke: none; }
kbd {
  display: inline-flex; align-items: center; height: var(--h-kbd); padding: 0 var(--sp-1);
  font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3);
  border: var(--bw) solid var(--line-strong); border-bottom-width: var(--bw-2); border-radius: var(--r-xs); background: var(--bg-raised); white-space: nowrap;
}

/* ---------- Buttons: default, hover, focus, active, disabled, loading, error ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1-5); flex: none;
  height: var(--h-ctl); padding: 0 var(--sp-3); border-radius: var(--r-sm);
  border: var(--bw) solid var(--line-strong); background: var(--bg-raised); color: var(--ink-2);
  font-size: var(--fs-ui); line-height: var(--lh-ui); font-weight: var(--fw-medium); white-space: nowrap;
  box-shadow: 0 1px 1px oklch(0 0 0 / 0.04);
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.btn:hover, .btn.is-hover { background: color-mix(in srgb, var(--tint-ink) var(--hover-mix), var(--bg-raised)); color: var(--ink); }
.btn:active, .btn.is-active, .btn[aria-pressed="true"] { background: color-mix(in srgb, var(--tint-ink) var(--active-mix), var(--bg-raised)); color: var(--ink); }
.btn:focus-visible, .btn.is-focus { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-off); }
.btn.sm { height: var(--h-ctl-sm); padding: 0 var(--sp-2-5); font-size: var(--fs-meta); line-height: var(--lh-meta); gap: var(--sp-1); }
.btn.xs { height: var(--h-ctl-xs); padding: 0 var(--sp-2); font-size: var(--fs-micro); line-height: var(--lh-micro); gap: var(--sp-1); }
.btn.icon { width: var(--h-ctl); padding: 0; }
.btn.sm.icon { width: var(--h-ctl-sm); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover, .btn.ghost.is-hover { background: var(--bg-hover); }
.btn.ghost:active, .btn.ghost.is-active, .btn.ghost[aria-pressed="true"] { background: var(--bg-active); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-on); box-shadow: 0 1px 2px color-mix(in srgb, var(--primary) 30%, transparent); }
.btn.primary:hover, .btn.primary.is-hover { background: var(--primary-hover); border-color: var(--primary-hover); color: var(--primary-on); }
.btn.primary:active, .btn.primary.is-active { background: var(--primary-active); border-color: var(--primary-active); color: var(--primary-on); box-shadow: none; }
.btn .k { font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); }
.btn.primary .k { color: color-mix(in srgb, var(--primary-on) 75%, transparent); }
/* Disabled reads as disabled: dashed, no fill, the reason next to it (structure §3). */
.btn:disabled, .btn[aria-disabled="true"], .btn.primary:disabled {
  background: transparent; border-style: dashed; border-color: var(--line-control); color: var(--ink-4); cursor: not-allowed; box-shadow: none;
}
.btn.ghost:disabled { border-color: transparent; }
.btn.is-loading { cursor: progress; }
.btn.is-error, .btn.primary.is-error { border-color: var(--err); color: var(--err); background: var(--err-bg); box-shadow: none; }
.why { font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); white-space: nowrap; }
.sep { width: var(--bw); align-self: stretch; background: var(--line); margin: var(--sp-2) var(--sp-1); flex: none; }
.spin { width: var(--glyph); height: var(--glyph); border-radius: 50%; border: var(--bw-2) solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: spin var(--dur-spin) linear infinite; flex: none; display: inline-block; }

/* ---------- Inputs ---------- */
.input {
  display: flex; align-items: center; gap: var(--sp-2); height: var(--h-ctl); padding: 0 var(--sp-2-5);
  border: var(--bw) solid var(--line-control); border-radius: var(--r-sm); background: var(--bg-input); color: var(--ink);
  font-size: var(--fs-ui); line-height: var(--lh-ui); min-width: 0; white-space: nowrap; overflow: hidden;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.input::placeholder, .input .ph { color: var(--ink-4); }
.input:hover, .input.is-hover { border-color: var(--ink-3); }
.input:focus-visible, .input.is-focus, .input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 var(--halo) var(--focus-halo); }
.input.is-active { border-color: var(--focus); }
.input:disabled, .input.is-disabled { border-style: dashed; background: transparent; color: var(--ink-4); cursor: not-allowed; }
.input.is-loading { color: var(--ink-3); cursor: progress; }
.input.is-error { border-color: var(--err); box-shadow: inset var(--rail) 0 0 var(--err); }
select.input { appearance: none; background-image: none; padding-right: var(--sp-6); }
.select-wrap { position: relative; display: block; }
.select-wrap svg { position: absolute; right: var(--sp-2); top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-3); }

/* ---------- Chips (filters, the model picker) ---------- */
.chip {
  display: inline-flex; align-items: center; gap: var(--sp-1); height: var(--h-chip); padding: 0 var(--sp-2-5);
  border: var(--bw) solid var(--line-strong); border-radius: var(--r-pill); background: var(--bg-raised);
  font-size: var(--fs-meta); line-height: var(--lh-meta); font-weight: var(--fw-medium); color: var(--ink-2); white-space: nowrap; flex: none;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.chip:hover, .chip.is-hover { background: color-mix(in srgb, var(--tint-ink) var(--hover-mix), var(--bg-raised)); color: var(--ink); }
.chip:active, .chip.is-active, .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--brand) var(--sel-mix), var(--bg-raised)); color: var(--ink); border-color: var(--sel-ring); }
.chip:focus-visible, .chip.is-focus { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-off); }
.chip:disabled, .chip.is-disabled { border-style: dashed; border-color: var(--line-control); background: transparent; color: var(--ink-4); cursor: not-allowed; }
.chip.is-loading { cursor: progress; color: var(--ink-3); }
.chip.is-error { border-color: var(--err); color: var(--err); background: var(--err-bg); }
.chip .spin { width: var(--glyph); height: var(--glyph); }
.tag { display: inline-flex; align-items: center; height: var(--h-tw); padding: 0 var(--sp-1-5); border-radius: var(--r-xs); font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); background: var(--bg-sunken); white-space: nowrap; }

/* ---------- Status glyphs: shape + color + word, never color alone. Whole-pixel borders. ---------- */
.st { display: inline-block; width: var(--glyph); height: var(--glyph); flex: none; border-radius: 50%; position: relative; }
.st-error { width: var(--glyph-diamond); height: var(--glyph-diamond); border-radius: var(--bw); background: var(--err); transform: rotate(45deg); }
.st-wait { background: var(--wait-glyph); }
.st-close { border: var(--bw-2) solid var(--close); }
.st-run { border: var(--bw-2) solid var(--work-track); border-top-color: var(--work); animation: spin var(--dur-spin) linear infinite; }
.st-gh { border: var(--bw) dashed var(--gh); }
.st-idle { border: var(--bw) solid var(--idle); }
.st-paused { border-radius: 0; background: linear-gradient(90deg, var(--paused) 0 var(--glyph-bar), transparent var(--glyph-bar) calc(var(--glyph) - var(--glyph-bar)), var(--paused) calc(var(--glyph) - var(--glyph-bar))); }
.st-warn { width: var(--glyph-diamond); height: var(--glyph-diamond); border-radius: var(--bw); border: var(--bw) solid var(--ink-2); transform: rotate(45deg); }
.st-todo { border: var(--bw) solid var(--deco); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0% { background: var(--wait-bg); } 100% { background: transparent; } }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

/* Type glyphs (task, One-Shot task, PR review, discussion) */
.ty { width: var(--icon); height: var(--icon); flex: none; color: var(--ink-3); fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }

/* The user's clock: a chip. Round and tinted for a wait, square with ! for an error, outlined for closing. */
.tw {
  display: inline-flex; align-items: center; gap: var(--sp-0-5); height: var(--h-tw); padding: 0 var(--sp-1-5); border-radius: var(--r-pill); flex: none;
  background: var(--wait-chip); color: var(--wait-chip-ink); box-shadow: inset 0 0 0 var(--bw) var(--wait-glyph);
  font-size: var(--fs-micro); line-height: var(--lh-micro); font-weight: var(--fw-strong); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.tw-error { background: var(--err-bg); color: var(--err); box-shadow: inset 0 0 0 var(--bw) var(--err); border-radius: var(--r-xs); }
.tw-error::before { content: "!"; font-weight: var(--fw-bold); }
.tw-close { background: transparent; color: var(--close); box-shadow: inset 0 0 0 var(--bw) var(--close); }
/* The agent's clock: plain text, no chip. The spinner is already the line's glyph. */
.tt { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }

/* Context meter: a short track with a soft gradient fill. */
.ctx { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.ctx i { display: inline-block; width: var(--ctx-w); height: var(--ctx-h); border-radius: var(--r-pill); background: var(--line-strong); position: relative; overflow: hidden; }
.ctx i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); border-radius: inherit; background: linear-gradient(90deg, var(--meter-a), var(--meter-b)); }

/* =====================================================================
   SHELL
   ===================================================================== */
/* The sidebar width from structure §6, rounded down to a whole pixel so nothing to its right lands on a half pixel. */
.app { --sb: round(down, clamp(18rem, calc(8vw + 12.5rem), 23.75rem), 1px); display: grid; grid-template-columns: var(--sb) minmax(0, 1fr); height: 100vh; background: var(--bg-app); }
.sb { display: flex; flex-direction: column; background: var(--bg-sidebar); min-height: 0; min-width: 0; container: sb / inline-size; position: relative; z-index: 1; }
.sb-top { display: flex; align-items: center; gap: var(--sp-1-5); height: var(--h-head); padding: 0 var(--sp-2) 0 var(--sp-3); flex: none; }
.brand { display: inline-flex; align-items: center; gap: var(--sp-2); font-family: var(--font-ui); font-weight: var(--fw-bold); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink); letter-spacing: var(--tracking-brand); }
.brand .mark { width: var(--mark); height: var(--mark); border-radius: var(--r-sm); background: var(--brand); display: inline-grid; place-items: center; color: var(--brand-on); box-shadow: inset 0 0 0 var(--bw) oklch(1 0 0 / 0.12); }
.brand .mark svg { width: var(--icon); height: var(--icon); stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sb-filter { padding: 0 var(--sp-2) var(--sp-3); flex: none; }
.sb-filter .input { width: 100%; height: var(--h-ctl-sm); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-2); background: var(--sb-input); }
.sb-tree { flex: 1; overflow: auto; padding: 0 var(--sp-2) var(--sp-4); }
.sb-foot { display: flex; align-items: center; gap: var(--sp-1); height: var(--h-head); padding: 0 var(--sp-2); flex: none; box-shadow: 0 calc(var(--bw) * -1) 0 var(--sb-line); }
.sb-foot .cnt { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); font-variant-numeric: tabular-nums; }

/* Tree sections: breathing room between boards, a quiet header per section. */
.sec + .sec { margin-top: var(--section-gap); }
.node {
  display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-2);
  height: var(--h-node); width: 100%; padding: 0 var(--sp-2) 0 var(--tree-pad); border-radius: var(--r-sm);
  color: var(--ink-3); font-size: var(--fs-meta); line-height: var(--lh-meta); font-weight: var(--fw-strong); cursor: pointer;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.node:hover { background: var(--bg-hover); color: var(--ink); }
.node .chev { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-4); justify-self: center; transition: transform var(--dur-fast) var(--ease); }
.node[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.node .lbl { display: inline-flex; align-items: center; gap: var(--sp-1); min-width: 0; }
.node .go { width: var(--icon-sm); height: var(--icon-sm); opacity: 0; color: var(--ink-3); transition: opacity var(--dur-fast) var(--ease); }
.node:hover .go, .node:focus-visible .go { opacity: 1; }
.node.epic { font-weight: var(--fw-medium); }
.node .x { font-weight: var(--fw-regular); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); display: inline-flex; gap: var(--sp-1); align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.node .x.warn { color: var(--ink-3); }
.node .sum { display: inline-flex; gap: var(--sp-1-5); align-items: center; font-weight: var(--fw-medium); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); }
.node .sum > span { display: inline-flex; gap: var(--sp-1); align-items: center; }
.grp { display: flex; flex-direction: column; gap: var(--row-gap); padding-top: var(--row-gap); }
/* An epic's items hang from a guide line under its chevron. */
.grp.epic-grp { margin-left: calc(var(--tree-pad) + var(--guide-x)); padding-left: var(--sp-1); box-shadow: inset var(--bw) 0 0 var(--sb-line); }

/* Tree row: a grid of three columns (glyph, text, right edge) and two lines, three while the agent runs. */
.it {
  display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-2); row-gap: var(--row-gap);
  width: 100%; padding: var(--row-pad-y) var(--sp-2) var(--row-pad-y) var(--tree-pad); border-radius: var(--r-md);
  position: relative; cursor: pointer; color: var(--ink);
  transition: background var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.epic-grp .it { padding-left: var(--sp-2); }
.it:hover, .it.is-hover { background: var(--bg-hover); }
.it:active, .it.is-active { background: var(--bg-active); }
.it.is-focus, [role="treeitem"]:focus-visible { outline: var(--focus-w) solid var(--focus); outline-offset: calc(var(--focus-w) * -1); }
/* The open row: a faint wash of the identity color and a ring. Not bold: bold means "waits for you". */
.it.sel { background: var(--bg-selected); box-shadow: inset 0 0 0 var(--bw) var(--sel-ring); }
.it.sel .meta, .it.sel .l3, .it.sel .rw, .it.sel .tt { color: var(--ink-3); }
.it .c1 { display: grid; place-items: center; width: var(--icon); height: 100%; }
.it .nm { font-size: var(--fs-ui); line-height: var(--lh-ui); font-weight: var(--fw-medium); color: var(--ink); }
.it.you .nm { font-weight: var(--fw-strong); }
.it .nm.plain { font-weight: var(--fw-regular); color: var(--ink-2); }
.it .r1, .it .r2, .it .r3 { justify-self: end; display: inline-flex; align-items: center; gap: var(--sp-1); }
.it .meta { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); white-space: nowrap; font-variant-numeric: tabular-nums; }
.it .l2 { display: flex; align-items: center; gap: var(--sp-1-5); min-width: 0; font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); }
.it.you .l2 { color: var(--ink-2); }
.it .more { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); flex: none; padding: 0 var(--sp-1); border-radius: var(--r-pill); box-shadow: inset 0 0 0 var(--bw) var(--line-strong); font-variant-numeric: tabular-nums; }
.it .rw { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); }
.it .l3 { font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); font-feature-settings: normal; }
.it .l3 .v { color: var(--ink-3); }
.it.err::before, .rail::before { content: ""; position: absolute; left: 0; top: var(--sp-1-5); bottom: var(--sp-1-5); width: var(--rail); border-radius: 0 var(--r-pill) var(--r-pill) 0; background: var(--err); }
.it.is-disabled { cursor: default; background: transparent; }
.it.is-disabled .nm { font-weight: var(--fw-regular); color: var(--ink-4); text-decoration: line-through; text-decoration-color: var(--ink-4); }
.it.is-loading { cursor: progress; }
.it.is-loading .l2 .lbl { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--dur-shimmer) linear infinite; }
.it.flash { animation: flash var(--dur-slow) var(--ease) 2; }
.it kbd { height: var(--h-more); }
.short { display: none; }
@container sb (max-width: 330px) { .it .meta:not(.jk) { display: none; } .it .long { display: none; } .it .short { display: inline; } }
@container sb (max-width: 370px) { .it .l3 .long { display: none; } .it .l3 .short { display: inline; } }
.sb-empty { padding: var(--sp-1) var(--sp-2) var(--sp-1) calc(var(--tree-pad) + var(--icon) + var(--sp-2)); color: var(--ink-3); font-size: var(--fs-meta); line-height: var(--lh-meta); }

/* =====================================================================
   MAIN · the item open
   ===================================================================== */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-main); position: relative; container: main / inline-size; }

/* The top of the item (round 04, kept): line 1 says what it is, line 2 where it is. */
.ih { flex: none; background: var(--bg-head); box-shadow: 0 var(--bw) 0 var(--head-line); position: relative; z-index: 3; }
.ih-top { display: flex; align-items: center; gap: var(--sp-2); height: var(--h-head); padding: 0 var(--sp-3) 0 var(--sp-2); min-width: 0; }
.navbtns { display: flex; gap: var(--sp-0-5); flex: none; }
.crumbs { display: flex; align-items: center; gap: var(--sp-1-5); min-width: 0; font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); flex: none; white-space: nowrap; }
.crumbs a { color: inherit; border-radius: var(--r-xs); }
.crumbs a:hover { color: var(--ink); }
.crumbs .gt { color: var(--deco); }
.crumbs .crumb-path { gap: var(--sp-1-5); }
.ih-title { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; margin: 0; font-size: var(--fs-title); line-height: var(--lh-title); font-weight: var(--fw-strong); letter-spacing: var(--tracking-title); color: var(--ink); }
.ih-title .ty { color: var(--ink-2); }
.ih-ref { font-family: var(--font-mono); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); white-space: nowrap; flex: none; font-feature-settings: normal; }
.ih-tools { display: flex; align-items: center; gap: var(--sp-1); flex: none; }
.ih-prog { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--h-prog); padding: 0 var(--sp-4) var(--sp-1); min-width: 0; }
.stages { display: flex; align-items: center; gap: var(--sp-0-5); min-width: 0; font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); }
.stg { display: inline-flex; align-items: center; gap: var(--sp-1); height: var(--h-ctl-sm); padding: 0 var(--sp-1-5); border-radius: var(--r-sm); white-space: nowrap; color: var(--ink-3); }
button.stg { transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
button.stg:hover { background: var(--bg-hover); color: var(--ink); }
.stg.done svg { color: var(--ink-3); width: var(--icon-sm); height: var(--icon-sm); }
.stg.next { color: var(--ink-3); }
.stg.next .st-todo { width: var(--glyph-sm); height: var(--glyph-sm); }
.stg.cur { color: var(--ink); font-weight: var(--fw-strong); background: var(--bg-raised); box-shadow: var(--shadow-xs); padding: 0 var(--sp-2-5); gap: var(--sp-2); }
.stages .gt { color: var(--deco); font-size: var(--fs-micro); flex: none; }
.segs { display: inline-flex; gap: var(--seg-gap); align-items: center; }
.segs i { display: block; width: var(--seg-w); height: var(--seg-h); border-radius: var(--r-pill); background: var(--line-strong); }
.segs i.d { background: var(--ink-3); }
.segs i.c { background: var(--ink); }
.stepinfo { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; font-size: var(--fs-ui); line-height: var(--lh-ui); }
.stepinfo .t { font-weight: var(--fw-medium); color: var(--ink); }
.stepinfo .s { color: var(--ink-3); font-size: var(--fs-meta); line-height: var(--lh-meta); white-space: nowrap; }
.nmn { font-weight: var(--fw-regular); color: var(--ink-3); font-variant-numeric: tabular-nums; }
/* Half a monitor: the finished stages keep only their check; the current one and the ones ahead keep their names. */
@container main (max-width: 1240px) {
  .stg.done .nm { display: none; }
  .stg.done { padding: 0 var(--sp-1); }
}
@container main (max-width: 1020px) {
  .crumbs .up { display: none; }
  .ih-tools .long { display: none; }
}

/* Body: the conversation column */
.body { flex: 1; display: flex; min-height: 0; position: relative; }
.colconvo { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-conv); position: relative; }
.convo { flex: 1 1 auto; overflow: auto; min-height: 0; scroll-padding-top: var(--sp-16); }
.convo-in { max-width: var(--measure); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure)) / 2), 1px)); padding: 0 var(--sp-6) var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-5); }

/* The conversation switch: the step's two conversations, pinned at the top of the reading column. */
.cv-head { position: sticky; top: 0; z-index: 2; background: var(--bg-conv); margin: 0 calc(var(--sp-6) * -1); padding: var(--sp-4) var(--sp-6) var(--sp-3); display: flex; align-items: center; gap: var(--sp-3); }
.cv-head::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--sp-4); background: linear-gradient(var(--bg-conv), transparent); pointer-events: none; }
.switch { display: inline-flex; gap: var(--sp-0-5); padding: var(--sp-0-5); background: var(--bg-sunken); border-radius: var(--r-md); flex: none; box-shadow: inset 0 0 0 var(--bw) var(--line); }
.sw { display: inline-flex; align-items: center; gap: var(--sp-1-5); height: var(--h-switch); padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--ink-3); font-size: var(--fs-ui); line-height: var(--lh-ui); font-weight: var(--fw-medium); white-space: nowrap; position: relative; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
.sw:hover, .sw.is-hover { color: var(--ink); background: var(--bg-hover); }
.sw:focus-visible, .sw.is-focus { outline: var(--focus-w) solid var(--focus); outline-offset: 0; }
.sw .what { color: var(--ink-3); font-weight: var(--fw-regular); }
.sw[aria-selected="true"], .sw.is-active { color: var(--ink); background: var(--bg-raised); box-shadow: var(--shadow-xs); }
.sw[aria-selected="true"] .what, .sw.is-active .what { color: var(--ink-2); }
.sw:disabled, .sw.is-disabled { color: var(--ink-4); cursor: not-allowed; background: transparent; box-shadow: inset 0 0 0 var(--bw) transparent; }
.sw.is-disabled .what { color: var(--ink-4); }
.sw.is-loading { cursor: progress; }
.sw.is-loading .spin { color: var(--work); }
.cv-head .tools { display: flex; gap: var(--sp-1); margin-left: auto; flex: none; }

/* Entries */
.e-marker { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); margin: var(--sp-1) 0; }
.e-marker::before, .e-marker::after { content: ""; height: var(--bw); background: var(--line); flex: 1 1 0; max-width: var(--sp-16); }
.e-marker svg { color: var(--ink-3); width: var(--icon-sm); height: var(--icon-sm); }
.e-marker .t { font-variant-numeric: tabular-nums; color: var(--ink-4); }
.who { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-2); font-weight: var(--fw-medium); margin-bottom: var(--sp-2); }
.who .av { width: var(--av); height: var(--av); border-radius: var(--r-pill); display: inline-grid; place-items: center; flex: none; background: var(--bg-sunken); color: var(--ink-3); box-shadow: inset 0 0 0 var(--bw) var(--line); }
.who .av svg { width: var(--icon-sm); height: var(--icon-sm); }
.who .t { color: var(--ink-4); font-weight: var(--fw-regular); font-variant-numeric: tabular-nums; }
.prose { font-family: var(--font-read); font-size: var(--fs-read); line-height: var(--lh-read); color: var(--ink); font-feature-settings: var(--ff-read); letter-spacing: var(--tracking-read); }
.prose p, .prose ul { max-width: var(--measure-read); }
.prose p { margin: 0 0 var(--sp-3); }
.prose p:last-child { margin-bottom: 0; }
.prose ul { margin: 0 0 var(--sp-3); padding-left: var(--list-indent); }
.prose li { margin: var(--sp-1) 0; }
.prose li::marker { color: var(--ink-4); }
.prose strong { font-weight: var(--fw-strong); }
code { font-family: var(--font-mono); font-feature-settings: normal; background: var(--bg-sunken); border-radius: var(--r-xs); padding: var(--code-pad-y) var(--code-pad-x); color: var(--ink); font-size: var(--fs-meta); }
.prose code { font-size: var(--fs-code-read); }
.code { margin: 0 0 var(--sp-3); border-radius: var(--r-md); background: var(--bg-code); overflow: hidden; box-shadow: inset 0 0 0 var(--bw) var(--line); }
.code .ch { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-3); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); box-shadow: inset 0 calc(var(--bw) * -1) 0 var(--line); }
.code .ch svg { width: var(--icon-sm); height: var(--icon-sm); }

<script>
const DIR = {"letter": "C", "name": "Oliva", "intent": "Paper on a desk. The sidebar is a paper surface with a hairline edge; the top of the item rests on a deeper ground; the conversation is a reading column lifted off that ground, rounded at the top, with the ask bar and the composer on it. The work you read is literally the raised thing. Olive marks what you act on.", "colorName": "Olive · oklch(0.51 0.09 122) · dark oklch(0.77 0.10 120)", "colorWhy": "An earthy green that leans warm: the brown trace the neutrals carry, taken one step into color. Sober and unusual in software, it reads as craft rather than as a signal. It sits between the wait amber (hue 58 to 85) and closing green, so this variation moves closing to an emerald (hue 162) and keeps the olive low in chroma and never on a glyph; terracotta, the other warm option, was left out because it falls between the error red and the wait amber, and because a warm accent on cream is the look round 04 was asked to leave.", "typeNote": "Atkinson Hyperlegible Next for the interface and the agent's speech, Atkinson Hyperlegible Mono for code, paths and the tree's line 3. A family drawn for legibility (the Braille Institute): every letter is told apart by its shape (I l 1, O 0), which is what a status line and a path need at 12 px without smoothing. It has character without ornament, and a mono of its own.", "neutralNote": "Neutrals: hue 75 to 80 with chroma 0.001 to 0.004; the warmth is a trace in the ink. The sidebar and the reading column are paper; the ground between them is a notch deeper.", "statusNote": "Agent working stays blue (hue 252). Closing moves to emerald (hue 162) to keep 40 degrees from the olive. Error red 27, wait amber 58 to 85."};
const Q = new URLSearchParams(location.search);

// ---------------- Atoms ----------------
const I = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

  const p = [`${kindWord(i)} ${i.name}`];

}

const GO_BUCKET = `<div class="code"><div class="ch">${I("code")}<span>go</span><span class="grow"></span><span class="mono">internal/ratelimit/bucket.go</span></div><pre><span class="com">// Allow takes one token if there is one, refilling first from the time elapsed.</span>

  };
  const row = (c) => {
    if (c === "disabled") return `<div class="onsb"><div class="it is-disabled" aria-disabled="true"><span class="c1">${ty({ kind: "task" })}</span><span class="nm trunc">Invoice PDF footer</span><span></span><span class="c1">${st("idle")}</span><span class="l2"><span class="lbl trunc">Deleted · removing the worktree</span></span><span></span></div></div>`;
    if (c === "loading") return `<div class="onsb"><div class="it is-loading" aria-busy="true"><span class="c1">${ty({ kind: "review" })}</span><span class="nm trunc">Bump pgx to v5.6</span><span class="r1"><span class="meta">api#1302</span></span><span class="c1">${st("gh")}</span><span class="l2"><span class="lbl trunc">checking GitHub…</span></span><span></span></div></div>`;
    if (c === "error") return `<div class="onsb"><div class="it err you"><span class="c1">${ty({ kind: "task" })}</span><span class="nm trunc">Deprecate v1 webhooks</span><span class="r1"><span class="meta">api#449</span></span><span class="c1">${st("error")}</span><span class="l2"><span class="lbl trunc">Session error · Plan</span></span><span class="r2">${tw({ sev: "error", since: "7m", long: "7m" })}</span></div></div>`;
    return `<div class="onsb"><div class="it you ${cls[c] || ""} ${c === "active" ? "sel" : ""}"><span class="c1">${ty({ kind: "task" })}</span><span class="nm trunc">Retry failed webhooks</span><span class="r1"><span class="meta">api#430</span></span><span class="c1">${st("wait")}</span><span class="l2"><span class="lbl trunc">Question · Tech spec</span></span><span class="r2">${tw({ sev: "wait", since: "12m", long: "12m" })}</span></div></div>`;
  };
  const link = (c) => c === "disabled" ? `<span class="faint">No PR yet</span>` : c === "loading" ? `<span class="row" style="gap:var(--sp-1)"><span class="spin"></span><a href="#">Opening PR…</a></span>` : c === "error" ? `<a href="#" style="color:var(--err)">PR #1279 · can't reach GitHub</a>` : `<a href="#" class="${cls[c] || ""}" style="${c === "hover" ? "text-decoration-color:currentColor" : c === "focus" ? "outline:var(--focus-w) solid var(--focus);outline-offset:var(--focus-off);border-radius:var(--r-xs)" : c === "active" ? "color:var(--brand-active)" : ""}">tech spec · rate limits</a>`;
  const rows = [["Primary", (c) => btn("primary", c)], ["Secondary", (c) => btn("secondary", c)], ["Ghost", (c) => btn("ghost", c)], ["Input", input], ["Chip", chip], ["Link", link]];
  const wide = [["Option in a question card", opt, { active: "chosen" }], ["Conversation tab", tab, { active: "selected" }], ["Tree row", row, { active: "the open row" }]];
  return `<div class="states"><span></span>${cols.map((c) => `<span class="h">${c}</span>`).join("")}${rows.map(([n, f]) => `<span class="rl">${n}</span>${cols.map((c) => `<div class="cell">${f(c)}</div>`).join("")}`).join("")}</div>
    <div class="states-wide">${wide.map(([n, f, alias]) => `<div><div class="rl">${n}</div><div class="cells">${cols.map((c) => `<div class="cell"><span class="h">${alias[c] ? `${c} · ${alias[c]}` : c}</span>${f(c)}</div>`).join("")}</div></div>`).join("")}</div>`;
}
function treeDemo() {

    <div class="demo-colc" style="height:var(--sp-12)"><button class="newmsg">${I("arrow-down")}New messages</button></div>

function pixelAudit() {
  const props = ["borderTopWidth", "borderRightWidth", "borderBottomWidth", "borderLeftWidth", "outlineWidth", "fontSize", "lineHeight"];
  let n = 0; const bad = [];
  document.querySelectorAll(".app *, .spec *").forEach((el) => {
    const cs = getComputedStyle(el); n++;
    props.forEach((p) => { const v = parseFloat(cs[p]); if (!isNaN(v) && Math.abs(v - Math.round(v)) > 0.01) bad.push(`${el.className || el.tagName} ${p} ${v}`); });
    if (el.classList.contains("st")) { const r = el.getBoundingClientRect(); ["width", "height"].forEach((k) => { const v = parseFloat(cs[k]); if (Math.abs(v - Math.round(v)) > 0.01) bad.push(`st ${k} ${v}`); }); }
  });
  const sb = document.querySelector(".sb"), sbw = sb ? sb.getBoundingClientRect().width : 0, sbTxt = sbw ? `The sidebar is ${sbw}px wide at this window, rounded down from the clamp.` : "The sidebar width is rounded down from the clamp (open the page without ?specimen to see it measured).";
  return `<p class="audit">${n} elements checked for borders, outlines, font sizes and line boxes: <b>${bad.length === 0 ? "no fractional pixel" : bad.length + " fractional"}</b>. ${sbTxt}${bad.length ? `<br><span class="faint">${bad.slice(0, 12).join(" · ")}</span>` : ""}</p>`;
}
function specimen() {
  const el = document.getElementById("specimen");
  const scope = (theme, inner) => `<div class="scope scope-${theme}" data-scope="${theme}"><span class="lbl">${theme === "light" ? "Light" : "Dark"}</span>${inner}</div>`;
  const both = (f) => `<div class="sw-grid">${["light", "dark"].map((th) => scope(th, f(th))).join("")}</div>`;
  const typeRows = TYPE.map(([tok, lh, n, use, w, s, f]) => `<tr class="typerow"><td><b>${n}</b><br><code class="faint">${tok}</code></td><td class="cr" data-type="${tok}|${lh}|${w}|${f}"></td><td class="faint">${use}</td><td><span style="display:block;font-size:var(${tok});line-height:var(${lh});font-weight:var(${w});font-family:var(${f});max-width:var(--measure-read)">${s}</span></td></tr>`).join("");
  const sw = (list) => `<div class="swatches">${list.map(([t, n]) => `<div class="swatch"><span class="chipc" style="background:var(${t})"></span><b>${n}</b><code>${t}</code></div>`).join("")}</div>`;
  const pairs = (list, kind) => `<table><thead><tr><th>Pair</th><th>Contrast</th></tr></thead><tbody>${list.map(([n, fg, bg, k]) => `<tr><td>${n} <code class="faint">${fg} / ${bg}</code></td><td data-cr="${fg}|${bg}|${k || kind}"></td></tr>`).join("")}</tbody></table>`;
  const statusRows = `<table><thead><tr><th>State</th><th>Glyph · line 2 · clock</th></tr></thead><tbody>${STATUS.map(([n, k, l]) => `<tr><td>${n}</td><td><span class="row">${st(k)}<span class="grow">${l}</span>${sample[k]}</span></td></tr>`).join("")}</tbody></table>`;
  el.innerHTML = `<div class="spec-in">
    <div><h2>${DIR.letter} · ${DIR.name}</h2><p class="lead">${DIR.intent}</p></div>
    <div><h3>Identity color</h3>${both(() => `<div class="idcard"><span class="big">${I("mark", "")}</span><div><h4>${DIR.colorName}</h4><p>${DIR.colorWhy}</p><p class="faint">Where it goes: the mark, the primary action, focus, the open row, a chosen option. Never a status glyph, never the ask bar, never next to the amber of a wait as a competing fill.</p></div></div>${sw(IDENT)}`)}</div>
    <div><h3>Type</h3><div class="tw-wrap"><table><thead><tr><th>Role</th><th>Size · line · weight · family</th><th>Where</th><th>Sample</th></tr></thead><tbody>${typeRows}</tbody></table></div><p class="note">${DIR.typeNote}</p></div>
    <div><h3>Neutrals</h3>${both(() => sw(NEUTRALS))}<p class="note">${DIR.neutralNote}</p></div>
    <div><h3>Text contrast (4.5:1)</h3>${both(() => pairs(TEXT_PAIRS, "text"))}</div>
    <div><h3>Glyphs, rings, borders and the open row (3:1)</h3>${both(() => pairs(UI_PAIRS, "ui"))}<p class="note">"Tone only" rows have no minimum: they report how far a surface stands from its neighbor, and something else carries the state (the ring on the open row, the ring and label on the ask bar).</p></div>
    <div><h3>Status: shape, color and word</h3>${both(() => statusRows)}<p class="note">${DIR.statusNote}</p></div>
    <div><h3>Radius and elevation</h3>${both(() => `<div class="radii">${["--r-xs", "--r-sm", "--r-md", "--r-lg", "--r-xl"].map((r) => `<div><span class="b" style="border-radius:var(${r})"></span><code>${r}</code><span data-size="${r}"></span></div>`).join("")}</div>
      <div class="elev">${[["plane", "none"], ["xs", "var(--shadow-xs)"], ["card", "var(--shadow-card)"], ["sheet", "var(--shadow-sheet)"], ["float", "var(--shadow-float)"], ["overlay", "var(--shadow-overlay)"]].map(([n, s]) => `<div><span class="b" style="box-shadow:${s};${n === "plane" ? "background:var(--bg-conv);box-shadow:inset 0 0 0 var(--bw) var(--line)" : ""}">${n}</span><span>${n === "plane" ? "bars, rows, the conversation" : n === "xs" ? "buttons, the current stage, the composer" : n === "card" ? "cards that block" : n === "sheet" ? "a region lifted off the ground" : n === "float" ? "menus, New messages" : "a panel over the conversation"}</span></div>`).join("")}</div>`)}</div>
    <div><h3>Components in every state</h3><div class="sw-grid" style="grid-template-columns:1fr">${["light", "dark"].map((th) => scope(th, statesGrid())).join("")}</div></div>
    <div><h3>The tree, row by row</h3>${both(() => treeDemo())}</div>
    <div><h3>Conversation pieces not on screen above</h3>${both(() => convoDemo())}</div>
    <div><h3>Pixel audit</h3><div data-audit></div></div>
  </div>`;
  el.querySelectorAll("[data-scope]").forEach((sc) => {
    sc.querySelectorAll("[data-cr]").forEach((c) => { const [fg, bg, k] = c.dataset.cr.split("|"); c.innerHTML = crCell(sc, fg, bg, k); });
    sc.querySelectorAll("[data-size]").forEach((c) => { c.textContent = getComputedStyle(sc).getPropertyValue(c.dataset.size).trim(); });
  });
  el.querySelectorAll("[data-type]").forEach((c) => {
    const [tok, lh, w, f] = c.dataset.type.split("|"), root = document.documentElement, g = (t) => getComputedStyle(root).getPropertyValue(t).trim();
    const px = (v) => Math.round(parseFloat(v) * 16 * 100) / 100;
    c.innerHTML = `${px(g(tok))} / ${px(g(lh))}px · ${g(w)}<br><span class="faint">${g(f).split(",")[0].replace(/"/g, "")}</span>`;
  });
  const runAudit = () => { el.querySelector("[data-audit]").innerHTML = pixelAudit(); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(runAudit);
}
render();
