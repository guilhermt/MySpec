    ${["PRD", "Tech spec", "Plan", "One-Shot planning", "Implementation", "Step review", "Pull request", "PR review", "Discussion"].map((s) => `<div class="lrow" style="padding-left:0"><span class="grow">${s}</span><span class="btn sm">Opus · high ▾</span></div>`).join("")}</div>`;
}
function settingsView({ back = "", closeLabel = "" } = {}) {
  return `<section class="place" aria-label="Settings"><div class="place-hd">${back}<h1>Settings</h1><span class="grow"></span>${closeLabel}</div>
    <div style="display:flex;flex:1;min-height:0"><nav style="width:220px;border-right:1px solid var(--line);overflow:auto;padding:6px 0">${settingsNav()}</nav>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">${settingsBody()}</div></div></section>`;
}

// ---------- Mock chrome ----------
function mockChrome(notesHtml) {
  document.body.insertAdjacentHTML("beforeend", `<div class="mock mock-w" id="mockw" aria-hidden="true"></div>
    <button class="mock mock-notes-btn" id="notesbtn" aria-expanded="false">Notes</button>
    <div class="mock mock-notes" id="notes" role="dialog" aria-label="Notes about this mock">${notesHtml}</div><div class="toast" id="toast" role="status"></div>`);
  const w = document.getElementById("mockw");
  const upd = () => { const x = innerWidth; w.textContent = `${x}px · ${x < 1500 ? "narrow" : x < 1900 ? "medium" : "wide"} · mock`; };
  addEventListener("resize", upd); upd();
  const nb = document.getElementById("notesbtn"), n = document.getElementById("notes");
  nb.onclick = () => { n.classList.toggle("open"); nb.setAttribute("aria-expanded", n.classList.contains("open")); };
}
const LEGEND = `<h3>Status glyphs (grayscale stand-ins for color)</h3><table>
<tr><td>${st("error")}</td><td>error: needs you, most urgent</td></tr>
<tr><td>${st("wait")}</td><td>waiting for you (question, decision, approval)</td></tr>
<tr><td>${st("close")}</td><td>closing: ready to merge / close</td></tr>
<tr><td>${st("run")}</td><td>agent working (turn running)</td></tr>
<tr><td>${st("gh")}</td><td>waiting on GitHub (checks), not on you</td></tr>
<tr><td>${st("paused")}</td><td>paused · ${st("idle")} idle</td></tr></table>
<p style="margin:6px 0 0">Type: ${ty("task")} task · ${ty("review")} PR review · ${ty("discussion")} discussion (placeholders for icons). Every glyph has a text label next to it.</p>`;

// ---------- B · Queue by urgency, places as layers ----------
const EMPTY = document.body.dataset.initial === "empty";
const S = {
  base: EMPTY ? null : (Q.get("open") || "t1"), // the open item; null = the board is the base
  baseBoard: "plat",
  layer: Q.get("layer"), // null | "board:plat" | "reviews" | "history" | "settings"
  sheet: Q.get("aux"), icolOpen: false, filter: "all", menu: null,
};
const app = document.getElementById("app");

function openItem(id) { S.base = id; S.layer = null; S.sheet = null; S.icolOpen = false; S.menu = null; render(); }
function openLayer(l) { S.layer = S.layer === l ? null : l; S.menu = null; S.sheet = null; render(); }
function closeLayer() { S.layer = null; render(); }
function firstJ() { return D.order.find((id) => D.items[id].group === "you" && id !== S.base) || null; }

// ---------- Top bar ----------
function topBar() {
  const on = (l) => (S.layer || "").startsWith(l) ? "on" : "";
  const boardsMenu = S.menu === "boards" ? `<div class="menu" style="left:78px">${D.boards.map((b) => `<button data-layer="board:${b.id}"><span class="grow">${b.title}</span>${b.failure ? `${st("error")}<span class="muted" style="font-size:11px">Read failed</span>` : `<span class="muted" style="font-size:11px">${b.open} open cards</span>`}</button>`).join("")}</div>` : "";
  const newMenu = S.menu === "new" ? `<div class="menu" style="right:96px">
    <button data-act="stub">${ty("task")}<span class="grow">New task</span>${kbd("Ctrl N")}</button><button data-layer="reviews">${ty("review")}<span class="grow">Review a pull request</span></button><button data-layer="board:plat">${ty("discussion")}<span class="grow">New discussion</span></button></div>` : "";
  return `<header class="top" style="position:relative"><span class="brand">MySpec</span>
    <button class="place-btn ${on("board")}" data-act="menu:boards" aria-haspopup="menu">Boards ▾</button>
    <button class="place-btn ${on("reviews")}" data-layer="reviews">Reviews <span class="tag">4 pending</span></button>
    <button class="place-btn ${on("history")}" data-layer="history">History <span class="faint">23</span></button>
    <span class="grow"></span>
    <button class="btn sm" data-act="menu:new">+ New ▾</button><button class="btn sm ghost iconbtn" title="Theme: System">◐</button>
    <button class="place-btn ${on("settings")}" data-layer="settings" title="Settings (Ctrl+,)">⚙ Settings</button>
    ${boardsMenu}${newMenu}</header>`;
}

// ---------- Queue ----------
function qrow(i) {
  const sel = S.base === i.id;
  const b = boardOf(i.board);
  const where = i.kind === "task" ? `${b.title} · ${i.repo}#${i.card}${i.epic ? " · " + i.epic : ""}` : i.kind === "review" ? `${i.repo}#${i.pr} · ${i.author}` : `${b.title} · #${i.cards.join(", #")}`;
  return `<button class="qi ${sel ? "sel" : ""} ${i.group === "you" ? "you" : ""}" data-item="${i.id}" ${sel ? 'aria-current="page"' : ""}>
    <span class="l1">${ty(i.kind)}<span class="nm trunc">${i.name}</span>${rightTime(i)}</span>
    <span class="l2">${st(i.tone)}<span class="trunc">${i.status}</span></span>
    ${i.tone === "run" ? `<span class="l3"><span class="trunc mono" style="font-size:11px">${i.activity}</span>${ctx(i.ctx)}</span>` : ""}
    <span class="l4 trunc">${where}</span></button>`;
}
function queue() {
  const modes = [["all", "All", D.list.length], ["implement", "Implement", byKind("task").length], ["review", "Review", byKind("review").length], ["discuss", "Discuss", byKind("discussion").length]];
  const list = D.list.filter((i) => S.filter === "all" || i.mode === S.filter);
  let h = "", g = null;
  for (const i of list) { if (i.group !== g) { g = i.group; h += `<div class="q-sep">${GROUPS[g]}</div>`; } h += qrow(i); }
  if (!list.length) h = `<div class="muted" style="padding:16px 6px">Nothing active here.</div>`;
  return `<aside class="queue" aria-label="Active items, most urgent first">
    <div class="q-hd"><h2>Active</h2><span class="muted">${D.list.length}</span><span class="grow"></span><span class="muted" style="font-size:11px">${kbd("Ctrl J")} opens the top</span></div>
    <div class="q-filters" role="toolbar" aria-label="Filter by mode">${modes.map(([k, l, n]) => `<button class="chip ${S.filter === k ? "on" : ""}" data-filter="${k}" aria-pressed="${S.filter === k}">${l} <span class="faint">${n}</span></button>`).join("")}<button class="chip" title="Filters tasks; reviews and discussions ignore it, as today">Repository ▾</button></div>
    <nav class="q-list" id="qlist">${h}</nav>
    <div class="q-foot"><span>Sorted: needs you (oldest first) · agent working · on GitHub · idle</span></div></aside>`;
}

// ---------- Item: conversation + item column ----------
function icol(i) {
  let s = "";
  if (i.kind === "task") {
    s += `<section><h3>Progress <span class="grow"></span><span class="faint" style="text-transform:none;letter-spacing:0">${i.flow} · ${i.reviewMode} review</span></h3>${vtrack(i)}`;
    if (i.id === "t1") s += `<div class="acts"><button class="btn sm">Review myself</button><button class="btn sm">Open in VS Code</button><button class="btn sm ghost">Discard step</button></div>`;
    if (i.id === "t3") s += `<div class="acts"><button class="btn sm ghost">Back to PRD…</button><button class="btn sm ghost">Discard and restart…</button></div>`;
    s += `</section>`;
    if (i.id === "t2") s += `<section><h3>Pull request</h3><div class="row"><span class="strong">#1284</span>${st("gh")}<span>Waiting for checks</span></div>
      <ul class="vtrack" style="margin-top:6px"><li class="done"><span class="mk">✓</span>lint</li><li class="done"><span class="mk">✓</span>unit-tests</li><li class="done"><span class="mk">✓</span>danger</li><li class="cur"><span class="mk">${st("run")}</span>build-ios · running</li><li><span class="mk">○</span>ui-tests · queued</li></ul>
      <div class="faint" style="font-size:11px">checked 40s ago</div><div class="acts"><button class="btn sm">Open PR</button><button class="btn sm">Open in VS Code</button><button class="btn sm ghost">…</button></div></section>`;
    s += `<section><h3>Task</h3><dl class="facts"><dt>Repository</dt><dd>acme/${i.repo}</dd><dt>Card</dt><dd><button data-act="aux:Card" style="text-decoration:underline">#${i.card}</button> · In progress</dd>${i.epic ? `<dt>Epic</dt><dd>${i.epic}</dd>` : ""}<dt>Review mode</dt><dd>${i.reviewMode} ▾</dd><dt>Models</dt><dd>${i.model} · per stage ▾</dd></dl></section>`;
  }
  if (i.kind === "review") {
    s += `<section style="padding-bottom:8px"><h3>Decide</h3>${findingsPanel()}<div class="acts"><button class="btn sm primary" disabled>Publish review · 4 left</button><button class="btn sm">Review again</button></div></section>
      <section><h3>Pull request</h3><dl class="facts"><dt>PR</dt><dd>web#2291 · lnakamura</dd><dt>Mode</dt><dd>Publish</dd><dt>Branch</dt><dd class="mono">settings-rhf → main</dd><dt>Checks</dt><dd>passed</dd></dl><div class="acts"><button class="btn sm">Open PR</button><button class="btn sm">Open in VS Code</button></div></section>`;
  }
  if (i.kind === "discussion") {
    s += `<section><h3>Drafts</h3><div class="muted">No drafts yet. The agent writes them when the understanding closes; you decide them here.</div></section>
      <section><h3>Cards</h3><div>#455 Usage metering events</div><div>#461 Pricing page tiers</div></section>
      <section><h3>Discussion</h3><dl class="facts"><dt>Board</dt><dd>Platform Roadmap</dd><dt>Reads</dt><dd>acme/api, acme/web</dd></dl><div class="acts"><button class="btn sm ghost">Archive…</button></div></section>`;
  }
  const label = i.kind === "review" ? "Findings 5/9" : i.kind === "discussion" ? "Drafts" : "Progress";
  return `<aside class="icol ${S.icolOpen ? "open" : ""}" aria-label="${label}"><button class="icol-toggle" data-act="icol" aria-expanded="${S.icolOpen}">${S.icolOpen ? "✕" : "‹"} <span class="v">${label}</span>${i.group === "you" ? st(i.tone) : ""}</button>${s}</aside>`;
}
function itemBase(i) {
  const aux = AUX[i.kind].map((a) => `<button class="btn sm ${S.sheet === a ? "on" : "ghost"}" data-act="aux:${a}" aria-pressed="${S.sheet === a}">${a}</button>`).join("");
  const stage = i.kind === "task" ? `<span class="tag compact-stage">${STAGES[i.flow][i.stage]}${i.id === "t1" ? " · Step 3/7" : ""}</span>` : "";
  let lead = "";
  if (i.id === "t1") lead = `<div class="bar"><span class="lbl">Step 3 of 7</span><span class="trunc">Token bucket middleware</span>${st("run")}<span>Implementing</span></div>` + stepTabs();
  if (i.id === "t2") lead = `<div class="bar">${st("gh")}<span>PR #1284 · Waiting for checks · 3 of 5 passed</span></div>`;
  if (i.id === "t3") lead = `<div class="bar"><span class="lbl">Tech spec</span>${st("wait")}<span class="strong">Question from the agent</span><span class="faint">· 12m</span></div>`;
  if (i.id === "r1") lead = `<div class="bar">${st("wait")}<span class="strong">Decide findings · 5 of 9 decided</span><span class="faint">· 34m</span></div>`;
  if (i.id === "d1") lead = `<div class="bar">${st("run")}<span>Discussing</span><span class="muted">· #455, #461</span></div>`;
  const sheet = S.sheet ? `<div class="sheet" role="complementary" aria-label="${S.sheet}"><div class="aux">${auxContent(i, S.sheet, `<button class="btn ghost sm iconbtn" data-act="aux:${S.sheet}" title="Close (Esc)">✕</button>`)}</div></div>` : "";
  return `<div class="base" style="position:relative"><div class="center">
    <div class="ihdr">${ty(i.kind)}<span class="nm trunc">${i.name}</span><span class="faint mono" style="font-size:11px">${meta(i)}</span>${stage}<span class="grow"></span>
      ${ctx(i.ctx)}<button class="btn sm ghost">Pause</button><span class="sep"></span>${aux}<button class="btn sm ghost iconbtn" title="More: delete, archive">…</button></div>
    ${lead}${conversation(i)}${composer(i)}${sheet}</div>${icol(i)}</div>`;
}
function layerView(l) {
  const baseName = S.base ? D.items[S.base].name : boardOf(S.baseBoard).title;
  const back = `<button class="btn sm layer-back" data-act="close">← ${baseName} ${kbd("Esc")}</button><span class="sep"></span>`;
  const [t, id] = l.split(":");
  let v = "";
  if (t === "board") v = boardView(id, { back });
  if (t === "reviews") v = reviewsView({ back });
  if (t === "history") v = historyView({ back });
  if (t === "settings") v = settingsView({ back });
  return `<div class="layer" role="dialog" aria-label="${t}">${v}</div>`;
}
function mainView() {
  let base;
  if (S.base) base = itemBase(D.items[S.base]);
  else base = `<div style="flex:1;display:flex;flex-direction:column;min-width:0"><div class="basenote">No item open. The board is the base until you open one. <span class="grow"></span>${kbd("Ctrl J")} opens the top of the queue</div>${boardView(S.baseBoard)}</div>`;
  return base + (S.layer ? layerView(S.layer) : "");
}
function render() {
  const f = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.item : null;
  app.innerHTML = topBar() + queue() + `<main class="main">${mainView()}</main>`;
  if (f) { const el = app.querySelector(`[data-item="${f}"]`); if (el) el.focus(); }
}

// ---------- Events ----------
app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-item],[data-layer],[data-filter],[data-act],[data-go]");
  if (!t) { if (S.menu) { S.menu = null; render(); } return; }
  if (t.dataset.item) return openItem(t.dataset.item);
  if (t.dataset.go) { const [k, id] = t.dataset.go.split(":"); if (k === "item") return openItem(id); if (k === "board") return openLayer("board:" + id); return openLayer(k); }
  if (t.dataset.layer) return openLayer(t.dataset.layer);
  if (t.dataset.filter) { S.filter = t.dataset.filter; return render(); }
  const a = t.dataset.act;
  if (a === "close") return closeLayer();
  if (a === "icol") { S.icolOpen = !S.icolOpen; return render(); }
  if (a === "stub") { S.menu = null; render(); return toast("New task dialog · Ctrl+N"); }
  if (a.startsWith("menu:")) { const m = a.slice(5); S.menu = S.menu === m ? null : m; return render(); }
  if (a.startsWith("aux:")) { const k = a.slice(4); S.sheet = S.sheet === k ? null : k; return render(); }
});
addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "j") { e.preventDefault(); const n = firstJ(); if (n) openItem(n); return; }
  if (mod && e.key === ",") { e.preventDefault(); openLayer("settings"); return; }
  if (mod && e.key.toLowerCase() === "n") { e.preventDefault(); toast("New task dialog · Ctrl+N"); return; }
  if (e.key === "Escape") {
    if (S.menu) { S.menu = null; return render(); }
    if (S.sheet) { S.sheet = null; return render(); }
    if (S.icolOpen) { S.icolOpen = false; return render(); }
    if (S.layer) return closeLayer();
  }
  const ql = document.getElementById("qlist");
  if (ql && ql.contains(document.activeElement) && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const all = [...ql.querySelectorAll(".qi")], k = all.indexOf(document.activeElement);
    const n = all[Math.max(0, Math.min(all.length - 1, k + (e.key === "ArrowDown" ? 1 : -1)))]; if (n) n.focus();
  }
});
render();
mockChrome(`<h2>B · Queue by urgency</h2>
<ul>
<li><b>Left: one flat queue</b> of every active task, review and discussion, sorted by who has to move: needs you (oldest wait first) › agent working › on GitHub › idle. Thin captions mark where each group starts; each item appears once. Boards and epics become meta on the row.</li>
<li><b>Modes</b> (Implement, Review, Discuss) are filters on the queue, not places.</li>
<li><b>Ctrl+J</b> is literally the top of the queue: the order you see is the order it follows.</li>
<li><b>The item is the base layer.</b> Boards, Reviews, History and Settings open in the top bar as layers over it; Esc or "← item" drops the layer and you are back exactly where you were. Opening an item from a layer replaces the base.</li>
<li><b>Two fixed columns</b> for the item: conversation in the center, an item column on the right with progress (stages with steps nested), PR checks, findings or drafts to decide, and the item facts.</li>
<li><b>Panels</b> (Artifacts, Card, Reports, Documents): a sheet over the conversation, closed by default.</li>
<li><b>Nothing open</b>: the last board is the base.</li>
<li><b>Narrow</b>: the item column folds into a 44px strip (‹ Progress), which opens as an overlay; the stage moves into the header as a tag.</li>
</ul>${LEGEND}`);

</script>
</body>
</html>
