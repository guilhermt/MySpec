  return `<div class="doc"><h2>Defaults</h2><div class="muted" style="margin-bottom:10px">What a new task starts with.</div>
    <div class="lrow" style="padding-left:0"><span class="grow">Review mode</span><span class="btn sm">Agent ▾</span></div>
    ${["PRD", "Tech spec", "Plan", "One-Shot planning", "Implementation", "Step review", "Pull request", "PR review", "Discussion"].map((s) => `<div class="lrow" style="padding-left:0"><span class="grow">${s}</span><span class="btn sm">Opus · high ▾</span></div>`).join("")}</div>`;
}
function settingsView({ back = "", closeLabel = "" } = {}) {
  return `<section class="place" aria-label="Settings"><div class="place-hd">${back}<h1>Settings</h1><span class="grow"></span>${closeLabel}</div>
    <div style="display:flex;flex:1;min-height:0"><nav style="width:220px;border-right:1px solid var(--line);overflow:auto;padding:6px 0">${settingsNav()}</nav>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">${settingsBody()}</div></div></section>`;
}

// ---------- Mock chrome ----------
function mockChrome(notesHtml) {
  document.body.insertAdjacentHTML("beforeend", `<div class="mock mock-w" id="mockw" aria-hidden="true"></div>
    <button class="mock mock-notes-btn" id="notesbtn" aria-expanded="false">Notes</button>
    <div class="mock mock-notes" id="notes" role="dialog" aria-label="Notes about this mock">${notesHtml}</div><div class="toast" id="toast" role="status"></div>`);
  const w = document.getElementById("mockw");
  const upd = () => { const x = innerWidth; w.textContent = `${x}px · ${x < 1500 ? "narrow" : x < 1900 ? "medium" : "wide"} · mock`; };
  addEventListener("resize", upd); upd();
  const nb = document.getElementById("notesbtn"), n = document.getElementById("notes");
  nb.onclick = () => { n.classList.toggle("open"); nb.setAttribute("aria-expanded", n.classList.contains("open")); };
}
const LEGEND = `<h3>Status glyphs (grayscale stand-ins for color)</h3><table>
<tr><td>${st("error")}</td><td>error: needs you, most urgent</td></tr>
<tr><td>${st("wait")}</td><td>waiting for you (question, decision, approval)</td></tr>
<tr><td>${st("close")}</td><td>closing: ready to merge / close</td></tr>
<tr><td>${st("run")}</td><td>agent working (turn running)</td></tr>
<tr><td>${st("gh")}</td><td>waiting on GitHub (checks), not on you</td></tr>
<tr><td>${st("paused")}</td><td>paused · ${st("idle")} idle</td></tr></table>
<p style="margin:6px 0 0">Type: ${ty("task")} task · ${ty("review")} PR review · ${ty("discussion")} discussion (placeholders for icons). Every glyph has a text label next to it.</p>`;

// ---------- A · Tree + back path ----------
const S = {
  cur: document.body.dataset.initial === "empty" ? { t: "start" } : { t: "item", id: Q.get("open") || "t1" },
  back: document.body.dataset.initial === "empty" ? [] : [{ t: "item", id: "t3" }, { t: "board", id: "plat" }],
  fwd: [], aux: Q.get("aux"), collapsed: {}, last: "t1",
};
const app = document.getElementById("app");
const key = (p) => p.t + (p.id ? ":" + p.id : "");
const parse = (s) => { const [t, id] = s.split(":"); return { t, id }; };
const title = (p) => p.t === "item" ? D.items[p.id].name : p.t === "board" ? boardOf(p.id).title : p.t === "start" ? "Home" : p.t[0].toUpperCase() + p.t.slice(1);

function go(p, { replace } = {}) {
  if (key(p) === key(S.cur)) return;
  if (!replace) { S.back.push(S.cur); S.fwd = []; }
  S.cur = p; S.aux = null;
  if (p.t === "item") S.last = p.id;
  render();
}
function back() { if (!S.back.length) return; S.fwd.push(S.cur); S.cur = S.back.pop(); S.aux = null; render(); }
function fwd() { if (!S.fwd.length) return; S.back.push(S.cur); S.cur = S.fwd.pop(); S.aux = null; render(); }
function nextJ() {
  const waiting = D.order.filter((id) => D.items[id].group === "you");
  const curId = S.cur.t === "item" ? S.cur.id : null;
  const idx = waiting.indexOf(curId);
  return waiting[(idx + 1) % waiting.length] === curId ? null : waiting[(idx + 1) % waiting.length];
}

// ---------- Sidebar ----------
function itemRow(i, d) {
  const sel = S.cur.t === "item" && S.cur.id === i.id;
  const j = nextJ() === i.id;
  return `<button class="it ${sel ? "sel" : ""} ${i.group === "you" ? "you" : ""}" style="--d:${d}" data-go="item:${i.id}" ${sel ? 'aria-current="page"' : ""}
    aria-label="${i.name}, ${i.status}${i.wait ? ", waiting " + i.wait : ""}">
    <span class="l1">${ty(i.kind)}<span class="nm trunc">${i.name}</span>${rightTime(i)}</span>
    <span class="l2">${st(i.tone)}<span class="trunc">${i.status}</span>${j ? kbd("Ctrl J") : `<span class="meta">${meta(i)}</span>`}</span>
    ${i.tone === "run" ? `<span class="l3"><span class="trunc mono" style="font-size:11px">${i.activity}</span>${ctx(i.ctx)}</span>` : ""}
  </button>`;
}
function summary(items) {
  const you = items.filter((i) => i.group === "you").length, run = items.filter((i) => i.tone === "run").length;
  return `<span class="sum">${you ? st("wait") + you : ""}${run ? " " + st("run") + run : ""}</span>`;
}
function node(id, label, items, d, extra = "", go = "", cls = "") {
  const c = S.collapsed[id];
  const sel = go && key(S.cur) === go;
  return `<div class="node ${cls} ${sel ? "sel" : ""}" style="--d:${d}"><button class="chev" data-act="fold:${id}" aria-expanded="${!c}" aria-label="${c ? "Expand" : "Collapse"} ${label}">${c ? "▸" : "▾"}</button>
    ${go ? `<button class="nt trunc" data-go="${go}">${label}</button>` : `<span class="nt trunc">${label}</span>`}${c ? summary(items) : ""}${extra}</div>`;
}
function tree() {
  const t = (id) => D.items[id];
  let h = node("reviews", "Reviews", [t("r1")], 0, `<span class="muted" style="font-weight:400">4 pending</span>`, "reviews");
  if (!S.collapsed.reviews) h += itemRow(t("r1"), 1);
  h += node("plat", "Platform Roadmap", [t("t1"), t("t3"), t("d1")], 0, "", "board:plat");
  if (!S.collapsed.plat) {
    h += node("ep", "API hardening", [t("t1")], 1, "", "", "epic");
    if (!S.collapsed.ep) h += itemRow(t("t1"), 2);
    h += itemRow(t("t3"), 1) + itemRow(t("d1"), 1);
  }
  h += node("mob", "Mobile App", [t("t2")], 0, `<span title="${boardOf("mob").failure}" class="row" style="gap:4px;font-weight:400">${st("error")}<span class="muted" style="font-size:11px">Read failed</span></span>`, "board:mob");
  if (!S.collapsed.mob) h += itemRow(t("t2"), 1);
  return h;
}
function strip() {
  const tile = (i) => `<button class="tile ${S.cur.id === i.id ? "sel" : ""}" data-go="item:${i.id}" title="${i.name} · ${i.status}${i.wait ? " · " + i.wait : ""}">${ty(i.kind)}${st(i.tone)}</button>`;
  return `${tile(D.items.r1)}<hr>${["t1", "t3", "d1"].map((x) => tile(D.items[x])).join("")}<hr>${tile(D.items.t2)}`;
}
function sidebar() {
  return `<aside class="sb" aria-label="Work">
    <div class="sb-top"><span class="brand grow">MySpec</span><button class="btn sm newbtn" data-act="new" title="New task (Ctrl+N), review or discussion">+ New ▾</button>
      <button class="btn ghost iconbtn" data-act="sb" title="Collapse the sidebar" aria-label="Collapse the sidebar">${app.classList.contains("sb-collapsed") ? "»" : "«"}</button></div>
    <div class="sb-filter"><button class="btn sm" style="width:100%">All repositories ▾</button></div>
    <nav class="sb-tree" id="tree" aria-label="Active items">${tree()}</nav>
    <div class="strip">${strip()}</div>
    <div class="sb-foot"><button class="btn ghost sm" data-go="history" title="History">History <span class="cnt wide">23</span></button><span class="grow wide"></span>
      <button class="btn ghost sm iconbtn wide" title="Theme: System">◐</button><button class="btn ghost sm" data-go="settings" title="Settings (Ctrl+,)">⚙<span class="wide"> Settings</span></button></div>
  </aside>`;
}

// ---------- Main ----------
function crumbs(p) {
  const nav = `<button class="btn ghost iconbtn" data-act="back" ${S.back.length ? "" : "disabled"} title="${S.back.length ? "Back to " + title(S.back[S.back.length - 1]) + " (Alt+←)" : "Nothing to go back to"}">←</button>
    <button class="btn ghost iconbtn" data-act="fwd" ${S.fwd.length ? "" : "disabled"} title="Forward (Alt+→)">→</button>`;
  if (p.t !== "item") return nav + `<div class="crumbs"><span class="here">${title(p)}</span></div>`;
  const i = D.items[p.id];
  const trail = i.kind === "review" ? [["Reviews", "reviews"]] : [[boardOf(i.board).title, "board:" + i.board], ...(i.epic ? [[i.epic, ""]] : [])];
  return nav + `<div class="crumbs">${trail.map(([l, g]) => g ? `<button data-go="${g}">${l}</button>` : `<span>${l}</span>`).join("<span>›</span>")}<span>›</span>
    ${ty(i.kind)}<span class="here trunc">${i.name}</span><span class="faint mono" style="font-size:11px">${meta(i)}</span>${i.flow === "One-Shot" ? `<span class="tag">One-Shot</span>` : ""}</div>`;
}
function tools(i) {
  const aux = AUX[i.kind].map((a) => `<button class="btn sm ${S.aux === a ? "on" : "ghost"}" data-act="aux:${a}" aria-pressed="${S.aux === a}">${a}</button>`).join("");
  return `<div class="tools">${ctx(i.ctx)}<button class="btn sm ghost">Pause</button>
    ${i.kind === "task" ? `<button class="btn sm ghost opt">Agent review ▾</button><button class="btn sm ghost opt">Models</button>` : ""}
    <span class="sep"></span>${aux}<button class="btn sm ghost iconbtn" title="More: delete, archive">…</button></div>`;
}
function itemView(i) {
  let bars = "";
  if (i.kind === "task") bars += `<div class="trackbar">${track(i)}</div>`;
  if (i.id === "t1") bars += stepBar(i) + stepTabs();
  if (i.id === "t2") bars += prBar();
  if (i.id === "t3") bars += planningBar(i);
  if (i.id === "r1") bars += reviewBar();
  if (i.id === "d1") bars += discussionBar();
  const wideDock = innerWidth >= 1900;
  const drawer = S.aux ? `<div class="drawer ${wideDock ? "" : "overlay"}" role="complementary" aria-label="${S.aux}"><div class="aux">${auxContent(i, S.aux, `<button class="btn ghost sm iconbtn" data-act="aux:${S.aux}" title="Close (Esc)">✕</button>`)}</div></div>` : "";
  const decide = i.id === "r1" ? `<div class="decide" role="region" aria-label="Findings">${findingsPanel()}</div>` : "";
  return `<div class="hdr">${crumbs(S.cur)}${tools(i)}</div>${bars}
    <div class="body"><div class="colconvo">${conversation(i)}${composer(i)}</div>${decide}${drawer}</div>`;
}
function startView() {
  const l = D.items[S.last];
  return `<div class="hdr">${crumbs(S.cur)}</div><div class="start"><div class="start-in">
    <div><h1>Nothing open</h1><div class="muted">Pick an item on the left, or start something. What needs you is marked in the tree.</div></div>
    <div><h2>Continue</h2><button class="cont" style="width:100%" data-go="item:${l.id}">${ty(l.kind)}<span class="grow"><span class="strong">${l.name}</span><br><span class="muted">${l.status} · ${meta(l)}</span></span>${kbd("Enter")}</button></div>
    <div><h2>Start</h2><div class="acts">
      <button class="act" data-act="new"><span class="t">${ty("task")} New task</span><span class="muted">From a card or from scratch</span>${kbd("Ctrl N")}</button>
      <button class="act" data-go="reviews"><span class="t">${ty("review")} Review a pull request</span><span class="muted">4 pending in 3 repositories</span></button>
      <button class="act" data-go="board:plat"><span class="t">${ty("discussion")} New discussion</span><span class="muted">From cards of a board</span></button></div></div>
    <div class="boards"><h2>Boards</h2>
      <button class="lrow" style="width:100%" data-go="board:plat"><span class="grow strong">Platform Roadmap</span><span class="muted">23 open cards · acme/api, acme/web · read 2m ago</span></button>
      <button class="lrow" style="width:100%" data-go="board:mob"><span class="grow strong">Mobile App</span><span class="row">${st("error")}<span class="muted">Read failed 18m ago · acme/ios</span></span></button></div>
    <div class="keys"><span>${kbd("Ctrl J")} next item that needs you</span><span>${kbd("Alt ←")} back</span><span>${kbd("Ctrl ,")} settings</span><span>${kbd("↑↓")} in the tree</span></div>
  </div></div>`;
}
function mainView() {
  const p = S.cur;
  if (p.t === "item") return itemView(D.items[p.id]);
  if (p.t === "start") return startView();
  const hdr = `<div class="hdr">${crumbs(p)}${p.t === "settings" ? `<div class="tools"><button class="btn sm" data-act="back">Close ${kbd("Esc")}</button></div>` : ""}</div>`;
  let body = "";
  if (p.t === "board") body = boardView(p.id).replace(/<div class="place-hd">[\s\S]*?<h1>[^<]*<\/h1>/, '<div class="place-hd">');
  if (p.t === "reviews") body = reviewsView().replace(/<h1>Reviews<\/h1>/, "");
  if (p.t === "history") body = historyView().replace(/<h1>History<\/h1>/, "");
  if (p.t === "settings") body = settingsView().replace(/<div class="place-hd">[\s\S]*?<\/div>/, "");
  return hdr + `<div class="body" style="flex-direction:column">${body}</div>`;
}
function render() {
  const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.go : null;
  app.innerHTML = sidebar() + `<main class="main" id="main">${mainView()}</main>`;
  if (focusKey) { const el = app.querySelector(`[data-go="${focusKey}"]`); if (el) el.focus(); }
}

// ---------- Events ----------
app.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]"), a = e.target.closest("[data-act]");
  if (a) {
    const v = a.dataset.act;
    if (v === "back") return back();
    if (v === "fwd") return fwd();
    if (v === "sb") { app.classList.toggle("sb-collapsed"); return render(); }
    if (v === "new") return toast("New task dialog · Ctrl+N (also Start review, New discussion)");
    if (v.startsWith("fold:")) { const k = v.slice(5); S.collapsed[k] = !S.collapsed[k]; return render(); }
    if (v.startsWith("aux:")) { const k = v.slice(4); S.aux = S.aux === k ? null : k; return render(); }
  }
  if (g) {
    if (g.dataset.go === "settings" && S.cur.t === "settings") return back();
    go(parse(g.dataset.go));
  }
});
addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "j") { e.preventDefault(); const n = nextJ(); if (n) go({ t: "item", id: n }); return; }
  if (mod && e.key === ",") { e.preventDefault(); S.cur.t === "settings" ? back() : go({ t: "settings" }); return; }
  if (mod && e.key.toLowerCase() === "n") { e.preventDefault(); toast("New task dialog · Ctrl+N"); return; }
  if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); back(); return; }
  if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); fwd(); return; }
  if (e.key === "Escape") { if (S.aux) { S.aux = null; render(); } else if (S.cur.t === "settings") back(); return; }
  if (e.key === "Enter" && S.cur.t === "start" && document.activeElement === document.body) { go({ t: "item", id: S.last }); return; }
  const tr = document.getElementById("tree");
  if (tr && tr.contains(document.activeElement) && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const all = [...tr.querySelectorAll("button.it, .node button.nt")];
    const k = all.indexOf(document.activeElement);
    const n = all[Math.max(0, Math.min(all.length - 1, k + (e.key === "ArrowDown" ? 1 : -1)))];
    if (n) n.focus();
  }
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 80); });
render();
mockChrome(`<h2>A · Tree and back path</h2>
<ul>
<li><b>Sidebar</b>: one tree. Reviews first, then one node per board, with epics inside. Each row: type, name, the time on the right (bold = waiting for you, plain = agent turn), status line with stage/step, and a third line only while the agent runs (current action + context).</li>
<li>A collapsed node keeps a summary (${st("wait")} count, ${st("run")} count), so folding never hides what needs you.</li>
<li><b>Ctrl+J</b> lives on the row it would open next (the ${kbd("Ctrl J")} mark replaces the row's meta). It cycles through what needs you, in urgency order.</li>
<li><b>Back path</b>: ← → in the header and Alt+← / Alt+→. Breadcrumb goes up to the board or to Reviews. Settings is a place like any other: Close (Esc) goes back to where you were.</li>
<li><b>Panels</b> (Artifacts, Card, Reports, Documents): closed by default, one toggle each in the header, Esc closes. At ≥1900px they dock as a column; below, they overlay the conversation.</li>
<li><b>Findings / drafts</b>: a column docked next to the conversation while there is something to decide.</li>
<li><b>Narrow</b>: the sidebar can fold to a strip of type+status tiles («). Row meta and secondary header tools drop first.</li>
<li>Try: click rows, the breadcrumb, ← →, Ctrl+J, Ctrl+, then Esc, the panel toggles, «.</li>
</ul>${LEGEND}`);

</script>
</body>
