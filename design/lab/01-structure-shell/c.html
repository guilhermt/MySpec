<title>C · Three modes</title>
<style>
/* Wireframe base: grayscale, system font, no final typography. */
:root {
  --bg: #f5f5f5;
  --surface: #ffffff;
  --sunken: #eeeeee;
  --hover: #e8e8e8;
  --selected: #dedede;
  --line: #dcdcdc;
  --line-2: #c4c4c4;
  --ink: #121212;
  --ink-2: #3a3a3a;
  --ink-3: #6b6b6b;
  --ink-4: #9b9b9b;
  --strong: #161616;
  --fs-xs: 11px;
  --fs-s: 12px;
  --fs-m: 13px;
  --fs-l: 15px;
  --fs-xl: 19px;
  --r: 4px;
  --measure: 820px;
  --mock: #7a5;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.strong { font-weight: 650; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 6px 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
kbd {
  font: 10px/1 ui-monospace, monospace; color: var(--ink-3);
  border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px;
  padding: 2px 4px; background: var(--surface); white-space: nowrap;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px;
  border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface);
  font-size: var(--fs-s); white-space: nowrap; color: var(--ink-2);
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--strong); color: #fff; border-color: var(--strong); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.on { background: var(--selected); border-color: var(--line-2); color: var(--ink); }
.btn.sm { height: 22px; padding: 0 7px; font-size: var(--fs-xs); }
.iconbtn { width: 26px; justify-content: center; padding: 0; }

/* Status glyphs: shape + label, never color alone. */
.st { display: inline-block; width: 9px; height: 9px; flex: none; border-radius: 50%; }
.st.error { border-radius: 1px; background: var(--strong); transform: rotate(45deg) scale(.9); }
.st.wait { background: var(--strong); }
.st.close { border: 2px solid var(--strong); }
.st.run { border: 2px solid var(--ink-2); background: conic-gradient(var(--ink-2) 0 25%, transparent 0); animation: spin 1.4s linear infinite; }
.st.gh { border: 1.5px dashed var(--ink-3); }
.st.idle { border: 1.5px solid var(--ink-4); }
.st.paused { border-radius: 0; width: 8px; background: linear-gradient(90deg, var(--ink-3) 0 35%, transparent 35% 65%, var(--ink-3) 65%); }
.st.done { border-radius: 0; width: 9px; height: 5px; border-left: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg) translate(1px, -1px); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Type glyph: placeholder for the type icon. */
.ty {
  display: inline-grid; place-items: center; flex: none; width: 17px; height: 17px;
  border: 1px solid var(--ink-3); border-radius: 3px; font-size: 9px; font-weight: 700; color: var(--ink-2);
  letter-spacing: -.02em;
}
.ty.review { border-radius: 50%; }
.ty.discussion { border-style: dashed; }

/* Context meter, compact */
.ctx { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
.ctx i { display: inline-block; width: 22px; height: 5px; border: 1px solid var(--ink-4); border-radius: 2px; position: relative; overflow: hidden; }
.ctx i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--ink-3); }

/* Stage track */
.track { display: flex; align-items: center; gap: 2px; font-size: var(--fs-s); color: var(--ink-3); min-width: 0; overflow: hidden; }
.track .stg { padding: 2px 7px; border-radius: 3px; white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
.track .stg.done { color: var(--ink-2); }
.track .stg.done::before { content: "✓"; font-size: 10px; }
.track .stg.cur { background: var(--selected); color: var(--ink); font-weight: 650; }
.track .gt { color: var(--ink-4); font-size: 10px; }
.vtrack { list-style: none; margin: 0; padding: 0; font-size: var(--fs-s); }
.vtrack li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; color: var(--ink-3); }
.vtrack li.done { color: var(--ink-2); }
.vtrack li.cur { color: var(--ink); font-weight: 650; }
.vtrack .mk { width: 12px; flex: none; text-align: center; font-size: 10px; }
.vtrack .steps { list-style: none; margin: 2px 0 4px 20px; padding: 0; font-weight: 400; }
.vtrack .steps li { padding: 2px 0; }

/* Bars attached to an item */
.bar {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0;
}
.bar .lbl { font-weight: 650; white-space: nowrap; }
.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.tabs .tab { display: inline-flex; gap: 6px; align-items: center; padding: 8px 10px 7px; border-bottom: 2px solid transparent; color: var(--ink-3); font-size: var(--fs-s); }
.tabs .tab.on { border-bottom-color: var(--ink); color: var(--ink); font-weight: 650; }

/* Conversation */
.convo { flex: 1 1 auto; overflow: auto; min-height: 0; }
.convo-in { max-width: var(--measure); margin: 0 auto; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.e-marker { display: flex; align-items: center; gap: 10px; font-size: var(--fs-xs); color: var(--ink-3); text-transform: none; }
.e-marker::before, .e-marker::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.e-user { align-self: flex-end; max-width: 78%; background: var(--sunken); border-radius: 8px; padding: 8px 12px; }
.e-app { border-left: 2px solid var(--line-2); padding: 2px 0 2px 12px; color: var(--ink-2); }
.e-app .who, .e-agent .who { font-size: var(--fs-xs); color: var(--ink-3); margin-bottom: 2px; }
.e-agent p { margin: 0 0 6px; }
.e-agent code, .e-app code, .finding code { font-family: ui-monospace, monospace; font-size: 12px; background: var(--sunken); padding: 0 3px; border-radius: 2px; }
.e-actions { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: var(--fs-s); }
.e-actions summary { display: flex; gap: 8px; align-items: center; padding: 6px 10px; cursor: pointer; list-style: none; color: var(--ink-2); }
.e-actions summary::-webkit-details-marker { display: none; }
.e-actions ul { list-style: none; margin: 0; padding: 4px 10px 8px 28px; border-top: 1px solid var(--line); }
.e-actions li { display: flex; gap: 8px; padding: 2px 0; color: var(--ink-2); }
.e-actions li .k { width: 44px; color: var(--ink-3); flex: none; }
.e-activity { display: flex; gap: 8px; align-items: center; font-size: var(--fs-s); color: var(--ink-2); }
.e-status { border: 1px dashed var(--line-2); border-radius: 6px; padding: 10px 12px; font-size: var(--fs-s); }
.card-q { border: 2px solid var(--strong); border-radius: 8px; background: var(--surface); padding: 12px 14px; }
.card-q .hd { display: flex; gap: 8px; align-items: center; font-size: var(--fs-xs); color: var(--ink-2); margin-bottom: 6px; }
.card-q .q { font-weight: 650; font-size: var(--fs-l); margin-bottom: 8px; }
.card-q .opt { display: flex; gap: 10px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 5px; margin-top: 6px; }
.card-q .opt:hover { background: var(--hover); }
.card-q .opt .n { font: 11px ui-monospace, monospace; border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; height: 17px; }
.card-q .opt small { display: block; color: var(--ink-3); }

/* Composer */
.composer { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 24px 12px; }
.composer-in { max-width: var(--measure); margin: 0 auto; }
.composer .box { border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; min-height: 58px; color: var(--ink-4); display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
.composer .box .row { color: var(--ink-3); font-size: var(--fs-xs); }

/* Findings and drafts */
.finding { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); font-size: var(--fs-s); }
.finding .loc { color: var(--ink-3); font: 11px ui-monospace, monospace; }
.finding.undecided { border-color: var(--ink-2); }
.finding.decided { color: var(--ink-3); }
.finding .dec { display: flex; gap: 6px; margin-top: 6px; }
.progress { height: 4px; background: var(--sunken); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink-2); width: var(--p); }

/* Places: lists */
.place { display: flex; flex-direction: column; min-height: 0; height: 100%; background: var(--surface); }
.place-hd { display: flex; align-items: center; gap: 10px; padding: 0 20px; height: 48px; border-bottom: 1px solid var(--line); flex: none; }
.place-hd h1 { font-size: var(--fs-l); margin: 0; }
.filters { display: flex; gap: 6px; padding: 8px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 12px; font-size: var(--fs-xs); color: var(--ink-2); background: var(--surface); }
.chip.on { background: var(--selected); color: var(--ink); }
.place-body { overflow: auto; flex: 1; min-height: 0; }
.sec-hd { display: flex; gap: 8px; align-items: center; padding: 10px 20px 4px; font-size: var(--fs-xs); color: var(--ink-3); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 7px 20px; border-bottom: 1px solid var(--sunken); min-width: 0; }
.lrow:hover { background: var(--hover); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 5px; height: 18px; color: var(--ink-2); white-space: nowrap; }
.tag.strong { border-color: var(--strong); color: var(--ink); font-weight: 650; }
.notice { margin: 10px 20px 0; border: 1px dashed var(--ink-3); border-radius: 5px; padding: 7px 10px; font-size: var(--fs-s); display: flex; gap: 8px; align-items: center; }

/* Skeleton text for documents */
.doc { padding: 16px 20px; overflow: auto; flex: 1; min-height: 0; }
.doc h2 { font-size: var(--fs-l); margin: 0 0 8px; }
.doc h3 { font-size: var(--fs-m); margin: 14px 0 6px; }
.ln { height: 8px; background: var(--sunken); border-radius: 2px; margin: 7px 0; }

/* Aux panel */
.aux { display: flex; flex-direction: column; background: var(--surface); min-height: 0; height: 100%; }
.aux-hd { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 14px; height: 44px; border-bottom: 1px solid var(--line); flex: none; }

/* Mock-only chrome: dashed, clearly not part of the UI */
.mock { position: fixed; z-index: 90; font: 11px/1.3 ui-monospace, monospace; color: #333; background: #fffef4; border: 1px dashed #888; border-radius: 4px; }
.mock-w { left: 50%; transform: translateX(-50%); bottom: 4px; padding: 4px 7px; pointer-events: none; }
.mock-notes-btn { right: 8px; bottom: 8px; padding: 4px 8px; cursor: pointer; }
.mock-notes { right: 8px; bottom: 36px; width: min(520px, calc(100vw - 16px)); max-height: 70vh; overflow: auto; padding: 12px 14px; font: 12px/1.5 system-ui, sans-serif; display: none; }
.mock-notes.open { display: block; }
.mock-notes h2 { font-size: 13px; margin: 0 0 6px; }
.mock-notes h3 { font-size: 12px; margin: 10px 0 4px; }
.mock-notes ul { margin: 0; padding-left: 16px; }
.mock-notes table { border-collapse: collapse; }
.mock-notes td { padding: 1px 8px 1px 0; vertical-align: top; }
.toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 95; background: var(--strong); color: #fff; padding: 6px 12px; border-radius: 4px; font-size: var(--fs-s); display: none; }
.toast.show { display: block; }

/* C · Three modes: rail + context panel */
.app { display: grid; grid-template-columns: 76px var(--pn) minmax(0, 1fr); height: 100vh; --pn: clamp(280px, 16vw, 360px); position: relative; }
.app.no-panel { --pn: 0px; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; background: var(--sunken); border-right: 1px solid var(--line); min-height: 0; overflow: auto; }
.rail .brand { font-weight: 800; font-size: 12px; margin: 4px 0 10px; }
.mode { position: relative; width: 64px; padding: 7px 0 6px; border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-2); font-size: 10.5px; }
.mode:hover { background: var(--hover); }
.mode.on { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: inset 3px 0 0 var(--ink); }
.mode .mk { width: 26px; height: 22px; border: 1.5px solid currentColor; border-radius: 5px; display: grid; place-items: center; font-weight: 700; font-size: 11px; }
.mode .badge { position: absolute; top: 3px; right: 6px; display: inline-flex; align-items: center; gap: 2px; font-size: 10px; font-weight: 700; background: var(--sunken); padding: 0 2px; border-radius: 3px; }
.mode.on .badge { background: var(--surface); }
.tiles { display: none; flex-direction: column; align-items: center; gap: 2px; margin: 2px 0 6px; }
.app.no-panel .tiles { display: flex; }
.tile { position: relative; width: 44px; height: 26px; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 650; color: var(--ink-2); border: 1px solid var(--line-2); background: var(--surface); }
.tile.sel { border-color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.tile .st { position: absolute; right: -3px; top: -3px; box-shadow: 0 0 0 2px var(--sunken); }
.rail .foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rail .foot button { width: 64px; padding: 5px 0; border-radius: 5px; font-size: 10.5px; text-align: center; color: var(--ink-2); }
.rail .foot button:hover, .rail .foot button.on { background: var(--surface); }

.panel { display: flex; flex-direction: column; background: var(--bg); border-right: 1px solid var(--line); min-height: 0; overflow: hidden; }
.app.no-panel .panel { display: none; }
.app.panel-over .panel { display: flex; position: absolute; left: 76px; top: 0; bottom: 0; width: 320px; z-index: 20; box-shadow: 10px 0 28px rgba(0,0,0,.16); }
.p-hd { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 10px 0 14px; flex: none; }
.p-hd h2 { font-size: var(--fs-l); margin: 0; flex: 1; }
.p-body { flex: 1; overflow: auto; padding: 0 6px 12px; }
.p-sec { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 650; text-transform: uppercase; letter-spacing: .05em; padding: 12px 8px 4px; display: flex; gap: 6px; }
.node { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 calc(6px + var(--d, 0) * 14px); font-size: var(--fs-s); font-weight: 650; color: var(--ink-2); border-radius: 4px; }
.node:hover { background: var(--hover); }
.node.epic { font-weight: 500; color: var(--ink-3); }
.it { display: grid; gap: 1px; width: 100%; padding: 6px 8px 6px calc(10px + var(--d, 0) * 14px); border-radius: 5px; margin: 1px 0; }
.it:hover { background: var(--hover); }
.it.sel { background: var(--selected); }
.it .l1, .it .l2, .it .l3 { display: flex; align-items: center; gap: 7px; min-width: 0; }
.it .l1 .nm { flex: 1; }
.it.you .l1 .nm { font-weight: 650; }
.it .l2 { font-size: var(--fs-s); padding-left: 24px; }
.it .l2 .meta { margin-left: auto; color: var(--ink-4); font-size: var(--fs-xs); white-space: nowrap; }
.it .l3 { font-size: var(--fs-xs); color: var(--ink-3); padding-left: 24px; }
.it .l3 .trunc { flex: 1; }
.pr { display: grid; width: 100%; padding: 5px 8px 5px 10px; border-radius: 5px; font-size: var(--fs-s); }
.pr:hover { background: var(--hover); }

.main { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); position: relative; }
.rail { grid-column: 1; grid-row: 1; }
.panel { grid-column: 2; grid-row: 1; }
.chdr { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.chdr .nm { font-size: var(--fs-l); font-weight: 650; }
.stagechip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 13px; font-size: var(--fs-s); white-space: nowrap; }
.stagechip:hover { background: var(--hover); }
.subbar { display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px; border-bottom: 1px solid var(--line); min-height: 38px; flex: none; }
.subbar .tabs { border: 0; padding: 0; }
.decbar { border-top: 1px solid var(--line); background: var(--bg); flex: none; }
.decbar-in { max-width: var(--measure); margin: 0 auto; padding: 8px 24px; display: flex; align-items: center; gap: 10px; }
.e-findings { display: flex; flex-direction: column; gap: 6px; border-left: 2px solid var(--ink); padding-left: 12px; }
.over { position: absolute; right: 0; top: 48px; bottom: 0; width: clamp(420px, 30vw, 620px); background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: -10px 0 28px rgba(0,0,0,.14); z-index: 8; }
.home { overflow: auto; flex: 1; }
.home-in { max-width: 760px; margin: 0 auto; padding: 48px 24px; display: flex; flex-direction: column; gap: 22px; }
.home h1 { font-size: var(--fs-xl); margin: 0; }
.home h2 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 0 0 8px; }
.bigact { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; width: 100%; }
.bigact:hover { background: var(--hover); }
@media (max-width: 1499px) {
  .chdr .opt { display: none; }
}

</style>

  return ["Defaults", "Boards", "Repositories"].map((p) => `<button class="lrow ${p === cur ? "strong" : ""}" style="border:0;${p === cur ? "background:var(--selected)" : ""}">${p}</button>`).join("") +
    `<div class="sec-hd">Prompts</div>` + ["PRD", "Tech spec", "Plan", "One-Shot planning", "Step review", "Commit", "Pull request", "PR review", "Discussion"].map((p) => `<button class="lrow" style="border:0;padding-top:4px;padding-bottom:4px">${p}</button>`).join("");
}
function settingsBody() {
  return `<div class="doc"><h2>Defaults</h2><div class="muted" style="margin-bottom:10px">What a new task starts with.</div>
    <div class="lrow" style="padding-left:0"><span class="grow">Review mode</span><span class="btn sm">Agent ▾</span></div>
    ${["PRD", "Tech spec", "Plan", "One-Shot planning", "Implementation", "Step review", "Pull request", "PR review", "Discussion"].map((s) => `<div class="lrow" style="padding-left:0"><span class="grow">${s}</span><span class="btn sm">Opus · high ▾</span></div>`).join("")}</div>`;
}
function settingsView({ back = "", closeLabel = "" } = {}) {
  return `<section class="place" aria-label="Settings"><div class="place-hd">${back}<h1>Settings</h1><span class="grow"></span>${closeLabel}</div>
    <div style="display:flex;flex:1;min-height:0"><nav style="width:220px;border-right:1px solid var(--line);overflow:auto;padding:6px 0">${settingsNav()}</nav>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">${settingsBody()}</div></div></section>`;
}

// ---------- Mock chrome ----------
function mockChrome(notesHtml) {
  document.body.insertAdjacentHTML("beforeend", `<div class="mock mock-w" id="mockw" aria-hidden="true"></div>
    <button class="mock mock-notes-btn" id="notesbtn" aria-expanded="false">Notes</button>
    <div class="mock mock-notes" id="notes" role="dialog" aria-label="Notes about this mock">${notesHtml}</div><div class="toast" id="toast" role="status"></div>`);
  const w = document.getElementById("mockw");
  const upd = () => { const x = innerWidth; w.textContent = `${x}px · ${x < 1500 ? "narrow" : x < 1900 ? "medium" : "wide"} · mock`; };
  addEventListener("resize", upd); upd();
  const nb = document.getElementById("notesbtn"), n = document.getElementById("notes");
  nb.onclick = () => { n.classList.toggle("open"); nb.setAttribute("aria-expanded", n.classList.contains("open")); };
}
const LEGEND = `<h3>Status glyphs (grayscale stand-ins for color)</h3><table>
<tr><td>${st("error")}</td><td>error: needs you, most urgent</td></tr>
<tr><td>${st("wait")}</td><td>waiting for you (question, decision, approval)</td></tr>
<tr><td>${st("close")}</td><td>closing: ready to merge / close</td></tr>
<tr><td>${st("run")}</td><td>agent working (turn running)</td></tr>
<tr><td>${st("gh")}</td><td>waiting on GitHub (checks), not on you</td></tr>
<tr><td>${st("paused")}</td><td>paused · ${st("idle")} idle</td></tr></table>
<p style="margin:6px 0 0">Type: ${ty("task")} task · ${ty("review")} PR review · ${ty("discussion")} discussion (placeholders for icons). Every glyph has a text label next to it.</p>`;

// ---------- C · Three modes: rail + context panel ----------
const EMPTY = document.body.dataset.initial === "empty";
const MODES = [
  ["discuss", "Discuss", "D", ["d1"]],
  ["implement", "Implement", "I", ["t1", "t3", "t2"]],
  ["review", "Review", "R", ["r1"]],
];
const open0 = Q.get("open");
const S = {
  mode: open0 ? D.items[open0].mode : (Q.get("mode") || "implement"),
  place: EMPTY ? { discuss: null, implement: null, review: null } : { discuss: "item:d1", implement: "item:t3", review: "item:r1" },
  special: Q.get("special"), // null | "history" | "settings"
  over: Q.get("aux"), panelWide: true, panelOver: false,
};
if (!EMPTY) S.place[S.mode] = "item:" + (open0 || "t1");
const app = document.getElementById("app");
const ABBR = { t1: "RL", t3: "RW", t2: "OS", r1: "2291", d1: "UP" };
const narrow = () => innerWidth < 1500;

function setMode(m) {
  if (S.special) { S.special = null; S.mode = m; }
  else if (S.mode === m) { if (narrow()) S.panelOver = !S.panelOver; else S.place[m] = null; }
  else { S.mode = m; S.panelOver = false; }
  S.over = null; render();
}
function openItem(id) { const m = D.items[id].mode; S.mode = m; S.place[m] = "item:" + id; S.special = null; S.over = null; S.panelOver = false; render(); }
function openPlace(p) { S.place[S.mode] = p; S.special = null; S.over = null; S.panelOver = false; render(); }
function nextJ() {
  const cur = !S.special && S.place[S.mode] && S.place[S.mode].startsWith("item:") ? S.place[S.mode].slice(5) : null;
  const w = D.order.filter((id) => D.items[id].group === "you"); const k = w.indexOf(cur);
  const n = w[(k + 1) % w.length]; return n === cur ? null : n;
}

// ---------- Rail ----------
function badge(ids) {
  const items = ids.map((x) => D.items[x]);
  const you = items.filter((i) => i.group === "you").length, run = items.some((i) => i.tone === "run");
  if (you) return `<span class="badge" title="${you} need you">${st("wait")}${you}</span>`;
  if (run) return `<span class="badge" title="Agent working">${st("run")}</span>`;
  return "";
}
function rail() {
  const cur = !S.special && S.place[S.mode] ? S.place[S.mode].slice(5) : null;
  return `<nav class="rail" aria-label="Modes"><span class="brand">MySpec</span>
    ${MODES.map(([k, l, g, ids]) => `<button class="mode ${S.mode === k && !S.special ? "on" : ""}" data-mode="${k}" aria-current="${S.mode === k && !S.special}" title="${l}${k === "review" ? " · 4 pending pull requests" : ""}">
      <span class="mk">${g}</span>${l}${badge(ids)}</button>
      <div class="tiles">${ids.map((x) => `<button class="tile ${cur === x ? "sel" : ""}" data-item="${x}" title="${D.items[x].name} · ${D.items[x].status}${D.items[x].wait ? " · " + D.items[x].wait : ""}">${ABBR[x]}${st(D.items[x].tone)}</button>`).join("")}</div>`).join("")}
    <div class="foot"><button data-special="history" class="${S.special === "history" ? "on" : ""}">History</button><button data-special="settings" class="${S.special === "settings" ? "on" : ""}" title="Settings (Ctrl+,)">Settings</button>
      <button title="Theme: System">Theme</button><button data-act="panel" title="${narrow() ? "Show the panel" : "Hide the panel"}">${narrow() || !S.panelWide ? "»" : "«"}</button></div></nav>`;
}

// ---------- Panel ----------
function row(i, d = 0) {
  const sel = !S.special && S.place[i.mode] === "item:" + i.id;
  return `<button class="it ${sel ? "sel" : ""} ${i.group === "you" ? "you" : ""}" style="--d:${d}" data-item="${i.id}">
    <span class="l1">${ty(i.kind)}<span class="nm trunc">${i.name}</span>${rightTime(i)}</span>
    <span class="l2">${st(i.tone)}<span class="trunc">${i.status}</span><span class="meta">${meta(i)}</span></span>
    ${i.tone === "run" ? `<span class="l3"><span class="trunc mono" style="font-size:11px">${i.activity}</span>${ctx(i.ctx)}</span>` : ""}</button>`;
}
function boardRows(primary) {
  return D.boards.map((b) => `<button class="pr" data-place="board:${b.id}"><span class="row"><span class="grow strong">${b.title}</span>${b.failure ? st("error") + `<span class="muted" style="font-size:11px">Read failed</span>` : `<span class="muted" style="font-size:11px">${b.open} open</span>`}</span><span class="muted" style="font-size:11px">${b.repos.map((r) => "acme/" + r).join(", ")}</span></button>`).join("");
}
function panel() {
  if (S.special === "settings") return `<aside class="panel"><div class="p-hd"><h2>Settings</h2><button class="btn sm" data-act="close">Close ${kbd("Esc")}</button></div><div class="p-body">${settingsNav()}</div></aside>`;
  if (S.special === "history") return `<aside class="panel"><div class="p-hd"><h2>History</h2><span class="muted">23</span></div><div class="p-body"><div class="chip" style="margin:0 8px 8px">Search…</div>
    ${[["task", "API key scopes", "Sep 22"], ["review", "web#2280 Fix flaky checkout test", "Sep 22"], ["discussion", "Audit trail for admin actions", "Sep 20"], ["task", "Share sheet redesign", "Sep 19"], ["task", "Invoice PDF footer", "Sep 18"]].map(([k, t, d]) => `<button class="pr"><span class="row">${ty(k)}<span class="trunc grow">${t}</span><span class="faint">${d}</span></span></button>`).join("")}</div></aside>`;
  const t = (x) => D.items[x];
  let h = "";
  if (S.mode === "implement") {
    h = `<div class="p-hd"><h2>Implement</h2><button class="btn sm" data-act="new">+ Task ${kbd("Ctrl N")}</button></div>
      <div style="padding:0 12px 6px"><button class="btn sm" style="width:100%">All repositories ▾</button></div><div class="p-body">
      <div class="node"><span class="grow">Platform Roadmap</span></div><div class="node epic" style="--d:1">▾ API hardening</div>${row(t("t1"), 2)}${row(t("t3"), 1)}
      <div class="node"><span class="grow">Mobile App</span>${st("error")}<span class="muted" style="font-weight:400;font-size:11px">Read failed</span></div>${row(t("t2"), 1)}
      <div class="p-sec">Start from a card</div>${boardRows("task")}</div>`;
  } else if (S.mode === "review") {
    h = `<div class="p-hd"><h2>Review</h2><button class="btn sm ghost" data-place="reviews">All PRs</button></div><div class="p-body">
      <div class="p-sec">In review</div>${row(t("r1"))}
      <div class="p-sec">Pending · 4 <span class="grow"></span><span style="text-transform:none;font-weight:400">read 1m ago</span></div>
      ${[["Add dark mode tokens to email templates", "web#2297 · rferraz"], ["Crash on share sheet when offline", "ios#312 · mkato · #90"], ["Bump pgx to v5.6", "api#1033 · dependabot"], ["Onboarding checklist v2", "web#2301 · lnakamura · New commits"]].map(([a, b]) => `<button class="pr" data-place="reviews"><span class="trunc">${a}</span><span class="muted" style="font-size:11px">${b}</span></button>`).join("")}
      <div class="p-sec">Yours</div><button class="pr" data-item="t2"><span class="trunc">Offline sync for drafts</span><span class="muted" style="font-size:11px">ios#1284 · task · Waiting for checks</span></button></div>`;
  } else {
    h = `<div class="p-hd"><h2>Discuss</h2><button class="btn sm" data-place="board:plat">+ Discussion</button></div><div class="p-body">
      <div class="p-sec">Active</div>${row(t("d1"))}
      <div class="p-sec">Pick cards on a board</div>${boardRows("discuss")}</div>`;
  }
  return `<aside class="panel" aria-label="${S.mode}">${h}</aside>`;
}

// ---------- Main ----------
function itemView(i) {
  const overs = (i.kind === "task" ? ["Steps", ...AUX.task] : AUX[i.kind]).map((a) => `<button class="btn sm ${S.over === a ? "on" : "ghost"} ${a === "Card" ? "opt" : ""}" data-act="over:${a}" aria-pressed="${S.over === a}">${a}</button>`).join("");
  let chip = "";
  if (i.id === "t1") chip = `<button class="stagechip" data-act="over:Steps" title="Stages and steps">Implementation · Step 3 of 7 ▾</button>`;
  if (i.id === "t2") chip = `<button class="stagechip" data-act="over:Steps">PR #1284 · ${st("gh")} Checks 3 of 5 ▾</button>`;
  if (i.id === "t3") chip = `<button class="stagechip" data-act="over:Steps">Tech spec · ${st("wait")} <b>Question · 12m</b> ▾</button>`;
  if (i.id === "r1") chip = `<span class="stagechip">${st("wait")} <b>Decide findings · 34m</b></span>`;
  if (i.id === "d1") chip = `<span class="stagechip">${st("run")} Discussing</span>`;
  let sub = "";
  if (i.id === "t1") sub = `<div class="subbar">${stepTabs().replace('class="tabs"', 'class="tabs" style="border:0;padding:0"')}<span class="grow"></span><span class="muted trunc">Token bucket middleware · Agent review</span><button class="btn sm">Review myself</button><button class="btn sm opt">Open in VS Code</button><button class="btn sm ghost iconbtn" title="Discard step…">…</button></div>`;
  if (i.id === "t2") sub = `<div class="subbar"><span class="muted" style="padding-left:8px">Waiting for the checks · the review of the PR starts when they finish</span><span class="grow"></span><button class="btn sm">Open PR</button><button class="btn sm opt">Open in VS Code</button></div>`;
  const conv = i.id === "r1" ? conversation(i, { inlineFindings: `<div class="row"><span class="strong">Review 1 · 9 findings</span><span class="grow"></span><span class="muted">decide here, in the conversation</span></div>${findingsList()}` }) : conversation(i);
  const dec = i.id === "r1" ? `<div class="decbar"><div class="decbar-in">${st("wait")}<span class="strong">4 findings to decide</span><div class="progress grow" style="--p:55%"><i></i></div><span class="muted">5 of 9</span><button class="btn sm">Next ${kbd("N")}</button><button class="btn sm primary" disabled>Publish review</button></div></div>` : "";
  let overlay = "";
  if (S.over) {
    const close = `<button class="btn ghost sm iconbtn" data-act="over:${S.over}" title="Close (Esc)">✕</button>`;
    overlay = `<div class="over" role="complementary" aria-label="${S.over}"><div class="aux">${S.over === "Steps"
      ? `<div class="aux-hd"><span class="strong grow">Stages and steps</span><span class="muted">${i.flow} · ${i.reviewMode} review</span>${close}</div><div class="doc">${vtrack(i)}<h3>Models</h3><div class="muted">${i.model} · per stage ▾</div><h3>Actions</h3><div class="row" style="flex-wrap:wrap"><button class="btn sm ghost">Back to a stage…</button><button class="btn sm ghost">Review mode: Agent ▾</button></div></div>`
      : auxContent(i, S.over, close)}</div></div>`;
  }
  return `<div class="chdr">${ty(i.kind)}<span class="nm trunc">${i.name}</span><span class="faint mono" style="font-size:11px">${meta(i)}</span>${chip}<span class="grow"></span>
    ${ctx(i.ctx)}<button class="btn sm ghost">Pause</button><span class="sep"></span>${overs}<button class="btn sm ghost iconbtn" title="More: delete, archive">…</button></div>
    ${sub}${conv}${dec}${composer(i)}${overlay}`;
}
function modeHome() {
  if (S.mode === "review") return reviewsView();
  const m = S.mode === "implement";
  return `<div class="home"><div class="home-in"><div><h1>${m ? "Implement" : "Discuss"}</h1><div class="muted">${m ? "Nothing open. Your tasks are in the panel; start a new one here." : "Nothing open. Pick cards on a board to start a discussion."}</div></div>
    <div><h2>Start</h2>${m ? `<button class="bigact" data-act="new">${ty("task")}<span class="grow"><span class="strong">New task</span><br><span class="muted">From scratch, in one of 3 repositories</span></span>${kbd("Ctrl N")}</button>` : ""}</div>
    <div><h2>${m ? "Start from a card" : "Boards"}</h2>${D.boards.map((b) => `<button class="lrow" style="width:100%;padding-left:0" data-place="board:${b.id}"><span class="grow strong">${b.title}</span><span class="muted">${b.failure ? "Read failed 18m ago" : b.open + " open cards · read " + b.readAt}</span></button>`).join("")}</div>
    <div class="row muted" style="gap:18px;flex-wrap:wrap;font-size:12px"><span>${kbd("Ctrl J")} next item that needs you, in any mode</span><span>Click a mode again for its home</span></div></div></div>`;
}
function mainView() {
  if (S.special === "settings") return `<div class="chdr"><span class="nm">Defaults</span><span class="grow"></span><span class="muted">Esc returns to ${MODES.find((m) => m[0] === S.mode)[1]}</span></div>${settingsBody()}`;
  if (S.special === "history") return `<div class="home"><div class="home-in"><h1>History</h1><div class="muted">Pick an archived task, review or discussion on the left. Its final artifacts open here.</div></div></div>`;
  const p = S.place[S.mode];
  if (!p) return modeHome();
  const [k, id] = p.split(":");
  if (k === "item") return itemView(D.items[id]);
  if (k === "board") return boardView(id, { primary: S.mode === "discuss" ? "discuss" : "task" });
  if (k === "reviews") return reviewsView();
  return modeHome();
}
function render() {
  const n = narrow();
  app.classList.toggle("no-panel", n || !S.panelWide);
  app.classList.toggle("panel-over", n && S.panelOver);
  app.innerHTML = rail() + panel() + `<main class="main">${mainView()}</main>`;
}

// ---------- Events ----------
app.addEventListener("click", (e) => {
  const t = e.target.closest("[data-mode],[data-item],[data-place],[data-special],[data-act],[data-go]");
  if (!t) { if (S.panelOver) { S.panelOver = false; render(); } return; }
  if (t.dataset.mode) return setMode(t.dataset.mode);
  if (t.dataset.item) return openItem(t.dataset.item);
  if (t.dataset.go) { const [k, id] = t.dataset.go.split(":"); return k === "item" ? openItem(id) : openPlace(t.dataset.go); }
  if (t.dataset.place) return openPlace(t.dataset.place);
  if (t.dataset.special) { S.special = S.special === t.dataset.special ? null : t.dataset.special; return render(); }
  const a = t.dataset.act;
  if (a === "close") { S.special = null; return render(); }
  if (a === "new") return toast("New task dialog · Ctrl+N");
  if (a === "panel") { if (narrow()) S.panelOver = !S.panelOver; else S.panelWide = !S.panelWide; return render(); }
  if (a.startsWith("over:")) { const k = a.slice(5); S.over = S.over === k ? null : k; return render(); }
});
addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "j") { e.preventDefault(); const n = nextJ(); if (n) openItem(n); return; }
  if (mod && e.key === ",") { e.preventDefault(); S.special = S.special === "settings" ? null : "settings"; return render(); }
  if (mod && e.key.toLowerCase() === "n") { e.preventDefault(); toast("New task dialog · Ctrl+N"); return; }
  if (mod && e.key >= "1" && e.key <= "3") { e.preventDefault(); return setMode(MODES[+e.key - 1][0]); }
  if (e.key === "Escape") {
    if (S.over) { S.over = null; return render(); }
    if (S.panelOver) { S.panelOver = false; return render(); }
    if (S.special) { S.special = null; return render(); }
  }
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 80); });
render();
mockChrome(`<h2>C · Three modes</h2>
<ul>
<li><b>Rail</b> with the three things the app is opened for: <b>Discuss</b>, <b>Implement</b>, <b>Review</b> (Ctrl+1/2/3). Each mode carries a badge: ${st("wait")} and how many items need you there, or ${st("run")} when only the agent is working. History and Settings sit at the bottom.</li>
<li><b>Panel</b>: the list of the current mode. Implement: tasks in the board/epic tree, then boards to start from a card. Review: reviews in progress, the pending PRs, your own PRs. Discuss: active discussions, then boards to pick cards.</li>
<li><b>Each mode remembers what was open.</b> Switching modes brings back its last item; clicking the active mode again goes to its home. Settings and History replace the panel and the main area; Esc goes back to the mode you left.</li>
<li><b>Ctrl+J</b> crosses modes: it opens the next item that needs you and switches to its mode.</li>
<li><b>Conversation takes the main area.</b> Stage and step are one chip in the header (it opens Stages and steps). Steps, Artifacts, Card, Reports, Documents are overlays from the right, closed by default. <b>Findings are decided inside the conversation</b>, with a decision bar above the composer.</li>
<li><b>Nothing open</b>: the mode's home. Review's home is the PR list.</li>
<li><b>Narrow</b> (&lt;1500px): the panel folds; the rail shows every active item as a tile with its status under its mode. Clicking the active mode, or », opens the panel as an overlay.</li>
</ul>${LEGEND}`);

</script>
</body>
