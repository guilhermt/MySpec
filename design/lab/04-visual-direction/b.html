/* =====================================================================
   SHARED STRUCTURE · identical in the three directions, styled only
   through the tokens. The direction block at the end changes treatment.
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg-app); color: var(--ink);
  font-family: var(--font-ui); font-size: var(--fs-ui); line-height: var(--lh-copy);
  font-feature-settings: var(--ff-ui);

}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus { outline: none; }
:focus-visible { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-off); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mono { font-family: var(--font-mono); font-feature-settings: normal; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.strong { font-weight: var(--fw-strong); }
.row { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }
kbd {

  padding: var(--sp-0-5) var(--sp-1); background: var(--bg-raised); white-space: nowrap;
}

/* ---------- Buttons: default, hover, focus, active, disabled, loading, error ---------- */
.btn {

.btn.is-focus { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-off); }
.btn.sm { height: var(--h-ctl-sm); padding: 0 var(--sp-2); font-size: var(--fs-meta); gap: var(--sp-1); }
.btn.icon { width: var(--h-ctl); padding: 0; }
.btn.sm.icon { width: var(--h-ctl-sm); }

.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-on); box-shadow: none; }
.btn.primary:hover, .btn.primary.is-hover { background: var(--primary-hover); border-color: var(--primary-hover); color: var(--primary-on); }
.btn.primary:active, .btn.primary.is-active { background: var(--primary-active); border-color: var(--primary-active); color: var(--primary-on); }

.st-wait { background: var(--wait-glyph); }
.st-close { border: calc(var(--glyph) * .26) solid var(--close); }
.st-run, .spin { border: calc(var(--glyph) * .2) solid var(--work-track); border-top-color: var(--work); animation: spin var(--dur-spin) linear infinite; display: inline-block; border-radius: 50%; flex: none; }
.st-gh { border: calc(var(--glyph) * .16) dashed var(--gh); }
.st-idle { border: calc(var(--glyph) * .14) solid var(--idle); }
.st-paused { border-radius: 0; width: calc(var(--glyph) * .8); background: linear-gradient(90deg, var(--paused) 0 34%, transparent 34% 66%, var(--paused) 66%); }
.st-warn { border-radius: var(--r-glyph); border: calc(var(--glyph) * .16) solid var(--ink-2); transform: rotate(45deg) scale(.78); }
.st-done { border-radius: 0; width: var(--glyph); height: calc(var(--glyph) * .55); border-left: calc(var(--glyph) * .2) solid var(--ink-3); border-bottom: calc(var(--glyph) * .2) solid var(--ink-3); transform: rotate(-45deg) translate(1px, -1px); }
.st-todo { border: var(--bw) solid var(--deco); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0% { background: var(--wait-bg); } 100% { background: transparent; } }

/* Type glyphs (task, One-Shot task, PR review, discussion) */
.ty { width: var(--icon); height: var(--icon); flex: none; color: var(--ink-3); fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }
.ty .fill { fill: currentColor; stroke: none; }

/* The user's clock: a filled chip (square with ! for an error, round for a wait, outlined for closing). */
.tw {
  display: inline-flex; align-items: center; height: var(--h-tw); padding: 0 var(--sp-1-5); border-radius: var(--r-pill); flex: none;
  background: var(--wait-solid); color: var(--wait-on); font-size: var(--fs-micro); font-weight: var(--fw-strong);
  font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1;
}
.tw-error { background: var(--err-solid); color: var(--err-on); border-radius: var(--r-xs); }
.tw-error::before { content: "!"; margin-right: var(--sp-0-5); }
.tw-close { background: transparent; color: var(--close); box-shadow: inset 0 0 0 calc(var(--bw) * 1.5) var(--close); }
/* The agent's clock: plain text after a small spinner. */
.tt { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-meta); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.tt .st { width: var(--glyph-sm); height: var(--glyph-sm); }

/* Context meter */
.ctx { display: inline-flex; align-items: center; gap: var(--sp-1); font-size: var(--fs-meta); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.ctx i { display: inline-block; width: var(--ctx-w); height: var(--ctx-h); border-radius: var(--r-pill); background: var(--meter-track); position: relative; overflow: hidden; }
.ctx i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--meter-fill); border-radius: inherit; }

/* =====================================================================
   SHELL
   ===================================================================== */
.app { --sb: clamp(18rem, calc(8vw + 12.5rem), 23.75rem); display: grid; grid-template-columns: var(--sb) minmax(0, 1fr); height: 100vh; }
.sb { display: flex; flex-direction: column; background: var(--bg-sidebar); min-height: 0; min-width: 0; container: sb / inline-size; border-right: var(--region-border); }
.sb-top { display: flex; align-items: center; gap: var(--sp-1-5); height: var(--h-head); padding: 0 var(--sp-2) 0 var(--sp-3); flex: none; }
.brand { display: inline-flex; align-items: center; gap: var(--sp-2); font-family: var(--font-title); font-weight: var(--fw-bold); font-size: var(--fs-body); letter-spacing: var(--tracking-brand); color: var(--ink); }
.brand .mark { width: var(--mark); height: var(--mark); border-radius: var(--r-mark); background: var(--brand); display: inline-grid; place-items: center; color: var(--brand-on); }
.brand .mark svg { width: calc(var(--mark) * .62); height: calc(var(--mark) * .62); stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sb-filter { padding: 0 var(--sp-2) var(--sp-2); flex: none; }
.sb-filter .input { width: 100%; height: var(--h-ctl-sm); font-size: var(--fs-meta); color: var(--ink-2); }
.sb-tree { flex: 1; overflow: auto; padding: var(--sp-0-5) var(--sp-1-5) var(--sp-3); }
.sb-foot { display: flex; align-items: center; gap: var(--sp-1); height: var(--h-head); padding: 0 var(--sp-2); border-top: var(--region-border); flex: none; }
.sb-foot .cnt { font-size: var(--fs-micro); color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* Tree nodes */
.node {
  display: flex; align-items: center; gap: var(--sp-1-5); min-height: var(--h-node); width: 100%;
  padding: 0 var(--sp-1-5) 0 calc(var(--sp-1) + var(--d, 0) * var(--indent)); border-radius: var(--r-sm);
  color: var(--node-ink); font-size: var(--fs-meta); font-weight: var(--fw-strong); cursor: pointer; margin-top: var(--node-gap);
  text-transform: var(--node-case); letter-spacing: var(--node-track);
}
.node:hover { background: var(--bg-hover); }
.node .chev { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-4); flex: none; }
.node.epic { font-weight: var(--fw-medium); color: var(--ink-3); min-height: var(--h-epic); margin-top: 0; text-transform: none; letter-spacing: 0; }
.node .x { font-weight: var(--fw-regular); font-size: var(--fs-micro); color: var(--ink-3); display: inline-flex; gap: var(--sp-1); align-items: center; white-space: nowrap; flex: none; text-transform: none; letter-spacing: 0; }

/* Tree row: 2 lines, 3 while the agent runs */
.it {
  display: grid; gap: var(--row-gap); width: 100%; padding: var(--sp-1-5) var(--sp-2) var(--sp-1-5) calc(var(--sp-2) + var(--d, 0) * var(--indent));
  border-radius: var(--r-row); margin: var(--sp-0-5) 0; position: relative; cursor: pointer; color: var(--ink);
  transition: background var(--dur-fast) var(--ease);
}
.it:hover, .it.is-hover { background: var(--bg-hover); }
.it:active, .it.is-active { background: var(--bg-active); }
.it.is-focus { outline: var(--focus-w) solid var(--focus); outline-offset: calc(var(--focus-w) * -1); }
[role="treeitem"]:focus-visible { outline-offset: calc(var(--focus-w) * -1); }
.it.sel { background: var(--bg-selected); box-shadow: var(--sel-mark); }
.it.sel .meta, .it.sel .l3, .it.sel .pos { color: var(--ink-3); }
.it .l1, .it .l2, .it .l3 { display: flex; align-items: center; gap: var(--sp-1-5); min-width: 0; }
.it .l1 .nm { flex: 1; font-size: var(--fs-ui); font-weight: var(--fw-medium); }
.it.you .l1 .nm { font-weight: var(--fw-bold); }
.it .l1 .meta { font-size: var(--fs-micro); color: var(--ink-4); white-space: nowrap; flex: none; font-family: var(--meta-font); }
.it .l2 { font-size: var(--fs-meta); color: var(--ink-2); padding-left: var(--row-inset); }
.it .l2 .lbl { flex: 1 1 auto; }
.it .l2 .pos { color: var(--ink-3); }
.it.you .l2 { color: var(--ink); }
.it .l2 .more { font-size: var(--fs-micro); border: var(--bw) solid var(--line-strong); border-radius: var(--r-pill); padding: 0 var(--sp-1); line-height: var(--h-more); font-weight: var(--fw-strong); flex: none; color: var(--ink-2); }
.it .l2 .tw, .it .l2 .tt, .it .l2 .rw { margin-left: auto; }
.it .l2 .rw { font-size: var(--fs-micro); color: var(--ink-3); flex: none; }
.it .l3 { padding-left: var(--row-inset); font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-label); color: var(--ink-3); font-feature-settings: normal; }
.it .l3 .doing { flex: 1 1 auto; }
.it.err::before, .rail::before { content: ""; position: absolute; left: var(--bw); top: var(--sp-1-5); bottom: var(--sp-1-5); width: var(--rail); border-radius: var(--r-pill); background: var(--err); }
.it.is-disabled { cursor: default; color: var(--ink-4); background: transparent; }
.it.is-disabled .nm { font-weight: var(--fw-regular); }
.it kbd { font-size: var(--fs-micro); }
.short { display: none; }
@container sb (max-width: 330px) { .it .l1 .meta:not(.jk) { display: none; } .it .long { display: none; } .it .short { display: inline; } }
@container sb (max-width: 370px) { .it .l3 .long { display: none; } .it .l3 .short { display: inline; } }
.nrow { display: flex; align-items: center; gap: var(--sp-1-5); width: 100%; padding: var(--sp-1) var(--sp-2) var(--sp-1) calc(var(--sp-2) + var(--d, 0) * var(--indent)); font-size: var(--fs-meta); color: var(--ink-2); border-radius: var(--r-sm); cursor: pointer; }
.nrow:hover { background: var(--bg-hover); }
.sb-empty { padding: var(--sp-1) var(--sp-2) var(--sp-1) calc(var(--sp-2) + var(--indent) * 2); color: var(--ink-3); font-size: var(--fs-meta); }

/* =====================================================================
   MAIN · the item open
   ===================================================================== */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-main); position: relative; container: main / inline-size; }

/* The top of the item: two lines, one hierarchy. Line 1 says what it is; line 2 where it is. */
.ih { flex: none; background: var(--bg-head); border-bottom: var(--head-border); }
.ih-top { display: flex; align-items: center; gap: var(--sp-2); height: var(--h-head); padding: 0 var(--sp-3) 0 var(--sp-2); min-width: 0; }
.navbtns { display: flex; gap: var(--sp-0-5); flex: none; }
.crumbs { display: flex; align-items: center; gap: var(--sp-1-5); min-width: 0; font-size: var(--fs-meta); color: var(--ink-3); flex: none; white-space: nowrap; }
.crumbs a { color: inherit; text-decoration: none; border-radius: var(--r-xs); }
.crumbs a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 0.2em; }
.crumbs .gt { color: var(--deco); }
.ih-title { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; margin: 0; font-family: var(--font-title); font-size: var(--fs-title); font-weight: var(--fw-title); letter-spacing: var(--tracking-title); color: var(--ink); line-height: var(--lh-label); }
.ih-title .ty { color: var(--ink-2); }
.ih-ref { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--ink-3); white-space: nowrap; flex: none; font-feature-settings: normal; }
.ih-tools { display: flex; align-items: center; gap: var(--sp-1); flex: none; }
.ih-prog { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--h-prog); padding: 0 var(--sp-4); border-top: var(--head-inner-border); min-width: 0; }
.stages { display: flex; align-items: center; gap: var(--sp-0-5); min-width: 0; font-size: var(--fs-meta); color: var(--ink-3); }
.stg { display: inline-flex; align-items: center; gap: var(--sp-1); height: var(--h-ctl-sm); padding: 0 var(--sp-1-5); border-radius: var(--r-sm); white-space: nowrap; color: var(--ink-3); }
button.stg:hover { background: var(--bg-hover); color: var(--ink); }
.stg.done svg { color: var(--ink-3); }
.stg.next { color: var(--ink-4); }
.stg.next .dot { width: var(--glyph-sm); height: var(--glyph-sm); border-radius: 50%; border: var(--bw) solid var(--deco); flex: none; }
.stg.cur { color: var(--ink); font-weight: var(--fw-strong); background: var(--stage-cur-bg); box-shadow: var(--stage-cur-ring); padding: 0 var(--sp-2); gap: var(--sp-2); }
.stages .gt { color: var(--deco); font-size: var(--fs-micro); flex: none; }
.segs { display: inline-flex; gap: var(--seg-gap); align-items: center; }
.segs i { display: block; width: var(--seg-w); height: var(--seg-h); border-radius: var(--r-pill); background: var(--line-strong); }
.segs i.d { background: var(--meter-fill); }
.segs i.c { background: var(--wait-glyph); }
.stepinfo { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; font-size: var(--fs-ui); }
.stepinfo .t { font-weight: var(--fw-medium); color: var(--ink); }
.stepinfo .s { color: var(--ink-3); font-size: var(--fs-meta); white-space: nowrap; }
.nmn { font-weight: var(--fw-regular); color: var(--ink-3); font-variant-numeric: tabular-nums; }
@container main (max-width: 1240px) {
  .stg.done .nm, .stg.next .nm { display: none; }
  .stg.done, .stg.next { padding: 0 var(--sp-1); }
}
@container main (max-width: 1020px) {
  .crumbs .up { display: none; }
  .ih-tools .long { display: none; }
}

/* Body: conversation column */
.body { flex: 1; display: flex; min-height: 0; position: relative; }
.colconvo { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-conv); }
.convo { flex: 1 1 auto; overflow: auto; min-height: 0; background: var(--bg-conv); scroll-padding-top: var(--sp-16); }
.convo-in { max-width: var(--measure); margin: 0 auto; padding: 0 var(--sp-6) var(--sp-8); display: flex; flex-direction: column; gap: var(--entry-gap); }

/* The conversation switch: the step's two conversations, pinned at the top of the reading column. */
.cv-head { position: sticky; top: 0; z-index: 2; background: var(--bg-conv); margin: 0 calc(var(--sp-6) * -1); padding: var(--sp-3) var(--sp-6); display: flex; align-items: center; gap: var(--sp-3); border-bottom: var(--cvhead-border); }
.switch { display: inline-flex; gap: var(--switch-gap); padding: var(--switch-pad); background: var(--switch-track); border-radius: var(--r-switch); flex: none; }
.sw { display: inline-flex; align-items: center; gap: var(--sp-1-5); height: var(--h-switch); padding: 0 var(--sp-3); border-radius: var(--r-sw); color: var(--ink-3); font-size: var(--fs-ui); font-weight: var(--fw-medium); white-space: nowrap; position: relative; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); }
.sw:hover { color: var(--ink); background: var(--sw-hover); }
.sw .what { color: var(--ink-3); font-weight: var(--fw-regular); }
.sw[aria-selected="true"] { color: var(--sw-on-ink); background: var(--sw-on-bg); box-shadow: var(--sw-on-shadow); }
.sw[aria-selected="true"] .what { color: var(--ink-2); }
.cv-head::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--sp-4); background: linear-gradient(var(--bg-conv), transparent); pointer-events: none; }
.cv-head .tools { display: flex; gap: var(--sp-1); margin-left: auto; flex: none; }

/* Entries */
.e-marker { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-meta); color: var(--ink-3); margin: var(--sp-2) 0; }
.e-marker svg { color: var(--ink-3); }
.e-marker .t { font-variant-numeric: tabular-nums; color: var(--ink-4); }
.who { display: flex; align-items: center; gap: var(--sp-1-5); font-size: var(--fs-meta); color: var(--ink-3); font-weight: var(--fw-medium); margin-bottom: var(--sp-1-5); }
.who .av { width: var(--av); height: var(--av); border-radius: var(--r-av); display: inline-grid; place-items: center; flex: none; background: var(--av-bg); color: var(--av-ink); }
.who .av svg { width: calc(var(--av) * .7); height: calc(var(--av) * .7); }
.who .t { color: var(--ink-4); font-weight: var(--fw-regular); font-variant-numeric: tabular-nums; }
.prose { font-family: var(--font-read); font-size: var(--fs-read); line-height: var(--lh-read); color: var(--ink); font-feature-settings: var(--ff-read); letter-spacing: var(--tracking-read); }
.prose p { margin: 0 0 var(--sp-3); }
.prose p:last-child { margin-bottom: 0; }
.prose ul { margin: 0 0 var(--sp-3); padding-left: 1.25em; }
.prose li { margin: var(--sp-1) 0; }
.prose li::marker { color: var(--ink-4); }
.prose strong { font-weight: var(--fw-read-strong); }
.prose code, .e-app code, .card code { font-family: var(--font-mono); font-size: var(--code-inline); background: var(--code-inline-bg); border-radius: var(--r-xs); padding: 0.05em 0.3em; font-feature-settings: normal; color: var(--ink); }
.code { margin: 0 0 var(--sp-3); border-radius: var(--r-md); background: var(--bg-code); border: var(--code-border); overflow: hidden; }
.code .ch { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-3); font-family: var(--font-ui); font-size: var(--fs-micro); color: var(--ink-3); border-bottom: var(--code-head-border); }
.code pre { margin: 0; padding: var(--sp-2) var(--sp-3) var(--sp-3); overflow-x: auto; font-family: var(--font-mono); font-size: var(--fs-code); line-height: var(--lh-code); color: var(--code-ink); tab-size: 4; font-feature-settings: normal; }
.code .kw { color: var(--code-kw); font-weight: var(--code-kw-w); }
.code .fn { color: var(--code-fn); }
.code .str { color: var(--code-str); }
.code .num { color: var(--code-num); }
.code .com { color: var(--code-com); font-style: italic; }

.e-app { background: var(--app-bg); border: var(--app-border); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); font-size: var(--fs-body); color: var(--ink-2); line-height: var(--lh-copy); }
.e-app .who { margin-bottom: var(--sp-1); }
.e-user { align-self: flex-end; max-width: 80%; background: var(--bg-user); color: var(--user-ink); border: var(--user-border); border-radius: var(--r-bubble); padding: var(--sp-2) var(--sp-3); font-size: var(--fs-body); line-height: var(--lh-copy); }
.e-user-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-1); }
.e-user-wrap .who { margin: 0; }

/* Action group: a quiet line that unfolds */
.acts { border: var(--acts-border); background: var(--acts-bg); border-radius: var(--r-md); font-size: var(--fs-meta); }
.acts > summary { display: flex; gap: var(--sp-2); align-items: center; min-height: var(--h-ctl); padding: 0 var(--sp-3); cursor: pointer; list-style: none; color: var(--ink-2); border-radius: var(--r-md); }
.acts > summary::-webkit-details-marker { display: none; }
.acts > summary:hover { background: var(--bg-hover); }
.acts > summary .chev { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-4); transition: transform var(--dur-fast) var(--ease); }
.acts[open] > summary .chev { transform: rotate(90deg); }
.acts .n { font-weight: var(--fw-medium); color: var(--ink-2); white-space: nowrap; }
.acts .sum { color: var(--ink-3); }
.acts .sum .mono { font-size: var(--fs-micro); }
.acts ul { list-style: none; margin: 0; padding: var(--sp-1) var(--sp-3) var(--sp-2); border-top: var(--acts-inner-border); }
.acts li { display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-1) 0; color: var(--ink-2); min-width: 0; }
.acts li .ic { width: var(--icon-sm); display: inline-grid; place-items: center; flex: none; }
.acts li .k { width: 3.25rem; color: var(--ink-3); flex: none; }
.acts li .tg { font-family: var(--font-mono); font-size: var(--fs-micro); color: var(--ink-2); font-feature-settings: normal; }
.acts li .s { color: var(--ink-4); font-size: var(--fs-micro); white-space: nowrap; }
.acts li.cur { color: var(--ink); }
.acts li.cur .k { color: var(--ink); font-weight: var(--fw-medium); }
.acts li.cur .s { color: var(--wait); font-weight: var(--fw-medium); }
.ok-ic { color: var(--ink-4); }
.err-ic { color: var(--err); }
.acts li.e .s { color: var(--err); }
.e-activity { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-meta); color: var(--ink-2); }

/* Question and permission: the only things in the conversation that block */
.card { background: var(--card-bg); border: var(--card-border); border-radius: var(--r-lg); box-shadow: var(--card-shadow); padding: var(--sp-3) var(--sp-4) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
.card .hd { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-meta); color: var(--ink-2); }
.card .hd .kind { font-weight: var(--fw-strong); color: var(--wait); text-transform: var(--card-kind-case); letter-spacing: var(--card-kind-track); }
.card .q { font-family: var(--font-q); font-weight: var(--fw-strong); font-size: var(--fs-q); line-height: var(--lh-label); color: var(--ink); text-wrap: pretty; }
.card .desc { color: var(--ink-2); font-size: var(--fs-body); }
.opts { display: flex; flex-direction: column; gap: var(--sp-1-5); }
.opt { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-2) var(--sp-3); border: var(--bw) solid var(--opt-border); border-radius: var(--r-md); width: 100%; background: var(--opt-bg); transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.opt:hover, .opt.is-hover { background: var(--bg-hover); border-color: var(--line-hover); }
.opt:active { background: var(--bg-active); }
.opt .kn { font-family: var(--font-mono); font-size: var(--fs-micro); border: var(--bw) solid var(--line-strong); border-bottom-width: calc(var(--bw) * 2); border-radius: var(--r-xs); min-width: 1.25rem; height: 1.25rem; display: inline-grid; place-items: center; flex: none; color: var(--ink-2); background: var(--bg-raised); margin-top: 0.0625rem; }
.opt .ot { display: flex; flex-direction: column; gap: var(--sp-0-5); font-size: var(--fs-body); color: var(--ink); font-weight: var(--fw-medium); }
.opt .ot small { font-size: var(--fs-meta); color: var(--ink-3); font-weight: var(--fw-regular); line-height: var(--lh-copy); }
.card pre.cmd { margin: 0; padding: var(--sp-2) var(--sp-3); background: var(--bg-code); border: var(--code-border); border-radius: var(--r-md); font-family: var(--font-mono); font-size: var(--fs-code); line-height: var(--lh-code); white-space: pre-wrap; word-break: break-all; color: var(--code-ink); }

/* The ask bar: the one place where the item says what it asks, and how to resolve it. */
.ask { flex: none; background: var(--ask-outer-bg); padding: var(--ask-pad-y) var(--sp-6) 0; border-top: var(--ask-outer-border); }

.ask .what { display: inline-flex; align-items: center; gap: var(--sp-1-5); white-space: nowrap; }
.ask .what .lbl { font-weight: var(--fw-strong); }
.ask .adet { color: var(--ink-3); flex: 1 1 10rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-meta); }
.ask .acts-r { display: flex; gap: var(--sp-1-5); align-items: center; margin-left: auto; }

/* Composer */
.composer { flex: none; background: var(--composer-outer-bg); padding: var(--sp-2) var(--sp-6) var(--sp-4); }
.composer-in { max-width: calc(var(--measure) - var(--sp-6) * 2); margin: 0 auto; }
.cbox { border: var(--bw) solid var(--input-border); border-radius: var(--r-composer); background: var(--bg-input); box-shadow: var(--composer-shadow); display: flex; flex-direction: column; transition: border-color var(--dur-fast) var(--ease); }

   ===================================================================== */

.elev .b { width: 8rem; height: 4.5rem; background: var(--bg-raised); border-radius: var(--r-md); display: grid; place-items: center; color: var(--ink-3); font-size: var(--fs-micro); }

/* Mock-only chrome: dashed and yellow, clearly not part of the UI */
.mock { position: fixed; z-index: 90; right: 2px; bottom: 2px; display: flex; gap: var(--sp-2); align-items: center; font: var(--fs-micro)/1.3 ui-monospace, monospace; color: var(--mock-ink); background: var(--mock-bg); border: 1px dashed var(--mock-line); border-radius: 4px; padding: 3px 8px; white-space: nowrap; }

/* =====================================================================
   DIRECTION · B · Leitura
   ===================================================================== */
/* Tone does the structure: no region lines; board names as small caps; the ask bar takes the tint of what it asks. */

<script>
const DIR = {"letter": "B", "name": "Leitura", "intent": "Calm for reading all day: a barely warm neutral, regions told apart by tone instead of lines, no brand color at all. Color appears only when something depends on you, or while the agent works. The agent speaks in a reading serif.", "typeNote": "Source Sans 3 for the interface, Source Serif 4 for the agent's speech and the question, Source Code Pro for code. The serif is only for prose: paths, code and lists of files stay in mono.", "statusNote": "No accent: the primary action, focus and selection are ink. Blue is a state here, agent working, so it can live in the tree without competing with anything.", "accentRows": [["--primary", "primary · ink"], ["--work", "agent working"], ["--work-bg", "working tint"], ["--err-solid", "error"], ["--wait-glyph", "waiting · glyph"], ["--wait-bg", "waiting tint"], ["--close", "ready to close"]], "mark": ""};
const Q = new URLSearchParams(location.search);
if (Q.has("specimen")) document.body.classList.add("specimen-only");
const S = { tab: (Q.get("tab") || "").toLowerCase() === "reviewer" ? "Reviewer" : "Implementer" };

// ---------------- Fake data (the round 03 set) ----------------
const REPOS = { api: "acme/api", web: "acme/web", ios: "acme/ios", android: "acme/android", infra: "acme/infra" };
const SEV = { error: 0, wait: 1, close: 2 };
const TONE_WORD = { error: "error", wait: "waiting for you", close: "ready to close", run: "agent working", gh: "waiting on GitHub", paused: "paused", idle: "idle" };
const ITEMS = {
  t1: { kind: "task", name: "Rate limit per API key", repo: "api", card: 412, board: "plat", epic: "API hardening",
    sits: [{ sev: "wait", label: "Question", place: "Reviewer", since: "18m", long: "18 minutes", min: 18 }, { sev: "wait", label: "Permission", place: "Implementer", since: "4m", long: "4 minutes", min: 4 }],
    row: ["Question · Reviewer · Step 3/7", "Question · Step 3/7"], pos: "Step 3 of 7 · Agent review · pass 1", ctx: 44 },
  t7: { kind: "task", name: "Rotate API keys without downtime", repo: "api", card: 441,
    pos: "Step 2/5 · Reviewer · pass 2", posShort: "Step 2/5 · Reviewer pass 2",
    run: { who: "Reviewer", turn: "3m", long: "3 minutes 20 seconds", verb: "Running", target: "go test ./internal/keys/...", short: "go test …/keys/..." }, ctx: 57 },
  t3: { kind: "task", name: "Retry failed billing webhooks", repo: "api", card: 430,
    sits: [{ sev: "wait", label: "Question", place: "Tech spec", since: "12m", long: "12 minutes", min: 12 }], row: ["Question · Tech spec · 1 of 2", "Question · Tech spec"], pos: "Tech spec" },
  t8: { kind: "task", name: "Deprecate v1 webhooks", repo: "api", card: 449,
    sits: [{ sev: "error", label: "Session error", place: "Plan", since: "7m", long: "7 minutes", min: 7 }], row: ["Session error · Plan", "Session error · Plan"], pos: "Plan" },
  d1: { kind: "discussion", name: "Usage-based pricing tiers", cards: [455, 461], pos: "Discussing · 2 cards", posShort: "Discussing",
    run: { who: "Agent", turn: "1m", long: "1 minute 5 seconds", verb: "Reading", target: "web/src/billing/plans.ts", short: "…/plans.ts" }, ctx: 17 },
  t2: { kind: "task", name: "Offline sync for drafts", repo: "ios", card: 88, oneshot: true, gh: true, pos: "PR review · checks 3/5" },
  t4: { kind: "task", name: "Haptics on complete", repo: "ios", card: 95,
    sits: [{ sev: "close", label: "Ready to close", place: "PR #1279 merged", since: "2h", long: "2 hours", min: 120 }], row: ["Ready to close · PR #1279 merged", "Ready to close · #1279"], pos: "Closing" },
  t5: { kind: "task", name: "Widget for today's tasks", repo: "ios", card: 93,
    sits: [{ sev: "error", label: "Step 2 blocked", place: "worktree not clean", since: "41m", long: "41 minutes", min: 41 }], row: ["Step 2/4 blocked · worktree not clean", "Step 2/4 blocked"], pos: "Step 2 of 4" },
  d2: { kind: "discussion", name: "Offline mode on mobile", cards: [101, 87],
    sits: [{ sev: "wait", label: "Decide drafts", place: "3 of 6 decided", since: "22m", long: "22 minutes", min: 22 }], row: ["Decide drafts · 3 of 6 decided", "Decide drafts · 3/6"], pos: "Decide drafts" },
  t6: { kind: "task", name: "Terraform 1.9 upgrade", repo: "infra", paused: true, pos: "Paused · PRD" },
  r1: { kind: "review", name: "Migrate settings page to react-hook-form", repo: "web", pr: 2291,
    sits: [{ sev: "wait", label: "Decide findings", place: "pass 1", since: "34m", long: "34 minutes", min: 34 }], row: ["Decide findings · pass 1 · 5 of 9", "Decide findings · 5/9"], pos: "Pass 1" },
  r2: { kind: "review", name: "Crash on share sheet when offline", repo: "ios", pr: 312, idle: true, pos: "Published · changes requested" },
};
const OPEN = "t1";
const TREE = [
  { id: "reviews", label: "Reviews", extra: `<span class="x">4 pending</span>`, items: ["r1", "r2"] },
  { id: "plat", label: "Platform Roadmap", epics: [{ id: "ep", label: "API hardening", items: ["t1", "t7"] }], items: ["t3", "t8", "d1"] },
  { id: "mob", label: "Mobile App", extra: `<span class="x" title="Last read failed 18m ago · GitHub API rate limit">${'<span class="st st-warn" aria-hidden="true"></span>'}Read failed</span>`, items: ["t2", "t4", "t5", "d2"] },
  { id: "nob", label: "No board", notices: ["infra"], items: ["t6"] },
];
const sortSits = (s) => [...(s || [])].sort((a, b) => SEV[a.sev] - SEV[b.sev] || b.min - a.min);
const needsYou = (i) => !!(i.sits && i.sits.length);
const tone = (i) => needsYou(i) ? sortSits(i.sits)[0].sev : i.run ? "run" : i.gh ? "gh" : i.paused ? "paused" : "idle";
const nextJ = Object.keys(ITEMS).filter((id) => id !== OPEN && needsYou(ITEMS[id])).sort((a, b) => {
  const x = sortSits(ITEMS[a].sits)[0], y = sortSits(ITEMS[b].sits)[0];
  return SEV[x.sev] - SEV[y.sev] || y.min - x.min;
})[0];

// ---------------- Atoms ----------------
const I = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const st = (t, label) => `<span class="st st-${t}" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}></span>`;
const ty = (i) => `<svg class="ty" aria-hidden="true"><use href="#i-${i.kind === "task" ? (i.oneshot ? "oneshot" : "task") : i.kind}"/></svg>`;
const tw = (s) => `<span class="tw tw-${s.sev}" title="${s.sev === "error" ? "Error · waiting for you" : "Waiting for you"} for ${s.long}"><span class="sr">${s.sev === "error" ? "error, " : ""}waiting for you </span>${s.since}</span>`;
const tt = (r) => `<span class="tt" title="Agent working on this turn for ${r.long}">${st("run")}<span class="sr">agent working </span>${r.turn}</span>`;
const ctxm = (p) => `<span class="ctx" title="Context window ${p}% used"><i style="--p:${p}%"></i>${p}%</span>`;
const kindWord = (i) => i.kind === "task" ? (i.oneshot ? "One-Shot task" : "task") : i.kind === "review" ? "pull request review" : "discussion";
function meta(i) {
  if (i.kind === "task") return (i.card ? `${i.repo}#${i.card}` : i.repo) + (i.oneshot ? " · One-Shot" : "");
  if (i.kind === "review") return `${i.repo}#${i.pr}`;
  return `#${i.cards.join(" #")}`;
}
function ariaFor(i) {
  const p = [`${kindWord(i)} ${i.name}`];
  if (needsYou(i)) p.push(sortSits(i.sits).map((s) => `${TONE_WORD[s.sev]}: ${s.label} · ${s.place}, for ${s.long}`).join("; "), i.pos);
  else p.push(`${TONE_WORD[tone(i)]}, ${i.pos}`);
  if (i.run) p.push(`${i.run.who} working for ${i.run.long}: ${i.run.verb} ${i.run.target}`, `context ${i.ctx}% used`);
  return p.join(". ");
}

// ---------------- Sidebar ----------------
function itemRow(id, level) {
  const i = ITEMS[id], t = tone(i), sel = id === OPEN;
  let l2, l3 = "";
  if (needsYou(i)) {
    const s = sortSits(i.sits)[0];
    const more = i.sits.length > 1 ? `<span class="more" title="${sortSits(i.sits).slice(1).map((x) => `${x.label} · ${x.place}`).join(", ")}">+${i.sits.length - 1}</span>` : "";
    l2 = `${st(t)}<span class="lbl trunc"><span class="long">${i.row[0]}</span><span class="short">${i.row[1]}</span></span>${more}${tw(s)}`;
  } else if (i.run) {

  ["Idle", "idle", [["--idle", "--bg-sidebar", "ui"], ["--ink-3", "--bg-sidebar", "text"]]],
  ["Paused", "paused", [["--paused", "--bg-sidebar", "ui"], ["--ink-2", "--bg-sidebar", "text"]]],
];
const sample = { error: tw({ sev: "error", since: "7m", long: "7m" }), wait: tw({ sev: "wait", since: "18m", long: "18m" }), close: tw({ sev: "close", since: "2h", long: "2h" }), run: tt({ turn: "3m", long: "3m" }), gh: `<span class="rw muted">GitHub</span>`, idle: `<span class="muted">idle</span>`, paused: `<span class="muted">Paused · PRD</span>` };
function crCell(scopeEl, fg, bg, kind) {
  const r = ratio(tokenIn(scopeEl, fg), tokenIn(scopeEl, bg)), need = kind === "ui" ? 3 : 4.5;
  return `<span class="cr" title="${fg} on ${bg}"><span class="${r >= need ? "pass" : "fail"}">${r.toFixed(2)}</span> <span class="faint">${r >= need ? (kind === "ui" ? "≥3 ui" : "AA") : "fails"}</span></span>`;
}
function statesGrid() {
  const cols = ["default", "hover", "focus", "active", "disabled", "loading", "error"];
  const cls = { hover: "is-hover", focus: "is-focus", active: "is-active", loading: "is-loading", error: "is-error" };
  const spin = `<span class="spin" aria-hidden="true"></span>`;
  const btn = (v, c) => {
    const base = v === "primary" ? "btn primary" : v === "ghost" ? "btn ghost" : "btn";
    if (c === "disabled") return `<button class="${base}" disabled>${v === "primary" ? "Approve" : v === "ghost" ? "Discard step" : "Open PR"}</button>`;
    if (c === "loading") return `<button class="${base} is-loading" aria-busy="true">${spin}${v === "primary" ? "Approving…" : v === "ghost" ? "Discarding…" : "Opening…"}</button>`;
    if (c === "error") return `<button class="${base} is-error">${I("x")}${v === "primary" ? "Retry" : v === "ghost" ? "Try again" : "Retry"}</button>`;
    return `<button class="${base} ${cls[c] || ""}">${v === "primary" ? "Approve" : v === "ghost" ? "Discard step" : "Open PR"}</button>`;
  };
  const input = (c) => c === "disabled" ? `<input class="input" disabled value="" placeholder="Branch name">`
    : c === "loading" ? `<span class="input is-disabled" aria-busy="true">${spin}<span class="ph">Reading branches…</span></span>`
    : c === "error" ? `<span class="input is-error">rate-limit per key</span>`
    : `<span class="input ${cls[c] || ""}">${c === "default" ? `<span class="ph">Branch name</span>` : "rate-limit-per-key"}</span>`;
  const chip = (c) => c === "disabled" ? `<button class="chip" disabled>Assignee</button>`
    : c === "loading" ? `<button class="chip is-disabled" aria-busy="true">${spin}Status</button>`
    : c === "error" ? `<button class="chip is-error">${st("warn")}Read failed</button>`
    : `<button class="chip ${cls[c] || ""}" ${c === "active" ? 'aria-pressed="true"' : ""}>${c === "active" ? "Assigned to me" : "Status"}${I("down")}</button>`;
  const row = (c) => {
    if (c === "disabled") return `<div class="it is-disabled" aria-disabled="true"><span class="l1">${ty({ kind: "task" })}<span class="nm trunc">Invoice PDF footer</span></span><span class="l2">${st("idle")}<span class="lbl trunc pos">Deleted · removing the worktree</span></span></div>`;
    if (c === "loading") return `<div class="it is-disabled" aria-busy="true"><span class="l1">${ty({ kind: "review" })}<span class="nm trunc">Bump pgx to v5.6</span></span><span class="l2">${st("gh")}<span class="lbl trunc pos">checking GitHub…</span></span></div>`;
    if (c === "error") return `<div class="it err you"><span class="l1">${ty({ kind: "task" })}<span class="nm trunc">Deprecate v1 webhooks</span></span><span class="l2">${st("error")}<span class="lbl trunc">Session error · Plan</span>${tw({ sev: "error", since: "7m", long: "7m" })}</span></div>`;
    return `<div class="it you ${cls[c] || ""} ${c === "active" ? "sel" : ""}"><span class="l1">${ty({ kind: "task" })}<span class="nm trunc">Retry failed webhooks</span></span><span class="l2">${st("wait")}<span class="lbl trunc">Question · Tech spec</span>${tw({ sev: "wait", since: "12m", long: "12m" })}</span></div>`;
  };
  const rows = [["Primary", (c) => btn("primary", c)], ["Secondary", (c) => btn("secondary", c)], ["Ghost", (c) => btn("ghost", c)], ["Input", input], ["Chip", chip], ["Tree row", row]];
  return `<div class="states"><span></span>${cols.map((c) => `<span class="h">${c === "active" ? "active · selected" : c}</span>`).join("")}${rows.map(([n, f]) => `<span class="rl">${n}</span>${cols.map((c) => `<div class="cell">${f(c)}</div>`).join("")}`).join("")}</div>`;
}
function specimen() {
  const el = document.getElementById("specimen");
  const scope = (theme, inner) => `<div class="scope scope-${theme}" data-scope="${theme}"><span class="lbl">${theme === "light" ? "Light" : "Dark"}</span>${inner}</div>`;
  const typeRows = TYPE.map(([tok, n, use, w, lh, s, f]) => `<tr class="typerow"><td><b>${n}</b><br><code class="mono faint">${tok}</code></td><td class="cr" data-type="${tok}|${w}|${lh}|${f}"></td><td class="faint">${use}</td><td><span style="display:block;font-size:var(${tok});font-weight:var(${w});font-family:var(${f});line-height:var(${lh});max-width:40rem">${s}</span></td></tr>`).join("");
  const swatches = NEUTRALS.map(([t, n]) => `<div class="swatch"><span class="chipc" style="background:var(${t})"></span><b>${n}</b><code>${t}</code></div>`).join("");
  const accent = DIR.accentRows.map(([t, n]) => `<div class="swatch"><span class="chipc" style="background:var(${t})"></span><b>${n}</b><code>${t}</code></div>`).join("");
  el.innerHTML = `<div class="spec-in">
    <div><h2>${DIR.letter} · ${DIR.name}</h2><p class="lead">${DIR.intent}</p></div>
    <div><h3>Type</h3><div class="tw-wrap"><table><thead><tr><th>Role</th><th>Size · weight · leading</th><th>Where</th><th>Sample</th></tr></thead><tbody>${typeRows}</tbody></table></div>
      <p class="faint" style="margin:var(--sp-2) 0 0;font-size:var(--fs-meta)">${DIR.typeNote}</p></div>
    <div><h3>Neutrals, accent and text contrast</h3><div class="sw-grid">${["light", "dark"].map((th) => scope(th, `<div class="swatches">${swatches}</div><div class="swatches">${accent}</div>
      <table><thead><tr><th>Pair</th><th>Contrast</th></tr></thead><tbody>${PAIRS.map(([n, fg, bg, k]) => `<tr><td>${n} <code class="mono faint">${fg} / ${bg}</code></td><td data-cr="${fg}|${bg}|${k}"></td></tr>`).join("")}</tbody></table>`)).join("")}</div></div>
    <div><h3>Status: shape, color and word, with the contrast of each pair</h3><div class="sw-grid">${["light", "dark"].map((th) => scope(th, `<table><thead><tr><th>State</th><th>Glyph · clock</th><th>Pairs</th></tr></thead><tbody>${STATUS.map(([n, k, pairs]) => `<tr class="${k === "error" ? "" : ""}"><td>${n}</td><td><span class="row">${st(k)}${sample[k]}</span></td><td>${pairs.map(([fg, bg, kind]) => `<div class="row" style="justify-content:space-between"><code class="mono faint">${fg} / ${bg}</code><span data-cr="${fg}|${bg}|${kind}"></span></div>`).join("")}</td></tr>`).join("")}</tbody></table>`)).join("")}</div>
      <p class="faint" style="margin:var(--sp-2) 0 0;font-size:var(--fs-meta)">Text pairs need 4.5:1 (AA). Glyphs, rings and focus need 3:1 (non-text). ${DIR.statusNote}</p></div>
    <div><h3>Radius and elevation</h3><div class="sw-grid">${["light", "dark"].map((th) => scope(th, `<div class="radii">${["--r-xs", "--r-sm", "--r-md", "--r-lg"].map((r) => `<div><span class="b" style="border-radius:var(${r})"></span><code class="mono">${r}</code><span data-size="${r}"></span></div>`).join("")}</div>
      <div class="elev">${[["plane", "none"], ["raised", "var(--shadow-raised)"], ["float", "var(--shadow-float)"], ["overlay", "var(--shadow-overlay)"]].map(([n, s]) => `<div><span class="b" style="box-shadow:${s};${n === "plane" ? "background:var(--bg-main);border:var(--bw) solid var(--line)" : ""}">${n}</span><span>${n === "plane" ? "bars, rows, conversation" : n === "raised" ? "cards that block, composer" : n === "float" ? "menus, popovers, tooltips" : "a panel over the conversation"}</span></div>`).join("")}</div>`)).join("")}</div></div>
    <div><h3>States</h3><div class="sw-grid" style="grid-template-columns:1fr">${["light", "dark"].map((th) => scope(th, statesGrid())).join("")}</div></div>
    <div><h3>Conversation pieces not on screen above</h3><div class="sw-grid">${["light", "dark"].map((th) => scope(th, `<div class="demo-stack">
      ${acts(6, [["Read", "internal/keys/rotation.go", "done"], ["Bash", "golangci-lint run ./internal/keys/...", "done"], ["Write", "internal/keys/rotation_test.go", "interrupted"], ["Bash", "go test ./internal/keys/...", "running", "running · 3m 20s"]], `Running <span class="mono">go test ./internal/keys/...</span>`, true, `<span class="ic"><span class="spin" style="width:var(--glyph);height:var(--glyph)"></span></span>`)}
      <div class="e-activity" role="status">${st("run")}<span>Working · 3m 20s · Running <span class="mono">go test ./internal/keys/...</span></span></div>
      ${MK("file", "Review 1 written · changes", "14:02")}
      ${QUESTION.replace('id="askcard"', "").replace('id="q-t"', "").replace('aria-labelledby="q-t"', 'aria-label="Question"').replace('aria-labelledby="q-t"', "")}
    </div>`)).join("")}</div></div>
  </div>`;
  el.querySelectorAll("[data-scope]").forEach((sc) => {
    sc.querySelectorAll("[data-cr]").forEach((c) => { const [fg, bg, k] = c.dataset.cr.split("|"); c.innerHTML = crCell(sc, fg, bg, k); });
    sc.querySelectorAll("[data-size]").forEach((c) => { c.textContent = tokenIn(sc, c.dataset.size); });
  });
  el.querySelectorAll("[data-type]").forEach((c) => {
    const [tok, w, lh, f] = c.dataset.type.split("|"), root = document.documentElement;
    const v = tokenIn(root, tok), px = Math.round(parseFloat(v) * 16 * 100) / 100;
    const fam = tokenIn(root, f).split(",")[0].replace(/"/g, "");
    c.innerHTML = `${v} · ${px}px<br><span class="faint">${tokenIn(root, w)} · ${tokenIn(root, lh)} · ${fam}</span>`;
  });
}
render();
specimen();
if (Q.has("specimen")) scrollTo(0, 0);
</script>
