<style id="tokens">
/* ===== tokens-draft.css · verbatim, do not edit here ===== */
/* =====================================================================
   MySpec design tokens · theme Grafite quente
   Draft of design/system/tokens.css (round 08-visual-final).

   How to read it
   - Every value the interface paints or measures lives here. Components use
     these names and nothing else: no color, size or duration outside this file.
   - Three layers of blocks:
       1. :root                            values that do not depend on the mode;
       2. :root, [data-theme="light"]      the light colors (the default);
          @media dark, :root without light the dark colors, following the system;
          [data-theme="dark"]              the dark colors, fixed by the user or
                                           forced on a subtree (the specimen);
       3. :root, [data-theme]              derived tokens (washes and veils),
                                           declared on every scope so they
                                           resolve against that scope's colors.
   - Sizes are rem at a 16px root and land on whole pixels: WebKitGTK blurs
     half pixels (brief.md §9).
   - Colors are OKLCH. The neutral carries a trace of warmth: surfaces and lines
     at hue 65 (chroma 0.004), inks at hue 60 (chroma 0.01), the sidebar at 68 in
     light and 62 in dark. The identity is an electric blue eased toward cobalt,
     hue 260.
   - A token that means the same as another is written as var(), never as a copy
     of its value: the aliases live in the last block.
   - The dark colors are written twice (system setting and fixed choice) because
     the mocks follow the system with CSS alone. In the app the theme is always
     set by script on data-theme, so design/system/tokens.css keeps one dark block.
   ===================================================================== */

:root {
  /* Type families: one sans for chrome and reading, one mono for code, paths and keys. */
  --font-ui: "Fira Sans", system-ui, sans-serif;
  --font-read: "Fira Sans", system-ui, sans-serif;
  --font-mono: "Fira Code", ui-monospace, monospace;

  /* Type sizes and leading, paired: the chrome register (caps to ui) and the reading register (body, read, code). */
  --text-caps: 0.6875rem;    --leading-caps: 1rem;
  --text-micro: 0.75rem;     --leading-micro: 1rem;
  --text-meta: 0.8125rem;    --leading-meta: 1.125rem;
  --text-ui: 0.875rem;       --leading-ui: 1.25rem;
  --text-body: 0.9375rem;    --leading-body: 1.375rem;
  --text-read: 1rem;         --leading-read: 1.625rem;
  --text-title: 1.125rem;    --leading-title: 1.5rem;
  --text-display: 1.375rem;  --leading-display: 1.75rem;
  --text-code: 0.8125rem;    --leading-code: 1.25rem;
  --text-code-read: 0.875rem;  /* inline code inside the reading register; it takes the line's leading */

  /* Weights: hierarchy comes from weight before color. A name that waits for you is 600, any other name 400. */
  --weight-regular: 400; --weight-medium: 500; --weight-strong: 600; --weight-bold: 700;
  --weight-name: 400; --weight-name-waiting: 600;
  --tracking-caps: 0.07em;

  /* Measure: the conversation column and the reading line inside it. */
  --measure: 50rem;
  --measure-read: 42rem;

  /* Space: a 4px grid with two half steps for tight chrome. */
  --space-0-5: 0.125rem; --space-1: 0.25rem; --space-1-5: 0.375rem; --space-2: 0.5rem; --space-2-5: 0.625rem;
  --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;

  /* Radius: grows with the size and the elevation of the object. */
  --radius-xs: 0.1875rem; --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-pill: 999px;

  /* Strokes: borders, the error rail, focus. Focus sits outside with a gap; selection sits inside. */
  --border: 1px; --border-2: 2px; --error-rail: 3px; --radius-glyph: 1px;
  --focus-width: 2px; --focus-offset: 2px; --halo: 3px;

  /* Control and chrome sizes. */
  --size-control: 2rem; --size-control-sm: 1.75rem; --size-control-xs: 1.375rem;
  --size-chip: 1.75rem; --size-time-chip: 1.125rem; --size-kbd: 1.125rem; --size-kbd-sm: 1rem;
  --size-head: 3rem; --size-progress: 2.5rem; --size-node: 1.75rem; --size-tab: 1.75rem; --size-ask: 2.75rem;
  --size-composer-min: 3.5rem; --size-mark: 1.5rem; --size-avatar: 1.5rem; --size-more-below: 1.75rem;
  --size-menu-min: 14rem; --size-dialog: 30rem; --size-toast: 22rem; --size-tooltip-max: 20rem;

  /* Icons and status glyphs. Glyphs are even so they center on a whole pixel. */
  --icon: 1rem; --icon-sm: 0.875rem; --icon-xs: 0.75rem; --icon-stroke: 1.5;
  --glyph: 0.625rem; --glyph-sm: 0.5rem; --glyph-diamond: 0.5rem; --glyph-bar: 0.1875rem;

  /* Meters: the context meter and the step segments of the current stage. */
  --meter-w: 2.5rem; --meter-h: 0.25rem; --meter-label: 2rem;
  --seg-w: 0.75rem; --seg-w-current: 1.25rem; --seg-h: 0.25rem; --seg-gap: 0.1875rem;

  /* The tree: row rhythm, the epic indent and its guide under the epic's chevron. */
  --tree-pad: 0.5rem; --row-pad-y: 0.375rem; --row-gap: 0.25rem; --line-gap: 0.125rem; --section-gap: 1.5rem;
  --epic-indent: 1rem; --guide-x: 0.9375rem;

  /* Layout: continuous widths, one rule per container (structure.md §6). The sidebar is drawn; the collapsed strip,
     the panel and the decision column are the rules of structure.md §2 and §3, reserved for the screens of phase 4. */
  --sidebar-width: round(down, clamp(18rem, calc(8vw + 12.5rem), 23.75rem), 1px);
  --sidebar-collapsed: 3.75rem;
  --panel-width: clamp(22.5rem, 28%, 30rem);
  --decision-width: clamp(18.75rem, 24%, 26.25rem);

  /* Small fixed pieces of content. */
  --key-size: 1.25rem; --action-verb-w: 3.5rem; --list-indent: 1.25rem; --newmsg-w: 8.5rem;
  --code-pad-y: 0.0625rem; --code-pad-x: 0.3125rem; --fade: 1.5rem; --link-offset: 0.2em;

  /* Motion: three durations and one standard curve; the spinner is the only loop. prefers-reduced-motion zeroes all of it. */
  --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 280ms;
  --duration-spin: 900ms; --duration-shimmer: 1400ms; --delay-tooltip: 500ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, 0, 1);
  --ease-exit: cubic-bezier(0.3, 0, 1, 1);

  /* Stacking: sticky heads, the item header, floating pieces, the dialog, toasts and tooltips. */
  --z-sticky: 2; --z-header: 3; --z-float: 4; --z-overlay: 50; --z-toast: 60; --z-tooltip: 70;

  /* Link underline: permanent and quiet, full on hover. The key hint on a primary button: the same in both modes. */
  --mix-link-line: 45%; --mix-key: 45%;
}

/* ---------------------------------------------------------------------
   LIGHT (the default)
   --------------------------------------------------------------------- */
:root, [data-theme="light"] {
  color-scheme: light;

  /* Surfaces in layers: 0 sunken (code, action groups, the quiet ask bar), 1 the ground (conversation, header),
     2 raised (cards, buttons, the selected tab), 3 floating (menus, tooltips' neighbors, dialogs, toasts).
     In light, 2 and 3 share white and differ by shadow. */
  --surface-0: oklch(0.962 0.004 65);
  --surface-1: oklch(0.995 0.001 65);
  --surface-2: oklch(1 0 0);
  --surface-3: oklch(1 0 0);
  --surface-input: oklch(1 0 0);
  --surface-user: oklch(0.95 0.005 60);

  /* The sidebar: in the tone of the page, one step down, with its own input, divider, control border and epic guide (3:1). */
  --surface-sidebar: oklch(0.945 0.007 68);
  --sidebar-input: oklch(0.975 0.004 68);
  --sidebar-line: oklch(0.885 0.008 68);
  --sidebar-control: oklch(0.595 0.011 68);

  /* Lines: 1 divider, 2 quiet border (buttons, chips), 3 control border at 3:1 (inputs, composer, dashed disabled). */
  --line-1: oklch(0.912 0.004 65);
  --line-2: oklch(0.86 0.005 65);
  --line-3: oklch(0.63 0.006 65);

  /* Ink: 1 text, 2 secondary, 3 muted (line 2 of a row, the agent's clock), 4 faint (meta, line 3, timestamps).
     1 to 3 pass 4.5:1 on every surface and veil of the system. 4 passes on the surfaces 0 to 3, the sidebar, the user
     message and the wait veil, and is NOT for: the open row (--brand-veil; the row lifts its meta to ink 3), a pressed
     or hovered open row, a pressed veil on the sidebar, --brand-tint and --state-wait-chip (dark). */
  --ink-1: oklch(0.2 0.01 60);
  --ink-2: oklch(0.36 0.009 60);
  --ink-3: oklch(0.455 0.007 60);
  --ink-4: oklch(0.495 0.006 60);

  /* Identity: the solid, its hover and press, the ink on it, the identity as text, the ring of the open row, the meter track. */
  --brand: oklch(0.52 0.175 260);
  --brand-hover: oklch(0.48 0.175 260);
  --brand-active: oklch(0.44 0.166 260);
  --brand-on: oklch(1 0 0);
  --brand-ink: oklch(0.49 0.17 260);
  --brand-ring: oklch(0.58 0.158 260);
  --brand-track: oklch(0.9 0.039 260);

  /* The ink of neutral veils (hover, press): a trace of the identity, never a gray from nowhere. */
  --veil-ink: oklch(0.3 0.061 260);

  /* Veil strengths, one per role. */
  --mix-hover: 6%; --mix-press: 10%; --mix-select: 12%; --mix-tint: 12%; --mix-tint-hover: 18%; --mix-tint-press: 24%;
  --mix-halo: 24%; --mix-seg: 26%; --mix-marker: 30%;

  /* Error: the loudest color, never alone: the diamond, the square chip with !, the rail. */
  --state-error: oklch(0.52 0.195 22);
  --state-error-hover: oklch(0.48 0.195 22);
  --state-error-press: oklch(0.44 0.185 22);
  --state-error-veil: oklch(0.962 0.02 22);
  --state-error-on: oklch(1 0 0);

  /* Waiting for you: amber. Text, glyph (and its contour), the veil of a request, its line, the time chip. */
  --state-wait: oklch(0.5 0.11 62);
  --state-wait-glyph: oklch(0.58 0.14 75);
  --state-wait-veil: oklch(0.965 0.035 85);
  --state-wait-line: oklch(0.86 0.08 80);
  --state-wait-chip: oklch(0.945 0.05 85);
  --state-wait-chip-ink: oklch(0.42 0.09 62);

  /* Ready to close: green, a ring and an outlined chip. */
  --state-close: oklch(0.5 0.13 145);

  /* Code: four hues at the lightness of the ink, the comment is faint ink. */
  --code-keyword: oklch(0.47 0.13 260);
  --code-string: oklch(0.47 0.1 150);
  --code-function: oklch(0.45 0.11 305);
  --code-number: oklch(0.5 0.12 55);

  /* Floating pieces: the tooltip is the one inverted surface; the scrim dims the app under a dialog. */
  --tooltip-surface: oklch(0.26 0.008 60);
  --tooltip-ink: oklch(0.97 0.003 60);
  --tooltip-ink-2: oklch(0.8 0.005 60);
  --scrim: oklch(0.2 0.01 60 / 0.28);

  /* Elevation: every shadow is the warm neutral, never black. Plane, button, xs (a raised control), card, float, overlay. */
  --shadow-hue: oklch(0.3 0.03 65);
  --sheen: oklch(1 0 0 / 0.12);
  --rim: color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 6%, transparent);
  --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 22%, transparent), inset 0 1px 0 var(--sheen);
  --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 8%, transparent), 0 0 0 1px var(--rim);
  --shadow-card: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 6%, transparent), 0 8px 20px color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 16%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 20%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(0 0 0 / 0.08);
}

/* ---------------------------------------------------------------------
   DARK: the same roles, lifted surfaces instead of shadows, lighter inks.
   Written twice: for the system setting and for a fixed choice or subtree.
   --------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: oklch(0.175 0.005 65); --surface-1: oklch(0.205 0.005 65); --surface-2: oklch(0.255 0.006 65); --surface-3: oklch(0.275 0.006 65);
    --surface-input: oklch(0.18 0.005 65); --surface-user: oklch(0.265 0.005 60);
    --surface-sidebar: oklch(0.165 0.008 62); --sidebar-input: oklch(0.2 0.008 62); --sidebar-line: oklch(0.245 0.008 62); --sidebar-control: oklch(0.505 0.01 62);
    --line-1: oklch(0.29 0.006 65); --line-2: oklch(0.35 0.007 65); --line-3: oklch(0.55 0.008 65);
    --ink-1: oklch(0.94 0.005 60); --ink-2: oklch(0.84 0.005 60); --ink-3: oklch(0.75 0.005 60); --ink-4: oklch(0.69 0.005 60);
    --brand: oklch(0.72 0.135 259); --brand-hover: oklch(0.77 0.135 259); --brand-active: oklch(0.67 0.135 259); --brand-on: oklch(0.16 0.041 259);
    --brand-ink: oklch(0.79 0.1 259); --brand-ring: oklch(0.6 0.122 259); --brand-track: oklch(0.3 0.047 259);
    --veil-ink: oklch(0.92 0.034 259);
    --mix-hover: 7%; --mix-press: 11%; --mix-select: 18%; --mix-tint: 16%; --mix-tint-hover: 22%; --mix-tint-press: 28%;
    --mix-halo: 32%; --mix-seg: 30%; --mix-marker: 36%;
    --state-error: oklch(0.72 0.16 25); --state-error-hover: oklch(0.77 0.15 25); --state-error-press: oklch(0.67 0.16 25);
    --state-error-veil: oklch(0.27 0.05 25); --state-error-on: oklch(0.16 0.03 25);
    --state-wait: oklch(0.83 0.13 80); --state-wait-glyph: oklch(0.8 0.15 78);
    --state-wait-veil: oklch(0.27 0.045 80); --state-wait-line: oklch(0.42 0.08 78); --state-wait-chip: oklch(0.33 0.07 78); --state-wait-chip-ink: oklch(0.9 0.1 85);
    --state-close: oklch(0.78 0.15 145);
    --code-keyword: oklch(0.8 0.1 260); --code-string: oklch(0.8 0.09 150); --code-function: oklch(0.82 0.08 305); --code-number: oklch(0.8 0.1 55);
    --tooltip-surface: oklch(0.34 0.006 65); --tooltip-ink: oklch(0.96 0.004 60); --tooltip-ink-2: oklch(0.82 0.005 60); --scrim: oklch(0.05 0.005 60 / 0.6);
    --shadow-hue: oklch(0.08 0.01 65); --sheen: oklch(1 0 0 / 0.2); --rim: oklch(1 0 0 / 0.07);
    --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 30%, transparent);
    --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 45%, transparent), inset 0 1px 0 var(--sheen);
    --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 40%, transparent), 0 0 0 1px var(--rim);
    --shadow-card: 0 0 0 1px oklch(1 0 0 / 0.04), 0 8px 24px color-mix(in srgb, var(--shadow-hue) 50%, transparent);
    --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 60%, transparent), 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 70%, transparent), 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.25), inset 0 0 0 1px oklch(0 0 0 / 0.12);
  }
}
[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: oklch(0.175 0.005 65); --surface-1: oklch(0.205 0.005 65); --surface-2: oklch(0.255 0.006 65); --surface-3: oklch(0.275 0.006 65);
  --surface-input: oklch(0.18 0.005 65); --surface-user: oklch(0.265 0.005 60);

  --brand-ink: oklch(0.79 0.1 259); --brand-ring: oklch(0.6 0.122 259); --brand-track: oklch(0.3 0.047 259);

  --mix-hover: 7%; --mix-press: 11%; --mix-select: 18%; --mix-tint: 16%; --mix-tint-hover: 22%; --mix-tint-press: 28%;

  --tooltip-surface: oklch(0.34 0.006 65); --tooltip-ink: oklch(0.96 0.004 60); --tooltip-ink-2: oklch(0.82 0.005 60); --scrim: oklch(0.05 0.005 60 / 0.6);

/* ---------------------------------------------------------------------
   ALIASES AND DERIVED: names that mean another token, and veils and washes
   mixed from the tokens above. Declared on every
   scope, so a subtree with its own data-theme mixes its own colors.
   --------------------------------------------------------------------- */
:root, [data-theme] {
  /* Aliases: the states without a situation are the neutral inks (the agent working in motion, GitHub, paused, idle). */
  --state-work: var(--ink-2); --state-work-track: var(--line-2); --state-github: var(--ink-3); --state-paused: var(--ink-3);
  --state-idle: var(--ink-4); --state-notice: var(--ink-2);
  /* Aliases: focus is the identity; the wait contour is the glyph unless a theme needs a darker one; the epic guide is the
     sidebar's control border; not-started glyphs and › separators use the control line; code comments are faint ink. */
  --focus: var(--brand); --state-wait-ring: var(--state-wait-glyph); --sidebar-guide: var(--sidebar-control);
  --line-deco: var(--line-3); --code-comment: var(--ink-4);

  /* Neutral veils, for hover and press on any surface; on a raised control they are mixed into it. */
  --veil-hover: color-mix(in srgb, var(--veil-ink) var(--mix-hover), transparent);
  --veil-press: color-mix(in srgb, var(--veil-ink) var(--mix-press), transparent);
  --surface-2-hover: color-mix(in srgb, var(--veil-ink) var(--mix-hover), var(--surface-2));
  --surface-2-press: color-mix(in srgb, var(--veil-ink) var(--mix-press), var(--surface-2));

  /* Identity washes: the open row on the sidebar (veil), a pressed or chosen control (tint), the same on the ground (tint-plane). */
  --brand-veil: color-mix(in srgb, var(--brand) var(--mix-select), var(--surface-sidebar));
  --brand-tint: color-mix(in srgb, var(--brand) var(--mix-tint), var(--surface-2));
  --brand-tint-hover: color-mix(in srgb, var(--brand) var(--mix-tint-hover), var(--surface-2));
  --brand-tint-press: color-mix(in srgb, var(--brand) var(--mix-tint-press), var(--surface-2));
  --brand-tint-plane: color-mix(in srgb, var(--brand) var(--mix-tint), var(--surface-1));

  /* Identity details: the segments still to do, the agent marker's ring, the key hint on a primary button, the focus halo. */
  --brand-seg-todo: color-mix(in srgb, var(--brand) var(--mix-seg), var(--surface-1));
  --brand-marker-ring: color-mix(in srgb, var(--brand) var(--mix-marker), transparent);

.ask-in.err { background: var(--state-error-veil); padding-left: var(--space-5); overflow: hidden; }
.ask-in.err::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--error-rail); background: var(--state-error); }

.composer { flex: none; background: var(--surface-1); padding: var(--space-2) var(--space-6) var(--space-4); }
.composer-in { max-width: calc(var(--measure) - var(--space-6) * 2); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure) + var(--space-6) * 2) / 2), 1px)); }
.cbox { border: var(--border) solid var(--line-3); border-radius: var(--radius-lg); background: var(--surface-input); box-shadow: var(--shadow-xs); display: flex; flex-direction: column; transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard); }
.cbox:hover, .cbox.is-hover { border-color: var(--ink-3); }
.cbox:focus-within, .cbox.is-focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 var(--halo) var(--focus-halo); }

.cbox textarea { border: 0; background: transparent; resize: none; padding: var(--space-3) var(--space-3) var(--space-1); font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-1); min-height: var(--size-composer-min); outline: none; }
.cbox textarea::placeholder { color: var(--ink-4); }
.cbox textarea:disabled { cursor: not-allowed; }
.cbox .cfoot { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-2) var(--space-2); }
.cbox .hint { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-4); }
.cbox .hint.err { color: var(--state-error); }


/* ---------- Danger: the one destructive confirmation of a dialog. Never on the main screen. ---------- */
.btn.danger { background: var(--state-error); border-color: var(--state-error); color: var(--state-error-on); box-shadow: var(--shadow-primary); }

.btn.danger:active, .btn.danger.is-active { background: var(--state-error-press); border-color: var(--state-error-press); color: var(--state-error-on); box-shadow: none; }
.btn.danger:disabled, .btn.danger[aria-disabled="true"] { background: transparent; border-style: dashed; border-color: var(--line-3); color: var(--ink-4); cursor: not-allowed; box-shadow: none; }
.btn.danger.is-error { background: var(--state-error-veil); border-color: var(--state-error); color: var(--state-error); box-shadow: none; }
.btn.primary.is-loading { color: var(--brand-on); }

.btn .spin { border-top-color: currentColor; border-right-color: currentColor; }

/* ---------- Textarea: the input's anatomy on several lines. ---------- */
.textarea { display: block; width: 100%; min-height: var(--size-composer-min); padding: var(--space-2) var(--space-2-5); resize: vertical;
  border: var(--border) solid var(--line-3); border-radius: var(--radius-sm); background: var(--surface-input); color: var(--ink-1);
  font-size: var(--text-body); line-height: var(--leading-body);
  transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard); }
.textarea::placeholder { color: var(--ink-4); }
.textarea:hover, .textarea.is-hover { border-color: var(--ink-3); }
.textarea:focus, .textarea.is-focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 var(--halo) var(--focus-halo); }
.textarea.is-active { border-color: var(--focus); }
.textarea:disabled { border-style: dashed; background: transparent; color: var(--ink-4); cursor: not-allowed; resize: none; }

.field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; width: 100%; }

.field .help { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }

/* ---------- Menus: the list a select or a ⋯ opens. Floating surface, one highlight at a time. ---------- */
.menu { display: flex; flex-direction: column; gap: var(--space-0-5); min-width: var(--size-menu-min); padding: var(--space-1); background: var(--surface-3); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); font-size: var(--text-ui); line-height: var(--leading-ui); }
.mi { display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-control); padding: 0 var(--space-2); border-radius: var(--radius-sm); color: var(--ink-1); cursor: pointer; white-space: nowrap; width: 100%; }
.mi .ck { width: var(--icon); height: var(--icon); color: var(--brand-ink); flex: none; visibility: hidden; }
.mi[aria-selected="true"] .ck, .mi[aria-checked="true"] .ck { visibility: visible; }
.mi .sub { color: var(--ink-3); font-size: var(--text-meta); line-height: var(--leading-meta); }
.mi .k { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.mi:hover, .mi.is-hover, .mi.is-cur { background: var(--veil-hover); }
.mi:active, .mi.is-active { background: var(--veil-press); }
.mi[aria-disabled="true"], .mi:disabled { color: var(--ink-4); cursor: not-allowed; background: transparent; }
.mi[aria-disabled="true"] .sub { color: var(--ink-4); }
.mi.danger { color: var(--state-error); }
.mi.is-loading { color: var(--ink-3); cursor: progress; }
.menu-sep { height: var(--border); background: var(--line-1); margin: var(--space-1) calc(var(--space-1) * -1); }
.menu-cap { padding: var(--space-1) var(--space-2) var(--space-0-5); font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }
.menu-msg { padding: var(--space-1-5) var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); max-width: var(--size-tooltip-max); white-space: normal; }
.menu-msg.err { color: var(--state-error); }
.select-trigger { justify-content: space-between; width: 100%; }
.select-trigger[aria-expanded="true"] { border-color: var(--focus); }

/* ---------- Tooltip: the one inverted surface. Opens after a pause, names the action and its key. ---------- */
.tip { position: fixed; z-index: var(--z-tooltip); max-width: var(--size-tooltip-max); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm);
  background: var(--tooltip-surface); color: var(--tooltip-ink); box-shadow: var(--shadow-float);
  font-size: var(--text-meta); line-height: var(--leading-meta); font-weight: var(--weight-regular); pointer-events: none;
  display: flex; align-items: center; gap: var(--space-2); white-space: normal;
  animation: tip-in var(--duration-fast) var(--ease-enter); }

@keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Dialog: floating sheet over a scrim. Says what will be lost before the danger button. ---------- */
.scrim { position: fixed; inset: 0; z-index: var(--z-overlay); background: var(--scrim); display: grid; place-items: center; padding: var(--space-8); }
.scrim.static { position: relative; inset: auto; border-radius: var(--radius-lg); padding: var(--space-8) var(--space-6); }
.dlg { width: min(var(--size-dialog), 100%); background: var(--surface-3); color: var(--ink-1); border-radius: var(--radius-xl); box-shadow: var(--shadow-overlay); display: flex; flex-direction: column; overflow: hidden; }
.dlg-hd { display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-5) var(--space-5) var(--space-2); }
.dlg-hd h2 { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); flex: 1; text-wrap: balance; }
.dlg-bd { padding: 0 var(--space-5) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-2); }
.dlg-bd ul { margin: 0; padding-left: var(--list-indent); display: flex; flex-direction: column; gap: var(--space-1); }
.dlg-bd li::marker { color: var(--ink-4); }
.dlg-ft { display: flex; justify-content: flex-end; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-5); background: var(--surface-0); box-shadow: inset 0 var(--border) 0 var(--line-1); }
.dlg-ft .why { margin-right: auto; }

/* ---------- Toast and notice. A toast is momentary and floats; the app notice is a strip that stays until dismissed. ---------- */
.toast { display: flex; align-items: flex-start; gap: var(--space-2-5); width: min(var(--size-toast), 100%); padding: var(--space-2-5) var(--space-2) var(--space-2-5) var(--space-3);
  background: var(--surface-3); color: var(--ink-1); border-radius: var(--radius-lg); box-shadow: var(--shadow-float); font-size: var(--text-ui); line-height: var(--leading-ui);
  animation: toast-in var(--duration-base) var(--ease-enter); }
.toast .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-0-5); }
.toast .tx .sub { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.toast .ic { display: inline-grid; place-items: center; height: var(--leading-ui); color: var(--ink-3); flex: none; }
@keyframes toast-in { from { opacity: 0; transform: translateY(var(--space-2)); } to { opacity: 1; transform: none; } }
.appnotice { position: relative; display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; min-height: var(--size-ask); padding: var(--space-1-5) var(--space-2) var(--space-1-5) var(--space-5);
  background: var(--state-error-veil); color: var(--ink-1); font-size: var(--text-ui); line-height: var(--leading-ui); overflow: hidden; }
.appnotice::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--error-rail); background: var(--state-error); }
.appnotice .lbl { font-weight: var(--weight-bold); color: var(--state-error); white-space: nowrap; }
.appnotice .det { flex: 1 1 0; min-width: 0; color: var(--ink-2); font-size: var(--text-meta); line-height: var(--leading-meta); }
.appnotice.clone { background: var(--surface-0); }
.appnotice.clone::before { content: none; }
.appnotice.clone .lbl { color: var(--ink-1); }

/* ---------- Code block: header with the language and the path, a copy button. ---------- */
.code .ch .btn { margin-left: var(--space-1); }
.copied { color: var(--ink-2); }

/* ---------- Context meter states. ---------- */
.ctx:hover, .ctx.is-hover { color: var(--ink-1); }
.ctx.is-loading .trk { background: linear-gradient(90deg, var(--brand-track) 40%, var(--brand-ring) 50%, var(--brand-track) 60%) 0 0 / 300% 100%; animation: shimmer var(--duration-shimmer) linear infinite; }
.ctx.is-empty .pc { color: var(--ink-4); }

/* ---------- Conversation markers that open something (a document written, a report) behave as links. ---------- */
.e-marker a { color: var(--ink-2); text-decoration-color: color-mix(in srgb, currentColor var(--mix-link-line), transparent); }
.e-marker a:hover { color: var(--brand-ink); }

/* ---------- Action group states. ---------- */
.acts > summary:active, .acts > summary.is-active { background: var(--veil-press); }
.acts > summary.is-hover { background: var(--veil-hover); }
.acts.is-error > summary .sum { color: var(--state-error); }


/* The toast region: bottom left of the main area, above everything but tooltips. It is also the app's polite live region. */
.toasts { position: fixed; z-index: var(--z-toast); left: calc(var(--sidebar-width) + var(--space-4)); bottom: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); pointer-events: none; }
.toasts > * { pointer-events: auto; }
.toast.out { animation: toast-out var(--duration-fast) var(--ease-exit) forwards; }
@keyframes toast-out { to { opacity: 0; transform: translateY(var(--space-2)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .st-run, .spin { border-color: var(--state-work); border-bottom-color: var(--state-work-track); }
  .btn .spin { border-color: currentColor; border-bottom-color: transparent; }
  .it.is-loading .l2 .lbl { color: var(--ink-3); background: none; }
}
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.report { position: fixed; z-index: var(--z-tooltip); right: var(--space-3); top: var(--space-3); max-width: var(--size-dialog); max-height: calc(100vh - var(--space-6)); overflow: auto; margin: 0; padding: var(--space-3); background: var(--surface-3); color: var(--ink-1); box-shadow: var(--shadow-overlay); border-radius: var(--radius-lg); font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-micro); white-space: pre-wrap; }

/* =====================================================================
   SPECIMEN PAGE · the frame around the system. It uses the same tokens.
   ===================================================================== */
body { background: var(--surface-1); color: var(--ink-1); font-family: var(--font-ui); font-size: var(--text-ui); line-height: var(--leading-ui); }
.spec { display: flex; flex-direction: column; min-height: 100vh; }
.sp-bar { position: sticky; top: 0; z-index: var(--z-header); display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; min-height: var(--size-head); padding: var(--space-2) var(--space-6); background: var(--surface-sidebar); box-shadow: 0 var(--border) 0 var(--sidebar-line); }
.sp-bar .brand { font-size: var(--text-ui); }
.sp-bar .ttl { color: var(--ink-3); font-size: var(--text-meta); line-height: var(--leading-meta); }
.sp-nav { display: flex; flex-wrap: wrap; gap: var(--space-0-5) var(--space-3); font-size: var(--text-meta); line-height: var(--leading-meta); }
.sp-nav a { color: var(--ink-2); text-decoration: none; border-radius: var(--radius-xs); }
.sp-nav a:hover { color: var(--brand-ink); text-decoration: underline; }
.sp-in { width: 100%; max-width: calc(var(--measure) * 3.5); margin: 0 auto; padding: var(--space-8) var(--space-6) var(--space-16); display: flex; flex-direction: column; gap: var(--space-16); }
.sp-sec { display: flex; flex-direction: column; gap: var(--space-4); scroll-margin-top: var(--space-16); }
.sp-sec > header h2 { margin: 0; font-size: var(--text-display); line-height: var(--leading-display); font-weight: var(--weight-strong); text-wrap: balance; }
.sp-sec > header p { margin: var(--space-1) 0 0; color: var(--ink-2); font-size: var(--text-body); line-height: var(--leading-body); max-width: var(--measure-read); }
.sp-h3 { margin: 0; font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--ink-3); }
.sp-note { margin: 0; color: var(--ink-3); font-size: var(--text-meta); line-height: var(--leading-meta); max-width: var(--measure-read); }

/* Light and dark, side by side when both fit, stacked otherwise. */
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(var(--measure) * 1.4)), 1fr)); gap: var(--space-4); }
.scope { background: var(--surface-1); color: var(--ink-1); border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); min-width: 0; box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.scope > .mode { font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--ink-3); }
body.only-light .scope[data-theme="dark"], body.only-dark .scope[data-theme="light"] { display: none; }
.blk { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.blk > .h { display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
.blk > .h b { font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: var(--weight-strong); }
.blk > .h span { color: var(--ink-3); font-size: var(--text-meta); line-height: var(--leading-meta); }

/* Tables */
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: var(--text-meta); line-height: var(--leading-meta); }
.tbl th { text-align: left; font-weight: var(--weight-strong); color: var(--ink-3); padding: var(--space-1-5) var(--space-2); box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); white-space: nowrap; font-size: var(--text-caps); line-height: var(--leading-caps); text-transform: uppercase; letter-spacing: var(--tracking-caps); }
.tbl td { padding: var(--space-1-5) var(--space-2); box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); vertical-align: middle; }
.tbl td.nw, .tbl .nw { white-space: nowrap; }
.tbl code, .sw-c code { background: none; padding: 0; font-size: var(--text-micro); color: var(--ink-3); }
.cr { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cr .pass { color: var(--ink-1); }
.cr .fail { color: var(--state-error); font-weight: var(--weight-bold); }
.cr .info { color: var(--ink-3); }
.cr .w { color: var(--ink-3); }

/* Type */
.ty-sample { display: block; max-width: var(--measure-read); }
.reg { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, calc(var(--measure-read) * 0.7)), 1fr)); gap: var(--space-4); }
.reg > div { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; padding: var(--space-3); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.weights { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); font-size: var(--text-title); line-height: var(--leading-title); }
.weights span small { display: block; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); font-weight: var(--weight-regular); }
.measure-demo { max-width: var(--measure-read); box-shadow: inset calc(var(--border) * -1) 0 0 var(--brand-ring); padding-right: var(--space-3); }

/* Swatches */
.sws { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--space-16) * 2), 1fr)); gap: var(--space-2); }
.sw-c { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-2); }
.sw-c .chipc { height: var(--space-12); border-radius: var(--radius-sm); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.sw-c b { font-weight: var(--weight-medium); color: var(--ink-1); }
.sw-c code { overflow-wrap: anywhere; }
.ramp { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-radius: var(--radius-md); overflow: hidden; box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.ramp > div { min-height: var(--space-16); padding: var(--space-1-5); display: flex; flex-direction: column; justify-content: flex-end; gap: var(--space-0-5); font-size: var(--text-micro); line-height: var(--leading-micro); min-width: 0; }
.ramp code { background: none; padding: 0; font-size: var(--text-micro); color: inherit; overflow-wrap: anywhere; }

/* Layers */
.layers { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); border-radius: var(--radius-lg); overflow: hidden; box-shadow: inset 0 0 0 var(--border) var(--line-1); min-height: calc(var(--space-16) * 4); }
.layers .l-rail { background: var(--surface-sidebar); padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
.layers .l-ground { background: var(--surface-1); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); position: relative; }
.layers .lab { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.layers .l-sunk { background: var(--surface-0); border-radius: var(--radius-md); padding: var(--space-3); }
.layers .l-raised { background: var(--surface-2); border-radius: var(--radius-lg); padding: var(--space-3); box-shadow: var(--shadow-card); }
.layers .l-float { position: absolute; right: var(--space-4); bottom: var(--space-4); background: var(--surface-3); border-radius: var(--radius-lg); padding: var(--space-3); box-shadow: var(--shadow-float); }

/* Identity */
.idrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.idmark { width: calc(var(--space-16) + var(--space-4)); height: calc(var(--space-16) + var(--space-4)); border-radius: var(--radius-xl); background: var(--brand); color: var(--brand-on); display: grid; place-items: center; box-shadow: var(--shadow-mark), var(--shadow-card); }
.idmark svg { width: var(--space-8); height: var(--space-8); stroke: currentColor; fill: none; stroke-width: var(--border-2); stroke-linecap: round; stroke-linejoin: round; }
.idlist { margin: 0; padding-left: var(--list-indent); color: var(--ink-2); font-size: var(--text-meta); line-height: var(--leading-meta); columns: 2 calc(var(--space-16) * 3); }
.inuse { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.onrail { background: var(--surface-sidebar); border-radius: var(--radius-md); padding: var(--space-1-5); container: sb / inline-size; }

/* States table */
.stt td:first-child { width: calc(var(--space-16) * 2); }

/* Space, radius, elevation, motion */
.spc { display: flex; flex-direction: column; gap: var(--space-1); }
.spc > div { display: grid; grid-template-columns: calc(var(--space-16) * 1.5) minmax(0, 1fr); align-items: center; gap: var(--space-2); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.spc i { display: block; height: var(--space-2); background: var(--brand-track); box-shadow: inset 0 0 0 var(--border) var(--brand-ring); border-radius: var(--radius-xs); }
.boxes { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.boxes > div { display: flex; flex-direction: column; gap: var(--space-1-5); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.boxes .b { width: calc(var(--space-16) + var(--space-8)); height: var(--space-16); background: var(--surface-0); box-shadow: inset 0 0 0 var(--border) var(--line-2); }
.boxes .e { width: calc(var(--space-16) * 2); height: var(--space-16); background: var(--surface-2); border-radius: var(--radius-md); display: grid; place-items: center; color: var(--ink-3); }
.boxes .e.plane { background: var(--surface-1); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.motion { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(var(--space-16) * 3.5), 1fr)); gap: var(--space-3); }
.motion > div { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.motion svg { width: 100%; height: var(--space-16); }
.motion svg path.crv { fill: none; stroke: var(--brand); stroke-width: var(--border-2); }
.motion svg path.ax { fill: none; stroke: var(--line-2); stroke-width: var(--border); }
.motion .track { position: relative; height: var(--space-4); border-radius: var(--radius-pill); background: var(--surface-0); }
.motion .dot { position: absolute; left: 0; top: 0; width: var(--space-4); height: var(--space-4); border-radius: var(--radius-pill); background: var(--state-work); }
.motion.play .dot { left: calc(100% - var(--space-4)); }
.motion b { color: var(--ink-1); font-weight: var(--weight-medium); font-size: var(--text-meta); line-height: var(--leading-meta); }

/* The states grid of a component. */
.grid7 { display: grid; grid-template-columns: calc(var(--space-16) * 1.5) repeat(7, minmax(0, 1fr)); gap: var(--space-3); align-items: center; font-size: var(--text-meta); line-height: var(--leading-meta); overflow-x: auto; padding: var(--space-1); }
.grid7 .h { font-size: var(--text-caps); line-height: var(--leading-caps); color: var(--ink-3); text-transform: uppercase; letter-spacing: var(--tracking-caps); font-weight: var(--weight-strong); }
.grid7 .rl { color: var(--ink-2); font-weight: var(--weight-medium); }
.grid7 .cell { min-width: 0; display: flex; align-items: center; }
.grid7 .cell > .input, .grid7 .cell > .select-wrap, .grid7 .cell > .textarea { width: 100%; }
.grid7 .na { color: var(--ink-4); font-size: var(--text-micro); line-height: var(--leading-micro); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--space-16) * 4.25), 1fr)); gap: var(--space-3); }
.cells.wide { grid-template-columns: repeat(auto-fill, minmax(calc(var(--space-16) * 7), 1fr)); }
.cells > .cell { display: flex; flex-direction: column; gap: var(--space-1-5); min-width: 0; padding: var(--space-1); }
.cells > .cell > .h { font-size: var(--text-caps); line-height: var(--leading-caps); color: var(--ink-3); text-transform: uppercase; letter-spacing: var(--tracking-caps); font-weight: var(--weight-strong); }
.cells > .cell > .onsw { align-self: flex-start; }
.onsw { background: var(--surface-0); border-radius: var(--radius-md); padding: var(--space-0-5); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.demo-col { position: relative; background: var(--surface-1); border-radius: var(--radius-md); height: var(--space-12); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.stack { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; }
.stack .ask { padding: 0; }
.stack .ask::before { content: none; }
.stack .ask-in { max-width: none; margin: 0; }
.menu.static { align-self: flex-start; }
.approw { display: flex; flex-direction: column; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.tipdemo { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; }
.tipdemo > div { display: flex; flex-direction: column; gap: var(--space-1-5); align-items: flex-start; }
.tipdemo .lab { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.audit-sum { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.audit-sum b { color: var(--ink-1); font-variant-numeric: tabular-nums; }
.audit-sum .bad { color: var(--state-error); }
.it.is-flash { background: var(--flash); }
.onrail.inl { display: inline-flex; align-items: center; container-type: normal; }
.dlg-ft .why { white-space: normal; }
.toast .tx a { align-self: flex-start; font-size: var(--text-meta); line-height: var(--leading-meta); }
.cells > .cell > :where(button, .stg, .switch, .chip, .ctx) { align-self: flex-start; }

<script>
/* =====================================================================
   ATOMS · the data of the scene and one builder per piece of the system.
   The scene (index.html) and the specimen (specimen.html) use the same builders.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const S = { tab: (Q.get("tab") || "").toLowerCase() === "reviewer" ? "Reviewer" : "Implementer" };

// ---------------- Fake data: the scene of rounds 03 to 07 ----------------
const REPOS = { api: "acme/api", web: "acme/web", ios: "acme/ios", android: "acme/android", infra: "acme/infra" };
const SEV = { error: 0, wait: 1, close: 2 };
const TONE_WORD = { error: "error", wait: "waiting for you", close: "ready to close", run: "agent working", gh: "waiting on GitHub", paused: "paused", idle: "idle" };
const ITEMS = {
  t1: { kind: "task", name: "Rate limit per API key", repo: "api", card: 412, board: "plat", epic: "API hardening",
    sits: [{ sev: "wait", label: "Question", place: "Reviewer", since: "18m", long: "18 minutes", min: 18 }, { sev: "wait", label: "Permission", place: "Implementer", since: "4m", long: "4 minutes", min: 4 }],
    row: ["Question · Reviewer · Step 3/7", "Question · Step 3/7"], pos: "Step 3 of 7 · Agent review · pass 1", ctx: 44 },
  t7: { kind: "task", name: "Rotate API keys without downtime", repo: "api", card: 441,
    pos: "Step 2/5 · Reviewer · pass 2", posShort: "Step 2/5 · pass 2",
    run: { who: "Reviewer", turn: "3m", long: "3 minutes 20 seconds", verb: "Running", target: "go test ./internal/keys/...", short: "go test …/keys" }, ctx: 57 },
  t3: { kind: "task", name: "Retry failed billing webhooks", repo: "api", card: 430,
    sits: [{ sev: "wait", label: "Question", place: "Tech spec", since: "12m", long: "12 minutes", min: 12 }], row: ["Question · Tech spec · 1 of 2", "Question · Tech spec"], pos: "Tech spec" },
  t8: { kind: "task", name: "Deprecate v1 webhooks", repo: "api", card: 449,
    sits: [{ sev: "error", label: "Session error", place: "Plan", since: "7m", long: "7 minutes", min: 7 }], row: ["Session error · Plan", "Session error · Plan"], pos: "Plan" },
  d1: { kind: "discussion", name: "Usage-based pricing tiers", cards: [455, 461], pos: "Discussing · 2 cards", posShort: "Discussing",
    run: { who: "Agent", turn: "1m", long: "1 minute 5 seconds", verb: "Reading", target: "web/src/billing/plans.ts", short: "…/plans.ts" }, ctx: 17 },
  t2: { kind: "task", name: "Offline sync for drafts", repo: "ios", card: 88, oneshot: true, gh: true, pos: "PR review · checks 3/5" },
  t4: { kind: "task", name: "Haptics on complete", repo: "ios", card: 95,
    sits: [{ sev: "close", label: "Ready to close", place: "PR #1279 merged", since: "2h", long: "2 hours", min: 120 }], row: ["Ready to close · PR #1279 merged", "Ready to close · #1279"], pos: "Closing" },
  t5: { kind: "task", name: "Widget for today's tasks", repo: "ios", card: 93,
    sits: [{ sev: "error", label: "Step 2 blocked", place: "worktree not clean", since: "41m", long: "41 minutes", min: 41 }], row: ["Step 2/4 blocked · worktree not clean", "Step 2/4 blocked"], pos: "Step 2 of 4" },
  d2: { kind: "discussion", name: "Offline mode on mobile", cards: [101, 87],
    sits: [{ sev: "wait", label: "Decide drafts", place: "3 of 6 decided", since: "22m", long: "22 minutes", min: 22 }], row: ["Decide drafts · 3 of 6 decided", "Decide drafts · 3/6"], pos: "Decide drafts" },
  t6: { kind: "task", name: "Terraform 1.9 upgrade", repo: "infra", paused: true, pos: "Paused · PRD" },
  r1: { kind: "review", name: "Migrate settings page to react-hook-form", repo: "web", pr: 2291,
    sits: [{ sev: "wait", label: "Decide findings", place: "pass 1", since: "34m", long: "34 minutes", min: 34 }], row: ["Decide findings · pass 1 · 5 of 9", "Decide findings · 5/9"], pos: "Pass 1" },
  r2: { kind: "review", name: "Crash on share sheet when offline", repo: "ios", pr: 312, idle: true, pos: "Published · changes requested" },
};
const OPEN = "t1";
const TREE = [
  { id: "reviews", label: "Reviews", tip: "Open Reviews", extra: `<span class="x">4 pending</span>`, items: ["r1", "r2"] },
  { id: "plat", label: "Platform Roadmap", tip: "Open the Platform Roadmap board", epics: [{ id: "ep", label: "API hardening", tip: "API hardening · epic", items: ["t1", "t7"] }], items: ["t3", "t8", "d1"] },
  { id: "mob", label: "Mobile App", tip: "Open the Mobile App board", extra: `<span class="x warn" data-tip="Last read failed 18m ago · GitHub API rate limit"><span class="st st-warn" aria-hidden="true"></span>Read failed</span>`, items: ["t2", "t4", "t5", "d2"] },
  { id: "nob", label: "No board", tip: "Items without a board", notices: ["infra"], items: ["t6"] },
];
const sortSits = (s) => [...(s || [])].sort((a, b) => SEV[a.sev] - SEV[b.sev] || b.min - a.min);
const needsYou = (i) => !!(i.sits && i.sits.length);
const tone = (i) => needsYou(i) ? sortSits(i.sits)[0].sev : i.run ? "run" : i.gh ? "gh" : i.paused ? "paused" : "idle";
const nextJ = Object.keys(ITEMS).filter((id) => id !== OPEN && needsYou(ITEMS[id])).sort((a, b) => {
  const x = sortSits(ITEMS[a].sits)[0], y = sortSits(ITEMS[b].sits)[0];
  return SEV[x.sev] - SEV[y.sev] || y.min - x.min;
})[0];

// ---------------- Atoms ----------------
const I = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const st = (t, label, extra = "") => `<span class="st st-${t} ${extra}" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}></span>`;
const ty = (i) => `<svg class="ty" aria-hidden="true"><use href="#i-${i.kind === "task" ? (i.oneshot ? "oneshot" : "task") : i.kind}"/></svg>`;
const tipWord = (s) => s.sev === "error" ? "Error · waiting for you" : s.sev === "close" ? "Ready to close" : "Waiting for you";
const tw = (s) => `<span class="tw tw-${s.sev}" data-tip="${tipWord(s)} for ${s.long}"><span class="sr">${s.sev === "error" ? "error, " : ""}waiting for you </span>${s.since}</span>`;
const tt = (r) => `<span class="tt" data-tip="Agent working on this turn for ${r.long}"><span class="sr">agent working </span>${r.turn}</span>`;
const ctxm = (p, cls = "") => `<span class="ctx ${cls}" data-tip="Context window ${p}% used" role="meter" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="Context window"><span class="trk"><span class="fil" style="--p:${p}"></span></span><span class="pc">${p}%</span></span>`;
const kindWord = (i) => i.kind === "task" ? (i.oneshot ? "One-Shot task" : "task") : i.kind === "review" ? "pull request review" : "discussion";
function meta(i) {
  if (i.kind === "task") return (i.card ? `${i.repo}#${i.card}` : i.repo) + (i.oneshot ? " · One-Shot" : "");
  if (i.kind === "review") return `${i.repo}#${i.pr}`;
  return `#${i.cards.join(" #")}`;
}
function ariaFor(i) {
  const p = [`${kindWord(i)} ${i.name}`];
  if (needsYou(i)) p.push(sortSits(i.sits).map((s) => `${TONE_WORD[s.sev]}: ${s.label} · ${s.place}, for ${s.long}`).join("; "), i.pos);
  else p.push(`${TONE_WORD[tone(i)]}, ${i.pos}`);
  if (i.run) p.push(`${i.run.who} working for ${i.run.long}: ${i.run.verb} ${i.run.target}`, `context ${i.ctx}% used`);
  p.push(meta(i));
  return p.join(". ");
}

// ---------------- Sidebar ----------------
function itemRow(id, level, opts = {}) {
  const i = ITEMS[id], t = tone(i), sel = opts.sel !== undefined ? opts.sel : id === OPEN;
  let l2 = "", r2 = "", l3 = "";
  if (needsYou(i)) {
    const s = sortSits(i.sits)[0];
    const more = i.sits.length > 1 ? `<span class="more" data-tip="${sortSits(i.sits).slice(1).map((x) => `${x.label} · ${x.place} · ${x.since}`).join(", ")}">+${i.sits.length - 1}</span>` : "";
    l2 = `<span class="lbl trunc"><span class="long">${i.row[0]}</span><span class="short">${i.row[1]}</span></span>${more}`;
    r2 = tw(s);
  } else if (i.run) {
    l2 = `<span class="lbl trunc"><span class="long">${i.pos}</span><span class="short">${i.posShort}</span></span>`;
    r2 = tt(i.run);
    l3 = `<span class="c1"></span><span class="l3 trunc"><span class="long"><span class="v">${i.run.verb}</span> ${i.run.target}</span><span class="short"><span class="v">${i.run.verb}</span> ${i.run.short}</span></span><span class="r3">${ctxm(i.ctx)}</span>`;
  } else {
    const word = t === "gh" ? "GitHub" : t === "idle" ? "idle" : "";
    l2 = `<span class="lbl trunc">${i.pos}</span>`;
    r2 = word ? `<span class="rw">${word}</span>` : "";
  }
  const jk = nextJ === id && !opts.noJ;
  const r1 = jk ? `<span class="meta jk" data-tip="Ctrl+J opens this next"><kbd class="jk">Ctrl J</kbd></span>` : `<span class="meta">${meta(i)}</span>`;
  const cls = [sel ? "sel" : "", needsYou(i) ? "you" : "", t === "error" ? "err" : "", jk ? "jk-row" : "", opts.cls || ""].join(" ");
  const focusable = sel && !opts.demo;
  return `<div class="it ${cls}" role="treeitem" aria-level="${level}" tabindex="${focusable ? 0 : -1}" ${focusable ? 'aria-current="page" aria-selected="true"' : ""} data-meta="${meta(i)}" aria-label="${ariaFor(i)}">
    <span class="c1">${ty(i)}</span><span class="nm trunc">${i.name}</span><span class="r1">${r1}</span>
    <span class="c1">${st(t)}</span><span class="l2">${l2}</span><span class="r2">${r2}</span>${l3}</div>`;
}
function nodeRow(n, level, kind, collapsed, summary, cls = "", owns = "") {
  const go = kind !== "epic" ? I("go", "i go") : "";
  return `<div class="node ${kind} ${cls}" role="treeitem" aria-level="${level}" aria-expanded="${collapsed ? "false" : "true"}" ${owns ? `aria-owns="${owns}"` : ""} tabindex="-1" data-tip="${n.tip || n.label}">${I("down", "i chev")}<span class="lbl trunc">${n.label}${go}</span>${summary || n.extra || "<span></span>"}</div>`;
}
function noticeRow(r) {
  return `<div class="it notice" role="treeitem" aria-level="2" tabindex="-1" aria-label="acme/${r}: the clone at ~/code/${r} is missing. Enter to change the path." data-tip="The clone at ~/code/${r} is missing">

// ---------------- Contrast, distance and the pixel audit ----------------
const TEXT_PAIRS = [
  ["Text", "--ink-1", "--surface-1"], ["Secondary", "--ink-2", "--surface-1"], ["Muted", "--ink-3", "--surface-1"], ["Faint", "--ink-4", "--surface-1"],

];
// Where ink 4 is not used: measured so the rule in the tokens stays true.
const NOT_PAIRS = [["Faint on the open row", "--ink-4", "--brand-veil"], ["Faint on a pressed sidebar row", "--ink-4", "--veil-press@--surface-sidebar"], ["Faint on the hovered open row", "--ink-4", "--veil-hover@--brand-veil"], ["Faint on a tint", "--ink-4", "--brand-tint"], ["Faint on the wait chip", "--ink-4", "--state-wait-chip"]];
const DE_PAIRS = [
  ["Identity · wait", "--brand", "--state-wait-glyph", 0.15], ["Identity · error", "--brand", "--state-error", 0.15], ["Identity · closing", "--brand", "--state-close", 0.15], ["Identity · working", "--brand", "--state-work", 0.15],
  ["Error · wait", "--state-error", "--state-wait-glyph", 0.15], ["Wait · closing", "--state-wait-glyph", "--state-close", 0.15], ["Open row ring · wait", "--brand-ring", "--state-wait-glyph", 0.15], ["Open row veil · wait veil", "--brand-veil", "--state-wait-veil", 0.05],
];
const need = (k) => (k === "ui" ? 3 : k === "body" ? 1.1 : k === "info" || k === "not" ? 0 : 4.5);
function crCell(r, k) {
  const n = need(k), okk = r >= n;
  return `<span class="cr"><span class="${k === "info" || k === "not" ? "info" : okk ? "pass" : "fail"}">${r.toFixed(2)}</span> <span class="w">${k === "not" ? "not used here" : k === "info" ? "tone" : okk ? (k === "ui" ? "≥ 3" : k === "body" ? "≥ 1.1" : "AA") : "fails"}</span></span>`;
}
function contrastSection() {
  const L = document.getElementById("m-light"), D = document.getElementById("m-dark");
  const all = [...TEXT_PAIRS.map((p) => [...p, "text"]), ...UI_PAIRS.map((p) => [...p, "ui"]), ...TONE_PAIRS.map((p) => [p[0], p[1], p[2], p[3] || "info"]), ...NOT_PAIRS.map((p) => [...p, "not"])];
  let fails = 0, min = { text: [9, 9], ui: [9, 9] };
  const rows = all.map(([n, fg, bg, k]) => {
    const l = ratioIn(L, fg, bg), d = ratioIn(D, fg, bg);
    if (k !== "info" && (l < need(k) || d < need(k))) fails++;
    if (min[k]) { min[k][0] = Math.min(min[k][0], l); min[k][1] = Math.min(min[k][1], d); }
    return `<tr><td>${n}</td><td><code>${fg.replace(/~/g, " | ")} / ${bg}</code></td><td class="nw">${k === "text" ? "text 4.5" : k === "ui" ? "glyph, ring 3" : k === "body" ? "body 1.1" : k === "not" ? "ink 4 not used" : "tone only"}</td><td>${crCell(l, k)}</td><td>${crCell(d, k)}</td></tr>`;
  }).join("");

    return `<tr><td>${n}</td><td><code>${a} / ${b}</code></td><td class="nw">≥ ${m}</td><td><span class="cr ${l < m ? "fail" : "pass"}">${l.toFixed(3)}</span></td><td><span class="cr ${d < m ? "fail" : "pass"}">${d.toFixed(3)}</span></td></tr>`; }).join("");
  window.__CONTRAST = { pairs: all.length + DE_PAIRS.length, fails, min };

    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pair</th><th>Tokens (fg / bg; a@b is a painted over b)</th><th>Minimum</th><th>Light</th><th>Dark</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Distance</th><th>Tokens</th><th>Minimum ΔE OKLab</th><th>Light</th><th>Dark</th></tr></thead><tbody>${des}</tbody></table></div>
    <p class="sp-note">Computed on this page from the painted colors of two hidden scopes, one per mode, with WCAG 2 relative luminance. "Ink 4 not used" rows are the backgrounds where the tokens forbid --ink-4 (the open row lifts its meta to --ink-3); they are measured so the rule stays true. "Tone only" rows have no minimum: another carrier (glyph, word, shadow) holds the meaning. ΔE is the Euclidean distance in OKLab; two veils both sit near the page, so theirs is 0.05.</p>`;
}
function pixelAudit() {
  // Sizes that the system fixes must be whole pixels: controls, rows, glyphs, chips, meters, keys, avatars.
  const frac = (v) => Math.abs(v - Math.round(v)) > 0.01;
  const H = [".btn", ".chip", ".input", ".it", ".node", ".sw", ".stg", ".tw", "kbd", ".ask-in", ".mi", ".acts > summary", ".tag", ".opt .kn", ".newmsg"];
  const W = [".st:not(.st-error):not(.st-warn):not(.st-run)", ".ctx .trk", ".segs i", ".who .av", ".brand .mark", ".btn.icon", ".opt .kn", ".it > .c1"];
  const bad = []; let n = 0;
  document.querySelectorAll(".scope").forEach((sc) => {
    H.forEach((s) => sc.querySelectorAll(s).forEach((el) => { const r = el.getBoundingClientRect(); if (!r.height) return; n++; if (frac(r.height)) bad.push(`${sc.dataset.theme} ${s} height ${r.height.toFixed(2)}`); }));
    W.forEach((s) => sc.querySelectorAll(s).forEach((el) => { const r = el.getBoundingClientRect(); if (!r.width) return; n++; if (frac(r.width)) bad.push(`${sc.dataset.theme} ${s} width ${r.width.toFixed(2)}`); }));
  });
  window.__AUDIT = { n, bad: bad.length };
  const S = STATIC_AUDIT;
  return `<div class="audit-sum"><span>Fixed sizes checked <b>${n}</b></span><span>Not a whole pixel <b class="${bad.length ? "bad" : ""}">${bad.length}</b></span><span>Color literals outside the tokens <b class="${S.colors.length ? "bad" : ""}">${S.colors.length}</b></span><span>Length literals outside the tokens <b>${S.lengths.length}</b></span></div>
    ${bad.length ? `<pre class="sp-note">${bad.slice(0, 40).join("\n")}</pre>` : ""}
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Check</th><th>Result</th><th>Rule</th></tr></thead><tbody>
      <tr><td>Heights of controls, rows, chips, keys, tabs, menu items, the ask bar</td><td>${n - bad.length} of ${n} whole</td><td>Heights come from rem tokens at a 16px root</td></tr>
      <tr><td>Widths of glyphs, meter tracks, segments, avatars, icon buttons, the glyph column</td><td>included above</td><td>Glyphs are even so they center on a whole pixel; the rotated diamond and the spinning ring are left to the engine</td></tr>
      <tr><td>Positions in the scene</td><td>see <code>index.html?audit</code></td><td>Regions, rows, glyph columns, meters, the card, the ask bar and the composer land on whole pixels at any width (round() on the centered columns); what follows text keeps the engine's rounding</td></tr>
      <tr><td>Color literals in the component and page CSS</td><td>${S.colors.length ? S.colors.join(", ") : "none"}</td><td>Every color is a token</td></tr>
      <tr><td>Length literals in the component and page CSS</td><td><code>${S.lengths.join("  ")}</code></td><td>Allowed only as geometry: 0, 50% and 100% for centering and fill, 100vh for the window, 1px for the screen-reader clip, the stops of the shimmer and of the fade, 80% as the width limit of your message, and the container query breakpoints of structure.md §6 (a query can't read a token)</td></tr>
    </tbody></table></div>`;
}

// ---------------- Page ----------------
const SECTIONS = [["type", "Type", "Two registers: a compact chrome and a reading conversation.", typeSection, true], ["neutrals", "Neutrals and surfaces", "", neutralSection], ["identity", "Identity", "", identitySection], ["states", "States", "", statesSection],

      <div class="switch" role="tablist" aria-label="Modes shown">${show("both", "Both")}${show("light", "Light")}${show("dark", "Dark")}</div></div>

    <div id="m-light" data-theme="light" class="sr" aria-hidden="true"></div><div id="m-dark" data-theme="dark" class="sr" aria-hidden="true"></div>`;
  document.body.classList.toggle("only-light", SHOW === "light"); document.body.classList.toggle("only-dark", SHOW === "dark");
  // The lightness of each ramp step, read from its painted color.

  document.getElementById("contrast-out").innerHTML = contrastSection();

  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
}
let SHOW_STATE = SHOW;
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-show]"); if (!b) return;
  SHOW_STATE = b.dataset.show; const u = new URLSearchParams(location.search); if (SHOW_STATE === "both") u.delete("show"); else u.set("show", SHOW_STATE);
  history.replaceState(null, "", u.toString() ? `?${u}` : location.pathname);
