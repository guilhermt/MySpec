<style id="tokens">
/* ===== tokens-draft.css · verbatim, do not edit here ===== */
/* =====================================================================
   MySpec design tokens · theme Grafite quente
   Draft of design/system/tokens.css (round 08-visual-final).

   How to read it
   - Every value the interface paints or measures lives here. Components use
     these names and nothing else: no color, size or duration outside this file.
   - Three layers of blocks:
       1. :root                            values that do not depend on the mode;
       2. :root, [data-theme="light"]      the light colors (the default);
          @media dark, :root without light the dark colors, following the system;
          [data-theme="dark"]              the dark colors, fixed by the user or
                                           forced on a subtree (the specimen);
       3. :root, [data-theme]              derived tokens (washes and veils),
                                           declared on every scope so they
                                           resolve against that scope's colors.
   - Sizes are rem at a 16px root and land on whole pixels: WebKitGTK blurs
     half pixels (brief.md §9).
   - Colors are OKLCH. The neutral carries a trace of warmth: surfaces and lines
     at hue 65 (chroma 0.004), inks at hue 60 (chroma 0.01), the sidebar at 68 in
     light and 62 in dark. The identity is an electric blue eased toward cobalt,
     hue 260.
   - A token that means the same as another is written as var(), never as a copy
     of its value: the aliases live in the last block.
   - The dark colors are written twice (system setting and fixed choice) because
     the mocks follow the system with CSS alone. In the app the theme is always
     set by script on data-theme, so design/system/tokens.css keeps one dark block.
   ===================================================================== */

:root {
  /* Type families: one sans for chrome and reading, one mono for code, paths and keys. */
  --font-ui: "Fira Sans", system-ui, sans-serif;
  --font-read: "Fira Sans", system-ui, sans-serif;
  --font-mono: "Fira Code", ui-monospace, monospace;

  /* Type sizes and leading, paired: the chrome register (caps to ui) and the reading register (body, read, code). */
  --text-caps: 0.6875rem;    --leading-caps: 1rem;
  --text-micro: 0.75rem;     --leading-micro: 1rem;
  --text-meta: 0.8125rem;    --leading-meta: 1.125rem;
  --text-ui: 0.875rem;       --leading-ui: 1.25rem;
  --text-body: 0.9375rem;    --leading-body: 1.375rem;
  --text-read: 1rem;         --leading-read: 1.625rem;
  --text-title: 1.125rem;    --leading-title: 1.5rem;
  --text-display: 1.375rem;  --leading-display: 1.75rem;
  --text-code: 0.8125rem;    --leading-code: 1.25rem;
  --text-code-read: 0.875rem;  /* inline code inside the reading register; it takes the line's leading */

  /* Weights: hierarchy comes from weight before color. A name that waits for you is 600, any other name 400. */
  --weight-regular: 400; --weight-medium: 500; --weight-strong: 600; --weight-bold: 700;
  --weight-name: 400; --weight-name-waiting: 600;
  --tracking-caps: 0.07em;

  /* Measure: the conversation column and the reading line inside it. */
  --measure: 50rem;
  --measure-read: 42rem;

  /* Space: a 4px grid with two half steps for tight chrome. */
  --space-0-5: 0.125rem; --space-1: 0.25rem; --space-1-5: 0.375rem; --space-2: 0.5rem; --space-2-5: 0.625rem;
  --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;

  /* Radius: grows with the size and the elevation of the object. */
  --radius-xs: 0.1875rem; --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-pill: 999px;

  /* Strokes: borders, the error rail, focus. Focus sits outside with a gap; selection sits inside. */
  --border: 1px; --border-2: 2px; --error-rail: 3px; --radius-glyph: 1px;
  --focus-width: 2px; --focus-offset: 2px; --halo: 3px;

  /* Control and chrome sizes. */
  --size-control: 2rem; --size-control-sm: 1.75rem; --size-control-xs: 1.375rem;
  --size-chip: 1.75rem; --size-time-chip: 1.125rem; --size-kbd: 1.125rem; --size-kbd-sm: 1rem;
  --size-head: 3rem; --size-progress: 2.5rem; --size-node: 1.75rem; --size-tab: 1.75rem; --size-ask: 2.75rem;
  --size-composer-min: 3.5rem; --size-mark: 1.5rem; --size-avatar: 1.5rem; --size-more-below: 1.75rem;
  --size-menu-min: 14rem; --size-dialog: 30rem; --size-toast: 22rem; --size-tooltip-max: 20rem;

  /* Icons and status glyphs. Glyphs are even so they center on a whole pixel. */
  --icon: 1rem; --icon-sm: 0.875rem; --icon-xs: 0.75rem; --icon-stroke: 1.5;
  --glyph: 0.625rem; --glyph-sm: 0.5rem; --glyph-diamond: 0.5rem; --glyph-bar: 0.1875rem;

  /* Meters: the context meter and the step segments of the current stage. */
  --meter-w: 2.5rem; --meter-h: 0.25rem; --meter-label: 2rem;
  --seg-w: 0.75rem; --seg-w-current: 1.25rem; --seg-h: 0.25rem; --seg-gap: 0.1875rem;

  /* The tree: row rhythm, the epic indent and its guide under the epic's chevron. */
  --tree-pad: 0.5rem; --row-pad-y: 0.375rem; --row-gap: 0.25rem; --line-gap: 0.125rem; --section-gap: 1.5rem;
  --epic-indent: 1rem; --guide-x: 0.9375rem;

  /* Layout: continuous widths, one rule per container (structure.md §6). The sidebar is drawn; the collapsed strip,
     the panel and the decision column are the rules of structure.md §2 and §3, reserved for the screens of phase 4. */
  --sidebar-width: round(down, clamp(18rem, calc(8vw + 12.5rem), 23.75rem), 1px);
  --sidebar-collapsed: 3.75rem;
  --panel-width: clamp(22.5rem, 28%, 30rem);
  --decision-width: clamp(18.75rem, 24%, 26.25rem);

  /* Small fixed pieces of content. */
  --key-size: 1.25rem; --action-verb-w: 3.5rem; --list-indent: 1.25rem; --newmsg-w: 8.5rem;
  --code-pad-y: 0.0625rem; --code-pad-x: 0.3125rem; --fade: 1.5rem; --link-offset: 0.2em;

  /* Motion: three durations and one standard curve; the spinner is the only loop. prefers-reduced-motion zeroes all of it. */
  --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 280ms;
  --duration-spin: 900ms; --duration-shimmer: 1400ms; --delay-tooltip: 500ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, 0, 1);
  --ease-exit: cubic-bezier(0.3, 0, 1, 1);

  /* Stacking: sticky heads, the item header, floating pieces, the dialog, toasts and tooltips. */
  --z-sticky: 2; --z-header: 3; --z-float: 4; --z-overlay: 50; --z-toast: 60; --z-tooltip: 70;

  /* Link underline: permanent and quiet, full on hover. The key hint on a primary button: the same in both modes. */
  --mix-link-line: 45%; --mix-key: 45%;
}

/* ---------------------------------------------------------------------
   LIGHT (the default)
   --------------------------------------------------------------------- */
:root, [data-theme="light"] {
  color-scheme: light;

  /* Surfaces in layers: 0 sunken (code, action groups, the quiet ask bar), 1 the ground (conversation, header),
     2 raised (cards, buttons, the selected tab), 3 floating (menus, tooltips' neighbors, dialogs, toasts).
     In light, 2 and 3 share white and differ by shadow. */
  --surface-0: oklch(0.962 0.004 65);
  --surface-1: oklch(0.995 0.001 65);
  --surface-2: oklch(1 0 0);
  --surface-3: oklch(1 0 0);
  --surface-input: oklch(1 0 0);
  --surface-user: oklch(0.95 0.005 60);

  /* The sidebar: in the tone of the page, one step down, with its own input, divider, control border and epic guide (3:1). */
  --surface-sidebar: oklch(0.945 0.007 68);
  --sidebar-input: oklch(0.975 0.004 68);
  --sidebar-line: oklch(0.885 0.008 68);
  --sidebar-control: oklch(0.595 0.011 68);

  /* Lines: 1 divider, 2 quiet border (buttons, chips), 3 control border at 3:1 (inputs, composer, dashed disabled). */
  --line-1: oklch(0.912 0.004 65);
  --line-2: oklch(0.86 0.005 65);
  --line-3: oklch(0.63 0.006 65);

  /* Ink: 1 text, 2 secondary, 3 muted (line 2 of a row, the agent's clock), 4 faint (meta, line 3, timestamps).
     1 to 3 pass 4.5:1 on every surface and veil of the system. 4 passes on the surfaces 0 to 3, the sidebar, the user
     message and the wait veil, and is NOT for: the open row (--brand-veil; the row lifts its meta to ink 3), a pressed
     or hovered open row, a pressed veil on the sidebar, --brand-tint and --state-wait-chip (dark). */
  --ink-1: oklch(0.2 0.01 60);
  --ink-2: oklch(0.36 0.009 60);
  --ink-3: oklch(0.455 0.007 60);
  --ink-4: oklch(0.495 0.006 60);

  /* Identity: the solid, its hover and press, the ink on it, the identity as text, the ring of the open row, the meter track. */
  --brand: oklch(0.52 0.175 260);
  --brand-hover: oklch(0.48 0.175 260);
  --brand-active: oklch(0.44 0.166 260);
  --brand-on: oklch(1 0 0);
  --brand-ink: oklch(0.49 0.17 260);
  --brand-ring: oklch(0.58 0.158 260);
  --brand-track: oklch(0.9 0.039 260);

  /* The ink of neutral veils (hover, press): a trace of the identity, never a gray from nowhere. */
  --veil-ink: oklch(0.3 0.061 260);

  /* Veil strengths, one per role. */
  --mix-hover: 6%; --mix-press: 10%; --mix-select: 12%; --mix-tint: 12%; --mix-tint-hover: 18%; --mix-tint-press: 24%;
  --mix-halo: 24%; --mix-seg: 26%; --mix-marker: 30%;

  /* Error: the loudest color, never alone: the diamond, the square chip with !, the rail. */
  --state-error: oklch(0.52 0.195 22);
  --state-error-hover: oklch(0.48 0.195 22);
  --state-error-press: oklch(0.44 0.185 22);
  --state-error-veil: oklch(0.962 0.02 22);
  --state-error-on: oklch(1 0 0);

  /* Waiting for you: amber. Text, glyph (and its contour), the veil of a request, its line, the time chip. */
  --state-wait: oklch(0.5 0.11 62);
  --state-wait-glyph: oklch(0.58 0.14 75);
  --state-wait-veil: oklch(0.965 0.035 85);
  --state-wait-line: oklch(0.86 0.08 80);
  --state-wait-chip: oklch(0.945 0.05 85);
  --state-wait-chip-ink: oklch(0.42 0.09 62);

  /* Ready to close: green, a ring and an outlined chip. */
  --state-close: oklch(0.5 0.13 145);

  /* Code: four hues at the lightness of the ink, the comment is faint ink. */
  --code-keyword: oklch(0.47 0.13 260);
  --code-string: oklch(0.47 0.1 150);
  --code-function: oklch(0.45 0.11 305);
  --code-number: oklch(0.5 0.12 55);

  /* Floating pieces: the tooltip is the one inverted surface; the scrim dims the app under a dialog. */
  --tooltip-surface: oklch(0.26 0.008 60);
  --tooltip-ink: oklch(0.97 0.003 60);
  --tooltip-ink-2: oklch(0.8 0.005 60);
  --scrim: oklch(0.2 0.01 60 / 0.28);

  /* Elevation: every shadow is the warm neutral, never black. Plane, button, xs (a raised control), card, float, overlay. */
  --shadow-hue: oklch(0.3 0.03 65);
  --sheen: oklch(1 0 0 / 0.12);
  --rim: color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 6%, transparent);
  --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 22%, transparent), inset 0 1px 0 var(--sheen);
  --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 8%, transparent), 0 0 0 1px var(--rim);
  --shadow-card: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 6%, transparent), 0 8px 20px color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 16%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 20%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(0 0 0 / 0.08);
}

/* ---------------------------------------------------------------------
   DARK: the same roles, lifted surfaces instead of shadows, lighter inks.
   Written twice: for the system setting and for a fixed choice or subtree.
   --------------------------------------------------------------------- */

  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: oklch(0.175 0.005 65); --surface-1: oklch(0.205 0.005 65); --surface-2: oklch(0.255 0.006 65); --surface-3: oklch(0.275 0.006 65);
    --surface-input: oklch(0.18 0.005 65); --surface-user: oklch(0.265 0.005 60);
    --surface-sidebar: oklch(0.165 0.008 62); --sidebar-input: oklch(0.2 0.008 62); --sidebar-line: oklch(0.245 0.008 62); --sidebar-control: oklch(0.505 0.01 62);
    --line-1: oklch(0.29 0.006 65); --line-2: oklch(0.35 0.007 65); --line-3: oklch(0.55 0.008 65);
    --ink-1: oklch(0.94 0.005 60); --ink-2: oklch(0.84 0.005 60); --ink-3: oklch(0.75 0.005 60); --ink-4: oklch(0.69 0.005 60);
    --brand: oklch(0.72 0.135 259); --brand-hover: oklch(0.77 0.135 259); --brand-active: oklch(0.67 0.135 259); --brand-on: oklch(0.16 0.041 259);
    --brand-ink: oklch(0.79 0.1 259); --brand-ring: oklch(0.6 0.122 259); --brand-track: oklch(0.3 0.047 259);
    --veil-ink: oklch(0.92 0.034 259);
    --mix-hover: 7%; --mix-press: 11%; --mix-select: 18%; --mix-tint: 16%; --mix-tint-hover: 22%; --mix-tint-press: 28%;
    --mix-halo: 32%; --mix-seg: 30%; --mix-marker: 36%;
    --state-error: oklch(0.72 0.16 25); --state-error-hover: oklch(0.77 0.15 25); --state-error-press: oklch(0.67 0.16 25);
    --state-error-veil: oklch(0.27 0.05 25); --state-error-on: oklch(0.16 0.03 25);
    --state-wait: oklch(0.83 0.13 80); --state-wait-glyph: oklch(0.8 0.15 78);
    --state-wait-veil: oklch(0.27 0.045 80); --state-wait-line: oklch(0.42 0.08 78); --state-wait-chip: oklch(0.33 0.07 78); --state-wait-chip-ink: oklch(0.9 0.1 85);
    --state-close: oklch(0.78 0.15 145);
    --code-keyword: oklch(0.8 0.1 260); --code-string: oklch(0.8 0.09 150); --code-function: oklch(0.82 0.08 305); --code-number: oklch(0.8 0.1 55);
    --tooltip-surface: oklch(0.34 0.006 65); --tooltip-ink: oklch(0.96 0.004 60); --tooltip-ink-2: oklch(0.82 0.005 60); --scrim: oklch(0.05 0.005 60 / 0.6);
    --shadow-hue: oklch(0.08 0.01 65); --sheen: oklch(1 0 0 / 0.2); --rim: oklch(1 0 0 / 0.07);
    --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 30%, transparent);
    --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 45%, transparent), inset 0 1px 0 var(--sheen);
    --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 40%, transparent), 0 0 0 1px var(--rim);
    --shadow-card: 0 0 0 1px oklch(1 0 0 / 0.04), 0 8px 24px color-mix(in srgb, var(--shadow-hue) 50%, transparent);
    --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 60%, transparent), 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 70%, transparent), 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.25), inset 0 0 0 1px oklch(0 0 0 / 0.12);
  }
}

/* ---------------------------------------------------------------------
   ALIASES AND DERIVED: names that mean another token, and veils and washes
   mixed from the tokens above. Declared on every
   scope, so a subtree with its own data-theme mixes its own colors.
   --------------------------------------------------------------------- */
:root, [data-theme] {
  /* Aliases: the states without a situation are the neutral inks (the agent working in motion, GitHub, paused, idle). */
  --state-work: var(--ink-2); --state-work-track: var(--line-2); --state-github: var(--ink-3); --state-paused: var(--ink-3);
  --state-idle: var(--ink-4); --state-notice: var(--ink-2);
  /* Aliases: focus is the identity; the wait contour is the glyph unless a theme needs a darker one; the epic guide is the
     sidebar's control border; not-started glyphs and › separators use the control line; code comments are faint ink. */
  --focus: var(--brand); --state-wait-ring: var(--state-wait-glyph); --sidebar-guide: var(--sidebar-control);
  --line-deco: var(--line-3); --code-comment: var(--ink-4);

  /* Neutral veils, for hover and press on any surface; on a raised control they are mixed into it. */
  --veil-hover: color-mix(in srgb, var(--veil-ink) var(--mix-hover), transparent);
  --veil-press: color-mix(in srgb, var(--veil-ink) var(--mix-press), transparent);
  --surface-2-hover: color-mix(in srgb, var(--veil-ink) var(--mix-hover), var(--surface-2));
  --surface-2-press: color-mix(in srgb, var(--veil-ink) var(--mix-press), var(--surface-2));

  /* Identity washes: the open row on the sidebar (veil), a pressed or chosen control (tint), the same on the ground (tint-plane). */
  --brand-veil: color-mix(in srgb, var(--brand) var(--mix-select), var(--surface-sidebar));
  --brand-tint: color-mix(in srgb, var(--brand) var(--mix-tint), var(--surface-2));
  --brand-tint-hover: color-mix(in srgb, var(--brand) var(--mix-tint-hover), var(--surface-2));
  --brand-tint-press: color-mix(in srgb, var(--brand) var(--mix-tint-press), var(--surface-2));
  --brand-tint-plane: color-mix(in srgb, var(--brand) var(--mix-tint), var(--surface-1));

  /* Identity details: the segments still to do, the agent marker's ring, the key hint on a primary button, the focus halo. */
  --brand-seg-todo: color-mix(in srgb, var(--brand) var(--mix-seg), var(--surface-1));
  --brand-marker-ring: color-mix(in srgb, var(--brand) var(--mix-marker), transparent);
  --brand-key-ring: color-mix(in srgb, var(--brand-on) var(--mix-key), transparent);

function convHead() {

      ${sw("Implementer", st("wait", "waiting for you, 4 minutes"), "Permission", "4 minutes")}${sw("Reviewer", st("wait", "waiting for you, 18 minutes"), "Question", "18 minutes")}</div>
    <div class="tools"><button class="btn sm" data-tip="Take the review of step 3 from the agent">Review myself</button><button class="btn sm" data-tip="Open the worktree of step 3">Open in VS Code</button><button class="btn ghost sm" data-tip="Discard step 3 and its changes…">Discard step…</button></div></div>`;
}
function askBar(kind) {
  const i = ITEMS.t1;
  if (kind === "error") return `<div class="ask-in err" role="region" aria-label="What this item asks"><span class="what">${st("error")}<span class="lbl">Session error</span><span class="muted">· Plan</span>${tw({ sev: "error", since: "7m", long: "7 minutes" })}</span>
    <span class="adet">Claude Code stopped unexpectedly · exit status 1</span><span class="acts-r"><button class="btn sm primary">Retry</button></span></div>`;
  if (kind === "drafts") return `<div class="ask-in" role="region" aria-label="What this item asks"><span class="what">${st("wait")}<span class="lbl">Decide drafts</span>${tw({ sev: "wait", since: "22m", long: "22 minutes" })}</span>
    <span class="adet">3 of 6 decided · 1 epic ready to publish</span><span class="acts-r"><button class="btn sm">Hide drafts</button><button class="btn sm">${I("arrow-down")}Next to decide <span class="k">Alt ↓</span></button></span></div>`;
  if (kind === "approve") return `<div class="ask-in" role="region" aria-label="What this item asks"><span class="what">${st("wait")}<span class="lbl">Review step 2</span><span class="muted">· Step 2/4</span>${tw({ sev: "wait", since: "9m", long: "9 minutes" })}</span>
    <span class="adet">5 of 7 files staged · 71%</span><span class="acts-r"><button class="btn sm">Open in VS Code</button><span class="why" id="why-approve">Stage 2 more files</span><button class="btn sm primary" disabled aria-describedby="why-approve">Approve</button></span></div>`;
  if (kind === "other") return `<div class="ask-in quiet" role="region" aria-label="What this item asks"><span class="what">${st("wait")}<span class="lbl">Question</span><span class="muted">· in Reviewer · Step 3/7</span>${tw(i.sits[0])}</span>
    <span class="adet">This conversation waits for nothing</span><span class="acts-r"><button class="btn sm">Go to Reviewer</button></span></div>`;
  const s = S.tab === "Reviewer" ? i.sits[0] : i.sits[1];
  return `<div class="ask-in quiet" role="region" aria-label="What this item asks">
    <span class="what">${st("wait")}<span class="lbl">${s.label}</span><span class="muted">· ${s.place} · Step 3/7</span>${tw(s)}</span>
    <span class="acts-r"><span class="sr" role="status">${s.label} in ${s.place}</span><button class="btn sm" data-act="show" data-tip="Go to the card · the first option takes the focus">${I("up")}Show</button></span></div>`;
}
let CID = 0;
function composer(state, why) {
  const ph = state === "paused" ? "Sending resumes the task…" : S.tab === "Reviewer" ? "Answer with 1–3, or reply to the reviewer…" : "Reply to the implementer…";
  if (state === "disabled") return `<div class="cbox is-disabled"><label class="sr" for="reply-d-${++CID}">Reply</label><textarea id="reply-d-${CID}" rows="1" disabled placeholder="The review conversation starts when the checks finish."></textarea>
    <div class="cfoot"><button class="chip" disabled>Opus · high</button><span class="grow"></span><button class="btn sm" disabled ${why ? `aria-describedby="${why}"` : ""}>Send</button></div></div>`;
  if (state === "working") return `<div class="cbox"><label class="sr" for="reply-w-${++CID}">Reply to the reviewer</label><textarea id="reply-w-${CID}" rows="2" placeholder="Queue a message for the reviewer…"></textarea>
    <div class="cfoot"><button class="chip" data-tip="Model and effort from the next message">Opus · high${I("down")}</button><span class="grow"></span><span class="hint">The agent is working · a message waits in the queue</span><button class="btn sm" data-tip="Stop the answer · the session stays">${I("x")}Stop</button></div></div>`;
  const filled = state === "filled" || state === "filled-card" || state === "loading" || state === "error";
  const id = state ? `reply-${state}-${++CID}` : "reply";
  const cls = { hover: "is-hover", focus: "is-focus", active: "is-active", loading: "is-loading", error: "is-error" }[state] || "";
  const send = state === "loading" ? `<button class="btn sm primary is-loading" aria-busy="true"><span class="spin"></span>Sending…</button>` : state === "error" ? `<span class="hint err">Not sent · the session stopped</span><button class="btn sm primary">Send again</button>` : `<button class="btn sm ${filled && state !== "filled-card" ? "primary" : ""}" data-send>Send</button>`;
  return `<div class="cbox ${cls}"><label class="sr" for="${id}">Reply to the ${S.tab.toLowerCase()}</label>
    <textarea id="${id}" rows="2" placeholder="${ph}">${filled ? "Go with 2, and add a note about the lookup cache to the tech spec." : ""}</textarea>
    <div class="cfoot"><button class="chip" data-tip="Model and effort from the next message">Opus · high${I("down")}</button><span class="grow"></span>${state === "error" || state === "loading" ? "" : `<span class="hint">Enter to send · Shift+Enter for a new line</span>`}${send}</div></div>`;
}

// ---------------- Tooltips and truncation: one tooltip for the whole page ----------------
// Anything with data-tip gets the system tooltip after a pause, on hover and on keyboard focus.
// Truncated text gets its full text as the tooltip: that is the rule for any name that cuts.
const within = (root, sel) => [...(root.matches && root.matches(sel) ? [root] : []), ...root.querySelectorAll(sel)];
function markTruncated(root = document) {
  // The meta of a row shows (hover, focus, open row) only when it fits beside the whole name.
  within(root, ".it[data-meta]").forEach((row) => {
    if (row.classList.contains("jk-row")) return;
    const nm = row.querySelector(".nm"), r1 = row.querySelector(".r1"); if (!nm || !r1) return;
    row.classList.remove("meta-fits");
    r1.style.display = "inline-flex"; const mw = r1.offsetWidth; r1.style.display = "";
    const gap = parseFloat(getComputedStyle(row).columnGap) || 0;
    const rg = document.createRange(); rg.selectNodeContents(nm); const need = Math.ceil(rg.getBoundingClientRect().width);
    if (need + gap + mw <= nm.clientWidth) row.classList.add("meta-fits");
  });
  // Line 3 of a row: the short form (verb, …, last segment) whenever the long one does not fit.
  within(root, ".it .l3").forEach((el) => {
    el.classList.remove("fit-short");
    if (el.scrollWidth > el.clientWidth + 0.5) el.classList.add("fit-short");
  });
  within(root, ".trunc").forEach((el) => {
    const long = el.querySelector(".long"); let full = (long || el).textContent.trim().replace(/\s+/g, " ");
    // A name whose meta does not fit carries the meta in its tooltip.
    const row = el.classList.contains("nm") && el.closest(".it[data-meta]:not(.meta-fits):not(.jk-row)");
    if (row) full += " · " + row.dataset.meta;
    const cut = !!row || el.scrollWidth > el.clientWidth + 0.5 || (long && getComputedStyle(long).display === "none");
    if (cut) { if (!el.dataset.tip || el.dataset.cut) { el.dataset.tip = full; el.dataset.cut = "1"; } }
    else if (el.dataset.cut) { delete el.dataset.tip; delete el.dataset.cut; }
  });
}
(function tooltips() {
  let tip = null, timer = 0, owner = null;
  const delay = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--delay-tooltip")) || 500;
  const hide = () => { clearTimeout(timer); owner = null; if (tip) { tip.remove(); tip = null; } };
  const show = (el, now) => {
    hide(); owner = el;
    timer = setTimeout(() => {
      if (owner !== el || !document.contains(el)) return;
      tip = document.createElement("div"); tip.className = "tip"; tip.setAttribute("role", "tooltip");
      const [txt, key] = el.dataset.tip.split(" · Ctrl+").length > 1 ? [el.dataset.tip.split(" · Ctrl+")[0], "Ctrl+" + el.dataset.tip.split(" · Ctrl+")[1]] : el.dataset.tip.split(" · Alt+").length > 1 ? [el.dataset.tip.split(" · Alt+")[0], "Alt+" + el.dataset.tip.split(" · Alt+")[1]] : [el.dataset.tip, ""];
      tip.innerHTML = `<span>${txt}</span>${key ? `<span class="k">${key}</span>` : ""}`;
      document.body.appendChild(tip);
      const tok = (t) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(t)) * 16;
      const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight, gap = tok("--space-1-5"), edge = tok("--space-2");
      let x = Math.round(Math.min(Math.max(edge, r.left + r.width / 2 - w / 2), innerWidth - w - edge));
      let y = Math.round(r.bottom + gap); if (y + h > innerHeight - edge) y = Math.round(r.top - gap - h);
      tip.style.left = x + "px"; tip.style.top = y + "px";
    }, now ? 0 : delay());
  };
  // A row that changes state (hover, focus, press) is measured again before its tooltip is read.
  const remeasure = (t) => { const row = t.closest && t.closest(".it"); if (row) markTruncated(row); };
  document.addEventListener("pointerover", (e) => { remeasure(e.target); const el = e.target.closest("[data-tip]"); if (el && el !== owner) show(el); else if (!el) hide(); });
  document.addEventListener("focusin", (e) => { remeasure(e.target); const el = e.target.closest("[data-tip]") || (e.target.querySelector && e.target.querySelector(".nm[data-tip]")); if (el && e.target.matches(":focus-visible")) show(el, true); else hide(); });
  document.addEventListener("pointerdown", (e) => remeasure(e.target), true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });
  document.addEventListener("scroll", hide, true);
  document.addEventListener("pointerdown", hide);
})();

/* =====================================================================
   SCENE · the task Rate limit per API key, step 3 of 7, the reviewer asking
   and the implementer waiting for a permission; the whole tree around it.
   ?theme=light|dark fixes the mode (the system's by default); ?tab=reviewer
   opens the reviewer; ?audit prints the geometry and truncation report.
   ===================================================================== */
const MODES = ["system", "light", "dark"];
let MODE = ["light", "dark"].includes(Q.get("theme")) ? Q.get("theme") : "system";

function main() {
  return `<main class="main" id="main">${head()}<div class="body"><div class="colconvo">
    <div class="convo" id="convo" tabindex="-1" role="tabpanel" aria-label="${S.tab} conversation"><div class="convo-in">${convHead()}${S.tab === "Reviewer" ? reviewer() : implementer()}</div></div>
    <div class="ask">${askBar()}</div><div class="composer"><div class="composer-in">${composer()}</div></div></div></div></main>`;
}
// The tree says what is below the fold.
function moreBelow() {
  const tree = document.getElementById("tree"), more = document.getElementById("sb-more"); if (!tree || !more) return;
  const bottom = tree.getBoundingClientRect().bottom - 8;
  const below = [...tree.querySelectorAll('.it[role="treeitem"]')].filter((r) => r.getBoundingClientRect().top + 12 > bottom);
  more.hidden = below.length === 0;
  if (below.length) more.querySelector("span").textContent = `${below.length} more below`;
}
function syncURL() {
  const u = new URLSearchParams(location.search);
  if (MODE === "system") u.delete("theme"); else u.set("theme", MODE);
  if (S.tab === "Reviewer") u.set("tab", "reviewer"); else u.delete("tab");
  const q = u.toString();
  history.replaceState(null, "", q ? `?${q}` : location.pathname);
}
function render() {
  document.getElementById("app").innerHTML = sidebar(MODE) + main();
  const cv = document.getElementById("convo"); cv.scrollTop = cv.scrollHeight;
  document.getElementById("tree").addEventListener("scroll", moreBelow);
  document.getElementById("sb-more-btn").addEventListener("click", () => { const t = document.getElementById("tree"); t.scrollTo({ top: t.scrollHeight }); });
  requestAnimationFrame(() => { moreBelow(); markTruncated(); });
}
addEventListener("resize", () => { moreBelow(); markTruncated(); });
document.getElementById("app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]");
  if (t) { S.tab = t.dataset.tab; render(); syncURL(); document.querySelector(`[data-tab="${S.tab}"]`).focus(); return; }
  if (e.target.closest("#theme-btn")) {
    MODE = MODES[(MODES.indexOf(MODE) + 1) % MODES.length];
    if (MODE === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = MODE;
    render(); syncURL(); document.getElementById("theme-btn").focus(); return;
  }
  if (e.target.closest('[data-act="show"]')) { const c = document.getElementById("askcard"); if (c) { c.scrollIntoView({ block: "center" }); const b = c.querySelector("button"); if (b) b.focus(); } }
});
document.addEventListener("input", (e) => {
  const box = e.target.closest(".cbox"); if (!box) return;
  // Send turns primary with text only when nothing else on screen waits for an answer: one primary per screen.
  const b = box.querySelector("[data-send]"); if (b) b.classList.toggle("primary", e.target.value.trim() !== "" && !document.getElementById("askcard"));
});
// The tabs are one Tab stop; ← and → move between them and open the conversation.
document.getElementById("app").addEventListener("keydown", (e) => {
  const tab = e.target.closest && e.target.closest('[role="tab"][data-tab]');
  if (!tab || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
  e.preventDefault(); S.tab = S.tab === "Implementer" ? "Reviewer" : "Implementer"; render(); syncURL(); document.querySelector(`[data-tab="${S.tab}"]`).focus();
});
// The tree is one Tab stop; arrows, Home and End move inside it.
document.getElementById("app").addEventListener("keydown", (e) => {
  const tree = document.getElementById("tree");
  if (!tree.contains(document.activeElement)) return;
  const rows = [...tree.querySelectorAll('[role="treeitem"]')], k = rows.indexOf(document.activeElement);
  const to = e.key === "ArrowDown" ? k + 1 : e.key === "ArrowUp" ? k - 1 : e.key === "Home" ? 0 : e.key === "End" ? rows.length - 1 : null;
  if (to === null || !rows[to]) return;
  e.preventDefault(); rows.forEach((r) => (r.tabIndex = -1)); rows[to].tabIndex = 0; rows[to].focus();
});

// ---------------- ?audit: whole pixels where the layout places things, and what truncates ----------------
function audit() {
  const frac = (v) => Math.abs(v - Math.round(v)) > 0.01;
  const GEO = [".sb", ".main", ".ih", ".ih-top", ".ih-prog", ".sb-tree", ".sec", ".node", ".it", ".it > .c1", ".it .st:not(.st-error):not(.st-warn):not(.st-run)", ".it .ctx .trk", ".convo-in", ".cv-head",
    ".ask-in", ".cbox", ".composer-in", ".card", ".card .hd", ".opt", ".e-agent", ".acts", ".code", ".e-app", ".sb-foot", ".sb-top", ".sb-filter .input", ".grp.epic-grp"];
  const bad = [], checked = { n: 0 };
  GEO.forEach((sel) => document.querySelectorAll(sel).forEach((el) => {
    const r = el.getBoundingClientRect(); if (!r.width && !r.height) return; checked.n++;
    const f = ["left", "top", "width", "height"].filter((k) => frac(r[k]));
    if (f.length) bad.push(`${sel} ${f.map((k) => `${k}=${r[k].toFixed(2)}`).join(" ")}`);
  }));
  // Text-sized boxes: counted, not required whole (the engine rounds them).
  let textSized = 0, textFrac = 0;
  document.querySelectorAll(".btn, .chip, .stg, .sw, .switch, .tag, kbd, .tw, .e-user, .segs i").forEach((el) => { const r = el.getBoundingClientRect(); if (!r.width) return; textSized++; if (frac(r.left) || frac(r.width)) textFrac++; });
  const cut = [...document.querySelectorAll(".trunc")].filter((el) => el.offsetParent && el.scrollWidth > el.clientWidth + 0.5).map((el) => `${el.className.replace(/\s+/g, ".")}: "${el.textContent.trim().replace(/\s+/g, " ").slice(0, 60)}" ${el.clientWidth}/${el.scrollWidth}`);
  const names = [...document.querySelectorAll(".sb .it .nm")].map((el) => ({ n: el.textContent.trim(), w: el.clientWidth, need: el.scrollWidth }));
  // Every row in hover and in focus: the name keeps its width, and any cut has a tooltip.
  const states = ["is-hover", "is-focus"].map((st) => [st, [...document.querySelectorAll(".sb .it[data-meta]")].map((row) => {
    const nm = row.querySelector(".nm"), rest = nm.scrollWidth > nm.clientWidth + 0.5; row.classList.add(st); markTruncated(row);
    const r = { n: nm.textContent.trim(), cutRest: rest, cut: nm.scrollWidth > nm.clientWidth + 0.5, tip: nm.dataset.tip || null, metaShown: getComputedStyle(row.querySelector(".r1")).display !== "none" };
    row.classList.remove(st); markTruncated(row); return r;
  })]);
  const rowStates = Object.fromEntries(states.map(([st, rows]) => [st, { newlyCut: rows.filter((r) => r.cut && !r.cutRest).map((r) => r.n), cutWithoutTip: rows.filter((r) => r.cut && !r.tip).map((r) => r.n), metaShown: rows.filter((r) => r.metaShown).length, metaInTip: rows.filter((r) => !r.metaShown && r.tip).length }]));
  const sb = document.querySelector(".sb").getBoundingClientRect().width, mn = document.querySelector(".main").getBoundingClientRect().width;
  const out = { viewport: innerWidth, sidebar: sb, main: mn, mode: document.documentElement.dataset.theme || "system", geometryChecked: checked.n, geometryFractional: bad, rowStates, textSized, textSizedFractional: textFrac, truncated: cut, treeNames: names };
  const pre = document.getElementById("report"); pre.hidden = false; pre.textContent = JSON.stringify(out, null, 1);
}

render();
syncURL();
if (Q.has("audit")) setTimeout(audit, 600);

</script>
</body>
</html>
