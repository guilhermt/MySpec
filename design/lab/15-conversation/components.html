/* BEGIN design/system/tokens.css */
/* =====================================================================
   MySpec design tokens · theme Grafite quente
   Phase 3, approved 2026-09-24. The single source of the tokens.

   How to read it
   - Every value the interface paints or measures lives here. Components use
     these names and nothing else: no color, size or duration outside this file.
   - Three layers of blocks:
       1. :root                            values that do not depend on the mode;
       2. :root, [data-theme="light"]      the light colors (the default);
          @media dark, :root without light the dark colors, following the system;
          [data-theme="dark"]              the dark colors, fixed by the user or
                                           forced on a subtree (the specimen);
       3. :root, [data-theme]              derived tokens (washes and veils),
                                           declared on every scope so they
                                           resolve against that scope's colors.
   - Sizes are rem at a 16px root and land on whole pixels: WebKitGTK blurs
     half pixels (brief.md §9).
   - Colors are OKLCH. The neutral carries a trace of warmth: surfaces and lines
     at hue 65 (chroma 0.004), inks at hue 60 (chroma 0.01), the sidebar at 68 in
     light and 62 in dark. The identity is an electric blue eased toward cobalt,
     hue 260.
   - A token that means the same as another is written as var(), never as a copy
     of its value: the aliases live in the last block.
   - The dark colors are written twice: for the system setting, and for a fixed
     choice or a subtree forced dark. In the app the theme is always set by script
     on data-theme, so the implementation keeps only the [data-theme="dark"] block.
   ===================================================================== */

:root {
  /* Type families: one sans for chrome and reading, one mono for code, paths and keys. */
  --font-ui: "Fira Sans", system-ui, sans-serif;
  --font-read: "Fira Sans", system-ui, sans-serif;
  --font-mono: "Fira Code", ui-monospace, monospace;

  /* Type sizes and leading, paired: the chrome register (caps to ui) and the reading register (body, read, code). */
  --text-caps: 0.6875rem;    --leading-caps: 1rem;
  --text-micro: 0.75rem;     --leading-micro: 1rem;
  --text-meta: 0.8125rem;    --leading-meta: 1.125rem;
  --text-ui: 0.875rem;       --leading-ui: 1.25rem;
  --text-body: 0.9375rem;    --leading-body: 1.375rem;
  --text-read: 1rem;         --leading-read: 1.625rem;
  --text-title: 1.125rem;    --leading-title: 1.5rem;
  --text-display: 1.375rem;  --leading-display: 1.75rem;
  --text-code: 0.8125rem;    --leading-code: 1.25rem;
  --text-code-read: 0.875rem;  /* inline code inside the reading register; it takes the line's leading */

  /* Weights: hierarchy comes from weight before color. A name that waits for you is 600, any other name 400. */
  --weight-regular: 400; --weight-medium: 500; --weight-strong: 600; --weight-bold: 700;
  --weight-name: 400; --weight-name-waiting: 600;
  --tracking-caps: 0.07em;

  /* Measure: the conversation column and the reading line inside it. */
  --measure: 50rem;
  --measure-read: 42rem;

  /* Space: a 4px grid with two half steps for tight chrome. */
  --space-0-5: 0.125rem; --space-1: 0.25rem; --space-1-5: 0.375rem; --space-2: 0.5rem; --space-2-5: 0.625rem;
  --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem; --space-16: 4rem;

  /* Radius: grows with the size and the elevation of the object. */
  --radius-xs: 0.1875rem; --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem; --radius-pill: 999px;

  /* Strokes: borders, the error rail, focus. Focus sits outside with a gap; selection sits inside. */
  --border: 1px; --border-2: 2px; --error-rail: 3px; --radius-glyph: 1px;
  --focus-width: 2px; --focus-offset: 2px; --halo: 3px;

  /* Control and chrome sizes. */
  --size-control: 2rem; --size-control-sm: 1.75rem; --size-control-xs: 1.375rem;
  --size-chip: 1.75rem; --size-time-chip: 1.125rem; --size-kbd: 1.125rem; --size-kbd-sm: 1rem;
  --size-head: 3rem; --size-progress: 2.5rem; --size-node: 1.75rem; --size-tab: 1.75rem; --size-ask: 2.75rem;
  --size-composer-min: 3.5rem; --size-mark: 1.5rem; --size-avatar: 1.5rem; --size-more-below: 1.75rem;
  --size-menu-min: 14rem; --size-dialog: 30rem; --size-toast: 22rem; --size-tooltip-max: 20rem;

  /* Icons and status glyphs. Glyphs are even so they center on a whole pixel. */
  --icon: 1rem; --icon-sm: 0.875rem; --icon-xs: 0.75rem; --icon-stroke: 1.5;
  --glyph: 0.625rem; --glyph-sm: 0.5rem; --glyph-diamond: 0.5rem; --glyph-bar: 0.1875rem;

  /* Meters: the context meter and the step segments of the current stage. */
  --meter-w: 2.5rem; --meter-h: 0.25rem; --meter-label: 2rem;
  --seg-w: 0.75rem; --seg-w-current: 1.25rem; --seg-h: 0.25rem; --seg-gap: 0.1875rem;

  /* The tree: row rhythm, the epic indent and its guide under the epic's chevron. */
  --tree-pad: 0.5rem; --row-pad-y: 0.375rem; --row-gap: 0.25rem; --line-gap: 0.125rem; --section-gap: 1.5rem;
  --epic-indent: 1rem; --guide-x: 0.9375rem;

  /* Layout: continuous widths, one rule per container (structure.md §6): the sidebar, its collapsed strip, and the
     panel of an open item, beside the conversation or over it (structure.md §3). */
  --sidebar-width: round(down, clamp(18rem, calc(8vw + 12.5rem), 23.75rem), 1px);
  --sidebar-collapsed: 3.75rem;
  --panel-width: clamp(22.5rem, 28%, 30rem);

  /* Layout of lists, list panels, wide dialogs and Settings (components.md, Tamanhos de layout). The list column is
     the scan width of a row; the columns of a row are fixed so they line up from row to row. */
  --list-measure: calc(var(--measure) + var(--space-16) * 5);      /* the board, Reviews and History lists: 70rem */
  --panel-card-width: clamp(22.5rem, 42%, 40rem);                  /* the card and pull request panel: a body is read there */
  --size-dialog-wide: calc(var(--size-dialog) + var(--space-16));  /* creation and start dialogs: a 64-character name fits */
  --col-num: var(--space-12);                                      /* card row: #474 */
  --col-epic: calc(var(--space-16) * 2.25);                        /* card row: the epic's title */
  --col-dep: calc(var(--space-12) + var(--space-2));               /* card row: ◇ #461 +1 */
  --col-task: calc(var(--space-16) * 3);                           /* card row: ● Question · Step 3/7 */
  --col-keys: calc(var(--space-16) + var(--space-12));             /* card and pull request rows: S start  D discuss */
  --col-ref: calc(var(--space-16) + var(--space-8));               /* pull request row: web#2291 */
  --col-author: calc(var(--space-16) + var(--space-8));            /* pull request row: dependabot */
  --col-state: calc(var(--space-16) * 3 + var(--space-4));         /* pull request row: Decide findings · pass 1 · 1/3 */
  --col-where: calc(var(--space-16) * 2 + var(--space-8));         /* History row: api#398, Platform Roadmap */
  --col-result: calc(var(--space-16) * 4);                         /* History row: PR #1279 · 6 steps · dev not updated */
  --col-time: var(--space-12);                                     /* History row: 15:02 */
  --snav-w: calc(var(--space-16) * 3 + var(--space-4));            /* Settings navigation: Repositories ◇ 1 */

  /* Small fixed pieces of content. */
  --key-size: 1.25rem; --action-verb-w: 3.5rem; --list-indent: 1.25rem; --newmsg-w: 8.5rem;
  --code-pad-y: 0.0625rem; --code-pad-x: 0.3125rem; --fade: 1.5rem; --link-offset: 0.2em;

  /* Motion: three durations and one standard curve; the spinner is the only loop. prefers-reduced-motion zeroes all of it. */
  --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 280ms;
  --duration-spin: 900ms; --duration-shimmer: 1400ms; --delay-tooltip: 500ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-enter: cubic-bezier(0, 0, 0, 1);
  --ease-exit: cubic-bezier(0.3, 0, 1, 1);

  /* Stacking: sticky heads, the item header, floating pieces, the dialog, toasts and tooltips. */
  --z-sticky: 2; --z-header: 3; --z-float: 4; --z-overlay: 50; --z-toast: 60; --z-tooltip: 70;

  /* Link underline: permanent and quiet, full on hover. The key hint on a primary button: the same in both modes. */
  --mix-link-line: 45%; --mix-key: 45%;
}

/* ---------------------------------------------------------------------
   LIGHT (the default)
   --------------------------------------------------------------------- */
:root, [data-theme="light"] {
  color-scheme: light;

  /* Surfaces in layers: 0 sunken (code, action groups, the quiet ask bar), 1 the ground (conversation, header),
     2 raised (cards, buttons, the selected tab), 3 floating (menus, tooltips' neighbors, dialogs, toasts).
     In light, 2 and 3 share white and differ by shadow. */
  --surface-0: oklch(0.962 0.004 65);
  --surface-1: oklch(0.995 0.001 65);
  --surface-2: oklch(1 0 0);
  --surface-3: oklch(1 0 0);
  --surface-input: oklch(1 0 0);
  --surface-user: oklch(0.95 0.005 60);

  /* The sidebar: in the tone of the page, one step down, with its own input, divider, control border and epic guide (3:1). */
  --surface-sidebar: oklch(0.945 0.007 68);
  --sidebar-input: oklch(0.975 0.004 68);
  --sidebar-line: oklch(0.885 0.008 68);
  --sidebar-control: oklch(0.595 0.011 68);

  /* Lines: 1 divider, 2 quiet border (buttons, chips), 3 control border at 3:1 (inputs, composer, dashed disabled). */
  --line-1: oklch(0.912 0.004 65);
  --line-2: oklch(0.86 0.005 65);
  --line-3: oklch(0.63 0.006 65);

  /* Ink: 1 text, 2 secondary, 3 muted (line 2 of a row, the agent's clock), 4 faint (meta, line 3, timestamps).
     1 to 3 pass 4.5:1 on every surface and veil of the system. 4 passes on the surfaces 0 to 3, the sidebar, the user
     message and the wait veil, and is NOT for: the open row (--brand-veil; the row lifts its meta to ink 3), a pressed
     or hovered open row, a pressed veil on the sidebar, --brand-tint and --state-wait-chip (dark). */
  --ink-1: oklch(0.2 0.01 60);
  --ink-2: oklch(0.36 0.009 60);
  --ink-3: oklch(0.455 0.007 60);
  --ink-4: oklch(0.495 0.006 60);

  /* Identity: the solid, its hover and press, the ink on it, the identity as text, the ring of the open row, the meter track. */
  --brand: oklch(0.52 0.175 260);
  --brand-hover: oklch(0.48 0.175 260);
  --brand-active: oklch(0.44 0.166 260);
  --brand-on: oklch(1 0 0);
  --brand-ink: oklch(0.49 0.17 260);
  --brand-ring: oklch(0.58 0.158 260);
  --brand-track: oklch(0.9 0.039 260);

  /* The ink of neutral veils (hover, press): a trace of the identity, never a gray from nowhere. */
  --veil-ink: oklch(0.3 0.061 260);

  /* Veil strengths, one per role. */
  --mix-hover: 6%; --mix-press: 10%; --mix-select: 12%; --mix-tint: 12%; --mix-tint-hover: 18%; --mix-tint-press: 24%;
  --mix-halo: 24%; --mix-seg: 26%; --mix-marker: 30%;

  /* Error: the loudest color, never alone: the diamond, the square chip with !, the rail. */
  --state-error: oklch(0.52 0.195 22);
  --state-error-hover: oklch(0.48 0.195 22);
  --state-error-press: oklch(0.44 0.185 22);
  --state-error-veil: oklch(0.962 0.02 22);
  --state-error-on: oklch(1 0 0);

  /* Waiting for you: amber. Text, glyph (and its contour), the veil of a request, its line, the time chip. */
  --state-wait: oklch(0.5 0.11 62);
  --state-wait-glyph: oklch(0.58 0.14 75);
  --state-wait-veil: oklch(0.965 0.035 85);
  --state-wait-line: oklch(0.86 0.08 80);
  --state-wait-chip: oklch(0.945 0.05 85);
  --state-wait-chip-ink: oklch(0.42 0.09 62);

  /* Ready to close: green, a ring and an outlined chip. */
  --state-close: oklch(0.5 0.13 145);

  /* Code: four hues at the lightness of the ink, the comment is faint ink. */
  --code-keyword: oklch(0.47 0.13 260);
  --code-string: oklch(0.47 0.1 150);
  --code-function: oklch(0.45 0.11 305);
  --code-number: oklch(0.5 0.12 55);

  /* Floating pieces: the tooltip is the one inverted surface; the scrim dims the app under a dialog. */
  --tooltip-surface: oklch(0.26 0.008 60);
  --tooltip-ink: oklch(0.97 0.003 60);
  --tooltip-ink-2: oklch(0.8 0.005 60);
  --scrim: oklch(0.2 0.01 60 / 0.28);

  /* Elevation: every shadow is the warm neutral, never black. Plane, button, xs (a raised control), card, float, overlay. */
  --shadow-hue: oklch(0.3 0.03 65);
  --sheen: oklch(1 0 0 / 0.12);
  --rim: color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 6%, transparent);
  --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 22%, transparent), inset 0 1px 0 var(--sheen);
  --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 8%, transparent), 0 0 0 1px var(--rim);
  --shadow-card: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 6%, transparent), 0 8px 20px color-mix(in srgb, var(--shadow-hue) 9%, transparent);
  --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 16%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 20%, transparent), 0 0 0 1px color-mix(in srgb, var(--shadow-hue) 8%, transparent);
  --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.18), inset 0 0 0 1px oklch(0 0 0 / 0.08);
}

/* ---------------------------------------------------------------------
   DARK: the same roles, lifted surfaces instead of shadows, lighter inks.
   Written twice: for the system setting and for a fixed choice or subtree.
   --------------------------------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: oklch(0.175 0.005 65); --surface-1: oklch(0.205 0.005 65); --surface-2: oklch(0.255 0.006 65); --surface-3: oklch(0.275 0.006 65);
    --surface-input: oklch(0.18 0.005 65); --surface-user: oklch(0.265 0.005 60);
    --surface-sidebar: oklch(0.165 0.008 62); --sidebar-input: oklch(0.2 0.008 62); --sidebar-line: oklch(0.245 0.008 62); --sidebar-control: oklch(0.505 0.01 62);
    --line-1: oklch(0.29 0.006 65); --line-2: oklch(0.35 0.007 65); --line-3: oklch(0.55 0.008 65);
    --ink-1: oklch(0.94 0.005 60); --ink-2: oklch(0.84 0.005 60); --ink-3: oklch(0.75 0.005 60); --ink-4: oklch(0.69 0.005 60);
    --brand: oklch(0.72 0.135 259); --brand-hover: oklch(0.77 0.135 259); --brand-active: oklch(0.67 0.135 259); --brand-on: oklch(0.16 0.041 259);
    --brand-ink: oklch(0.79 0.1 259); --brand-ring: oklch(0.6 0.122 259); --brand-track: oklch(0.3 0.047 259);
    --veil-ink: oklch(0.92 0.034 259);
    --mix-hover: 7%; --mix-press: 11%; --mix-select: 18%; --mix-tint: 16%; --mix-tint-hover: 22%; --mix-tint-press: 28%;
    --mix-halo: 32%; --mix-seg: 30%; --mix-marker: 36%;
    --state-error: oklch(0.72 0.16 25); --state-error-hover: oklch(0.77 0.15 25); --state-error-press: oklch(0.67 0.16 25);
    --state-error-veil: oklch(0.27 0.05 25); --state-error-on: oklch(0.16 0.03 25);
    --state-wait: oklch(0.83 0.13 80); --state-wait-glyph: oklch(0.8 0.15 78);
    --state-wait-veil: oklch(0.27 0.045 80); --state-wait-line: oklch(0.42 0.08 78); --state-wait-chip: oklch(0.33 0.07 78); --state-wait-chip-ink: oklch(0.9 0.1 85);
    --state-close: oklch(0.78 0.15 145);
    --code-keyword: oklch(0.8 0.1 260); --code-string: oklch(0.8 0.09 150); --code-function: oklch(0.82 0.08 305); --code-number: oklch(0.8 0.1 55);
    --tooltip-surface: oklch(0.34 0.006 65); --tooltip-ink: oklch(0.96 0.004 60); --tooltip-ink-2: oklch(0.82 0.005 60); --scrim: oklch(0.05 0.005 60 / 0.6);
    --shadow-hue: oklch(0.08 0.01 65); --sheen: oklch(1 0 0 / 0.2); --rim: oklch(1 0 0 / 0.07);
    --shadow-button: 0 1px 1px color-mix(in srgb, var(--shadow-hue) 30%, transparent);
    --shadow-primary: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 45%, transparent), inset 0 1px 0 var(--sheen);
    --shadow-xs: 0 1px 2px color-mix(in srgb, var(--shadow-hue) 40%, transparent), 0 0 0 1px var(--rim);
    --shadow-card: 0 0 0 1px oklch(1 0 0 / 0.04), 0 8px 24px color-mix(in srgb, var(--shadow-hue) 50%, transparent);
    --shadow-float: 0 8px 24px color-mix(in srgb, var(--shadow-hue) 60%, transparent), 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-overlay: 0 16px 40px color-mix(in srgb, var(--shadow-hue) 70%, transparent), 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-mark: inset 0 1px 0 oklch(1 0 0 / 0.25), inset 0 0 0 1px oklch(0 0 0 / 0.12);
  }
}
[data-theme="dark"] {

  --surface-0: oklch(0.175 0.005 65); --surface-1: oklch(0.205 0.005 65); --surface-2: oklch(0.255 0.006 65); --surface-3: oklch(0.275 0.006 65);

  --brand: oklch(0.72 0.135 259); --brand-hover: oklch(0.77 0.135 259); --brand-active: oklch(0.67 0.135 259); --brand-on: oklch(0.16 0.041 259);
  --brand-ink: oklch(0.79 0.1 259); --brand-ring: oklch(0.6 0.122 259); --brand-track: oklch(0.3 0.047 259);
  --veil-ink: oklch(0.92 0.034 259);
  --mix-hover: 7%; --mix-press: 11%; --mix-select: 18%; --mix-tint: 16%; --mix-tint-hover: 22%; --mix-tint-press: 28%;
  --mix-halo: 32%; --mix-seg: 30%; --mix-marker: 36%;
  --state-error: oklch(0.72 0.16 25); --state-error-hover: oklch(0.77 0.15 25); --state-error-press: oklch(0.67 0.16 25);
  --state-error-veil: oklch(0.27 0.05 25); --state-error-on: oklch(0.16 0.03 25);

  --code-keyword: oklch(0.8 0.1 260); --code-string: oklch(0.8 0.09 150); --code-function: oklch(0.82 0.08 305); --code-number: oklch(0.8 0.1 55);
  --tooltip-surface: oklch(0.34 0.006 65); --tooltip-ink: oklch(0.96 0.004 60); --tooltip-ink-2: oklch(0.82 0.005 60); --scrim: oklch(0.05 0.005 60 / 0.6);

/* ---------------------------------------------------------------------
   ALIASES AND DERIVED: names that mean another token, and veils and washes
   mixed from the tokens above. Declared on every
   scope, so a subtree with its own data-theme mixes its own colors.
   --------------------------------------------------------------------- */
:root, [data-theme] {
  /* Aliases: the states without a situation are the neutral inks (the agent working in motion, GitHub, paused, idle). */
  --state-work: var(--ink-2); --state-work-track: var(--line-2); --state-github: var(--ink-3); --state-paused: var(--ink-3);
  --state-idle: var(--ink-4); --state-notice: var(--ink-2);
  /* Aliases: focus is the identity; the wait contour is the glyph unless a theme needs a darker one; the epic guide is the
     sidebar's control border; not-started glyphs and › separators use the control line; code comments are faint ink. */
  --focus: var(--brand); --state-wait-ring: var(--state-wait-glyph); --sidebar-guide: var(--sidebar-control);
  --line-deco: var(--line-3); --code-comment: var(--ink-4);

  /* Neutral veils, for hover and press on any surface; on a raised control they are mixed into it. */

/* ---------- Action rows: the description the agent wrote is the label; the command follows, faint. ---------- */

/* ---------- Quick replies: a question asked in text, answered in one key. ---------- */

/* A radio in a segmented control shows its choice the way the selected tab does. */
.sw[aria-checked="true"] { color: var(--ink-1); background: var(--surface-2); box-shadow: var(--shadow-xs), inset 0 0 0 var(--border) var(--line-3); }

/* =====================================================================
   ROUND 10 · the minimal task screen, shared by a and b. On top of
   base.css (round 08) and core.css (round 09). Every value is a token of
   design/system/tokens.css; the bare lengths are geometry (0, 50%, 100%)
   and container-query limits, which a query cannot read from a token.
   ===================================================================== */

/* ---------- The header: breadcrumb, title, progress, then the tools. ---------- */

/* ---------- The ⋯ menu: the item's tools that are not the screen's. ---------- */

.menu .mi.danger:hover { background: var(--state-error-veil); }
.menu .menu-cap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(var(--size-menu-min) + var(--space-8)); }

/* ---------- The conversation: more air, and the workflow's events as quiet lines. ---------- */
.m .convo-in { padding-top: var(--space-8); padding-bottom: var(--space-6); gap: var(--space-6); }
.m .stream { gap: var(--space-6); }
.m .who .role, .m .who .to { display: none; }
/* A marker (a document written, a step started, a message of the product, a commit) is one discreet line:
   a small icon, the words in ink 2, the time. The content is one click away, in place. */
.m .ev { grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2); align-items: center; color: var(--ink-3); }
.m .ev .ev-ic { width: var(--icon); height: var(--icon); background: transparent; box-shadow: none; color: var(--ink-4); border-radius: 0; }
.m .ev .ev-ic svg { width: var(--icon-sm); height: var(--icon-sm); }

.m .ev .ev-sub { display: none; }
.m .ev .sha { color: var(--ink-3); }
.m .evx > summary { padding: var(--space-1) var(--space-2); margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1); }
.m .evx .rd { padding-top: 0; color: var(--ink-4); }
.m .evx .rd .closed-l, .m .evx .rd .open-l { display: none; }

/* ---------- The ask bar: the request of the agent on screen, and the other agent's below it (A). ---------- */

.ask-in.two-rows .req { min-height: var(--size-control); }
.ask-in .req .btn { margin-left: auto; }

/* ---------- An earlier conversation, opened from Details: read only, one way back. ---------- */

.pastfoot b { color: var(--ink-1); font-weight: var(--weight-strong); }
.pastfoot svg { color: var(--ink-3); }

/* ---------- The words of a state: the ink of its situation (wait, error, close), neutral otherwise. ---------- */
.st-wait-t { color: var(--state-wait); }
.st-error-t { color: var(--state-error); }
.st-close-t { color: var(--state-close); }
.st-run-t { color: var(--ink-2); }
.st-gh-t, .st-idle-t, .st-paused-t { color: var(--ink-3); }

/* ---------- The panels: Details holds the steps, the earlier conversations and the reports. ---------- */
.pl-list { display: flex; flex-direction: column; }
.pl-row { display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: var(--size-control-sm); padding: 0 var(--space-2); margin: 0 calc(var(--space-2) * -1); width: calc(100% + var(--space-4)); border-radius: var(--radius-sm); color: var(--ink-1); font-size: var(--text-meta); line-height: var(--leading-meta); transition: background var(--duration-fast) var(--ease-standard); }
button.pl-row:hover, .pl-row.is-hover { background: var(--veil-hover); }
button.pl-row:active, .pl-row.is-active { background: var(--veil-press); }
.pl-row.is-on { background: var(--brand-tint-plane); color: var(--brand-ink); box-shadow: inset 0 0 0 var(--border) var(--brand-marker-ring); }
.pl-row[aria-disabled="true"] { color: var(--ink-4); cursor: default; background: transparent; }
.pl-row svg { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-3); flex: none; }
.pl-row .c1 { width: var(--icon-sm); display: inline-grid; place-items: center; flex: none; }
.pl-row .m { color: var(--ink-3); font-size: var(--text-micro); line-height: var(--leading-micro); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pl-row .m.mono { font-family: var(--font-mono); }
.pl-row .m.now { color: var(--brand-ink); font-weight: var(--weight-medium); }
.pl-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pl-step .head { cursor: default; }
.pl-step.todo .head { color: var(--ink-3); }
.pl-step.cur .head { font-weight: var(--weight-strong); }
.pl-kids { display: flex; flex-direction: column; padding-left: calc(var(--icon-sm) + var(--space-2)); }
.pl-kids .pl-row { color: var(--ink-2); min-height: var(--size-control-xs); }
.pl-prose { font-size: var(--text-body); line-height: var(--leading-body); }

/* ---------- The quick replies sit inside the composer box, above the text. ---------- */
.m .qr { padding: var(--space-2) var(--space-3) 0; }

/* The review of a Manual step: the files in the card, the progress and the actions in the bar. */
.m .stagebar { display: none; }
.m .card.dec .hd .prog { display: none; }
.composer-end { flex: none; height: var(--space-4); }
/* The last step before the title gives way: the context meter keeps its percentage, without the track. */
.mh.f6 .ctx .trk { display: none; }
/* What the card's buttons, keys and the placeholder already say is not said again under the card. */
.m .opts + .foot, .m .files + .foot, .m .fnds + .foot { display: none; }
/* The panel lands on a whole pixel. */
.m .panel { width: round(down, var(--panel-width), 1px); }

/* ---------- The situation is said once. The bar says what the item asks; the card holds only the content. ---------- */
.m fieldset.card:not(.answered):not(.plain) > .hd { display: none; }
.m .e-error .h { display: none; }
/* A card whose request the tinted bar carries (the files of a Manual step, the findings) is neutral content. */
.m .card.plain { box-shadow: var(--shadow-xs); }
.m .card.plain > .hd { background: transparent; box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); font-weight: var(--weight-medium); }

/* ---------- Review mode and models: popovers from ⋯ and from Details; a listbox for one choice. ---------- */
.popm { width: calc(var(--space-16) * 5.5); padding: var(--space-2); display: flex; flex-direction: column; gap: var(--space-1); }
.pop-h { padding: var(--space-1) var(--space-2) var(--space-1-5); font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: var(--weight-strong); color: var(--ink-1); }
.pop-opt { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) var(--icon); gap: var(--space-2); align-items: start; width: 100%; padding: var(--space-2); border-radius: var(--radius-md); color: var(--ink-1); transition: background var(--duration-fast) var(--ease-standard); }
.pop-opt:hover, .pop-opt.is-hover { background: var(--veil-hover); }
.pop-opt:active, .pop-opt.is-active { background: var(--veil-press); }
.pop-opt[aria-checked="true"] { background: var(--brand-tint); box-shadow: inset 0 0 0 var(--border) var(--brand-ring); }

.pop-opt[aria-disabled="true"] small { color: var(--ink-4); }
.pop-opt > svg { margin-top: var(--space-0-5); color: var(--ink-3); }
.pop-opt .po-t { display: flex; flex-direction: column; gap: var(--space-0-5); font-size: var(--text-ui); line-height: var(--leading-ui); }
.pop-opt .po-t b { font-weight: var(--weight-medium); }
.pop-opt small { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.pop-opt .ck { color: var(--brand-ink); visibility: hidden; margin-top: var(--space-0-5); }
.pop-opt[aria-checked="true"] .ck { visibility: visible; }
.pop-note { margin: var(--space-1) var(--space-2) var(--space-1); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.pm { display: flex; flex-direction: column; }
.pm-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: var(--size-control); padding: 0 var(--space-2); font-size: var(--text-ui); line-height: var(--leading-ui); }
.pm-row + .pm-row { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.pm-n { color: var(--ink-1); }
.pm-v { color: var(--ink-2); font-size: var(--text-meta); line-height: var(--leading-meta); }
.popl { position: absolute; z-index: var(--z-overlay); min-width: calc(var(--space-16) * 3); }
.popl .mi svg { width: var(--icon-sm); height: var(--icon-sm); }
.popl .mi .ck { visibility: hidden; color: var(--brand-ink); }
.popl .mi[aria-selected="true"] .ck { visibility: visible; }
.popm, .popl { position: absolute; z-index: var(--z-overlay); }
.chip.sm { height: var(--size-control-sm); }
.chip.xs { height: var(--size-control-xs); padding: 0 var(--space-2); gap: var(--space-1); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.chip.xs svg { width: var(--icon-xs); height: var(--icon-xs); }
.chip.xs.own { color: var(--ink-1); font-weight: var(--weight-medium); }
.pl-sel { display: inline-flex; gap: var(--space-1); flex: none; }
.pl-step .head { min-height: var(--size-control); }

/* =====================================================================
   B · The stepper. The stages as points with names, the current one as a pill.
   ===================================================================== */
.stepper { list-style: none; margin: 0 0 0 var(--space-2); padding: 0; display: flex; align-items: center; gap: var(--space-1-5); flex: none; font-size: var(--text-meta); line-height: var(--leading-meta); white-space: nowrap; }
.sp { display: inline-flex; align-items: center; gap: var(--space-1-5); color: var(--ink-3); position: relative; }
.sp .mk { display: inline-grid; place-items: center; width: var(--icon-xs); height: var(--icon-xs); }
.sp .mk svg { width: var(--icon-xs); height: var(--icon-xs); color: var(--ink-3); }
.sp.todo { color: var(--ink-4); }
.sp.todo .st-todo { width: var(--glyph-sm); height: var(--glyph-sm); }
.cn { width: var(--space-3); height: var(--border); background: var(--line-2); flex: none; }
.sp.cur .pill { display: inline-flex; align-items: center; gap: var(--space-2); height: var(--size-control-sm); padding: 0 var(--space-3); border-radius: var(--radius-pill); background: var(--brand-tint-plane); box-shadow: inset 0 0 0 var(--border) var(--brand-marker-ring); }
.sp.cur .lb-c { color: var(--brand-ink); font-weight: var(--weight-strong); }
.sp.cur .pos { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sp.cur .stw { display: inline-flex; align-items: center; gap: var(--space-1-5); font-weight: var(--weight-medium); }
.sp.cur .stw.st-run-t, .sp.cur .stw.st-gh-t { font-weight: var(--weight-regular); }
.sp.cur .stw::before { content: ""; width: var(--border); height: var(--space-3); background: var(--brand-marker-ring); margin-right: var(--space-0-5); }
/* States of the stepper: paused, loading, and the pill of an error. */
.stepper.is-paused .sp.cur .pill { background: var(--surface-0); box-shadow: inset 0 0 0 var(--border) var(--line-2); }
.stepper.is-paused .sp.cur .lb-c { color: var(--ink-2); }
.stepper.is-loading .sp .lb, .stepper.is-loading .lb-c { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
.stepper.is-focus { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); border-radius: var(--radius-sm); }
.stepper .is-hover .lb { color: var(--ink-1); }
.fold .sp.done .lb, .fold .sp.todo .lb { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fold .cn { width: var(--space-2); }

/* ---------- Two small tabs above the conversation, only while the step has both agents. ---------- */
.vtabs { flex: none; padding: var(--space-1) var(--space-6) 0; background: var(--surface-1); }
.vtabs-in { max-width: calc(var(--measure) - var(--space-6) * 2); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure) + var(--space-6) * 2) / 2), 1px)); display: flex; gap: var(--space-5); height: var(--size-control); box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); }
.vt { position: relative; display: inline-flex; align-items: center; gap: var(--space-1-5); height: 100%; padding: 0 var(--space-0-5); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); transition: color var(--duration-fast) var(--ease-standard); }
.vt .st { width: var(--glyph-sm); height: var(--glyph-sm); }
.vt:hover, .vt.is-hover { color: var(--ink-1); }
.vt:active, .vt.is-active { color: var(--ink-1); }
.vt[aria-selected="true"] { color: var(--ink-1); font-weight: var(--weight-strong); }
.vt[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--border-2); border-radius: var(--radius-pill) var(--radius-pill) 0 0; background: var(--brand); }
.vt:focus-visible, .vt.is-focus { outline-offset: calc(var(--focus-offset) * -1); border-radius: var(--radius-sm); }
.vt .vw { color: var(--state-wait); font-weight: var(--weight-medium); }
.vt .vw.err { color: var(--state-error); }
.vt .vw.dis { color: var(--ink-4); font-weight: var(--weight-regular); }
.vt.is-loading .vw.dis { color: var(--ink-3); }
.vt:disabled, .vt.is-disabled { color: var(--ink-4); cursor: not-allowed; outline: var(--border) dashed var(--line-3); outline-offset: calc(var(--border) * -1); border-radius: var(--radius-sm); }
.vt.is-loading { cursor: progress; }
.vt.is-error .vw { color: var(--state-error); }
.m .convo-in { padding-top: var(--space-6); }

/* ---------- The top gives way by the width of the main area alone, in a fixed order: first what is
   around the stepper (the breadcrumb, the labels of the tools, the context meter's track), then the stages
   done fold to their mark (the name in the tooltip), then the loop and the working word of the pill, and the
   names of the current stage and of the stages to come last. They hold at half the monitor (1250 to 1300 px
   of window, 950 to 1000 px of main area). The title gives way after all of it.
   Below 1660 px the breadcrumb folds · 1440 the panels keep their icons · 1360 Pause keeps its icon
   · 1300 the context meter keeps its percentage, the connectors go · 1200 the stages done keep their mark
   · 1040 the pill drops the loop (3/7) and keeps the spinner without the word · 900 the stages to come keep
   their circle. ---------- */
@container main (max-width: 1660px) { .mh .crumbs .board, .mh .crumbs .epicl { display: none; } .mh .crumbs .ellb { display: inline-flex; } }
@container main (max-width: 1440px) { .mh .pbtn .pl { display: none; } .mh .pbtn svg { display: inline-block; } .mh .pbtn { width: var(--size-control-xs); padding: 0; justify-content: center; } }
@container main (max-width: 1360px) { .mh .pz .pl { display: none; } .mh .pz { width: var(--size-control-sm); padding: 0; justify-content: center; } }
@container main (max-width: 1300px) { .mh .ctx .trk { display: none; } .mh .cn { display: none; } .mh .stepper { gap: var(--space-2-5); } }
@container main (max-width: 1200px) { .mh .sp.done .lb { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .mh .stepper { gap: var(--space-2); } }
@container main (max-width: 1040px) { .mh .sp.cur .lp { display: none; } .mh .sp.cur .stw .long { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .mh { gap: var(--space-2); } .mh .stepper { margin-left: 0; } .mh .sp { gap: var(--space-1); } .mh .sp.cur .pill { padding: 0 var(--space-2-5); } }
@container main (max-width: 900px) { .mh .sp.todo .lb { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }

/* =====================================================================
   ROUND 15 · what the three treatments share: Markdown in the reading
   register (headings, tables, mermaid, code with its path), the action
   row, the request cards without a header band, the error block, the
   body of a milestone that opens, the caret of a speech in streaming and

/* =====================================================================
   B · The stepper. The progress is a compact stepper in the header: the
   stages as points with their names, the current one opened into a pill
   with the position (3/7) and the state of the place. No full track, no
   times. The two agents are two small tabs above the conversation, only
   while the step has both.
   ===================================================================== */
function stepper(opts = {}) {
  const stage = opts.stage ?? SC.stage, stages = opts.stages || STAGES, g = opts.g ?? NOW.g;
  const bar = opts.bar ?? (typeof S !== "undefined" && S.hasBar); opts.bar = bar;
  const pos = opts.pos ?? NOW.posShort, word = opts.short ?? NOW.short, long = opts.word ?? NOW.word;
  const items = stages.map((n, k) => {
    const s = k < stage ? "done" : k === stage ? "cur" : "todo";
    if (s === "cur") return `<li class="sp cur" aria-current="step"><span class="pill"><span class="lb-c">${n}</span>${pos ? `<span class="pos">${pos.replace(/ · (.*)$/, `<span class="lp"> · $1</span>`)}</span>` : ""}<span class="stw st-${g}-t">${st(g, opts.bar ? long : "")}${opts.bar ? "" : `<span class="long">${word}</span>`}</span></span></li>`;
    const mark = s === "done" ? `<span class="mk">${I("check")}</span>` : `<span class="mk">${st("todo")}</span>`;
    return `<li class="sp ${s}" data-tip="${n} · ${s === "done" ? "done" : "to come"}">${mark}<span class="lb">${n}<span class="sr"> · ${s === "done" ? "done" : "to come"}</span></span></li>`;
  });
  const tip = stages.map((n, k) => `${k < stage ? "✓" : k === stage ? "●" : "○"} ${n}`).join("  ");
  return `<ol class="stepper ${opts.cls || ""}" tabindex="0" data-tip="${tip}" aria-label="Progress · ${stages[stage]}${pos ? ` ${pos}` : ""} · ${long}">${items.join(`<li class="cn" aria-hidden="true"></li>`)}</ol>`;
}

<span class="kw">import</span> (
	<span class="str">"sync"</span>
	<span class="str">"time"</span>
)

<span class="com">// Limiter keeps one bucket per API key, created on first use.</span>
<span class="kw">type</span> Limiter <span class="kw">struct</span> {
	mu      sync.RWMutex
	buckets <span class="kw">map</span>[<span class="kw">string</span>]*Bucket
	plans   PlanSource
}

<span class="com">// For returns the bucket of a key, creating it full from the key's plan.</span>
<span class="kw">func</span> (l *Limiter) <span class="fn">For</span>(keyID <span class="kw">string</span>, now time.Time) *Bucket {
	l.mu.<span class="fn">RLock</span>()
	b, ok := l.buckets[keyID]
	l.mu.<span class="fn">RUnlock</span>()
	<span class="kw">if</span> ok {
		<span class="kw">return</span> b
	}
	plan := l.plans.<span class="fn">PlanFor</span>(keyID)
	l.mu.<span class="fn">Lock</span>()
	<span class="kw">defer</span> l.mu.<span class="fn">Unlock</span>()
	<span class="kw">if</span> b, ok = l.buckets[keyID]; ok {
		<span class="kw">return</span> b
	}
	b = &amp;Bucket{burst: plan.Burst, rate: plan.RefillPerSecond, tokens: plan.Burst, last: now}
	l.buckets[keyID] = b
	<span class="kw">return</span> b
}

<span class="com">// Allow takes one token if there is one, refilling first from the time elapsed.</span>
<span class="kw">func</span> (b *Bucket) <span class="fn">Allow</span>(now time.Time) <span class="kw">bool</span> {
	b.mu.<span class="fn">Lock</span>()
	<span class="kw">defer</span> b.mu.<span class="fn">Unlock</span>()
	elapsed := now.<span class="fn">Sub</span>(b.last).<span class="fn">Seconds</span>()
	b.tokens = <span class="fn">min</span>(<span class="fn">float64</span>(b.burst), b.tokens+elapsed*b.rate)
	b.last = now
	<span class="kw">if</span> b.tokens &lt; <span class="num">1</span> {
		<span class="kw">return</span> <span class="kw">false</span>
	}
	b.tokens--
	<span class="kw">return</span> <span class="kw">true</span>
}</pre></div>`;

  const v = typeof curVoice === "function" ? curVoice() : "impl";
  return c[v] || c.impl || c.rev;
}
// Is this entry something you read (a speech, a request, an error), something you may skip (actions), or a
// milestone that marks the time? The three variations weigh the three differently.
const ROLE = (e) => ["agent", "user", "question", "permission", "error", "findings"].includes(e.t) ? "read" : e.t === "acts" || e.t === "activity" ? "skip" : "time";

/* =====================================================================
   ROUND 15 · pieces the three variations share: the request cards, the
   error block, an action row, the findings card, the way back to the end,
   and the keyboard path between entries. Each variation sets:
     V.conv()       the conversation's HTML
     V.after(cv)    where the conversation opens (the end, or the top in `long`)

let ENTRY_N = 0;
const eid = () => `e${++ENTRY_N}`;
const plain = (h) => String(h).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
const WHO = { impl: "Implementer", rev: "Reviewer", agent: "PRD agent" };
const WHO_ICON = { impl: "bot", rev: "review-s", agent: "bot" };
const LONG_TIME = (at) => `Today at ${at}`;

// An action row: the description the agent wrote, the command dimmed, the status or the duration.
// A subagent opens its own actions, indented, with its own summary.
function actIcon(s) {
  if (s === "done") return `<span class="ai ok">${I("check")}</span>`;
  if (s === "error") return `<span class="ai bad">${I("x")}</span>`;
  if (s === "interrupted") return `<span class="ai">${I("ban")}</span>`;
  if (s === "wait") return `<span class="ai">${I("hold")}</span>`;
  if (s === "agent") return `<span class="ai">${I("bot")}</span>`;
  return `<span class="ai">${st("run")}</span>`;
}
function actRow(r) {
  const [label, cmd, s, note, sub] = r;
  if (s === "agent") return `<li class="ar sub"><details class="subag"><summary aria-label="${label}, ${sub.roll}, ${sub.dur}">${I("right", "i chev")}${actIcon("agent")}<span class="al">${label}</span><span class="sroll">${sub.roll}</span><span class="ad">${sub.dur}</span></summary><ul class="subrows">${sub.rows.map(actRow).join("")}</ul></details></li>`;
  const cls = s === "error" ? "is-err" : s === "running" ? "is-now" : s === "wait" ? "is-hold" : s === "interrupted" ? "is-int" : "";
  return `<li class="ar ${cls}">${actIcon(s)}<span class="al">${label}</span><span class="ac" data-tip="${esc(cmd)}">${esc(cmd)}</span><span class="ad">${note || s}</span></li>`;
}
function actRows(g) {
  const earlier = g.earlier ? `<li class="ar more"><button class="earlier" type="button">${I("up")}Show ${g.earlier} earlier actions</button></li>` : "";
  return `<ul class="arows">${earlier}${g.rows.map(actRow).join("")}</ul>`;
}
// The summary of a group, in words: what it did, what failed, what waits.
function actRoll(g) {
  if (g.live) return `<span class="now">${st("run")}<span class="nl">${g.live[0]}</span><span class="nc">${esc(g.live[1])}</span></span>`;
  const fail = g.fail ? ` <span class="${g.recovered ? "rec" : "bad"}">· ${g.fail} failed${g.recovered ? ", then passed" : ""}</span>` : "";
  return `<span class="roll">${g.roll}${fail}${g.hold ? " · 1 waits for your permission" : ""}</span>`;
}
const actName = (g) => `${g.n} actions, ${g.live ? `running: ${g.live[0]}` : plain(g.roll)}${g.fail ? `, ${g.fail} failed${g.recovered ? " then passed" : ""}` : ""}${g.dur ? `, ${g.dur}` : ""}`;

// The request cards: no header band, the ask bar already says what and whose.
function reqCard(e) {
  const id = eid();
  if (e.t === "question" && e.answered) return `<fieldset class="card cv-ans" aria-labelledby="${id}"><div class="bd"><div class="aq" id="${id}">${I("check")}<span>${e.q}</span><span class="t">answered ${e.answeredAt}</span></div><div class="aa">${e.answer}</div></div></fieldset>`;
  if (e.t === "question") return `<fieldset class="card cv-req" ${e.live ? 'id="askcard"' : ""} aria-labelledby="${id}"><div class="bd"><div class="q" id="${id}">${e.q}</div>
    <div class="opts" role="radiogroup" aria-labelledby="${id}">${e.opts.map((o, k) => `<button class="opt" role="radio" aria-checked="false"><span class="kn">${k + 1}</span><span class="ot">${o[0]}<small>${o[1]}</small></span></button>`).join("")}
    <button class="opt" role="radio" aria-checked="false"><span class="kn">${e.opts.length + 1}</span><span class="ot">Other…<small>Write your own answer.</small></span></button></div></div></fieldset>`;
  return `<fieldset class="card cv-req" ${e.live ? 'id="askcard2"' : ""} aria-labelledby="${id}"><div class="bd"><div class="pd" id="${id}"><span class="tag">${e.tool}</span><span>${e.desc}</span></div><pre class="cmd">${e.cmd}</pre><div class="foot">${e.foot}</div>
    <div class="btns"><button class="btn primary">Allow <span class="k">1</span></button><button class="btn">Allow for this session <span class="k">2</span></button><button class="btn ghost">Deny… <span class="k">3</span></button></div></div></fieldset>`;
}
// The error: the explanation and the detail; the title and Retry live in the ask bar.
const errBlock = (e) => `<div class="cv-err" role="group" aria-label="Session error">${e.text}${e.detail ? `<pre>${e.detail}</pre>` : ""}</div>`;
// The findings of the PR review: the decision card of screens/task.md §9, as round 10 left it.
function findingsCard() {
  return FINDCARD(false).replace(/<fieldset class="card dec" id="askcard" aria-labelledby="dec-t"><div class="hd">[\s\S]*?<\/div>/, '<fieldset class="card dec plain" id="askcard" aria-labelledby="dec-t"><div class="hd"><span id="dec-t">Findings</span><span class="grow"></span><span class="faint num">4</span></div>').replace(/<div class="foot">[\s\S]*?<\/div><\/div><\/fieldset>$/, "</div></fieldset>");
}
// The body of a milestone that opens: a document, a report, the product's message.
function markBody(e) {
  if (!e.body) return "";
  const foot = e.kind === "product" ? "" : `<div class="mfoot"><button class="btn ghost xs" data-panel="Artifacts">${I("file")}${e.foot || "Open in Artifacts"}</button></div>`;
  return `<div class="mbody"><div class="prose sm">${e.body}</div>${foot}</div>`;
}
const markName = (e) => `${e.text}${e.n ? ` · ${plain(e.n)}` : ""}, ${e.at}`;
const caret = `<span class="caret" aria-hidden="true"></span>`;
// A streaming speech ends on a still caret: the spinner, beside the speaker, is what moves.
function speechHTML(e) {
  if (!e.streaming) return e.html;
  return e.html.replace(/(<\/(?:p|li)>)(?![\s\S]*<\/(?:p|li)>)/, `${caret}$1`);
}

// ---------------- The way back to the end ----------------
function newMessages() {
  if (SCENE !== "long") return "";
  return `<div class="tomsg"><button class="newmsg2" type="button" data-toend aria-label="New messages: 2. Go to the end. The implementer is writing.">${I("arrow-down")}<span class="nm-l">New messages</span><span class="nm-n">2</span><span class="nm-sep" aria-hidden="true"></span>${st("run")}<span class="nm-w">Implementer writing</span></button></div>`;
}

// ---------------- The keyboard path ----------------
// With the focus in the conversation, ↑ and ↓ (or Page Up and Page Down) move between entries; Home and End go
// to the first and the last. Tab still walks the controls inside an entry. Esc returns to the composer.
const shown = (x) => x.getClientRects().length && !x.parentElement.closest("details:not([open]) > :not(summary)");
function navList() { return [...document.querySelectorAll(`#convo ${V.nav}`)].filter(shown); }
// One Tab stop for the whole conversation: the current entry. The controls inside the current entry (an open

const FOCUSABLE = 'a[href], button, summary, [tabindex], input, textarea';
const boxOf = (nav) => nav.tagName === "SUMMARY" ? nav.parentElement : nav;
function rove(cur) {
  const cv = document.getElementById("convo"); if (!cv || !cur) return;
  cv.querySelectorAll(FOCUSABLE).forEach((el) => { if (!el.matches(V.nav)) el.tabIndex = -1; });
  navList().forEach((x) => { x.tabIndex = -1; });
  cur.tabIndex = 0;
  const box = boxOf(cur);
  box.querySelectorAll(FOCUSABLE).forEach((el) => {
    if (el === cur || el.matches(V.nav)) return;
    const owner = el.closest(V.nav); if (owner && owner !== cur) return;
    if (el.closest("[role=radiogroup]")) return;
    el.tabIndex = 0;
  });

}

}
// The option cards: 1–9 choose, ↑ ↓ move inside the radiogroup, Enter sends the chosen answer.
function choose(opt) {
  const g = opt.closest("[role=radiogroup]"); if (!g || opt.getAttribute("aria-disabled") === "true") return;

}

document.addEventListener("click", (e) => {

  const pb = e.target.closest(".cv .card.cv-req .btns .btn");

});
document.addEventListener("keydown", (e) => {

  const card = e.target.closest(".card.cv-req, .card.dec");
  const opt = e.target.closest("[role=radio]");
  if (opt && (e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    e.preventDefault(); const opts = [...opt.closest("[role=radiogroup]").querySelectorAll("[role=radio]")]; const k = opts.indexOf(opt);

    return;
  }

  const cur = document.activeElement.closest(V.nav);

  if (cur && /^[1-9]$/.test(e.key)) { const opts = cur.querySelectorAll("[role=radio]"); if (opts.length) { e.preventDefault(); const o = opts[+e.key - 1]; if (o) choose(o); return; } }

  if (e.key === "End") { e.preventDefault(); focusEntry(list[list.length - 1]); return; }

}, true);
// Focus that lands in the conversation by a click or by Show makes that entry the current one.
document.addEventListener("focusin", (e) => {
  const cv = document.getElementById("convo"); if (!cv || !cv.contains(e.target)) return;
  const cur = e.target.closest(V.nav); if (cur && cur.tabIndex !== 0) rove(cur);
});
// The last entry is the one Tab lands on; ?focus=N shows the focus on the Nth entry.
function armNav() {
  const list = navList(); if (!list.length) return;
  const req = list.find((x) => x.querySelector("#askcard, #askcard2"));
  rove(req || list[list.length - 1]);
  if (Q.has("focus")) { const n = +Q.get("focus"); const el = list[n < 0 ? list.length + n : n]; if (el) { rove(el); el.classList.add("is-focus"); el.addEventListener("blur", () => el.classList.remove("is-focus"), { once: true }); el.focus({ preventScroll: true }); el.scrollIntoView({ block: "center" }); } }
}
// ?tabs: the Tab stops of the conversation, measured, in the report.
function tabStops() {
  const cv = document.getElementById("convo"); if (!cv) return 0;
  return [...cv.querySelectorAll(FOCUSABLE)].filter((el) => el.tabIndex >= 0 && el.getClientRects().length && !el.closest("details:not([open]) > :not(summary)")).length;
}
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-toend]")) { const cv = document.getElementById("convo"); cv.scrollTop = cv.scrollHeight; const t = document.querySelector(".tomsg"); if (t) t.hidden = true; }
});
// Where the conversation opens: at the end, where it follows what arrives; the long scene opens scrolled up,
// the way a reader leaves it, so the folds and the way back to the end are both in sight.
// Pieces that shrink to their text land on whole pixels: WebKitGTK blurs half pixels (principle 10).
function snapWidths() {
  document.querySelectorAll(".cu, .newmsg2, .tut, .dutext, .cv-ans").forEach((el) => {
    el.style.width = ""; let w = Math.ceil(el.getBoundingClientRect().width);
    // A centred piece takes the parity of its container, so its left edge is whole too.
    if (el.classList.contains("newmsg2")) { const cw = Math.round(el.parentElement.getBoundingClientRect().width); if ((cw - w) % 2) w += 1; }
    el.style.width = w + "px";
  });
}
addEventListener("resize", snapWidths);
if (document.fonts) document.fonts.ready.then(snapWidths);
function afterRender(cv) {
  snapWidths();
  if (SCENE === "long") cv.scrollTop = 0;
  if (Q.has("open")) document.querySelectorAll(Q.get("open") === "all" ? "#convo details" : "#convo details.is-first").forEach((d) => d.open = true);
  requestAnimationFrame(armNav);
  const tm = document.querySelector(".tomsg"); if (!tm) return;
  // It exists only out of the end: at the end, or with everything in sight, there is nothing to go back to.
  const upd = () => { tm.hidden = cv.scrollHeight - cv.scrollTop - cv.clientHeight < 8; };
  upd(); cv.addEventListener("scroll", upd); addEventListener("resize", upd); if (document.fonts) document.fonts.ready.then(upd);
}
document.addEventListener("DOMContentLoaded", () => document.body.insertAdjacentHTML("afterbegin", SPRITE_15));
// ?kbtest: a scripted walk of the keyboard, written to the report (keys dispatched as the browser would).
if (Q.has("kbtest")) setTimeout(() => {
  const key = (k) => document.activeElement.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));
  const name = () => { const a = document.activeElement; return (a.getAttribute("aria-label") || a.textContent || a.tagName).trim().replace(/\s+/g, " ").slice(0, 60); };
  const out = { scene: SCENE, voice: curVoice(), tabStopsConvo: tabStops() };
  const show = document.querySelector("[data-show]");
  if (show && document.querySelector("#askcard [role=radio]")) {
    show.click(); out.afterShow = name();
    key("ArrowDown"); out.afterDown = name(); out.checkedAfterDown = [...document.querySelectorAll("#askcard [role=radio]")].map((o) => o.getAttribute("aria-checked"));
    key("ArrowDown"); key("ArrowDown"); out.wrapsTo = name();
    key("1"); out.after1 = name(); out.checkedAfter1 = [...document.querySelectorAll("#askcard [role=radio]")].map((o) => o.getAttribute("aria-checked"));
    key("Enter"); out.afterEnter = (document.querySelector("#askcard .qsend") || {}).textContent || "nothing";
  }
  const list = navList(); focusEntry(list[list.length - 1]); out.start = name();
  const walk = []; for (let i = 0; i < 4; i++) { key("ArrowUp"); walk.push(name()); } out.up4 = walk;
  const grp = list.find((x) => x.tagName === "SUMMARY" && x.parentElement.matches(".da, .t-grp"));

/* =====================================================================
   A · Document. The conversation reads as running text. A margin on the
   left holds who speaks and when; the text column holds what is said.
   The agent's speech has no card and no ground. The actions are a thin
   folded line between speeches; open, the sunken block of the system.
   Your messages sit on the right, on a rule, without a balloon. The
   milestones are the discreet line of components.md (no rule across the
   reading), and a stretch of the past folds behind that same line. The
   question and the permission are the only blocks with a contour.
   After the critique, two loans from B: the time is written only when it
   changes, and the arrow keys walk every entry (→ opens, ← folds), with
   one Tab stop for the whole conversation.
   ===================================================================== */
let DOC_LAST = "";
// The margin: the time, only when it changes; the exact time stays in the tooltip and the accessible name.
function dTime(at) {
  const show = at && at !== DOC_LAST; if (at) DOC_LAST = at;
  return show ? `<span class="dt" data-tip="${LONG_TIME(at)}">${at}</span>` : "";
}
const dMargin = (e, extra = "") => `<div class="dm">${extra}${dTime(e.at)}</div>`;
// A retry that went through is a fact of the turn that follows: it joins that group's line instead of
// standing as a line of its own, so milestones do not stack.
function docPrep(list) {
  const out = [];
  list.forEach((e, k) => {
    if (!e) return;
    const next = list[k + 1];
    if (e.t === "mark" && e.kind === "retry" && next && next.t === "acts") { out.push({ ...next, retried: "retried on its own · 2 attempts", retriedTip: plain(e.n) }); list[k + 1] = null; return; }
    out.push(e);
  });
  return out.filter(Boolean);
}
function docEntries(list) {
  let prev = null;
  return docPrep([...list]).map((e) => {
    const html = docEntry(e, prev);
    prev = e.t === "agent" ? e.who : e.t === "acts" ? prev : null;
    return html;
  }).join("");
}
function docEntry(e, prevWho) {
  if (e.t === "agent") {
    const same = prevWho === e.who;
    const mark = e.streaming ? `<span class="dmk">${st("run")}</span>` : `<span class="dmk ${e.who === "rev" ? "rev" : ""}" aria-hidden="true"></span>`;
    const who = same ? "" : `<span class="dn">${WHO[e.who]}</span>`;
    const t = dTime(e.at);
    return `<article class="dr d-sp ${same ? "same" : ""}" data-nav tabindex="-1" aria-label="${WHO[e.who]}, ${e.at}${e.streaming ? ", writing" : ""}${e.interrupted ? ", interrupted" : ""}">
      <div class="dm">${same ? "" : mark}${who}${t}${e.streaming ? `<span class="dt">writing</span>` : ""}</div>
      <div class="dx"><div class="prose">${speechHTML(e)}</div>${e.interrupted ? `<div class="intr">${I("ban")}Interrupted by you</div>` : ""}</div></article>`;
  }
  if (e.t === "user") {
    DOC_LAST = e.at;
    const meta = e.queued ? `<span class="dq">Queued · sends when the turn ends</span><button class="btn ghost xs" data-tip="Remove the message from the queue">Remove</button>` : `<span>You · ${e.at}${e.fromQueue ? " · from the queue" : ""}</span>`;
    return `<article class="dr d-us ${e.queued ? "queued" : ""}" data-nav tabindex="-1" aria-label="You, ${e.at}${e.queued ? ", queued" : ""}"><div class="dm"></div><div class="dx"><div class="dumeta">${meta}</div><div class="dutext">${e.text}</div></div></article>`;
  }
  if (e.t === "acts") {
    const dur = e.live ? e.live[2] : e.dur;
    const sum = `<summary data-nav tabindex="-1" aria-label="${actName(e)}${e.retried ? `, ${e.retried}` : ""}">${I("right", "i chev")}<span class="dan">${e.n} actions</span>${actRoll(e)}${dur ? `<span class="dad">· ${dur}</span>` : ""}${e.retried ? `<span class="dre" data-tip="${e.retriedTip}">${I("retry")}${e.retried}</span>` : ""}</summary>`;
    return `<div class="dr d-ac ${e.live ? "live" : ""}">${dMargin(e)}<details class="da" ${e.open ? "open" : ""}>${sum}${actRows(e)}</details></div>`;
  }
  if (e.t === "mark") {
    // The discreet line of components.md: the icon, the words, the complement; the time in the margin.
    const line = `${I(e.icon, "i dki")}<span class="dkt">${e.text}</span>${e.n ? `<span class="dkn">${e.n}</span>` : ""}`;
    if (!e.body) return `<div class="dr d-mk ${e.kind}">${dMargin(e)}<div class="dk" data-nav tabindex="-1" role="separator" aria-label="${markName(e)}">${line}</div></div>`;
    return `<div class="dr d-mk ${e.kind}">${dMargin(e)}<details class="dkd"><summary class="dk" data-nav tabindex="-1" aria-label="${markName(e)}, opens here">${line}${I("right", "i chev")}</summary>${markBody(e)}</details></div>`;
  }
  if (e.t === "question" || e.t === "permission") return `<article class="dr d-req" data-nav tabindex="-1" aria-label="${e.t === "question" ? (e.answered ? "Question, answered" : "Question") : "Permission"}, ${e.at}">${dMargin(e)}<div class="dx">${reqCard(e)}</div></article>`;

// Per treatment, how hover and focus land: on the summary or on the entry.
function applyState(v, h, s) {
  if (s !== "hover" && s !== "focus") return s(h);
  const c = `is-${s}`;
  if (/<summary/.test(h)) return onSummary(c)(h);
  if (v === "c") return h.replace(/<(article|section|div) class="/, `<$1 class="${c} `);
  return cls(c)(h);
}
function cell(v, [label, e, fx]) {
  let h = DOCS[v].render(e);
  if (fx) h = applyState(v, h, fx);
  return `<div class="cell"><span class="sl">${label}</span>${DOCS[v].wrap(h)}</div>`;
}
function modes(inner) {
  return `<div class="modes"><div class="mode" data-theme="light"><div class="mcap">Light</div>${inner}</div><div class="mode" data-theme="dark"><div class="mcap">Dark</div>${inner}</div></div>`;
}
const SHARED = () => {
  const rows = [R("Read the finding's file", "sed -n '1,60p' internal/ratelimit/limiter.go", "done", "0.1 s"), R("Run the rate limit tests", "go test ./internal/ratelimit/... -race", "error", "exit 1 · 8.2 s"), R("Run the refill and eviction tests", "go test ./internal/ratelimit/... -race -run 'Evict|Refill'", "running", "12 s"), R("Run the linter", "golangci-lint run ./...", "interrupted", "stopped with the session"), R("Apply the migration to api_dev", "the command in the card below", "wait", "waits for your permission")];
  const nm = (c, extra = "") => `<div class="tomsg static"><button class="newmsg2 ${c}" type="button">${I("arrow-down")}<span class="nm-l">New messages</span><span class="nm-n">2</span><span class="nm-sep" aria-hidden="true"></span>${st("run")}<span class="nm-w">Implementer writing</span></button></div>${extra}`;
  const nothing = `<div class="tomsg static"><button class="newmsg2 only" type="button" aria-label="Go to the end">${I("arrow-down")}</button></div>`;
  return `<section class="cs"><h2>Shared · the action row</h2><p>The description the agent wrote, the command dimmed, and the duration or the exit code. The state is the icon and, for a failure, the red of the label.</p>
    ${modes(`<div class="cell wide"><span class="sl">done · error · running · interrupted · waits</span><ul class="arows">${rows.map(actRow).join("")}</ul></div>`)}</section>
    <section class="cs"><h2>Shared · the way back to the end</h2><p>Out of the end, it names what arrived and who works. It leaves once you are at the end.</p>
    ${modes(`<div class="cell"><span class="sl">default</span>${nm("")}</div><div class="cell"><span class="sl">hover</span>${nm("is-hover")}</div><div class="cell"><span class="sl">focus</span>${nm("is-focus")}</div><div class="cell"><span class="sl">active</span>${nm("is-active")}</div><div class="cell"><span class="sl">nothing new</span>${nothing}</div>`)}</section>
    <section class="cs"><h2>Shared · mermaid</h2><p>The figure on the sunken ground, the language and full screen; the diagram in the ink of the text.</p>${modes(`<div class="cell wide"><span class="sl">default · full screen in hover</span>${MERMAID.replace('class="btn ghost xs icon"', 'class="btn ghost xs icon is-hover"')}</div>`)}</section>`;
};
function build() {
  let html = `<main class="spec"><header><h1>Conversation components</h1><p>Round 15. Every entry the three treatments draw, in every state, light and dark side by side. Hover, focus and pressed are drawn with the classes the real states map to.</p></header>`;
  for (const v of ["a", "b", "c"]) {
    html += `<h2 class="vh">${DOCS[v].name}</h2>`;
    for (const [key, [title, note, cells]] of Object.entries(GROUPS)) {
      const inner = cells.map((c) => cell(v, c)).join("");
      html += `<section class="cs"><h2>${title}</h2><p>${note}</p>${modes(inner)}</section>`;
    }
  }
  html += SHARED() + `</main>`;
  return html;
}
