<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>07 · Theme explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* =====================================================================
   TOKENS THAT ARE NOT COLOR · the same for every theme.
   Every size is a whole pixel at the 16px root: WebKitGTK blurs half pixels.
   Color lives only in the theme blocks written by the script below: a theme
   is one complete set of semantic tokens, in light and in dark.
   ===================================================================== */
:root {
  --sp-0-5: 0.125rem; --sp-1: 0.25rem; --sp-1-5: 0.375rem; --sp-2: 0.5rem; --sp-2-5: 0.625rem; --sp-3: 0.75rem; --sp-4: 1rem;
  --sp-5: 1.25rem; --sp-6: 1.5rem; --sp-8: 2rem; --sp-12: 3rem; --sp-16: 4rem;
  --measure: 50rem;
  --bw: 1px; --bw-2: 2px; --rail: 3px; --focus-w: 2px; --focus-off: 2px; --halo: 3px;
  --glyph: 10px; --glyph-sm: 8px; --glyph-diamond: 8px; --glyph-bar: 3px;
  --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 280ms; --duration-spin: 900ms; --duration-shimmer: 1400ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --icon: 1rem; --icon-sm: 0.875rem; --icon-xs: 0.75rem; --icon-stroke: 1.5; --mark: 1.5rem; --av: 1.5rem;
  --h-ctl: 2rem; --h-ctl-sm: 1.75rem; --h-ctl-xs: 1.375rem; --h-chip: 1.75rem; --h-tw: 1.125rem; --h-more: 1rem; --h-kbd: 1.125rem;
  --h-head: 3rem; --h-prog: 2.5rem; --h-node: 1.75rem; --h-switch: 1.75rem; --h-ask: 2.75rem; --h-more-below: 1.75rem;
  --ctx-w: 2.5rem; --ctx-h: 0.25rem; --ctx-pc: 2rem; --seg-w: 0.75rem; --seg-w-cur: 1.25rem; --seg-h: 0.25rem; --seg-gap: 0.1875rem;
  --r-xs: 0.1875rem; --r-sm: 0.375rem; --r-md: 0.5rem; --r-lg: 0.75rem; --r-xl: 1rem; --r-pill: 999px;
  --tree-pad: 0.5rem; --row-pad-y: 0.375rem; --row-gap: 0.25rem; --line-gap: 0.125rem; --section-gap: 1.5rem;
  --epic-indent: 1rem;          /* an epic's items step in by one glyph column */
  --guide-x: 0.9375rem;         /* the guide sits under the epic's chevron: 15px, a whole pixel */
  --key-w: 1.25rem; --act-k: 3.5rem; --composer-min: 3.5rem; --list-indent: 1.25rem; --code-pad-y: 0.0625rem; --code-pad-x: 0.3125rem;
  --newmsg-w: 8.5rem;
  --fade: 1.5rem; --link-offset: 0.2em; --link-line-mix: 45%; --caps-tracking: 0.07em;

  --fs-caps: 0.6875rem; --lh-caps: 1rem;
  --fs-micro: 0.75rem;  --lh-micro: 1rem;
  --fs-meta: 0.8125rem; --lh-meta: 1.125rem;
  --fs-ui: 0.875rem;    --lh-ui: 1.25rem;
  --fs-body: 0.9375rem; --lh-body: 1.375rem;
  --fs-read: 1rem;      --lh-read: 1.625rem;
  --fs-q: 1.125rem;     --lh-q: 1.5rem;
  --fs-title: 1.125rem; --lh-title: 1.5rem;
  --fs-display: 1.375rem; --lh-display: 1.75rem;
  --fs-code: 0.8125rem; --lh-code: 1.25rem;
  --fs-code-read: 0.875rem;
  --fw-regular: 400; --fw-medium: 500; --fw-strong: 600; --fw-bold: 700;
  --fw-name: 400; --fw-name-you: 600;
  --font-ui: "Fira Sans", system-ui, sans-serif; --font-read: "Fira Sans", system-ui, sans-serif;
  --font-mono: "Fira Code", ui-monospace, monospace;
  --measure-read: 42rem;

  /* The explorer panel: a tool over the mock, never part of a theme. Its own neutral tokens, in both modes. */
  --pn-w: 23rem;
  --pn-bg: oklch(0.995 0 0); --pn-bg-2: oklch(0.96 0 0); --pn-ink: oklch(0.22 0 0); --pn-ink-2: oklch(0.4 0 0); --pn-ink-3: oklch(0.5 0 0);
  --pn-line: oklch(0.89 0 0); --pn-sel: oklch(0.935 0 0); --pn-sel-ring: oklch(0.42 0 0); --pn-focus: oklch(0.25 0 0); --pn-warn: oklch(0.5 0.19 27);
  --pn-shadow: 0 12px 32px oklch(0 0 0 / 0.16), 0 0 0 1px oklch(0 0 0 / 0.08);
  --pn-swatch-ring: oklch(0 0 0 / 0.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pn-bg: oklch(0.24 0 0); --pn-bg-2: oklch(0.28 0 0); --pn-ink: oklch(0.95 0 0); --pn-ink-2: oklch(0.8 0 0); --pn-ink-3: oklch(0.72 0 0);
    --pn-line: oklch(0.35 0 0); --pn-sel: oklch(0.32 0 0); --pn-sel-ring: oklch(0.75 0 0); --pn-focus: oklch(0.92 0 0); --pn-warn: oklch(0.75 0.15 27);
    --pn-shadow: 0 12px 32px oklch(0 0 0 / 0.5), 0 0 0 1px oklch(1 0 0 / 0.1);
    --pn-swatch-ring: oklch(1 0 0 / 0.16);
  }
}
:root[data-theme="dark"] {
  --pn-bg: oklch(0.24 0 0); --pn-bg-2: oklch(0.28 0 0); --pn-ink: oklch(0.95 0 0); --pn-ink-2: oklch(0.8 0 0); --pn-ink-3: oklch(0.72 0 0);
  --pn-line: oklch(0.35 0 0); --pn-sel: oklch(0.32 0 0); --pn-sel-ring: oklch(0.75 0 0); --pn-focus: oklch(0.92 0 0); --pn-warn: oklch(0.75 0.15 27);
  --pn-shadow: 0 12px 32px oklch(0 0 0 / 0.5), 0 0 0 1px oklch(1 0 0 / 0.1);
  --pn-swatch-ring: oklch(1 0 0 / 0.16);
}

/* Aliases: declared on every scope (the page, a theme scope, the rail) so they resolve against that scope's colors. */
:root, .th, .sb, .sbx {
  --bg-conv: var(--bg-ground); --bg-main: var(--bg-ground); --bg-head: var(--bg-ground); --bg-app: var(--bg-ground); --bg-code: var(--bg-sunken);
  --primary: var(--brand); --primary-hover: var(--brand-hover); --primary-active: var(--brand-active); --primary-on: var(--brand-on);
  --focus-halo: color-mix(in srgb, var(--focus) var(--halo-mix), transparent);
  --link: var(--brand-ink);
  --bg-hover: color-mix(in srgb, var(--tint-ink) var(--hover-mix), transparent);
  --bg-active: color-mix(in srgb, var(--tint-ink) var(--active-mix), transparent);
  --bg-selected: color-mix(in srgb, var(--brand) var(--sel-mix), var(--bg-sidebar));
  --bg-wash: color-mix(in srgb, var(--brand) var(--wash-mix), var(--bg-raised));
  --bg-wash-hover: color-mix(in srgb, var(--brand) var(--wash-hover-mix), var(--bg-raised));
  --bg-wash-active: color-mix(in srgb, var(--brand) var(--wash-active-mix), var(--bg-raised));
  --bg-wash-conv: color-mix(in srgb, var(--brand) var(--wash-mix), var(--bg-ground));
  --seg-todo: color-mix(in srgb, var(--brand) var(--seg-mix), var(--bg-ground));
  --marker-ring: color-mix(in srgb, var(--brand) var(--marker-mix), transparent);
  --key-ring: color-mix(in srgb, var(--primary-on) var(--key-mix), transparent);
  --sel-ring: var(--brand-line);
  --meter: var(--brand);
}

/* =====================================================================
   BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg-ground); color: var(--ink);
  font-family: var(--font-ui); font-size: var(--fs-ui); line-height: var(--lh-ui); text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus { outline: none; }
:focus-visible, .is-focus { outline: var(--focus-w) solid var(--focus); outline-offset: var(--focus-off); }
a { color: var(--link); text-decoration: underline; text-decoration-thickness: var(--bw); text-underline-offset: var(--link-offset); text-decoration-color: color-mix(in srgb, currentColor var(--link-line-mix), transparent); transition: text-decoration-color var(--duration-fast) var(--ease-standard); }
a:hover, a.is-hover { text-decoration-color: currentColor; }
a:active, a.is-active { color: var(--brand-active); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.grow { flex: 1 1 auto; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mono { font-family: var(--font-mono); }
.mono, code, pre, kbd, .tag, .it .l3, .acts li .tg, .ih-ref { font-variant-ligatures: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.faint { color: var(--ink-4); }
.row { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
svg.i { width: var(--icon); height: var(--icon); flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }
svg.i .fill, .ty .fill { fill: currentColor; stroke: none; }
kbd {
  display: inline-flex; align-items: center; height: var(--h-kbd); padding: 0 var(--sp-1);
  font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3);
  border: var(--bw) solid var(--line-strong); border-bottom-width: var(--bw-2); border-radius: var(--r-xs); background: var(--bg-raised); white-space: nowrap;
}
kbd.jk { color: var(--brand-ink); border-color: var(--brand-line); background: var(--bg-wash); }

/* ---------- Buttons: default, hover, focus, active, disabled, loading, error ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-1-5); flex: none;
  height: var(--h-ctl); padding: 0 var(--sp-3); border-radius: var(--r-sm);
  border: var(--bw) solid var(--line-strong); background: var(--bg-raised); color: var(--ink-2);
  font-size: var(--fs-ui); line-height: var(--lh-ui); font-weight: var(--fw-medium); white-space: nowrap;
  box-shadow: var(--shadow-btn);
  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);
}
.btn:hover, .btn.is-hover { background: color-mix(in srgb, var(--tint-ink) var(--hover-mix), var(--bg-raised)); color: var(--ink); }
.btn:active, .btn.is-active { background: color-mix(in srgb, var(--tint-ink) var(--active-mix), var(--bg-raised)); color: var(--ink); box-shadow: none; }
.btn[aria-pressed="true"] { background: var(--bg-wash); color: var(--brand-ink); border-color: transparent; }
.btn.sm { height: var(--h-ctl-sm); padding: 0 var(--sp-2-5); font-size: var(--fs-meta); line-height: var(--lh-meta); gap: var(--sp-1); }
.btn.xs { height: var(--h-ctl-xs); padding: 0 var(--sp-2); font-size: var(--fs-micro); line-height: var(--lh-micro); gap: var(--sp-1); }
.btn.icon { width: var(--h-ctl); padding: 0; }
.btn.sm.icon { width: var(--h-ctl-sm); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.ghost:hover, .btn.ghost.is-hover { background: var(--bg-hover); }
.btn.ghost:active, .btn.ghost.is-active { background: var(--bg-active); }
.btn.ghost[aria-pressed="true"] { background: var(--bg-wash-conv); color: var(--brand-ink); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-on); box-shadow: var(--shadow-primary); }
.btn.primary:hover, .btn.primary.is-hover { background: var(--primary-hover); border-color: var(--primary-hover); color: var(--primary-on); }
.btn.primary:active, .btn.primary.is-active { background: var(--primary-active); border-color: var(--primary-active); color: var(--primary-on); box-shadow: none; }
/* New: a raised button on the rail with the identity in its text and icon. It has a body on any rail, light or dark. */
.btn.new { background: var(--bg-raised); border-color: transparent; color: var(--brand-ink); box-shadow: var(--shadow-xs); }
.btn.new:hover, .btn.new.is-hover { background: var(--bg-wash-hover); color: var(--brand-ink); }
.btn.new:active, .btn.new.is-active { background: var(--bg-wash-active); color: var(--brand-ink); box-shadow: none; }
.btn .k { font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); }
.btn.primary .k { color: var(--primary-on); padding: 0 var(--sp-1); border-radius: var(--r-xs); box-shadow: inset 0 0 0 var(--bw) var(--key-ring); }
.btn:disabled, .btn[aria-disabled="true"], .btn.primary:disabled, .btn.new:disabled {
  background: transparent; border-style: dashed; border-color: var(--line-control); color: var(--ink-4); cursor: not-allowed; box-shadow: none;
}
.btn.ghost:disabled { border-color: transparent; }
.btn.is-loading { cursor: progress; }
.btn.is-error, .btn.primary.is-error, .btn.new.is-error { border-color: var(--err); color: var(--err); background: var(--err-bg); box-shadow: none; }
.why { font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); white-space: nowrap; }
.sep { width: var(--bw); align-self: stretch; background: var(--line); margin: var(--sp-2) var(--sp-1); flex: none; }
.spin { width: var(--glyph); height: var(--glyph); border-radius: 50%; border: var(--bw-2) solid var(--work-track); border-top-color: var(--work); animation: spin var(--duration-spin) linear infinite; flex: none; display: inline-block; }

/* ---------- Inputs ---------- */
.input {
  display: flex; align-items: center; gap: var(--sp-2); height: var(--h-ctl); padding: 0 var(--sp-2-5);
  border: var(--bw) solid var(--line-control); border-radius: var(--r-sm); background: var(--bg-input); color: var(--ink);
  font-size: var(--fs-ui); line-height: var(--lh-ui); min-width: 0; white-space: nowrap; overflow: hidden;
  transition: border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);
}
.input::placeholder, .input .ph { color: var(--ink-4); }
.input:hover, .input.is-hover { border-color: var(--ink-3); }
.input:focus-visible, .input.is-focus, .input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 var(--halo) var(--focus-halo); }
.input.is-active { border-color: var(--focus); }
.input:disabled, .input.is-disabled { border-style: dashed; background: transparent; color: var(--ink-4); cursor: not-allowed; }
.input.is-loading { color: var(--ink-3); cursor: progress; }
.input.is-error { border-color: var(--err); box-shadow: inset var(--rail) 0 0 var(--err); }
select.input { appearance: none; background-image: none; padding-right: var(--sp-6); }
.select-wrap { position: relative; display: block; }
.select-wrap svg { position: absolute; right: var(--sp-2); top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-3); }

/* ---------- Chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: var(--sp-1); height: var(--h-chip); padding: 0 var(--sp-2-5);
  border: var(--bw) solid var(--line-strong); border-radius: var(--r-pill); background: var(--bg-raised);
  font-size: var(--fs-meta); line-height: var(--lh-meta); font-weight: var(--fw-medium); color: var(--ink-2); white-space: nowrap; flex: none;
  transition: background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}
.chip:hover, .chip.is-hover { background: color-mix(in srgb, var(--tint-ink) var(--hover-mix), var(--bg-raised)); color: var(--ink); }
.chip:active, .chip.is-active, .chip[aria-pressed="true"] { background: var(--bg-wash); color: var(--brand-ink); border-color: var(--sel-ring); }
.chip:disabled, .chip.is-disabled { border-style: dashed; border-color: var(--line-control); background: transparent; color: var(--ink-4); cursor: not-allowed; }
.chip.is-loading { cursor: progress; color: var(--ink-3); }
.chip.is-error { border-color: var(--err); color: var(--err); background: var(--err-bg); }
.tag { display: inline-flex; align-items: center; height: var(--h-tw); padding: 0 var(--sp-1-5); border-radius: var(--r-xs); font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); background: var(--bg-sunken); white-space: nowrap; }

/* ---------- Status glyphs: shape + color + word. Agent working is neutral ink: shape and motion carry it. ---------- */
.st { display: inline-block; width: var(--glyph); height: var(--glyph); flex: none; border-radius: 50%; position: relative; }
.st-error { width: var(--glyph-diamond); height: var(--glyph-diamond); border-radius: var(--bw); background: var(--err); transform: rotate(45deg); }
.st-wait { background: var(--wait-glyph); box-shadow: inset 0 0 0 var(--bw) var(--wait-ring); }
.st-close { border: var(--bw-2) solid var(--close); }
.st-run { border: var(--bw-2) solid var(--work-track); border-top-color: var(--work); border-right-color: var(--work); animation: spin var(--duration-spin) linear infinite; }
.st-gh { border: var(--bw) dashed var(--gh); }
.st-idle { border: var(--bw) solid var(--idle); }
.st-paused { border-radius: 0; background: linear-gradient(90deg, var(--paused) 0 var(--glyph-bar), transparent var(--glyph-bar) calc(var(--glyph) - var(--glyph-bar)), var(--paused) calc(var(--glyph) - var(--glyph-bar))); }
.st-warn { width: var(--glyph-diamond); height: var(--glyph-diamond); border-radius: var(--bw); border: var(--bw) solid var(--ink-2); transform: rotate(45deg); }
.st-todo { border: var(--bw) solid var(--deco); }
.st.sm { width: var(--glyph-sm); height: var(--glyph-sm); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { 0% { background: var(--wait-bg); } 100% { background: transparent; } }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

.ty { width: var(--icon); height: var(--icon); flex: none; color: var(--ink-4); fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; transition: color var(--duration-fast) var(--ease-standard); }

.tw {
  display: inline-flex; align-items: center; gap: var(--sp-0-5); height: var(--h-tw); padding: 0 var(--sp-1-5); border-radius: var(--r-pill); flex: none;
  background: var(--wait-chip); color: var(--wait-chip-ink); box-shadow: inset 0 0 0 var(--bw) var(--wait-ring);
  font-size: var(--fs-micro); line-height: var(--lh-micro); font-weight: var(--fw-strong); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.tw-error { background: var(--err-bg); color: var(--err); box-shadow: inset 0 0 0 var(--bw) var(--err); border-radius: var(--r-xs); }
.tw-error::before { content: "!"; font-weight: var(--fw-bold); }
.tw-close { background: transparent; color: var(--close); box-shadow: inset 0 0 0 var(--bw) var(--close); }
.it.sel .tw-close { background: var(--bg-raised); }
.tt { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }

.ctx { display: inline-flex; align-items: center; gap: var(--sp-1-5); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
.ctx .trk { display: block; width: var(--ctx-w); height: var(--ctx-h); border-radius: var(--r-pill); background: var(--brand-track); overflow: hidden; flex: none; }
.ctx .pc { width: var(--ctx-pc); text-align: right; }
.ctx .fil { display: block; height: 100%; width: round(down, calc(var(--ctx-w) * var(--p) / 100), 1px); border-radius: inherit; background: var(--meter); }

/* =====================================================================
   SHELL
   ===================================================================== */
.app { --sb: round(down, clamp(18rem, calc(8vw + 12.5rem), 23.75rem), 1px); display: grid; grid-template-columns: var(--sb) minmax(0, 1fr); height: 100vh; background: var(--bg-app); }
.sb { display: flex; flex-direction: column; background: var(--bg-sidebar); color: var(--ink); min-height: 0; min-width: 0; container: sb / inline-size; position: relative; z-index: 1; box-shadow: inset calc(var(--bw) * -1) 0 0 var(--sb-edge); }
.sbx { color: var(--ink); }
.sb-top { display: flex; align-items: center; gap: var(--sp-1-5); height: var(--h-head); padding: 0 var(--sp-2) 0 var(--sp-3); flex: none; }
.brand { display: inline-flex; align-items: center; gap: var(--sp-2); font-weight: var(--fw-bold); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink); }
.brand .mark { width: var(--mark); height: var(--mark); border-radius: var(--r-sm); background: var(--brand); display: inline-grid; place-items: center; color: var(--brand-on); box-shadow: var(--shadow-mark); }
.brand .mark svg { width: var(--icon); height: var(--icon); stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sb-filter { padding: 0 var(--sp-2) var(--sp-4); flex: none; }
.sb-filter .input { width: 100%; height: var(--h-ctl-sm); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-2); background: var(--sb-input); border-color: var(--sb-control); }
.sb-tree { flex: 1; overflow: auto; padding: var(--sp-0-5) var(--sp-2) 0; position: relative; }
.sb-tree-end { height: var(--sp-4); }
/* The tree says when it scrolls: a fade over the last rows and the count of what is below. */
.sb-more { position: sticky; bottom: 0; display: flex; align-items: flex-end; justify-content: flex-start; height: var(--h-more-below); margin-top: calc(var(--h-more-below) * -1); padding: 0 var(--sp-2) var(--sp-1) calc(var(--tree-pad) + var(--icon) + var(--sp-2-5)); background: linear-gradient(color-mix(in srgb, var(--bg-sidebar) 0%, transparent), var(--bg-sidebar) 70%); pointer-events: none; z-index: 1; }

.sb-foot { display: flex; align-items: center; gap: var(--sp-1); height: var(--h-head); padding: 0 var(--sp-2); flex: none; box-shadow: inset 0 var(--bw) 0 var(--sb-line); }
.sb-foot .cnt { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); font-variant-numeric: tabular-nums; }

/* Tree nodes. A board is a place (it opens the board): sentence case, 14px, medium, secondary ink.
   An epic sits under it: 13px, muted ink, and its items step in along a visible guide. */
.sec + .sec { margin-top: var(--section-gap); }
.node {
  display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-2-5);
  height: var(--h-node); width: 100%; padding: 0 var(--sp-2) 0 var(--tree-pad); border-radius: var(--r-sm);
  color: var(--ink-2); font-size: var(--fs-ui); line-height: var(--lh-ui); font-weight: var(--fw-medium); cursor: pointer;
  transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard);
}

.node .lbl { display: inline-flex; align-items: center; gap: var(--sp-1-5); min-width: 0; }

.node.is-loading .x { color: var(--ink-3); }
.node.epic { font-size: var(--fs-meta); line-height: var(--lh-meta); font-weight: var(--fw-medium); color: var(--ink-3); }
.node .x { font-weight: var(--fw-regular); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); display: inline-flex; gap: var(--sp-1); align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.node .x.warn { color: var(--ink-3); }
.node .sum { display: inline-flex; gap: var(--sp-1-5); align-items: center; font-weight: var(--fw-medium); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); }
.node .sum > span { display: inline-flex; gap: var(--sp-1); align-items: center; }
.grp { display: flex; flex-direction: column; gap: var(--row-gap); padding-top: var(--sp-1); }
.grp.epic-grp { margin-left: var(--epic-indent); padding-top: var(--row-gap); position: relative; }
.grp.epic-grp::before { content: ""; position: absolute; left: calc(var(--guide-x) - var(--epic-indent)); top: 0; bottom: var(--sp-1); width: var(--bw); background: var(--guide); }

/* Tree row: glyph, text, right edge. The name spans the text and the right edge while the meta is hidden;
   the hidden meta takes no room at all. */
.it {
  display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-2-5); row-gap: var(--line-gap);
  width: 100%; padding: var(--row-pad-y) var(--sp-2) var(--row-pad-y) var(--tree-pad); border-radius: var(--r-md);
  position: relative; cursor: pointer; color: var(--ink);
  transition: background var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);
}
.it:hover, .it.is-hover { background: var(--bg-hover); }
.it:active, .it.is-press { background: var(--bg-active); }
.it.sel { background: var(--bg-selected); box-shadow: inset 0 0 0 var(--bw) var(--sel-ring); }
.it.sel .ty { color: var(--brand-ink); }
.it.sel .l3, .it.sel .rw, .it.sel .tt { color: var(--ink-3); }
.it .c1 { display: grid; place-items: center; width: var(--icon); height: 100%; }
.it .nm { grid-column: 2 / 4; font-size: var(--fs-ui); line-height: var(--lh-ui); font-weight: var(--fw-name); color: var(--ink); }
.it.you .nm { font-weight: var(--fw-name-you); }
.it .nm.plain { color: var(--ink-2); }
.it .r1 { display: none; }
.it .r1, .it .r2, .it .r3 { justify-self: end; align-items: center; gap: var(--sp-1); }
.it .r2, .it .r3 { display: inline-flex; }
.it:is(:hover, .is-hover, :focus-visible, .is-focus, .sel, .jk-row, .notice) .r1 { display: inline-flex; }
.it:is(:hover, .is-hover, :focus-visible, .is-focus, .sel, .jk-row, .notice) .nm { grid-column: 2; }
.it .meta { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); white-space: nowrap; font-variant-numeric: tabular-nums; }

.it .l2 { display: flex; align-items: center; gap: var(--sp-1-5); min-width: 0; font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); }
.it .more { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); flex: none; padding: 0 var(--sp-1); border-radius: var(--r-pill); box-shadow: inset 0 0 0 var(--bw) var(--line-strong); font-variant-numeric: tabular-nums; }
.it .rw { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); }
.it .l3 { font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-4); }
.it .l3 .v { color: var(--ink-3); }
.it.err::before, .rail::before { content: ""; position: absolute; left: 0; top: var(--sp-1-5); bottom: var(--sp-1-5); width: var(--rail); border-radius: 0 var(--r-pill) var(--r-pill) 0; background: var(--err); }
.it.is-disabled { cursor: default; background: transparent; }
.it.is-disabled .nm { color: var(--ink-4); text-decoration: line-through; text-decoration-color: var(--ink-4); }
.it.is-loading { cursor: progress; }
.it.is-loading .l2 .lbl { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
.it.flash { animation: flash var(--duration-slow) var(--ease-standard) 2; }
.it kbd { height: var(--h-more); }
.it .hint { font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--brand-ink); white-space: nowrap; }
.short { display: none; }
@container sb (max-width: 330px) { .it .long { display: none; } .it .short { display: inline; } }
@container sb (max-width: 370px) { .it .l3 .long { display: none; } .it .l3 .short { display: inline; } }
.sb-empty { padding: var(--sp-1) var(--sp-2) var(--sp-1) calc(var(--tree-pad) + var(--icon) + var(--sp-2-5)); color: var(--ink-3); font-size: var(--fs-meta); line-height: var(--lh-meta); }

/* =====================================================================
   MAIN
   ===================================================================== */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg-main); position: relative; container: main / inline-size; }
.ih { flex: none; background: var(--bg-head); box-shadow: 0 var(--bw) 0 var(--line); position: relative; z-index: 3; }
.ih-top { display: flex; align-items: center; gap: var(--sp-2); height: var(--h-head); padding: 0 var(--sp-3) 0 var(--sp-2); min-width: 0; }
.navbtns { display: flex; gap: var(--sp-0-5); flex: none; }
.crumbs { display: flex; align-items: center; gap: var(--sp-1-5); min-width: 0; font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); flex: none; white-space: nowrap; }

.crumbs .gt { color: var(--deco); }
.crumbs .crumb-path { gap: var(--sp-1-5); }
.ih-title { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; margin: 0; font-size: var(--fs-title); line-height: var(--lh-title); font-weight: var(--fw-strong); color: var(--ink); }
.ih-title .ty { color: var(--brand-ink); }
.ih-ref { font-family: var(--font-mono); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); white-space: nowrap; flex: none; }

.ih-prog { display: flex; align-items: center; gap: var(--sp-3); min-height: var(--h-prog); padding: 0 var(--sp-4) var(--sp-1); min-width: 0; }
.stages { display: flex; align-items: center; gap: var(--sp-0-5); flex: none; font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); }
.stg { display: inline-flex; align-items: center; gap: var(--sp-1); height: var(--h-ctl-sm); padding: 0 var(--sp-1-5); border-radius: var(--r-sm); white-space: nowrap; color: var(--ink-3); }
button.stg { transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
button.stg:hover, button.stg.is-hover { background: var(--bg-hover); color: var(--ink); }

button.stg:disabled, button.stg.is-disabled { color: var(--ink-4); cursor: not-allowed; box-shadow: inset 0 0 0 var(--bw) transparent; outline: var(--bw) dashed var(--line-control); outline-offset: calc(var(--bw) * -1); }
button.stg.is-loading { cursor: progress; }

.stg.done svg { color: var(--brand-ink); width: var(--icon-sm); height: var(--icon-sm); }

.stg.cur { color: var(--brand-ink); font-weight: var(--fw-strong); background: var(--bg-wash-conv); padding: 0 var(--sp-2-5); gap: var(--sp-2); box-shadow: inset 0 0 0 var(--bw) var(--marker-ring); }
.stg.cur .nmn { color: var(--brand-ink); }
.stages .gt { color: var(--deco); font-size: var(--fs-micro); flex: none; }
/* Step segments: done are the identity, the current one is the identity and twice as long, the rest a tint. */
.segs { display: inline-flex; gap: var(--seg-gap); align-items: center; }
.segs i { display: block; width: var(--seg-w); height: var(--seg-h); border-radius: var(--r-pill); background: var(--seg-todo); }
.segs i.d { background: var(--brand); }
.segs i.c { background: var(--brand); width: var(--seg-w-cur); }
.stepinfo { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; flex: 1 1 auto; font-size: var(--fs-ui); line-height: var(--lh-ui); }
.stepinfo .t { font-weight: var(--fw-medium); color: var(--ink); }
.stepinfo .s { color: var(--ink-3); font-size: var(--fs-meta); line-height: var(--lh-meta); white-space: nowrap; }
.nmn { font-weight: var(--fw-regular); color: var(--ink-3); font-variant-numeric: tabular-nums; }
@container main (max-width: 1240px) { .stg.done .nm { display: none; } .stg.done { padding: 0 var(--sp-1); } }
@container main (max-width: 1020px) { .crumbs .up { display: none; } .ih-tools .long { display: none; } }

.body { flex: 1; display: flex; min-height: 0; position: relative; }
.colconvo { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-conv); position: relative; }
.convo { flex: 1 1 auto; overflow: auto; min-height: 0; scroll-padding-top: var(--sp-16); }
.convo-in { max-width: var(--measure); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure)) / 2), 1px)); padding: 0 var(--sp-6) var(--sp-8); display: flex; flex-direction: column; gap: var(--sp-5); }
.cv-head { position: sticky; top: 0; z-index: 2; background: var(--bg-conv); margin: 0 calc(var(--sp-6) * -1); padding: var(--sp-4) var(--sp-6) var(--sp-3); display: flex; align-items: center; gap: var(--sp-3); box-shadow: 0 var(--bw) 0 var(--line); }
.switch { display: inline-flex; gap: var(--sp-0-5); padding: var(--sp-0-5); background: var(--bg-sunken); border-radius: var(--r-md); flex: none; box-shadow: inset 0 0 0 var(--bw) var(--line); }
.sw { display: inline-flex; align-items: center; gap: var(--sp-1-5); height: var(--h-switch); padding: 0 var(--sp-3); border-radius: var(--r-sm); color: var(--ink-3); font-size: var(--fs-ui); line-height: var(--lh-ui); font-weight: var(--fw-medium); white-space: nowrap; position: relative; transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard); }
.sw:hover, .sw.is-hover { color: var(--ink); background: var(--bg-hover); }
.sw:active, .sw.is-press { background: var(--bg-active); }
.sw .what { color: var(--ink-4); font-weight: var(--fw-regular); }
.sw .st { width: var(--glyph-sm); height: var(--glyph-sm); }
.sw[aria-selected="true"], .sw.is-active { color: var(--ink); background: var(--bg-raised); box-shadow: var(--shadow-xs); }
.sw[aria-selected="true"] .what, .sw.is-active .what { color: var(--ink-3); }
.sw:disabled, .sw.is-disabled { color: var(--ink-4); cursor: not-allowed; background: transparent; outline: var(--bw) dashed var(--line-control); outline-offset: calc(var(--bw) * -1); }
.sw.is-loading { cursor: progress; }
.cv-head .tools { display: flex; gap: var(--sp-1); margin-left: auto; flex: none; }

.e-marker { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-3); margin: var(--sp-1) 0; }
.e-marker::before, .e-marker::after { content: ""; height: var(--bw); background: var(--line); flex: 1 1 0; max-width: var(--sp-16); }
.e-marker svg { color: var(--ink-3); width: var(--icon-sm); height: var(--icon-sm); }
.e-marker .t { font-variant-numeric: tabular-nums; color: var(--ink-4); }
.who { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-2); font-weight: var(--fw-medium); margin-bottom: var(--sp-2); }
.who .av { width: var(--av); height: var(--av); border-radius: var(--r-pill); display: inline-grid; place-items: center; flex: none; background: var(--bg-sunken); color: var(--ink-3); box-shadow: inset 0 0 0 var(--bw) var(--line); }
.who .av svg { width: var(--icon-sm); height: var(--icon-sm); }
.e-agent .who .av { background: var(--bg-wash-conv); color: var(--brand-ink); box-shadow: inset 0 0 0 var(--bw) var(--marker-ring); }

.who .t { color: var(--ink-4); font-weight: var(--fw-regular); font-variant-numeric: tabular-nums; }
.prose { font-family: var(--font-read); font-size: var(--fs-read); line-height: var(--lh-read); color: var(--ink); }
.prose p, .prose ul { max-width: var(--measure-read); }
.prose p { margin: 0 0 var(--sp-3); }
.prose p:last-child { margin-bottom: 0; }
.prose ul { margin: 0 0 var(--sp-3); padding-left: var(--list-indent); }
.prose li { margin: var(--sp-1) 0; }
.prose li::marker { color: var(--ink-4); }
.prose strong { font-weight: var(--fw-strong); }
code { font-family: var(--font-mono); background: var(--bg-sunken); border-radius: var(--r-xs); padding: var(--code-pad-y) var(--code-pad-x); color: var(--ink); font-size: var(--fs-meta); }
.prose code { font-size: var(--fs-code-read); }
.code { margin: 0 0 var(--sp-3); border-radius: var(--r-md); background: var(--bg-code); overflow: hidden; box-shadow: inset 0 0 0 var(--bw) var(--line); }
.code .ch { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) var(--sp-3); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); box-shadow: inset 0 calc(var(--bw) * -1) 0 var(--line); }
.code .ch svg { width: var(--icon-sm); height: var(--icon-sm); }
.code pre { margin: 0; padding: var(--sp-2) var(--sp-3) var(--sp-3); overflow-x: auto; font-family: var(--font-mono); font-size: var(--fs-code); line-height: var(--lh-code); color: var(--ink); tab-size: 4; }
.code .kw { color: var(--code-kw); font-weight: var(--fw-strong); }
.code .str { color: var(--code-str); }
.code .fn { color: var(--code-fn); }
.code .num { color: var(--code-num); }
.code .com { color: var(--code-com); font-style: italic; }

.e-app { background: var(--bg-sunken); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-3); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-2); }
.e-app .who { margin-bottom: var(--sp-1); font-size: var(--fs-micro); line-height: var(--lh-micro); }
.e-app .who .av { width: var(--icon); height: var(--icon); box-shadow: none; background: transparent; }
.e-app code { font-size: var(--fs-micro); background: var(--bg-raised); }
.e-user-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: var(--sp-1); }
.e-user-wrap .who { margin: 0; }
.e-user { max-width: 80%; background: var(--bg-user); color: var(--ink); border-radius: var(--r-lg); padding: var(--sp-2) var(--sp-3); font-size: var(--fs-body); line-height: var(--lh-body); }
.e-user.queued { background: transparent; box-shadow: inset 0 0 0 var(--bw) var(--line-strong); color: var(--ink-2); }
.queued-meta { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-3); }

.acts { background: var(--bg-sunken); border-radius: var(--r-md); font-size: var(--fs-meta); line-height: var(--lh-meta); }
.acts > summary { display: flex; gap: var(--sp-2); align-items: center; min-height: var(--h-ctl); padding: 0 var(--sp-3); cursor: pointer; list-style: none; color: var(--ink-2); border-radius: var(--r-md); transition: background var(--duration-fast) var(--ease-standard); }
.acts > summary::-webkit-details-marker { display: none; }
.acts > summary:hover { background: var(--bg-hover); }
.acts > summary .chev { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-4); transition: transform var(--duration-fast) var(--ease-standard); }
.acts[open] > summary .chev { transform: rotate(90deg); }
.acts .n { font-weight: var(--fw-medium); color: var(--ink-2); white-space: nowrap; }
.acts .sum { color: var(--ink-3); }
.acts ul { list-style: none; margin: 0; padding: var(--sp-1) var(--sp-3) var(--sp-2); box-shadow: inset 0 var(--bw) 0 var(--line); }
.acts li { display: flex; gap: var(--sp-2); align-items: center; padding: var(--sp-1) 0; color: var(--ink-2); min-width: 0; }
.acts li .ic { width: var(--icon-sm); display: inline-grid; place-items: center; flex: none; }
.acts li .ic svg { width: var(--icon-sm); height: var(--icon-sm); }
.acts li .k { width: var(--act-k); color: var(--ink-3); flex: none; }
.acts li .tg { font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-2); }
.acts li .s { color: var(--ink-4); font-size: var(--fs-micro); line-height: var(--lh-micro); white-space: nowrap; }
.acts li.now .k, .acts li.now .s { color: var(--ink-2); font-weight: var(--fw-medium); }
.acts li.e .s { color: var(--err); }
.ok-ic { color: var(--ink-4); }

.e-error { position: relative; background: var(--bg-sunken); border-radius: var(--r-md); padding: var(--sp-2-5) var(--sp-3) var(--sp-2-5) var(--sp-4); font-size: var(--fs-meta); line-height: var(--lh-meta); color: var(--ink-2); display: flex; flex-direction: column; gap: var(--sp-1-5); overflow: hidden; }
.e-error::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--rail); background: var(--err); }
.e-error .h { display: flex; gap: var(--sp-2); align-items: center; color: var(--err); font-weight: var(--fw-strong); font-size: var(--fs-ui); line-height: var(--lh-ui); }
.e-error pre { margin: 0; font-family: var(--font-mono); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--ink-2); white-space: pre-wrap; }

.tx-mode button:hover { color: var(--pn-ink); }
.tx-mode button[aria-checked="true"] { background: var(--pn-bg); color: var(--pn-ink); box-shadow: 0 0 0 var(--bw) var(--pn-line); }

.tx-nm { display: flex; flex-direction: column; min-width: 0; }

.tx-like:hover { color: var(--pn-ink); background: var(--pn-bg); }
.tx-like svg { width: var(--icon); height: var(--icon); fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
.tx-like[aria-pressed="true"] { color: var(--pn-ink); }

/* The swatch: a tiny window of the theme, drawn with that theme's own tokens. */
.mini { width: 3.75rem; height: 2rem; border-radius: var(--r-sm); overflow: hidden; display: grid; grid-template-columns: 1rem minmax(0, 1fr); box-shadow: 0 0 0 var(--bw) var(--pn-swatch-ring); flex: none; }

.tx-tags { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-micro); line-height: var(--lh-micro); color: var(--pn-ink-2); }

    if (c === "loading") return onRail(`<div class="it is-loading" aria-busy="true"><span class="c1">${ty({ kind: "review" })}</span><span class="nm trunc">Bump pgx to v5.6</span><span class="r1"><span class="meta">api#1302</span></span><span class="c1">${st("gh")}</span><span class="l2"><span class="lbl trunc">checking GitHub…</span></span><span class="r2"></span></div>`);
    if (c === "error") return onRail(`<div class="it err you"><span class="c1">${ty({ kind: "task" })}</span><span class="nm trunc">Deprecate v1 webhooks</span><span class="r1"><span class="meta">api#449</span></span><span class="c1">${st("error")}</span><span class="l2"><span class="lbl trunc">Session error · Plan</span></span><span class="r2">${tw({ sev: "error", since: "7m", long: "7m" })}</span></div>`);
    return onRail(`<div class="it you ${c === "active" ? "sel" : cls[c] || ""}"><span class="c1">${ty({ kind: "task" })}</span><span class="nm trunc">Retry failed webhooks</span><span class="r1"><span class="meta">api#430</span></span><span class="c1">${st("wait")}</span><span class="l2"><span class="lbl trunc">Question · Tech spec</span></span><span class="r2">${tw({ sev: "wait", since: "12m", long: "12m" })}</span></div>`);
  };
  const rowExtra = [
    ["focus · on the open row", onRail(`<div class="it you sel is-focus"><span class="c1">${ty({ kind: "task" })}</span><span class="nm trunc">Rate limit per API key</span><span class="r1"><span class="meta">api#412</span></span><span class="c1">${st("wait")}</span><span class="l2"><span class="lbl trunc">Question · Step 3/7</span><span class="more">+1</span></span><span class="r2">${tw({ sev: "wait", since: "18m", long: "18m" })}</span></div>`)],
    ["pressed", onRail(`<div class="it is-press"><span class="c1">${ty({ kind: "task" })}</span><span class="nm trunc">Terraform 1.9 upgrade</span><span class="r1"><span class="meta">infra</span></span><span class="c1">${st("paused")}</span><span class="l2"><span class="lbl trunc">Paused · PRD</span></span><span class="r2"></span></div>`)],
  ];
  const comp = (c) => `<div style="width:100%">${composer(c === "default" ? "plain" : c === "active" ? "filled" : c)}</div>`;
  const rows = [["Primary", (c) => btn("primary", c)], ["Secondary", (c) => btn("secondary", c)], ["New, on the rail", (c) => onRail(btn("new", c))], ["Ghost", (c) => btn("ghost", c)], ["Input", input], ["Chip", chip], ["Link", link], ["Stage", stage]];
  const wide = [["Board node", node, { active: "collapsed, with its summary", disabled: "empty board" }], ["Option in a question card", opt, { active: "chosen" }], ["Conversation tab", tab, { active: "selected" }], ["Tree row", row, { active: "the open row" }, rowExtra], ["Composer", comp, { active: "with text, Send is primary" }]];
  return `<div class="states"><span></span>${cols.map((c) => `<span class="h">${c}</span>`).join("")}${rows.map(([n, f]) => `<span class="rl">${n}</span>${cols.map((c) => `<div class="cell">${f(c)}</div>`).join("")}`).join("")}</div>
    <div class="states-wide">${wide.map(([n, f, alias, extra]) => `<div><div class="rl">${n}</div><div class="cells">${cols.map((c) => `<div class="cell"><span class="h">${alias[c] ? `${c} · ${alias[c]}` : c}</span>${f(c)}</div>`).join("")}${(extra || []).map(([h, html]) => `<div class="cell"><span class="h">${h}</span>${html}</div>`).join("")}</div></div>`).join("")}</div>`;
}
function treeDemo() {
  const sum = `<span class="sum" aria-label="1 error, 1 waiting, 1 ready to close, 1 on GitHub"><span>${st("error")}1 error</span><span>${st("wait")}1</span><span>${st("close")}1</span><span>${st("gh")}1</span></span>`;
  return `<div class="demo-sb sbx" role="tree" aria-label="Tree rows in every state">
    <div class="cap">Every row state</div>
    ${["t8", "t1", "t4", "t7", "t2", "t6", "r2"].map((id) => itemRow(id, 2, { demo: true, noJ: true, sel: false })).join("")}
    <div class="cap">The open row, and the row Ctrl+J opens next</div>
    ${itemRow("t1", 2, { demo: true, sel: true })}${itemRow("t5", 2, { demo: true, sel: false })}
    <div class="cap">A board, an epic and its items along the guide</div>
    ${nodeRow({ label: "Platform Roadmap", title: "Open the board" }, 1, "board", false, "")}${nodeRow({ label: "API hardening", title: "Epic" }, 2, "epic", false, "")}<div class="grp epic-grp" role="group">${itemRow("t3", 3, { demo: true, noJ: true, sel: false })}${itemRow("t7", 3, { demo: true, noJ: true, sel: false })}</div>

  </div>`;
}
function convoDemo() {
  const answeredQ = `<div class="card answered"><div class="hd">${I("check")}<span class="kind">Question</span><span>Reviewer · pass 1</span><span class="grow"></span><span class="faint num">asked 14:17</span></div>
    <div class="bd"><div class="q sm">Should a request with an unknown API key be rate limited before the auth check?</div><div class="ans">${I("check")}<span>No, reject it with 401 first</span></div></div></div>`;
  return `<div class="demo-stack">
    ${acts(6, [["Read", "internal/keys/rotation.go", "done"], ["Bash", "golangci-lint run ./internal/keys/...", "done"], ["Write", "internal/keys/rotation_test.go", "interrupted"], ["Bash", "go test ./internal/keys/...", "running", "running"]], `Running <span class="mono">go test ./internal/keys/...</span>`, true, `<span class="ic">${st("run")}</span>`)}
    <div class="e-activity" role="status">${st("run")}<span>Working · 3m 20s · Running <span class="mono">go test ./internal/keys/...</span></span></div>
    <div class="e-activity" role="status">${st("run")}<span>Thinking…</span></div>
    ${MK("file", "Review 1 written · changes", "14:02")}${MK("archive", "Context compacted", "14:40")}
    <div class="e-error" role="group" aria-label="Error"><div class="h">${st("error")}Session error · Plan</div><span>Claude Code stopped unexpectedly while writing the step files.</span><pre>exit status 1 · claude --resume 3f9c…e21a</pre></div>
    <div class="e-user-wrap"><div class="queued-meta">Queued · sent when the agent finishes<button class="btn ghost xs">Remove</button></div><div class="e-user queued">Also check that the Retry-After header is in seconds.</div></div>
    <div class="demo-colc"><button class="newmsg">${I("arrow-down")}New messages</button></div>
    ${answeredQ}
    <div class="ask" style="padding:0">${askBar("error")}</div>
    <div class="ask" style="padding:0">${askBar("drafts")}</div>
    ${GO_BUCKET}
    ${composer("paused")}
  </div>`;
}
function crCell(sc, fg, bg, k, w) {
  const r = ratioIn(sc, fg, bg, w), n = need(k), ok2 = r >= n;
  const word = k === "info" ? "tone only" : ok2 ? (k === "ui" ? "≥ 3" : k === "body" ? "≥ 1.1 body" : "AA") : "fails";
  return `<span class="cr"><span class="${k === "info" ? "info" : ok2 ? "pass" : "fail"}">${r.toFixed(2)}</span> <span class="faint">${word}</span></span>`;
}
function deCell(sc, a, b, min, w) {
  const d = deIn(sc, a, b, w);
  return `<span class="cr"><span class="${d >= min ? "de-ok" : "de-near"}">${d.toFixed(3)}</span> <span class="faint">${d >= min ? `≥ ${min}` : `below ${min}`}</span></span>`;
}
function overview() {
  const rows = THEMES.map((t) => {
    const r = RESULTS[t.id], deMin = (m) => Math.min(r[m].de["Identity · wait"], r[m].de["Identity · error"], r[m].de["Identity · closing"]);
    const c = (v, n) => `<span class="${v < n ? "de-near" : ""}">${v.toFixed(2)}</span>`;
    return `<tr class="${t.id === ST.theme ? "cur" : ""}"><td><span class="row">${mini(t.id, "l")}${mini(t.id, "d")}<b>${t.name}</b></span></td><td class="w">${t.intent}</td><td>${t.neutral}</td><td>${t.family}</td><td>${t.rail}</td>
      <td class="num">${c(r.l.text, 4.5)} · ${c(r.d.text, 4.5)}</td><td class="num">${c(r.l.ui, 3)} · ${c(r.d.ui, 3)}</td><td class="num">${c(deMin("l"), 0.15)} · ${c(deMin("d"), 0.15)}</td><td class="num">${r.l.fails.length + r.d.fails.length}</td></tr>`;
  }).join("");
  return `<div class="tw-wrap"><table class="ov"><thead><tr><th>Theme</th><th>Intent</th><th>Neutrals</th><th>Identity</th><th>Rail</th><th>Text min · L · D</th><th>UI min · L · D</th><th>ΔE identity–states</th><th>Fails</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Measured on this page from the painted colors of ${TEXT_PAIRS.length} text pairs (4.5:1) and ${UI_PAIRS.length} glyph, ring and border pairs (3:1) in each mode, plus the body of New on the rail (1.1:1) and the ΔE in OKLab between the identity and the error, wait and closing colors (0.15).</p>`;
}
function specimen() {
  const el = document.getElementById("specimen"), t = TH[ST.theme];
  RCACHE.clear();
  const scope = (m, inner) => `<div class="scope th th-${t.id}-${m}" data-scope="${m}"><span class="lbl">${m === "l" ? "Light" : "Dark"}</span>${inner}<div class="sbx" hidden></div></div>`;
  const both = (f, one) => `<div class="sw-grid ${one ? "one" : ""}">${["l", "d"].map((m) => scope(m, f(m))).join("")}</div>`;
  const typeRows = TYPE.map(([tok, lh, n, use, w, s, f]) => `<tr class="typerow"><td><b>${n}</b><br><code class="faint">${tok}</code></td><td class="faint">${use}</td><td><span style="display:block;font-size:var(${tok});line-height:var(${lh});font-weight:var(${w});font-family:var(${f});max-width:var(--measure-read)">${s}</span></td></tr>`).join("");
  const swl = (list, rail) => `<div class="swatches">${list.map(([tk, n]) => `<div class="swatch"><span class="chipc ${rail && tk === "--bg-sidebar" ? "sbx" : ""}" style="background:var(${tk})"></span><b>${n}</b><code>${tk}</code></div>`).join("")}</div>`;
  const pairs = (list, kind) => `<table><thead><tr><th>Pair</th><th>Contrast</th></tr></thead><tbody>${list.map(([n, fg, bg, k, w]) => `<tr><td>${n} <code class="faint">${w === "sb" ? "rail · " : ""}${fg} / ${bg}</code></td><td data-cr="${fg}|${bg}|${k || kind}|${w || ""}"></td></tr>`).join("")}</tbody></table>`;
  const des = `<table><thead><tr><th>Pair</th><th>ΔE OKLab</th></tr></thead><tbody>${DE_PAIRS.map(([n, a, b, m, w]) => `<tr><td>${n} <code class="faint">${a} / ${b}</code></td><td data-de="${a}|${b}|${m}|${w || ""}"></td></tr>`).join("")}</tbody></table>`;
  const statusRows = `<div class="onsb sbx"><table><tbody>${STATUS.map(([n, k, l]) => `<tr><td>${n}</td><td><span class="row">${st(k)}<span class="grow">${l}</span>${sample[k]}</span></td></tr>`).join("")}</tbody></table></div>`;
  el.innerHTML = `<div class="spec-in">
    <div><h2>07 · ${t.name}</h2><p class="lead">${t.intent} <span class="faint">After ${t.ref}</span></p></div>
    <div><h3>All themes, measured</h3>${overview()}</div>
    <div><h3>Identity</h3>${both(() => `<div class="idcard"><span class="big">${I("mark", "")}</span><div><h4>${t.name} · ${t.family}</h4><p>Where the identity goes, in every theme: the mark, New, the one primary action of a screen, focus, the open row, links, Ctrl J, the current stage, the agent's marker, a pressed panel button or a chosen option, the composer's ring, the context meter and the hue of shadows. Never on a state: agent working is the theme's ink, in motion.</p></div></div>${swl(IDENT)}`)}</div>
    <div><h3>Neutrals and regions</h3>${both(() => swl(NEUTRALS, true))}</div>
    <div><h3>States and code</h3>${both(() => swl(STATES_SW))}</div>
    <div><h3>Status on the rail: shape, color and word</h3>${both(() => statusRows)}</div>
    <div><h3>Text contrast (4.5:1)</h3>${both(() => pairs(TEXT_PAIRS, "text"))}</div>
    <div><h3>Glyphs, rings, borders and meters (3:1), and tones</h3>${both(() => pairs(UI_PAIRS, "ui") + pairs(TONE_PAIRS, "info"))}<p class="note">"Tone only" rows have no minimum: they report how far a surface stands from its neighbor, and something else carries the state. New's body keeps 1.1:1 against the rail.</p></div>
    <div><h3>Distance between the identity and the states</h3>${both(() => des)}<p class="note">ΔE in OKLab, from the painted colors. For solid colors the bar is 0.15; two washes both sit near the page, so theirs is 0.05.</p></div>
    <div><h3>Type</h3><div class="tw-wrap"><table><thead><tr><th>Role</th><th>Where</th><th>Sample</th></tr></thead><tbody>${typeRows}</tbody></table></div></div>
    <div><h3>Elevation</h3>${both(() => `<div class="elev">${[["plane", ""], ["xs", "var(--shadow-xs)"], ["card", "var(--shadow-card)"], ["float", "var(--shadow-float)"], ["overlay", "var(--shadow-overlay)"]].map(([n, s]) => `<div><span class="b ${n === "plane" ? "plane" : ""}" style="${s ? `box-shadow:${s}` : ""}">${n}</span></div>`).join("")}</div>`)}</div>
    <div><h3>Components in every state</h3>${both(() => statesGrid(), true)}</div>
    <div><h3>The tree, row by row</h3>${both(() => treeDemo())}</div>
    <div><h3>Conversation pieces not on screen above</h3>${both(() => convoDemo())}</div>
  </div>`;
  el.querySelectorAll("[data-scope]").forEach((sc) => {
    sc.querySelectorAll("[data-cr]").forEach((c) => { const [fg, bg, k, w] = c.dataset.cr.split("|"); c.innerHTML = crCell(sc, fg, bg, k, w); });
    sc.querySelectorAll("[data-de]").forEach((c) => { const [a, b, m, w] = c.dataset.de.split("|"); c.innerHTML = deCell(sc, a, b, parseFloat(m), w); });
  });
}

render();
panel();
specimen();
syncURL();
if (Q.has("specimen")) scrollTo(0, 0);
if (Q.has("report")) {
  const rep = document.getElementById("report");
  rep.textContent = JSON.stringify(Object.fromEntries(THEMES.map((t) => [t.id, { l: { text: +RESULTS[t.id].l.text.toFixed(2), textPair: RESULTS[t.id].l.textPair, ui: +RESULTS[t.id].l.ui.toFixed(2), uiPair: RESULTS[t.id].l.uiPair, body: +RESULTS[t.id].l.body.toFixed(2), fails: RESULTS[t.id].l.fails, de: Object.fromEntries(Object.entries(RESULTS[t.id].l.de).map(([k, v]) => [k, +v.toFixed(3)])) },
    d: { text: +RESULTS[t.id].d.text.toFixed(2), textPair: RESULTS[t.id].d.textPair, ui: +RESULTS[t.id].d.ui.toFixed(2), uiPair: RESULTS[t.id].d.uiPair, body: +RESULTS[t.id].d.body.toFixed(2), fails: RESULTS[t.id].d.fails, de: Object.fromEntries(Object.entries(RESULTS[t.id].d.de).map(([k, v]) => [k, +v.toFixed(3)])) } }])));
}
</script>
