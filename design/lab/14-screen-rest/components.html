.keysline span { display: inline-flex; align-items: center; gap: var(--space-1-5); }
.home .nothing { display: flex; flex-direction: column; gap: var(--space-1); }
.home .nothing .t { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); color: var(--ink-1); }
.home .nothing .s { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-3); }

/* ---------- The creation dialog: few fields, good defaults, the rest one click away. ---------- */
/* The dialog sits at a fixed height from the top, on a whole pixel, and grows down: opening Models never moves its title. */
.scrim:has(.dlg.wide) { align-items: start; }
.dlg.wide { width: min(var(--size-dialog-wide), 100%); margin-top: round(down, 8vh, 1px); max-height: calc(100vh - round(down, 8vh, 1px) - var(--space-16)); }
.dlg.wide .dlg-bd { gap: var(--space-4); overflow: auto; padding-top: var(--space-2); }
.dlg-hd .x { margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1) 0 0; }
.cardsum { display: grid; grid-template-columns: var(--col-num) minmax(0, 1fr); column-gap: var(--space-2); row-gap: var(--space-0-5); padding: var(--space-2-5) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); }
.cardsum .num { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: var(--space-0-5); }
.cardsum .t { color: var(--ink-1); font-weight: var(--weight-medium); font-size: var(--text-ui); line-height: var(--leading-ui); }
.cardsum .s { grid-column: 2; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.fld { display: flex; flex-direction: column; gap: var(--space-1-5); }
.fld > .lb { display: flex; align-items: baseline; gap: var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); font-weight: var(--weight-medium); color: var(--ink-2); }
.fld > .lb .opt-l { font-weight: var(--weight-regular); color: var(--ink-4); }
.fld .help { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.fld .help.err { color: var(--state-error); font-size: var(--text-meta); line-height: var(--leading-meta); }
.fld .help.err a { color: var(--state-error); }
.fld .input.mono input, .fld .input.mono { font-family: var(--font-mono); font-size: var(--text-meta); }
.fld .input input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 0; font: inherit; color: var(--ink-1); }
.fld .input:focus-within { border-color: var(--focus); box-shadow: 0 0 0 var(--halo) var(--focus-halo); }
.fld .input.is-error:focus-within { border-color: var(--state-error); box-shadow: inset var(--error-rail) 0 0 var(--state-error), 0 0 0 var(--halo) var(--focus-halo); }
.fld .desc { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.fld .switch { align-self: flex-start; }
.fld .switch .sw { height: var(--size-control-xs); font-size: var(--text-meta); line-height: var(--leading-meta); padding: 0 var(--space-2-5); }
.fld .switch .sw svg { width: var(--icon-sm); height: var(--icon-sm); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.ctxrow { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.ctxrow .w { flex: 1 1 0; min-width: 0; }
.ctxrow .w b { font-weight: var(--weight-medium); color: var(--ink-1); }
.ctxrow .w .rd { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
.ctxprev { max-height: calc(var(--leading-read) * 9); overflow: auto; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); font-size: var(--text-body); line-height: var(--leading-body); }
.ctxprev.cbody { font-size: var(--text-body); line-height: var(--leading-body); }
.mdl { display: flex; flex-direction: column; }
.mdl-sum { display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: var(--size-control); padding: 0 var(--space-2); margin: 0 calc(var(--space-2) * -1); border-radius: var(--radius-sm); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.mdl-sum:hover { background: var(--veil-hover); color: var(--ink-1); }
.mdl-sum .l { font-weight: var(--weight-medium); }
.mdl-sum .v { color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mdl-sum .chev { width: var(--icon-xs); height: var(--icon-xs); color: var(--ink-4); transition: transform var(--duration-fast) var(--ease-standard); transform: rotate(-90deg); }
.mdl-sum[aria-expanded="true"] .chev { transform: none; }
.mdl-list { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-1) var(--space-4); align-items: center; padding: var(--space-1) 0 0 calc(var(--icon-xs) + var(--space-2)); font-size: var(--text-meta); line-height: var(--leading-meta); }
.mdl-list .st-l { color: var(--ink-3); }
.mdl-list .chip { justify-self: start; height: var(--size-control-xs); }
.mdl-list .chip.own { color: var(--ink-1); border-color: var(--line-3); }
.mdl-list .chip svg { width: var(--icon-xs); height: var(--icon-xs); }
.dlg-ft .why.err { color: var(--state-error); white-space: normal; }
.dlg-ft .why { white-space: normal; }
.dlg .stalebox { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--ink-1); }

/* ---------- Widths: the row gives way to the title, in fixed limits of the list's own width. ---------- */
/* On a narrow list (the half of the monitor, or the list beside the Card panel) the meta goes to a second line
   under the title, whole: the epic, the dependency and the task with its label. Nothing that decides the choice goes. */
@container list (max-width: 1040px) {
  .cr .meta { display: none; grid-row: 2; grid-column: 3 / -1; align-items: center; gap: var(--space-1) var(--space-4); flex-wrap: wrap; min-width: 0; }
  .cr.has2 .meta { display: flex; }
  .cr.has2 { padding-top: var(--space-1-5); padding-bottom: var(--space-1-5); row-gap: var(--space-0-5); }
  .cr .meta .col:empty { display: none; }
  .cr .meta .epc { max-width: calc(var(--col-epic) + var(--space-8)); }
}
@container list (max-width: 620px) {
  .fbar .srch { width: calc(var(--space-16) * 3); }
}
@media (prefers-reduced-motion: reduce) { .skel i, .ctxrow .w .rd, .hr .r .rd, .node .x.is-reading { animation: none; background: none; color: var(--ink-3); } }
.st-gap { display: inline-flex; margin-right: var(--space-2); vertical-align: middle; }
.sb-more[hidden] { display: none; }

/* =====================================================================
   ROUND 12 · the review center and the screen of a review, shared by a and b.
   On top of base.css and core.css (rounds 08 and 09), m.css and b.css (the
   decided task screen, round 10) and board.css (the decided board, round 11),
   all unchanged. Every value is a token of design/system/tokens.css or a
   calc() of tokens; the bare lengths are geometry and container limits.
   ===================================================================== */

/* The columns of a pull request row. Proposed tokens, see the README. */
:root {
  --col-ref: calc(var(--space-16) + var(--space-8));       /* web#2291, gateway#88 */
  --col-author: calc(var(--space-16) + var(--space-8));    /* dependabot */
  --col-state: calc(var(--space-16) * 3 + var(--space-4)); /* Decide findings · pass 1 · 1/3 */
}

/* ---------- The list: the rows of the board, with the columns of a pull request. ---------- */
.prr { grid-template-columns: var(--col-ref) minmax(0, 1fr) var(--col-author) var(--col-state) var(--col-keys); }
.prr .ref { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-4); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prr.open .ref { color: var(--ink-3); }
.prr .tlw { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.prr .tlw .tl { flex: 0 1 auto; }
.dtag { display: inline-flex; align-items: center; height: var(--size-kbd); padding: 0 var(--space-1-5); border-radius: var(--radius-xs); box-shadow: inset 0 0 0 var(--border) var(--line-2); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); white-space: nowrap; flex: none; }
.prr .aut .t { color: var(--ink-3); }
.prr .rst .t { color: var(--ink-2); }
.prr .rst.wait .t, .prr .rst.error .t { color: var(--ink-1); font-weight: var(--weight-medium); }
.prr .rst .ty { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-3); }
.prr .rst .short { display: none; }
/* On a narrow list the author and the state go under the title, whole. */
@container list (max-width: 1040px) {
  .prr { grid-template-columns: var(--col-ref) minmax(0, 1fr) var(--col-keys); }
  .prr .meta { grid-column: 2 / -1; }
}
.lst .sech .fl { margin-left: var(--space-2); }

/* The reading of the list, per repository: the strip names the repository and keeps its last reading. */
.readfail .rep { font-family: var(--font-mono); font-size: var(--text-meta); }
.readfail .lines { display: flex; flex-direction: column; gap: var(--space-0-5); flex: 1 1 0; min-width: 0; }

/* The filter menu: Author and Label cycle between nothing, out (−) and in (+). */
.fmenu .mi .tri { display: inline-grid; place-items: center; width: var(--icon); height: var(--icon); flex: none; font-family: var(--font-mono); font-size: var(--text-meta); color: var(--ink-3); }
.fmenu .mi[data-tri="-"] .tri, .fmenu .mi[data-tri="+"] .tri { color: var(--brand-ink); font-weight: var(--weight-strong); }
.fmenu { max-height: calc(100vh - var(--space-16) * 3); overflow: auto; }

/* ---------- The panel of a pull request: the card panel of the board, with the review's facts. ---------- */
.prp .cd-tags { display: inline-flex; gap: var(--space-1-5); margin-left: var(--space-1); vertical-align: middle; }
.prp .cd-acts .btn.primary { min-width: calc(var(--space-16) * 2); }
.prp .gh { background: transparent; }
.prp .gh .gh-h { box-shadow: inset 0 calc(var(--border) * -1) 0 var(--line-1); }
.cd-rev { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2); row-gap: var(--space-0-5); align-items: center; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-2); box-shadow: var(--shadow-xs); }
.cd-rev .ty { color: var(--brand-ink); }
.cd-rev .nm { font-weight: var(--weight-medium); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd-rev .l2 { grid-column: 2; display: inline-flex; align-items: center; gap: var(--space-1-5); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); min-width: 0; }
.cd-rev .btn { grid-row: 1 / 3; grid-column: 3; }

/* ---------- The start dialog: the pull request, the model, and the rest on request. ---------- */
.dlg .modelrow { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.dlg .modelrow .chip { height: var(--size-control-sm); }
.dlg .modelrow .desc { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.dlg .morebtns { display: flex; gap: var(--space-1); flex-wrap: wrap; margin-left: calc(var(--space-2) * -1); }
.dlg .ctxrow .st { margin-right: var(--space-0-5); }

/* ---------- The review screen: the header's one pill, the checks of the first pass. ---------- */
.stepper.one { margin-left: var(--space-1); }
.gh .gh-note { padding: 0 var(--space-3) var(--space-2-5); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.gh .gh-h .btn { margin-left: var(--space-1); }

/* ---------- A finding: the title, the place (GitHub first, the editor second), the text, the decision. ---------- */
.fnd .fh { display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
.fnd .fh .fti { font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: var(--weight-strong); color: var(--ink-1); }
.fnd .ft code, .frb .ft code { font-family: var(--font-mono); font-size: var(--text-code); padding: var(--code-pad-y) var(--code-pad-x); border-radius: var(--radius-xs); background: var(--surface-0); font-variant-ligatures: none; }
.fnd .ft:hover { box-shadow: none; background: transparent; }
.fnd.ok .fh .fti { color: var(--ink-1); }
/* A decided finding keeps its text legible (structure.md §3): a discarded one only steps down to ink 2. */
.fnd.no-go .fh .fti { color: var(--ink-2); }
/* The place of a finding: a link to the line on GitHub, then the editor as a small second way. */
.locrow { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
.locrow .loc svg { width: var(--icon-xs); height: var(--icon-xs); flex: none; }
.locrow .btn.icon { width: var(--size-control-xs); color: var(--ink-3); }
.fnd .fa .grow { flex: 1 1 auto; }
.fedit { display: flex; flex-direction: column; gap: var(--space-1-5); }
.fedit .textarea { font-size: var(--text-body); line-height: var(--leading-body); }
.fedit .row { justify-content: flex-end; }
.fedit .help { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); margin-right: auto; }

/* ---------- The review that left while open: what happened, the result, and the ways on. ---------- */
.leftw { flex: 1; overflow: auto; }
.left { max-width: var(--measure-read); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure-read)) / 2), 1px)); padding: calc(var(--space-16) + var(--space-8)) var(--space-6) var(--space-12); display: flex; flex-direction: column; gap: var(--space-5); }
.left .hd { display: flex; flex-direction: column; gap: var(--space-2); }
.left .hd .ic { display: inline-grid; place-items: center; width: var(--size-control); height: var(--size-control); border-radius: var(--radius-md); background: var(--surface-0); box-shadow: inset 0 0 0 var(--border) var(--line-1); color: var(--ink-2); }
.left h2 { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); color: var(--ink-1); text-wrap: balance; }
.left p { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-2); }
.left .res { display: flex; flex-direction: column; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); background: var(--surface-0); }
.left .res li { display: grid; grid-template-columns: calc(var(--space-16) + var(--space-2)) minmax(0, 1fr) auto; column-gap: var(--space-3); align-items: center; min-height: var(--size-control); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); list-style: none; }
.left .res li + li { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.left .res .p { color: var(--ink-1); font-weight: var(--weight-medium); }
.left .res .t { color: var(--ink-4); font-variant-numeric: tabular-nums; }
.left .res ul { margin: 0; padding: 0; }
.left .acts2 { display: flex; gap: var(--space-2); flex-wrap: wrap; }

/* ---------- The review's panels: Details and Reports. ---------- */
.panel .pchk { display: flex; flex-direction: column; }
.panel .pchk .chk { min-height: var(--size-control-xs); }
.dlg .cardsum { grid-template-columns: var(--col-ref) minmax(0, 1fr); }
/* The open Reviews node lifts its count from ink 4, as the open row lifts its meta. */
.node.cur .x { color: var(--ink-3); }
/* The review's dialogs sit at a fixed height from the top, on a whole pixel, like the creation dialog. */
.scrim:has(.dlg.pubd), .scrim:has(.dlg.agd) { align-items: start; }
.dlg.pubd, .dlg.agd { margin-top: round(down, 8vh, 1px); }

/* The reading of every minute that failed: a strip under the header, sunken, never red; not a situation. */
.warnstrip { flex: none; position: relative; padding: var(--space-4) var(--space-6) var(--space-1); background: var(--surface-1); }
.warnstrip::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: var(--space-4); z-index: var(--z-sticky); background: linear-gradient(var(--surface-1), color-mix(in srgb, var(--surface-1) 0%, transparent)); pointer-events: none; }
.warnstrip .readfail { margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure) + var(--space-6) * 2) / 2), 1px)); max-width: calc(var(--measure) - var(--space-6) * 2); }
/* A note inside a card or a dialog: commits after the pass, decisions that a new pass discards. */
.stale { display: flex; align-items: flex-start; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.stale .st-warn { margin-top: calc((var(--leading-meta) - var(--glyph-diamond)) / 2); }
.stale .l { flex: 1 1 0; min-width: 0; }
.stale b { font-weight: var(--weight-strong); color: var(--ink-1); }
.dlg .dp { margin: 0; }

/* =====================================================================
   B · A list of findings: the decision column beside a quiet conversation,
   and the publication in a small dialog.
   ===================================================================== */
.fcol { flex: none; width: round(down, var(--decision-width), 1px); background: var(--surface-0); display: flex; flex-direction: column; min-height: 0; animation: panel-in var(--duration-base) var(--ease-enter); }
.fcol-h { display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-control); padding: var(--space-3) var(--space-4) var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.fcol-h b { color: var(--ink-1); font-weight: var(--weight-strong); }
.fcol-h .prog { margin-left: auto; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.flist2 { flex: 1 1 auto; overflow: auto; padding: 0 var(--space-2) var(--space-4); display: flex; flex-direction: column; gap: var(--space-1); }
.fcol-k { margin: 0; padding: var(--space-2) var(--space-4) var(--space-3); display: flex; flex-wrap: wrap; gap: var(--space-1-5); align-items: center; font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); box-shadow: inset 0 var(--border) 0 var(--line-1); }
.fcol-k kbd { height: var(--size-kbd-sm); }
.fcol-k kbd:not(:first-child) { margin-left: var(--space-2); }
.fr { border-radius: var(--radius-md); transition: background var(--duration-fast) var(--ease-standard); }
.fr.cur { background: var(--surface-2); box-shadow: var(--shadow-xs); }
.fr-h { white-space: normal; display: grid; grid-template-columns: var(--key-size) var(--icon) minmax(0, 1fr); align-items: start; column-gap: var(--space-2); width: 100%; padding: var(--space-2); border-radius: var(--radius-md); text-align: left; color: var(--ink-1); transition: background var(--duration-fast) var(--ease-standard); }
.fr-h:hover, .fr-h.is-hover { background: var(--veil-hover); }
.fr-h:active, .fr-h.is-active { background: var(--veil-press); }
.fr.cur .fr-h:hover { background: transparent; }
.fr-h:focus-visible, .fr-h.is-focus { outline: var(--focus-width) solid var(--focus); outline-offset: calc(var(--focus-offset) * -1); }
.fr-h .no { font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-ui); color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.fr-h .dm { display: inline-grid; place-items: center; width: var(--icon); height: var(--leading-ui); }
.fr-h .dm svg { width: var(--icon-sm); height: var(--icon-sm); }
.fr-h .dm.ok svg { color: var(--ink-2); }
.fr-h .dm.no svg { color: var(--ink-4); }
.fr-h .tx { display: flex; flex-direction: column; gap: var(--space-0-5); min-width: 0; }
.fr-h .ftt { overflow-wrap: anywhere; font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: var(--weight-medium); color: var(--ink-1); }
.fr.cur .fr-h .ftt { font-weight: var(--weight-strong); }
.fr-h .lc { font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); font-variant-ligatures: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fr.no-go .fr-h .ftt { color: var(--ink-2); font-weight: var(--weight-regular); }
.fr.ok .fr-h .ftt { color: var(--ink-2); }
.fr.cur.ok .fr-h .ftt { color: var(--ink-1); }
.fr.is-disabled .fr-h { cursor: not-allowed; outline: var(--border) dashed var(--line-3); outline-offset: calc(var(--border) * -1); }
.fr.is-disabled .ftt { color: var(--ink-4); }
.fr.is-loading .dm { cursor: progress; }
.fr.is-error { box-shadow: inset var(--error-rail) 0 0 var(--state-error); }
.frb { display: flex; flex-direction: column; gap: var(--space-2); padding: 0 var(--space-3) var(--space-3) calc(var(--space-2) + var(--key-size) + var(--space-2) + var(--icon) + var(--space-2)); }
.frb .loc { font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-micro); overflow-wrap: anywhere; font-variant-ligatures: none; }
.frb .loc.gen { font-family: var(--font-ui); color: var(--ink-3); }
.frb .ft { font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-1); }
.frb .fa { display: flex; gap: var(--space-1-5); align-items: center; flex-wrap: wrap; }
.frb .fa .note { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.frb .fa .grow { flex: 1 1 auto; }

/* The publication dialog: the verdict is a choice with nothing chosen, the summary is optional. */
.pubd .opts { display: flex; flex-direction: column; gap: var(--space-1-5); }

/* The verdict your decisions suggest: a tag on its option, in the identity's tint; the option itself is never marked. */
.pubd .otl { display: inline-flex; align-items: center; gap: var(--space-2); }
.pubd .sug { display: inline-flex; align-items: center; height: var(--size-kbd); padding: 0 var(--space-1-5); border-radius: var(--radius-pill); background: var(--brand-tint); box-shadow: inset 0 0 0 var(--border) var(--brand-ring); color: var(--brand-ink); font-size: var(--text-micro); line-height: var(--leading-micro); font-weight: var(--weight-medium); }

.sump { display: flex; align-items: flex-start; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }

/* =====================================================================
   ROUND 14 · Settings, History, the archived items, starting, welcome,
   migration, the notices, the page of an item that left and the task's
   dialogs. On top of base.css and core.css (rounds 08 and 09), m.css and
   b.css (round 10), board.css (round 11) and review.css and vb.css
   (round 12), all unchanged. Every value is a token of
   design/system/tokens.css or a calc() of tokens; the bare lengths are
   geometry (0, 50%, 100%) and container-query limits.
   ===================================================================== */
:root {
  --snav-w: calc(var(--space-16) * 3 + var(--space-4));        /* the Settings navigation: 13rem, "Repositories ◇ 1" */
  --col-where: calc(var(--space-16) * 2 + var(--space-8));     /* History: api#398, Platform Roadmap */
  --col-result: calc(var(--space-16) * 4);                     /* History: PR #1279 · 6 steps · dev not updated */
  --col-time: var(--space-12);                                 /* History: 15:02 */
}

/* ---------- The footer says the place that is open (History, Settings), like a pressed panel button. ---------- */
.sb-foot .fbtn[aria-current="page"] { background: var(--brand-tint-plane); color: var(--brand-ink); box-shadow: inset 0 0 0 var(--border) var(--brand-marker-ring); }

/* Starting: the sidebar in skeleton, with the shimmer of a reading. */
.skel-tree { display: flex; flex-direction: column; gap: var(--space-2); padding-top: var(--space-2); }
.skel-tree i { display: block; height: var(--space-3); border-radius: var(--radius-xs); background: linear-gradient(90deg, var(--sidebar-line) 40%, var(--sidebar-input) 50%, var(--sidebar-line) 60%) 0 0 / 300% 100%; animation: shimmer var(--duration-shimmer) linear infinite; }
.sk-node { padding: var(--space-3) var(--space-2) var(--space-1); }

.sk-row .sk-g { width: var(--icon); height: var(--icon); border-radius: var(--radius-xs); }
.sk-l { display: flex; flex-direction: column; gap: var(--space-1-5); }

/* ---------- Settings: the navigation at the left, the page at the right, centered on a whole pixel. ---------- */
.setw { flex: 1; overflow: auto; }
.set { display: grid; grid-template-columns: var(--snav-w) minmax(0, var(--measure)); column-gap: var(--space-12); align-items: start;
  max-width: calc(var(--snav-w) + var(--space-12) + var(--measure)); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--snav-w) - var(--space-12) - var(--measure)) / 2), 1px)); padding: var(--space-8) var(--space-6) var(--space-16); }
.snav { position: sticky; top: var(--space-8); display: flex; flex-direction: column; gap: var(--space-0-5); }
.sni { display: flex; align-items: center; gap: var(--space-2-5); min-height: var(--size-control); padding: 0 var(--space-2-5); border-radius: var(--radius-sm); color: var(--ink-2); font-size: var(--text-ui); line-height: var(--leading-ui); text-decoration: none;
  transition: background var(--duration-fast) var(--ease-standard), color var(--duration-fast) var(--ease-standard); }
.sni svg { color: var(--ink-3); flex: none; }
.sni:hover, .sni.is-hover { background: var(--veil-hover); color: var(--ink-1); text-decoration: none; }
.sni:active, .sni.is-active { background: var(--veil-press); }
.sni[aria-current="page"] { background: var(--brand-tint-plane); color: var(--ink-1); font-weight: var(--weight-medium); box-shadow: inset 0 0 0 var(--border) var(--brand-ring); }
.sni[aria-current="page"] svg { color: var(--brand-ink); }
.sni .snx { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); font-variant-numeric: tabular-nums; }

.spage { min-width: 0; display: flex; flex-direction: column; gap: var(--space-8); }
.sp-h { display: flex; align-items: flex-start; gap: var(--space-4); }
.sp-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.sp-h h2 { margin: 0; display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); color: var(--ink-1); }
.sp-h p { margin: 0; max-width: var(--measure-read); font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-3); }
.sp-a { display: flex; gap: var(--space-2); flex: none; padding-top: var(--space-0-5); }
.backl { align-self: flex-start; margin: calc(var(--space-4) * -1) 0 calc(var(--space-6) * -1) calc(var(--space-2) * -1); color: var(--ink-3); }
.sgrp { display: flex; flex-direction: column; gap: var(--space-3); }

.sg-h h3 { margin: 0; font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }
.sg-d { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.sg-d .rd, .scan .rd { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
.sfoot { margin: 0; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); max-width: var(--measure-read); }
/* Review mode: the options of the popover of the task, laid in the page. */
.rmopts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.rmopts .pop-opt { box-shadow: inset 0 0 0 var(--border) var(--line-2); text-align: left; }
.rmopts .pop-opt[aria-checked="true"] { box-shadow: inset 0 0 0 var(--border) var(--brand-ring); }
/* Models: one row per stage, grouped by the part of the workflow. The chip of a choice changed from the factory is in ink 1. */
.mtab { display: flex; flex-direction: column; gap: var(--space-4); }
.mgrp { display: flex; flex-direction: column; border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); padding: var(--space-1) 0; }
.mgrp-h { padding: var(--space-1-5) var(--space-3) var(--space-0-5); font-size: var(--text-micro); line-height: var(--leading-micro); font-weight: var(--weight-medium); color: var(--ink-3); }
.mrow { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--space-3); align-items: center; min-height: calc(var(--size-control) + var(--space-2)); padding: 0 var(--space-2) 0 var(--space-3); }
.mrow + .mrow { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.mn { display: flex; flex-direction: column; min-width: 0; font-size: var(--text-ui); line-height: var(--leading-ui); color: var(--ink-1); }
.mn .mhint { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-3); }
.mc { position: relative; display: flex; justify-content: flex-end; }
.mc .chip { color: var(--ink-2); }
.mc .chip.own { color: var(--ink-1); font-weight: var(--weight-medium); border-color: var(--line-3); }
.mc .chip[aria-expanded="true"] { background: var(--brand-tint); border-color: var(--brand-ring); }
.mc .chip.is-warn .un { color: var(--ink-3); font-weight: var(--weight-regular); }
.mc .chip .spin { margin-right: var(--space-0-5); }
.mrow-err { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-2); padding: 0 0 var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--state-error); }
.mlist { position: absolute; top: calc(100% + var(--space-1)); right: 0; z-index: var(--z-overlay); min-width: calc(var(--size-menu-min) + var(--space-4)); }
.mlist .menu-msg { max-width: calc(var(--size-menu-min) + var(--space-4)); }

.readfail.sm .st-warn { align-self: flex-start; margin-top: calc((var(--leading-ui) - var(--glyph-diamond)) / 2); }

/* ---------- A row of Settings: a board or a repository. The blocking line sits under its row. ---------- */
.slist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.srow { position: relative; display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-3); align-items: start; padding: var(--space-3) var(--space-3); color: var(--ink-1); }

.srow .si { display: grid; place-items: center; height: var(--leading-ui); color: var(--ink-3); }
.stx { display: flex; flex-direction: column; gap: var(--space-0-5); min-width: 0; }
.s1 { display: flex; align-items: baseline; gap: var(--space-2); min-width: 0; }
.sn { font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: var(--weight-medium); color: var(--ink-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.s2 .mono { font-size: var(--text-meta); color: var(--ink-2); }
.ghl { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-micro); line-height: var(--leading-micro); white-space: nowrap; }
.ghl svg { width: var(--icon-xs); height: var(--icon-xs); }
.sr-r { display: flex; align-items: center; gap: var(--space-1-5); flex-wrap: wrap; justify-content: flex-end; }
.sr-r .rs { margin-right: var(--space-1); }
.rs .st-warn { margin-right: var(--space-1); }
.srow-sub { grid-column: 2 / -1; display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); min-height: var(--size-control-sm); padding: var(--space-1) var(--space-1) var(--space-1) var(--space-3); border-radius: var(--radius-sm); background: var(--surface-0); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.srow-sub .mono { font-size: var(--text-meta); }
.srow-sub.err { background: transparent; padding-left: 0; color: var(--state-error); }
.srow-sub.err .mono { color: var(--state-error); }
.rrow { grid-template-columns: var(--icon) minmax(0, 1fr) auto auto; align-items: center; padding-top: var(--space-2); padding-bottom: var(--space-2); }
.rrow .rc { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rrow .srow-sub, .rrow .instr { grid-column: 2 / -1; margin-bottom: var(--space-1); }
.rm-w { position: relative; }
.rrow.is-open .rm-w .btn { background: var(--veil-press); }
.rmenu { position: absolute; top: calc(100% + var(--space-1)); right: 0; min-width: calc(var(--size-menu-min) + var(--space-16)); }
.rmenu .mi { white-space: normal; }
.instr { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-2); padding: var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); }
.instr .textarea { font-size: var(--text-meta); line-height: var(--leading-meta); font-family: var(--font-mono); font-variant-ligatures: none; }
.row.end { justify-content: flex-end; }
.rgroups { display: flex; flex-direction: column; gap: var(--space-5); }
.rgrp { display: flex; flex-direction: column; gap: var(--space-2); }
.sgh { display: flex; align-items: baseline; gap: var(--space-2); font-size: var(--text-meta); line-height: var(--leading-meta); font-weight: var(--weight-strong); color: var(--ink-2); }
.sgh .cnt { font-weight: var(--weight-regular); font-size: var(--text-micro); color: var(--ink-4); }
.sempty { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-8) 0; }
.sempty .t { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); }
.sempty .s { margin: 0 0 var(--space-2); color: var(--ink-3); font-size: var(--text-body); line-height: var(--leading-body); max-width: var(--measure-read); }
.cfrow { display: flex; align-items: center; gap: var(--space-3); min-height: var(--size-control); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); font-size: var(--text-meta); line-height: var(--leading-meta); }

/* ---------- Prompts: the list, the prompt read with its placeholders, the editor. ---------- */
.plist2 > li > .srow { text-decoration: none; grid-template-columns: var(--icon) minmax(0, 1fr) auto var(--icon); align-items: center; transition: background var(--duration-fast) var(--ease-standard); }
.plist2 > li:first-child > .srow { border-radius: var(--radius-md) var(--radius-md) 0 0; }

.plist2 .srow:hover, .plist2 .srow.is-hover { background: var(--veil-hover); text-decoration: none; }
.plist2 .srow:active, .plist2 .srow.is-active { background: var(--veil-press); }
.plist2 .srow:focus-visible { outline-offset: calc(var(--focus-offset) * -1); }
.plist2 .s2 { white-space: normal; }
.plist2 .chev { width: var(--icon-xs); height: var(--icon-xs); color: var(--ink-4); }
.pst { font-size: var(--text-meta); line-height: var(--leading-meta); }
.dtag.on { color: var(--ink-1); box-shadow: inset 0 0 0 var(--border) var(--line-3); }
.sp-h h2 .dtag { font-weight: var(--weight-regular); }
.pdoc { padding: var(--space-5) var(--space-6); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); font-size: var(--text-body); line-height: var(--leading-body); }

.pdoc h4:first-child { margin-top: 0; }
.pdoc p, .pdoc ul { margin: 0 0 var(--space-2); max-width: var(--measure-read); }
.phc { display: inline-flex; align-items: center; height: var(--size-kbd); padding: 0 var(--space-1); border-radius: var(--radius-xs); background: var(--surface-0); box-shadow: inset 0 0 0 var(--border) var(--line-2); font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-2); font-variant-ligatures: none; white-space: nowrap; }
.pedit { display: grid; grid-template-columns: minmax(0, 1fr) calc(var(--space-16) * 3.5); gap: var(--space-4); align-items: start; }

.phs h3 { margin: 0; font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }

.phs li { display: flex; flex-direction: column; gap: var(--space-0-5); align-items: flex-start; }
.phs .pw { color: var(--ink-2); }
.phs .pwo { color: var(--ink-3); font-size: var(--text-micro); line-height: var(--leading-micro); }
.pbar { position: sticky; bottom: 0; display: flex; align-items: center; gap: var(--space-2); justify-content: flex-end; margin: calc(var(--space-6) * -1) 0 0; padding: var(--space-3) 0; background: var(--surface-1); box-shadow: 0 calc(var(--border) * -1) 0 var(--line-1); }
.pbar .why { margin-right: auto; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }

/* The radio (new in this round): a ring, the dot of the identity when chosen. */
.rb { display: inline-grid; place-items: center; width: var(--icon); height: var(--icon); border-radius: 50%; border: var(--border) solid var(--line-3); background: var(--surface-input); flex: none; transition: border-color var(--duration-fast) var(--ease-standard); }
.rb::after { content: ""; width: var(--space-2); height: var(--space-2); border-radius: 50%; background: var(--brand); transform: scale(0); transition: transform var(--duration-fast) var(--ease-standard); }

.rb.is-hover:not(.on), .rbl:hover .rb:not(.on) { border-color: var(--ink-3); }
.rb.is-focus, .rbl:focus-within .rb { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); }
.rb.off-limits { border-style: dashed; background: transparent; }

.rbl { display: inline-flex; cursor: pointer; }

/* ---------- The dialogs of Settings: a subtitle with the step, Back at the left of the footer. ---------- */
.dlg-ht { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-0-5); }
.dlg-sub { margin: 0; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }

.lrows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); max-height: calc(var(--size-control) * 9); overflow: auto; }
.lrow + .lrow { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.lr-l { display: grid; grid-template-columns: var(--icon) auto auto minmax(0, 1fr); column-gap: var(--space-2-5); align-items: center; min-height: var(--size-control); padding: 0 var(--space-3); cursor: pointer; font-size: var(--text-ui); line-height: var(--leading-ui); color: var(--ink-1); }
.lr-l:hover { background: var(--veil-hover); }
.lr-l:focus-within .cb { outline: var(--focus-width) solid var(--focus); outline-offset: var(--focus-offset); }
.lr-l .ln { font-weight: var(--weight-medium); white-space: nowrap; }
.lr-l .lc { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-4); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lr-l .ll { justify-self: end; max-width: 100%; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lr-l .ll.mono { font-size: var(--text-micro); }

.lcons { display: flex; align-items: flex-start; gap: var(--space-1-5); padding: 0 var(--space-3) var(--space-2) calc(var(--space-3) + var(--icon) + var(--space-2-5)); margin-top: calc(var(--space-1) * -1); font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.lcons svg { width: var(--icon-xs); height: var(--icon-xs); margin-top: var(--space-0-5); color: var(--ink-3); flex: none; }
.lrow.has-cons { background: var(--surface-0); }
.addrow { display: flex; gap: var(--space-2); }
.addrow .input { flex: 1; height: var(--size-control-sm); }
.addrow input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; padding: 0; font: inherit; color: var(--ink-1); }
.srch.wide { width: 100%; height: var(--size-control); }
.scan { display: flex; align-items: center; gap: var(--space-2); min-height: calc(var(--size-control) * 4); justify-content: center; font-size: var(--text-ui); line-height: var(--leading-ui); color: var(--ink-2); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.regd > summary { display: flex; align-items: center; gap: var(--space-2); min-height: var(--size-control-sm); padding: 0 var(--space-2); margin: 0 calc(var(--space-2) * -1); border-radius: var(--radius-sm); cursor: pointer; list-style: none; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); font-weight: var(--weight-medium); }
.regd > summary::-webkit-details-marker { display: none; }
.regd > summary:hover { background: var(--veil-hover); }
.regd > summary .chev { width: var(--icon-xs); height: var(--icon-xs); color: var(--ink-4); transition: transform var(--duration-fast) var(--ease-standard); }
.regd[open] > summary .chev { transform: rotate(90deg); }
.regd .cnt { font-weight: var(--weight-regular); color: var(--ink-4); font-size: var(--text-micro); }
.regd .lrows { margin-top: var(--space-1); }
.ctxrow.col { flex-direction: column; align-items: stretch; gap: var(--space-1); }
.dlist { margin: 0; }
.dlg .dp + .dlist { margin-top: calc(var(--space-2) * -1); }
/* The preview of what a deletion destroys: one line per thing, the detail under it, a tag for what matters. */
.dprev { list-style: none; margin: 0; padding: var(--space-1) var(--space-3); display: flex; flex-direction: column; border-radius: var(--radius-md); background: var(--surface-0); }
.dlg-bd .dprev { padding-left: var(--space-3); gap: 0; }
.dprev li { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr); column-gap: var(--space-2); padding: var(--space-2) 0; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-1); }
.dprev li + li { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.dprev .c { display: grid; place-items: center; height: var(--leading-meta); color: var(--ink-3); }
.dprev .c svg { width: var(--icon-sm); height: var(--icon-sm); }
.dprev .w { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); }
.dprev .d { flex-basis: 100%; color: var(--ink-3); overflow-wrap: anywhere; }
.dprev .d .mono { font-size: var(--text-micro); }
.dprev .dtag { color: var(--ink-1); box-shadow: inset 0 0 0 var(--border) var(--line-3); }
.dprev.is-loading li.skel { display: block; }
.dprev.is-loading li.skel i { display: block; height: var(--space-4); border-radius: var(--radius-sm); background: linear-gradient(90deg, var(--surface-0) 40%, var(--line-1) 50%, var(--surface-0) 60%) 0 0 / 300% 100%; animation: shimmer var(--duration-shimmer) linear infinite; }
.cbl.opt2 { align-items: flex-start; padding: var(--space-2-5) var(--space-3); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-2); }
.cbl.opt2 .cb { margin-top: var(--space-0-5); }
.cbl.opt2 .tx { display: flex; flex-direction: column; gap: var(--space-0-5); }
.cbl.opt2 .tx b { font-weight: var(--weight-medium); }
.cbl.opt2 .tx span { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.bdlg .dlg-bd, .ardlg .dlg-bd { gap: var(--space-3); }

/* ---------- History: one list by date. The day is the section; the row has the kind, the name, where, the result and the hour. ---------- */
.hcount { font-size: var(--text-micro); line-height: var(--leading-micro); color: var(--ink-4); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hlst { padding-top: var(--space-1); }
.hday + .hday { margin-top: var(--space-4); }
.hday .grpb { list-style: none; margin: var(--space-1) 0 0; padding: 0; }
.sech.is-static { grid-template-columns: minmax(0, 1fr); margin: 0; cursor: default; font: inherit; }
.sech.is-static:hover { background: transparent; color: var(--ink-2); }
.hrow { grid-template-columns: var(--icon) minmax(0, 1fr) var(--col-where) var(--col-result) var(--col-time); text-decoration: none; color: var(--ink-1); }
.hrow:hover { text-decoration: none; }
.hrow:focus-visible { outline-offset: calc(var(--focus-offset) * -1); }
.hrow .ty { width: var(--icon-sm); height: var(--icon-sm); color: var(--ink-3); }
.hrow.open .ty { color: var(--brand-ink); }
.hrow .hw .t { color: var(--ink-3); }
.hrow .hres .t { color: var(--ink-2); }
.hrow .rw2 { color: var(--ink-1); font-weight: var(--weight-medium); }
.hrow .htm { justify-content: flex-end; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.hrow.open .htm { color: var(--ink-3); }
/* The board hides a row's meta on a list under 1040 px unless the row has a second line; a History row always keeps
   its meta: in its columns down to 860 px, then on the second line. */
@container list (max-width: 1040px) { .hrow .meta { display: contents; } }
@container list (max-width: 860px) {
  .hrow { grid-template-columns: var(--icon) minmax(0, 1fr) var(--col-time); padding-top: var(--space-1-5); padding-bottom: var(--space-1-5); row-gap: var(--space-0-5); }
  .hrow .meta { display: flex; grid-row: 2; grid-column: 2 / -1; gap: var(--space-1) var(--space-4); flex-wrap: wrap; min-width: 0; }
  .hrow .htm { grid-row: 1; grid-column: 3; }
}

/* ---------- An archived item: the facts, the closing, the documents. ---------- */
.ah .tyh { width: var(--icon); height: var(--icon); color: var(--ink-3); flex: none; }
.ah .dtag { flex: none; }
.aw { flex: 1; overflow: auto; }
.ain { max-width: var(--measure); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure)) / 2), 1px)); padding: var(--space-8) var(--space-6) var(--space-16); display: flex; flex-direction: column; gap: var(--space-6); }
.ain.wide { max-width: var(--list-measure); margin-left: max(0px, round(down, calc((100% - var(--list-measure)) / 2), 1px)); }
.afacts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-1) var(--space-5); margin: 0; font-size: var(--text-meta); line-height: var(--leading-meta); }
.afacts dt { color: var(--ink-3); }
.afacts dd { margin: 0; color: var(--ink-1); min-width: 0; }
/* The result of the closing: a line per part, the mark of what happened, the detail of a skip in ink 2. */
.cres { display: flex; flex-direction: column; padding: var(--space-2) var(--space-4) var(--space-2-5); border-radius: var(--radius-md); background: var(--surface-0); }
.cres-h { display: flex; align-items: baseline; gap: var(--space-2); padding: var(--space-1) 0 var(--space-1-5); font-size: var(--text-caps); line-height: var(--leading-caps); font-weight: var(--weight-bold); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-3); }
.cres-h .t { font-size: var(--text-micro); line-height: var(--leading-micro); font-weight: var(--weight-regular); letter-spacing: 0; text-transform: none; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.cres ul { list-style: none; margin: 0; padding: 0; }
.cres li { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr); column-gap: var(--space-2); padding: var(--space-1-5) 0; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-1); }
.cres li + li { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.cres .c { display: grid; place-items: center; height: var(--leading-meta); color: var(--ink-3); }
.cres .c svg { width: var(--icon-sm); height: var(--icon-sm); }
.cres .skipm { font-weight: var(--weight-bold); color: var(--ink-3); }
.cres .w { min-width: 0; overflow-wrap: anywhere; }
.cres .w .mono { font-size: var(--text-micro); }
.cres .d { display: block; color: var(--ink-3); }
.cres li.skip .w { color: var(--ink-2); }
a.btn, a.btn:hover { text-decoration: none; }
.cres li.fail .d { font-family: var(--font-mono); font-size: var(--text-micro); line-height: var(--leading-micro); margin-top: var(--space-0-5); }
.left .cres, .left .code { margin: 0; }
.atabs { padding: 0; background: transparent; }
.atabs .vtabs-in { margin: 0; max-width: none; }
.atabs::after { content: none; }
.atabs .vt { text-decoration: none; }
.adoc-w { margin-top: calc(var(--space-2) * -1); }
.adoc { font-size: var(--text-read); line-height: var(--leading-read); }
.adoc h4 { margin: var(--space-5) 0 var(--space-1); font-size: var(--text-body); line-height: var(--leading-body); font-weight: var(--weight-strong); }
.adoc h4:first-child { margin-top: 0; }
.adoc p, .adoc ul { max-width: var(--measure-read); }
.asteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); }
.asteps > li { padding: var(--space-2) 0; }
.asteps > li + li { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.as-h { display: flex; align-items: baseline; gap: var(--space-3); font-size: var(--text-ui); line-height: var(--leading-ui); }
.as-h .no { font-family: var(--font-mono); font-size: var(--text-micro); color: var(--ink-3); width: var(--key-size); text-align: right; font-variant-numeric: tabular-nums; }
.as-h .sha { font-size: var(--text-micro); color: var(--ink-3); }
.as-r { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-1) 0 0 calc(var(--key-size) + var(--space-3)); }
.aw .ev { grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2); align-items: center; color: var(--ink-3); }
.aw .ev .ev-ic { width: var(--icon); height: var(--icon); background: transparent; box-shadow: none; color: var(--ink-4); border-radius: 0; }
.aw .ev .ev-ic svg { width: var(--icon-sm); height: var(--icon-sm); }
.aw .ev .ev-l { font-weight: var(--weight-regular); color: var(--ink-2); }
.aw .ev .ev-l .n { color: var(--ink-3); }
.aw .evx > summary { padding: var(--space-1) var(--space-2); margin: 0 calc(var(--space-2) * -1); }
.aw .evx .rd .closed-l, .aw .evx .rd .open-l { display: none; }
.aw .docbody { margin-left: calc(var(--icon) + var(--space-2)); }
.pdraft { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4) var(--space-5); border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); margin-bottom: var(--space-6); }
.pdraft h3 { margin: 0; font-size: var(--text-title); line-height: var(--leading-title); font-weight: var(--weight-strong); }
.pdraft .cd-h, .adoc-w > .cd-h { margin: 0; }
.apass { display: flex; flex-direction: column; gap: var(--space-2); padding-bottom: var(--space-4); }
.apass + .apass { padding-top: var(--space-4); box-shadow: inset 0 var(--border) 0 var(--line-1); }
.ap-h { display: flex; align-items: baseline; gap: var(--space-2); font-size: var(--text-ui); line-height: var(--leading-ui); }
.ap-n { font-weight: var(--weight-strong); }
.ap-v { color: var(--ink-1); }
.ap-h .t { font-size: var(--text-micro); color: var(--ink-4); margin-left: auto; font-variant-numeric: tabular-nums; }
.apub { list-style: none; margin: 0; padding: var(--space-1) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); }
.apub li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--space-3); row-gap: var(--space-0-5); padding: var(--space-1-5) 0; font-size: var(--text-meta); line-height: var(--leading-meta); }
.apub li + li { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.apub .loc { grid-row: 2; font-size: var(--text-micro); color: var(--ink-3); font-variant-ligatures: none; }
.apub .wh { grid-row: 1 / 3; grid-column: 2; align-self: center; color: var(--ink-3); white-space: nowrap; }
.asec { display: flex; flex-direction: column; gap: var(--space-2); }
.asec .cd-h { margin: 0; }
.dpub { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.dpub li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: var(--space-2-5); align-items: center; min-height: var(--size-control); padding: var(--space-1) var(--space-3); font-size: var(--text-ui); line-height: var(--leading-ui); }
.dpub li + li { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.dpub li.kid { padding-left: calc(var(--space-3) + var(--epic-indent)); }
.dpub li.np .w { color: var(--ink-2); }
.dpub .w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dpub .o { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: var(--space-1); }
.dpub .o svg { width: var(--icon-xs); height: var(--icon-xs); }

/* ---------- Starting, welcome and the migration: a column on the ground, the brand on top. ---------- */
.home.boot, .home.wel { gap: var(--space-8); }
.bt { display: flex; flex-direction: column; gap: var(--space-4); align-items: flex-start; }
.bt-t, .wl-h h2 { margin: 0; font-size: var(--text-display); line-height: var(--leading-display); font-weight: var(--weight-strong); color: var(--ink-1); letter-spacing: 0; text-transform: none; }
.bt-s { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-2); max-width: var(--measure-read); }
.bt .code { width: 100%; }
.bt-ic .st { width: var(--space-4); height: var(--space-4); }
.bsteps, .wchk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.bsteps li, .wchk li { display: grid; grid-template-columns: var(--icon) minmax(0, 1fr) auto; column-gap: var(--space-2-5); align-items: center; font-size: var(--text-ui); line-height: var(--leading-ui); color: var(--ink-1); }
.bsteps .c, .wchk .c { display: grid; place-items: center; color: var(--ink-3); }
.bsteps .c svg, .wchk .c svg { width: var(--icon-sm); height: var(--icon-sm); }
.bsteps li.todo { color: var(--ink-3); }
.bsteps .d { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bsteps li.run .w { font-weight: var(--weight-medium); }
.wchk .w { display: flex; flex-direction: column; gap: var(--space-0-5); }
.wchk .d { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); }
.wchk li.warn .w { color: var(--ink-1); font-weight: var(--weight-medium); }
.wchk li.warn .c { align-self: start; height: var(--leading-ui); }
.wl-h { display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-start; }
.wl-h p { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-2); }
.hr.wr { min-height: calc(var(--size-control) + var(--space-5)); padding-top: var(--space-2); padding-bottom: var(--space-2); }
.hr.wr .tx { flex-direction: column; align-items: flex-start; gap: var(--space-0-5); }
.hr.wr .tx .s { white-space: normal; }
.brand .mark:only-child { width: var(--space-8); height: var(--space-8); border-radius: var(--radius-md); }
.brand .mark:only-child svg { width: var(--space-5); height: var(--space-5); }
.mig { height: 100vh; overflow: auto; background: var(--surface-1); color: var(--ink-1); }
.mig-in { max-width: var(--measure-read); margin: 0 auto 0 max(0px, round(down, calc((100% - var(--measure-read)) / 2), 1px)); padding: var(--space-16) var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
.mig h1 { margin: var(--space-4) 0 0; font-size: var(--text-display); line-height: var(--leading-display); font-weight: var(--weight-strong); }
.mig .lead, .lead2 { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-2); }
.lead2 { max-width: var(--measure); }
.lead2 b { font-weight: var(--weight-medium); color: var(--ink-1); }
.mcase { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4) var(--space-4) var(--space-3); border-radius: var(--radius-md); background: var(--surface-0); }
.mcase h3 { margin: 0; font-size: var(--text-ui); line-height: var(--leading-ui); font-weight: var(--weight-strong); }
.mcase > p { margin: 0; font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-2); }
.mcase > ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.mcase > ul > li { padding-top: var(--space-2); box-shadow: inset 0 var(--border) 0 var(--line-1); }
.mcase .mw { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-1); }
.mcase .md { font-size: var(--text-meta); line-height: var(--leading-meta); color: var(--ink-3); margin-top: var(--space-0-5); overflow-wrap: anywhere; }
.mcase .mt { list-style: none; margin: var(--space-1) 0 0; padding: 0 0 0 var(--space-4); display: flex; flex-direction: column; gap: var(--space-0-5); font-size: var(--text-meta); line-height: var(--leading-meta); }
.mcase .mt .mono { font-size: var(--text-meta); }
.mig .foot { margin: 0; font-size: var(--text-body); line-height: var(--leading-body); color: var(--ink-2); }

/* ---------- Notifications, as a table. ---------- */
.ntw { overflow-x: auto; border-radius: var(--radius-md); box-shadow: inset 0 0 0 var(--border) var(--line-1); }
.ntbl { width: 100%; border-collapse: collapse; font-size: var(--text-meta); line-height: var(--leading-meta); }
.ntbl th, .ntbl td { padding: var(--space-2) var(--space-3); text-align: left; vertical-align: top; }
.ntbl thead th { font-size: var(--text-micro); line-height: var(--leading-micro); font-weight: var(--weight-medium); color: var(--ink-3); background: var(--surface-0); }
.ntbl tbody tr + tr { box-shadow: inset 0 var(--border) 0 var(--line-1); }
.ntbl .it2 { color: var(--ink-3); white-space: nowrap; }
.ntbl td:nth-child(2) { white-space: nowrap; color: var(--ink-1); font-weight: var(--weight-medium); }
.ntbl td:nth-child(3) { display: flex; align-items: flex-start; gap: var(--space-2); }
.nt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-0-5); padding: var(--space-1-5) var(--space-2-5); border-radius: var(--radius-sm); background: var(--surface-0); }
.ntt { font-weight: var(--weight-strong); color: var(--ink-1); }
.ntb { color: var(--ink-2); }
.ntbl .cl { color: var(--ink-2); width: 30%; }

/* ---------- Widths: below about 820 px of main area (a window under 1100 px), the Settings navigation goes above the page. ---------- */
@container main (max-width: 820px) {
  .set { grid-template-columns: minmax(0, 1fr); row-gap: var(--space-6); max-width: var(--measure); margin-left: max(0px, round(down, calc((100% - var(--measure)) / 2), 1px)); }
  .snav { position: static; flex-direction: row; flex-wrap: wrap; }
  .rmopts { grid-template-columns: 1fr; }
  .pedit { grid-template-columns: minmax(0, 1fr); }
  .phs { position: static; }
  .rrow { grid-template-columns: var(--icon) minmax(0, 1fr) auto; }
  .rrow .rc { grid-row: 2; grid-column: 2; }
  .rrow .rm-w { grid-row: 1; grid-column: 3; }
}
@container main (max-width: 720px) { .srow { grid-template-columns: var(--icon) minmax(0, 1fr); } .srow .sr-r { grid-column: 2; justify-content: flex-start; } }
@media (prefers-reduced-motion: reduce) { .skel-tree i, .sg-d .rd, .scan .rd, .dprev.is-loading li.skel i { animation: none; } .rb::after { transition: none; } }

/* A toast of an item that left without being open: the text takes the width, the way to History under it. */
.toast .tact { display: flex; margin: var(--space-1) 0 0 calc(var(--space-2) * -1); }
.home h2.bt-t { font-size: var(--text-display); line-height: var(--leading-display); font-weight: var(--weight-strong); color: var(--ink-1); letter-spacing: 0; text-transform: none; }
.wchk li.warn .d { font-weight: var(--weight-regular); }
.lcons .err-t { color: var(--state-error); }

/* ---------- After the critique. ---------- */
.menu .mi.danger[aria-disabled="true"], .menu .mi.danger[aria-disabled="true"]:hover { color: var(--ink-4); background: transparent; }
.rmenu .menu-msg { padding-top: 0; }
/* Defaults while the catalog is read: the saved choice stays, with the shimmer of a reading; no spinner. */
.mc .chip.is-reading { cursor: progress; }
.mc .chip.is-reading .rd, .dprev-rd .rd { background: linear-gradient(90deg, var(--ink-3) 40%, var(--ink-1) 50%, var(--ink-3) 60%) 0 0 / 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer var(--duration-shimmer) linear infinite; }
