version: '3'

vars:
  APP_NAME: myspec
  APP_ID: org.wails.myspec
  BIN_DIR: bin
  PACKAGE_MANAGER: pnpm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  MODULE: github.com/guilhermt/myspec
  # JOBS caps the parallelism of each tool in a run. Agents run the checks side by side and every
  # tool defaults to all the cores, so an uncapped run takes the machine. MYSPEC_JOBS overrides it;
  # the default is 4, or the cores there are when there are fewer.
  JOBS:
    sh: 'n=$(nproc); echo "${MYSPEC_JOBS:-$(( n < 4 ? n : 4 ))}"'
  # The branch point with main, from which test:web picks the frontend tests to run.
  BASE:
    sh: git merge-base HEAD origin/main 2>/dev/null || echo HEAD

includes:
  common: ./build/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  setup:
    summary: Prepares a fresh clone (tools, deps, git hooks)
    cmds:
      - mise install
      - go install tool
      - go mod download
      - task: common:install:frontend:deps
      - task: playwright:install
      - lefthook install

  playwright:install:
    summary: Installs the Chromium of Playwright the computed-style suite runs in; a no-op when it is there
    dir: frontend
    cmds:
      - pnpm exec playwright install --only-shell chromium

  dev:
    summary: Runs the app in development mode with Vite HMR
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:
    summary: Production build to bin/myspec
    cmds:
      - task: linux:build

  run:
    cmds:
      - task: linux:run

  generate:
    summary: Regenerates frontend/bindings from the Go services
    cmds:
      - task: common:generate:bindings

  fmt:
    summary: Formats Go and frontend code
    deps: [fmt:go, fmt:web]

  fmt:go:
    cmds:
      - golangci-lint fmt ./...

  fmt:web:
    cmds:
      - biome check --write .

  lint:
    deps: [lint:go, lint:web]

  lint:go:
    deps: [embed:stub]
    cmds:
      - golangci-lint run --concurrency {{.JOBS}} ./...

  lint:web:
    cmds:
      - biome ci .

  typecheck:
    dir: frontend
    cmds:
      - pnpm typecheck

  test:
    deps: [test:go, test:web]

  test:go:
    summary: Runs the Go tests; a package that did not change comes from the test cache. The CI adds -race with `task test:go -- -race`
    deps: [embed:stub]
    cmds:
      - gotestsum --format pkgname-and-test-fails -- -p {{.JOBS}} {{.CLI_ARGS}} ./...

  test:web:
    summary: Runs the frontend tests, both suites, that reach a file changed since the branch left main
    dir: frontend
    cmds:
      - pnpm exec vitest run --changed {{.BASE}} --passWithNoTests --maxWorkers={{.JOBS}}

  test:full:
    deps: [test:go:full, test:web:full]

  test:go:full:
    summary: Runs every Go test with the race detector, in shuffled order, with coverage and its thresholds
    deps: [embed:stub]
    cmds:
      - mkdir -p coverage
      - gotestsum --format testdox -- -race -shuffle=on -count=1 -p {{.JOBS}} -coverprofile=coverage/go.out ./...
      - go-test-coverage --config .testcoverage.yml

  test:web:full:
    summary: Runs the jsdom suite with coverage and its thresholds, then the computed-style suite in Chromium
    dir: frontend
    cmds:
      - pnpm test:coverage --maxWorkers={{.JOBS}}
      - pnpm test:painted --maxWorkers={{.JOBS}}

  captures:
    summary: Runs the computed-style suite saving the screenshots of the pull request to frontend/captures
    dir: frontend
    cmds:
      - rm -rf captures
      - MYSPEC_CAPTURES=1 pnpm test:painted

  captures:push:
    summary: Publishes frontend/captures on the orphan branch captures/<branch> and prints the Markdown that shows them
    # The screenshots never reach main: they live on an orphan branch of their own, pushed over on
    # every run, and the pull request links to them. Not part of check nor of the CI.
    silent: true
    cmds:
      - |
        set -eu
        branch="$(git rev-parse --abbrev-ref HEAD)"
        target="captures/$branch"
        repo="$(gh repo view --json nameWithOwner -q .nameWithOwner)"
        if ! ls frontend/captures/*.png >/dev/null 2>&1; then
          echo "frontend/captures has no screenshots: run task captures first" >&2
          exit 1
        fi
        tree="$(mktemp -d)"
        trap 'git worktree remove --force "$tree"' EXIT
        git worktree add --quiet --detach "$tree"
        if git show-ref --verify --quiet "refs/heads/$target"; then
          git -C "$tree" checkout --quiet "$target"
        else
          git -C "$tree" checkout --quiet --orphan "$target"
        fi
        git -C "$tree" rm -r --quiet --cached --ignore-unmatch .
        find "$tree" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp frontend/captures/*.png "$tree/"
        git -C "$tree" add --all
        git -C "$tree" commit --quiet --allow-empty -m "Record the captures of $branch"
        git -C "$tree" push --quiet --force origin "$target"
        for file in frontend/captures/*.png; do
          name="$(basename "$file" .png)"
          echo "![$name](https://github.com/$repo/blob/$target/$name.png?raw=true)"
        done

  vuln:
    deps: [embed:stub]
    cmds:
      - govulncheck ./...

  embed:stub:
    summary: Creates the embed target so the Go tasks can build without a frontend build
    # main.go embeds frontend/dist, and `//go:embed` fails to typecheck when the
    # directory holds no files. dist is build output, so it is absent on a fresh
    # clone and every Go task that compiles the root package would fail. Skipped
    # as soon as a real build has filled the directory.
    internal: true
    run: once
    status:
      - test -n "$(ls -A frontend/dist 2>/dev/null)"
    cmds:
      - mkdir -p frontend/dist
      - touch frontend/dist/.gitkeep

  tidy:check:
    cmds:
      - go mod tidy -diff

  bindings:check:
    summary: Fails when frontend/bindings is out of date
    cmds:
      - task: generate
      - git diff --exit-code -- frontend/bindings

  check:
    summary: The everyday check, in seconds, for the agents and the CI
    cmds:
      - nice -n 10 "{{.TASK_EXE}}" tidy:check lint typecheck test vuln bindings:check

  check:full:
    summary: Every test with the race detector, the shuffle and coverage; run on request and weekly in the CI
    cmds:
      - nice -n 10 "{{.TASK_EXE}}" tidy:check lint typecheck test:full vuln bindings:check

  install:
    summary: Installs the app for the current user (binary, launcher entry, icons)
    deps: [build]
    cmds:
      - install -Dm755 {{.BIN_DIR}}/{{.APP_NAME}} "$HOME/.local/bin/{{.APP_NAME}}"
      - mkdir -p "$HOME/.local/share/applications"
      - sed "s|@EXEC@|$HOME/.local/bin/{{.APP_NAME}}|" build/linux/{{.APP_ID}}.desktop > "$HOME/.local/share/applications/{{.APP_ID}}.desktop"
      - install -Dm644 build/linux/icon.svg "$HOME/.local/share/icons/hicolor/scalable/apps/{{.APP_ID}}.svg"
      - install -Dm644 build/appicon.png "$HOME/.local/share/icons/hicolor/512x512/apps/{{.APP_ID}}.png"
      - cmd: update-desktop-database "$HOME/.local/share/applications"
        ignore_error: true
      - cmd: gtk-update-icon-cache -f -t "$HOME/.local/share/icons/hicolor"
        ignore_error: true

  uninstall:
    summary: Removes what install put in place; never touches app data
    cmds:
      - rm -f "$HOME/.local/bin/{{.APP_NAME}}"
      - rm -f "$HOME/.local/share/applications/{{.APP_ID}}.desktop"
      - rm -f "$HOME/.local/share/icons/hicolor/scalable/apps/{{.APP_ID}}.svg"
      - rm -f "$HOME/.local/share/icons/hicolor/512x512/apps/{{.APP_ID}}.png"
      - cmd: update-desktop-database "$HOME/.local/share/applications"
        ignore_error: true
      - cmd: gtk-update-icon-cache -f -t "$HOME/.local/share/icons/hicolor"
        ignore_error: true
